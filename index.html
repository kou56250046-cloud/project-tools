// ---- ui/views/import.js ----
// 取込画面: Gemini の返答を貼る → 差分をカードで確認 → 採用分だけ適用


// 取込の下書き（画面を切り替えても残す。再読み込みでは消える）
const draft = {
  text: '',
  extracted: null,   // extractJson の結果
  validated: null,   // validatePatch の結果
  gen: null,         // 検証したときの台帳の世代（revision は重なることがあるので使わない）
  token: null,       // 検証したときの台帳の印。台帳が置き換わったら下書きを捨てる
  accepted: new Set(),
  result: null,      // 直前の適用結果
  justRead: false,   // 読み取った直後（結果へスクロールする）
};

function clearDraft(keepText) {
  if (!keepText) draft.text = '';
  draft.extracted = null; draft.validated = null; draft.result = null; draft.accepted = new Set();
}

function runExtract(text) {
  draft.text = text;
  draft.result = null;
  draft.validated = null;
  try {
    draft.extracted = extractJson(text);
    if (draft.extracted.ok) revalidate(true);
  } catch (e) {
    draft.extracted = { ok: false, error: '読み取り中に問題が起きました（' + String(e && e.message || e) + '）' };
    draft.validated = null;
  }
  draft.justRead = true;
}

function revalidate(resetAccepted) {
  draft.validated = validatePatch(draft.extracted.value, store.ledger);
  draft.gen = store.gen;
  draft.token = store.token;
  if (resetAccepted) draft.accepted = new Set(draft.validated.ops.filter((p) => !p.errors.length).map((p) => p.index));
}

// 読み取った直後だけ、結果を読み上げ、結果の位置へスクロールしてフォーカスを移す
function announce(root, message, targetId) {
  if (!draft.justRead) return;
  draft.justRead = false;
  root.appendChild(h('p', { class: 'sr-only', role: 'status', 'aria-live': 'polite', text: message }));
  setTimeout(() => {
    const t = document.getElementById(targetId);
    if (t) { t.scrollIntoView({ block: 'start' }); t.focus({ preventScroll: true }); }
  }, 0);
}

function opTitle(p, ledger) {
  const op = p.op;
  if (!op || typeof op !== 'object') return '（読めない操作）';
  if (op.op === 'add') return op.item && typeof op.item.title === 'string' ? op.item.title : '（題名なし）';
  if (op.op === 'update') return `${op.id || '?'} ${itemTitle(op.id, ledger) || ''}`.trim();
  if (op.op === 'relate') {
    const n = (id) => itemTitle(id, ledger) || id;
    return `${n(op.from)} → ${n(op.to)}：${op.label || ''}`;
  }
  if (op.op === 'project') return '案件情報';
  return `op: ${String(op.op)}`;
}

function errorLines(v) {
  const lines = [...v.errors];
  for (const p of v.ops) {
    for (const e of p.errors) lines.push(`操作${p.index + 1}（${opLabel(p.type)}${p.kind && KINDS[p.kind] ? '・' + kindLabel(p.kind) : ''}）: ${e}`);
  }
  return lines;
}

function addBody(p, ledger) {
  const item = p.op.item || {};
  const kind = item.kind;
  const rows = h('div', { class: 'diff add' });
  const names = ['body', 'status', 'confidence', ...Object.keys(KINDS[kind] ? KINDS[kind].fields : {}), 'links', 'sources', 'tags'];
  for (const name of names) {
    if (item[name] === undefined) continue;
    const spec = KINDS[kind] ? fieldSpec(kind, name) : null;
    rows.appendChild(h('div', { class: 'k', text: spec ? spec.label : name }));
    rows.appendChild(h('div', { class: 'after span3', text: valueText(kind, name, item[name], ledger) }));
  }
  if (p.tempId) {
    rows.appendChild(h('div', { class: 'k', text: '仮ID' }));
    rows.appendChild(h('div', { class: 'after span3 mono', text: p.tempId }));
  }
  return rows;
}

function updateBody(p, ledger) {
  const t = ledger.items.find((x) => x.id === p.op.id);
  if (!t) return null;
  const rows = h('div', { class: 'diff' });
  for (const r of updateRows(ledger, p.op)) {
    rows.appendChild(h('div', { class: 'k', text: r.label }));
    rows.appendChild(h('div', { class: 'before', text: valueText(t.kind, r.field, r.before, ledger) }));
    rows.appendChild(h('div', { class: 'arrow', text: '→' }));
    rows.appendChild(h('div', { class: 'after', text: valueText(t.kind, r.field, r.after, ledger) }));
  }
  if (typeof p.op.reason === 'string') {
    rows.appendChild(h('div', { class: 'k', text: '理由' }));
    rows.appendChild(h('div', { class: 'after span3', text: p.op.reason }));
  }
  return rows;
}

const PROJECT_LABELS = { name: '案件名', customer: '顧客', purpose: '目的', periodStart: '開始日', periodEnd: '終了日', goals: 'ゴール', summary: '概要', starter: '案件の型' };

function projectBody(p, ledger) {
  const rows = h('div', { class: 'diff' });
  for (const [k, v] of Object.entries(p.op.set || {})) {
    const fmt = (x) => (x === undefined ? '（なし）' : x === null ? '（消す）' : Array.isArray(x) ? x.join(' / ') : String(x));
    rows.appendChild(h('div', { class: 'k', text: PROJECT_LABELS[k] || k }));
    rows.appendChild(h('div', { class: 'before', text: fmt(ledger.project[k]) }));
    rows.appendChild(h('div', { class: 'arrow', text: '→' }));
    rows.appendChild(h('div', { class: 'after', text: fmt(v) }));
  }
  return rows;
}

function card(p, plan, rerender, app) {
  const ledger = store.ledger;
  const hasError = p.errors.length > 0;
  const accepted = draft.accepted.has(p.index) && !hasError;
  const auto = plan.autoRejected.has(p.index);
  const willApply = plan.apply.has(p.index);
  const toggle = h('div', { class: 'toggle', role: 'group', 'aria-label': `操作${p.index + 1}を採用するか` },
    h('button', { class: 'accept', type: 'button', 'data-fk': `op-${p.index}-accept`, 'aria-pressed': String(accepted), disabled: hasError, onclick: () => { draft.accepted.add(p.index); rerender(); } }, '採用'),
    h('button', { class: 'reject', type: 'button', 'data-fk': `op-${p.index}-reject`, 'aria-pressed': String(!accepted), disabled: hasError, onclick: () => { draft.accepted.delete(p.index); rerender(); } }, '却下'));

  let body = null;
  if (!hasError || (p.op && p.op.op === 'update' && store.item(p.op.id))) {
    if (p.type === 'add' && p.op.item) body = addBody(p, ledger);
    else if (p.type === 'update') body = updateBody(p, ledger);
    else if (p.type === 'project') body = projectBody(p, ledger);
  }
  const msgs = [
    ...p.errors.map((e) => h('li', { class: 'error', text: e })),
    ...p.warnings.map((w) => h('li', { class: 'warning', text: w })),
    ...((plan.warnings.get(p.index) || []).map((w) => h('li', { class: 'warning', text: w }))),
  ];
  return h('article', { class: ['op-card', hasError && 'has-error', !willApply && 'rejected'], 'data-index': String(p.index) },
    h('div', { class: 'op-head' },
      h('span', { class: 'muted small mono', text: `#${p.index + 1}` }),
      h('span', { class: ['badge', p.type === 'add' ? 'ok' : p.type === 'update' ? 'accent' : ''], text: opLabel(p.type) }),
      p.kind && KINDS[p.kind] ? h('span', { class: 'badge', text: kindLabel(p.kind) }) : null,
      h('span', { class: 'op-title', text: opTitle(p, ledger) }),
      p.type === 'update' && store.item(p.op.id) ? idButton(p.op.id, app) : null,
      auto ? h('span', { class: 'badge mid', text: '自動で却下' }) : null,
      toggle),
    body,
    msgs.length ? h('ul', { class: 'msgs' }, msgs) : null);
}

function renderImport(root, app) {
  const ledger = store.ledger;
  // 台帳が置き換わっていたら下書きを捨てる。同じ台帳が変わっただけなら検証し直す
  if (draft.validated && draft.token !== store.token) clearDraft(true);
  else if (draft.validated && draft.gen !== store.gen) revalidate(false);

  root.appendChild(h('h2', { text: '取込' }));
  root.appendChild(h('ol', { class: 'steps muted small' },
    h('li', { text: '「指示文」画面で指示文をコピーし、資料と一緒に Gemini に貼る' }),
    h('li', { text: 'Gemini の返答をまるごとコピーして、下の欄に貼る（```json の囲みや説明文が付いていてもかまいません）' }),
    h('li', { text: '1件ずつ内容を確かめ、要らないものは「却下」にしてから「適用」を押す' })));

  const ta = h('textarea', { rows: '9', id: 'import-text', 'aria-label': 'Gemini の返答', placeholder: 'ここに Gemini の返答を貼り付けます' });
  ta.value = draft.text;
  // 読み取る前でも、貼った内容を画面の切り替えで失わない
  ta.addEventListener('input', () => { draft.text = ta.value; });
  root.appendChild(ta);
  root.appendChild(h('div', { class: 'row' },
    h('button', { class: 'btn primary', type: 'button', id: 'import-read', onclick: () => { runExtract(ta.value); app.refresh(); } }, '読み取る'),
    h('button', { class: 'btn', type: 'button', id: 'import-clear', onclick: () => { clearDraft(false); app.refresh(); } }, 'クリア')));

  if (draft.result) {
    const r = draft.result;
    root.appendChild(h('div', { class: 'notice', id: 'import-result', tabindex: '-1', role: 'status' },
      h('strong', { text: `${r.applied}件を取り込みました（rev ${r.revision}）。` }),
      ' 間違えたときは上部の「取り消し」で戻せます。',
      r.idMap.length ? h('div', { class: 'small' }, '振られた ID: ', r.idMap.map(([t, id], i) => [i ? '、' : '', `${t} → `, idButton(id, app)])) : null));
  }

  const ex = draft.extracted;
  if (!ex) return;
  if (!ex.ok) {
    announce(root, ex.error, 'import-error');
    root.appendChild(h('div', { class: 'notice error stack', id: 'import-error', tabindex: '-1' },
      h('p', { text: ex.error }),
      h('button', { class: 'btn', type: 'button', onclick: async () => {
        const ok = await copyText(buildFixPrompt([ex.error + '。JSON の文法（括弧・カンマ・引用符）を直し、途中で切れないように出力してください'], ledger));
        toast(ok ? '修正依頼文をコピーしました。Gemini に貼ってください' : 'コピーできませんでした');
      } }, 'Gemini への修正依頼文をコピー')));
    return;
  }
  if (ex.notes.length) root.appendChild(h('ul', { class: 'muted small' }, ex.notes.map((n) => h('li', { text: n }))));

  const v = draft.validated;
  if (v.warnings.length) root.appendChild(h('div', { class: 'notice warn' }, v.warnings.map((w) => h('div', { text: w }))));
  if (v.errors.length) root.appendChild(h('div', { class: 'notice error' }, v.errors.map((e) => h('div', { text: e }))));

  const plan = planPatch(v, draft.accepted);
  // 採用した操作を仮に適用し、項目をまたぐ誤り（循環など）が新しく出ないか確かめる
  const integ = plan.apply.size ? previewPatch(ledger, v, draft.accepted, nowIso()).integrityErrors : [];
  if (integ.length) {
    root.appendChild(h('div', { class: 'notice error', id: 'import-integrity' },
      h('strong', { text: 'このまま適用すると、項目をまたぐ誤りが出るため適用できません。関係する操作を却下するか、Gemini に直させてください。' }),
      h('ul', null, integ.map((e) => h('li', { text: `${e.itemId}: ${e.message}` })))));
  }
  const errCount = v.ops.filter((p) => p.errors.length).length;
  const lines = errorLines(v);
  for (const e of integ) lines.push(`項目をまたぐ誤り ${e.itemId}: ${e.message}`);
  const rerender = () => app.refresh();

  root.appendChild(h('div', { class: 'row import-summary', id: 'import-summary', tabindex: '-1' },
    h('strong', { text: `操作 ${v.ops.length}件` }),
    h('span', { class: 'badge ok', text: `適用 ${plan.apply.size}` }),
    h('span', { class: 'badge', text: `却下 ${v.ops.length - plan.apply.size - errCount}` }),
    errCount ? h('span', { class: 'badge high', text: `誤り ${errCount}` }) : null,
    h('span', { class: 'spacer' }),
    h('button', { class: 'btn small', type: 'button', 'data-fk': 'accept-all', onclick: () => { draft.accepted = new Set(v.ops.filter((p) => !p.errors.length).map((p) => p.index)); rerender(); } }, 'すべて採用'),
    h('button', { class: 'btn small', type: 'button', 'data-fk': 'reject-all', onclick: () => { draft.accepted = new Set(); rerender(); } }, 'すべて却下')));

  root.appendChild(h('div', { class: 'stack op-list' }, v.ops.map((p) => card(p, plan, rerender, app))));
  announce(root, `操作 ${v.ops.length}件を読み取りました。適用 ${plan.apply.size}件${errCount ? `、誤り ${errCount}件` : ''}`, 'import-summary');

  root.appendChild(h('div', { class: 'sticky-bar row' },
    h('button', {
      class: 'btn primary', type: 'button', id: 'import-apply', disabled: plan.apply.size === 0 || integ.length > 0,
      onclick: () => {
        const r = store.applyValidated(v, draft.accepted);
        draft.result = { applied: r.applied, revision: r.ledger.revision, idMap: [...r.idMap.entries()] };
        draft.text = ''; draft.extracted = null; draft.validated = null;
        toast(`${r.applied}件を取り込みました`);
        app.refresh();
        document.getElementById('view').scrollTop = 0;
        const res = document.getElementById('import-result');
        if (res) res.focus({ preventScroll: true });
      },
    }, `適用（${plan.apply.size}件）`),
    lines.length ? h('button', { class: 'btn', type: 'button', id: 'import-fix', onclick: async () => {
      const ok = await copyText(buildFixPrompt(lines, ledger));
      toast(ok ? '修正依頼文をコピーしました。Gemini に貼ってください' : 'コピーできませんでした');
    } }, `修正依頼文をコピー（誤り ${lines.length}件）`) : null,
    plan.apply.size === 0 ? h('span', { class: 'muted small', text: '採用できる操作がないため、適用できません' }) : null));
}


// ---- ui/views/prompts.js ----
// 指示文画面: 目的を選ぶ → 指示文を作る → コピーして Gemini / NotebookLM に貼る


const promptState = { purpose: 'minutes', freeText: '', meetingId: '', changeId: '', reportText: '', targetIds: [] };

const GUIDE = {
  notebooklm: 'NotebookLM に資料を入れたうえで、この文を質問欄に貼ります。返ってきた箇条書きは、「資料からの追加」の指示文と一緒に Gemini に貼ってください（指示文の末尾の「ここから資料」の下に貼ります）。',
  default: 'コピーした指示文を Gemini に貼り、末尾の「--- ここから資料 ---」の下に資料・議事録を貼って送ります。返答は「取込」画面に貼ります。',
  review: 'レビューは台帳そのものが材料です。補足の資料が無ければ、そのまま送ってかまいません。返答は「取込」画面に貼ります。',
};

function renderPrompts(root, app, opts) {
  const ledger = store.ledger;
  // 他の画面から目的と会議を指定して開かれたとき
  if (opts && opts.purpose) {
    promptState.purpose = opts.purpose;
    if (opts.meetingId) promptState.meetingId = opts.meetingId;
    if (opts.changeId) promptState.changeId = opts.changeId;
    if (Array.isArray(opts.targetIds)) promptState.targetIds = opts.targetIds;
    if (opts.reportText !== undefined) promptState.reportText = opts.reportText;
    app.viewOpts = {};
  }
  if (promptState.meetingId && !ledger.items.some((it) => it.id === promptState.meetingId)) promptState.meetingId = '';
  root.appendChild(h('h2', { text: '指示文' }));

  const list = h('div', { class: 'purpose-list', role: 'group', 'aria-label': '指示文の目的' });
  let group = null;
  for (const p of PURPOSES) {
    if (p.group !== group) { group = p.group; list.appendChild(h('div', { class: 'muted small group-title', text: group })); }
    list.appendChild(h('button', {
      class: 'purpose', type: 'button', 'aria-pressed': String(promptState.purpose === p.id), 'data-purpose': p.id,
      onclick: () => { promptState.purpose = p.id; app.refresh(); },
    }, h('span', { class: 't', text: p.label }), h('span', { class: 'd', text: p.desc })));
  }

  const right = h('div', { class: 'stack' });
  const guide = promptState.purpose === 'report-polish' ? '返ってきた文面をそのままメールや Chat に使います。差分ではないので「取込」には貼りません。' : promptState.purpose === 'notebooklm' ? GUIDE.notebooklm : promptState.purpose.startsWith('review-') ? GUIDE.review : GUIDE.default;
  right.appendChild(h('p', { class: 'notice', text: guide }));

  const preview = h('textarea', { class: 'prompt-preview', id: 'prompt-text', readonly: true, 'aria-label': '生成された指示文', rows: '24' });
  const refresh = () => { preview.value = buildPrompt(promptState.purpose, ledger, { today: todayStr(), freeText: promptState.freeText, meetingId: promptState.purpose === 'minutes' ? promptState.meetingId : '', changeId: promptState.changeId, reportText: promptState.reportText, targetIds: promptState.targetIds }); };

  if (promptState.purpose === 'minutes') {
    const ms = ledger.items.filter((it) => it.kind === 'meeting').sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const sel = h('select', { id: 'prompt-meeting', 'aria-label': 'どの会議の議事録か' },
      h('option', { value: '', text: '会議を指定しない' }),
      ms.map((m) => h('option', { value: m.id, selected: m.id === promptState.meetingId, text: `${m.date}　${m.title}` })));
    sel.addEventListener('change', () => { promptState.meetingId = sel.value; refresh(); });
    right.appendChild(h('label', { class: 'field' }, 'どの会議の議事録か（指定すると、出席者とヒヤリングシートの質問が指示文に入ります）', sel));
  }
  if (promptState.purpose === 'change-review') {
    const crs = ledger.items.filter((it) => it.kind === 'change');
    const sel = h('select', { id: 'prompt-change', 'aria-label': 'どの変更要求か' },
      h('option', { value: '', text: '変更要求を選ぶ' }),
      crs.map((c) => h('option', { value: c.id, selected: c.id === promptState.changeId, text: `${c.id} ${c.title}` })));
    sel.addEventListener('change', () => { promptState.changeId = sel.value; refresh(); });
    right.appendChild(h('label', { class: 'field' }, 'どの変更要求をレビューさせるか', sel));
  }
  if (promptState.purpose === 'test-viewpoints') {
    promptState.targetIds = promptState.targetIds.filter((id) => ledger.items.some((it) => it.id === id));
    const cands = ledger.items.filter((it) => (it.kind === 'requirement' && it.status !== 'dropped') || it.kind === 'screen');
    const box = h('div', { class: 'target-list', id: 'prompt-targets', role: 'group', 'aria-label': 'テストの対象' }, cands.map((it) => h('label', { class: 'row small' },
      h('input', { type: 'checkbox', 'data-fk': 'target-' + it.id, checked: promptState.targetIds.includes(it.id), onchange: (e) => {
        promptState.targetIds = e.target.checked ? [...promptState.targetIds, it.id] : promptState.targetIds.filter((x) => x !== it.id);
        app.refresh();
      } }),
      h('span', { class: 'mono', text: it.id }), it.title)));
    right.appendChild(h('div', { class: 'field' }, h('span', { text: `テストの対象（${promptState.targetIds.length}件選択中）` }), box));
  }
  if (promptState.purpose === 'report-polish') {
    const ta = h('textarea', { rows: '6', id: 'prompt-report-text', 'aria-label': '週報の下書き', placeholder: '定例会資料の画面から開くと、週報の下書きが入ります。ここに直接貼ってもかまいません' });
    ta.value = promptState.reportText;
    ta.addEventListener('input', () => { promptState.reportText = ta.value; refresh(); });
    right.appendChild(h('label', { class: 'field' }, '週報の下書き', ta));
  }
  if (promptState.purpose === 'free') {
    const free = h('textarea', { rows: '4', 'aria-label': '自由指示', placeholder: '例: 課題の重要度を、期限と影響の大きさから見直してください' });
    free.value = promptState.freeText;
    free.addEventListener('input', () => { promptState.freeText = free.value; refresh(); });
    right.appendChild(h('label', { class: 'field' }, '指示', free));
  }
  refresh();

  right.appendChild(h('div', { class: 'row' },
    h('button', { class: 'btn primary', type: 'button', id: 'prompt-copy', onclick: async () => {
      const ok = await copyText(preview.value);
      if (ok) toast('コピーしました');
      else { preview.select(); toast('コピーできませんでした。選択した状態にしたので Ctrl+C でコピーしてください'); }
    } }, '指示文をコピー'),
    h('span', { class: 'muted small', text: `${preview.value.length.toLocaleString()} 文字 ／ 台帳 rev ${ledger.revision}` }),
    promptState.purpose === 'notebooklm' ? h('button', { class: 'btn', type: 'button', onclick: () => { promptState.purpose = 'material'; app.refresh(); } }, '「資料からの追加」へ') : null,
    promptState.purpose !== 'notebooklm' && promptState.purpose !== 'report-polish' ? h('button', { class: 'btn', type: 'button', onclick: () => app.go('import') }, '取込へ') : null));
  right.appendChild(preview);

  root.appendChild(h('div', { class: 'prompt-layout' }, list, right));
}


// ---- ui/views/settings.js ----
// 設定画面: 案件の一覧（切り替え・外す）・新規案件・読み込み・この案件の設定・書き出し・HTML のダウンロード・保存の大きさ


const settingsState = { loadErrors: null };
// localStorage はおよそ 5MB（文字数で約 500 万）。4MB を超えたら知らせる
const STORAGE_WARN = 4 * 1024 * 1024;

function lastExportText(p) {
  return p.exportedAt ? `最後の書き出し: ${fmtDateTime(p.exportedAt)}` : 'まだ一度も書き出していません';
}

async function loadFile(file, app) {
  if (!file) return;
  let text;
  try { text = await file.text(); } catch (e) {
    settingsState.loadErrors = { name: file.name, errors: ['ファイルを読めませんでした'], more: 0 };
    app.refresh();
    return;
  }
  const r = store.parseLedgerFile(text);
  if (!r.ok) {
    settingsState.loadErrors = { name: file.name, errors: r.errors, more: r.more || 0 };
    app.refresh();
    return;
  }
  settingsState.loadErrors = null;
  // 同じ案件名の案件があれば、置き換えるか別の案件として足すかを選ぶ（P5 AC-06）
  const same = store.findProjectByName(r.ledger.project.name);
  let mode = 'add';
  if (same) {
    const p = store.projects().find((x) => x.id === same);
    mode = await choiceDialog(
      `同じ案件名「${p.name}」の案件がすでにあります。`,
      [{ value: 'add', label: '別の案件として足す' }, { value: 'replace', label: '置き換える', primary: true }],
      `今ある案件: rev ${p.revision}・${lastExportText(p)}${p.dirty ? '・その後に変更があります（置き換えると失われます）' : ''}。読み込むファイル: rev ${r.ledger.revision}`);
    if (!mode) return;
  }
  if (!(await ensureVaultReady())) return;
  if (mode === 'replace') store.replaceProject(same, r.ledger, { exported: true, migrated: r.migrated });
  else store.addProject(r.ledger, { exported: true, migrated: r.migrated });
  toast(`「${r.ledger.project.name}」を${mode === 'replace' ? '置き換えて' : ''}読み込みました`);
  app.go('overview');
}

function settingInput(key, d, cur) {
  if (d.type === 'enum') {
    return h('select', { id: 'set-' + key, 'aria-label': d.label }, d.values.map((e) => h('option', { value: e.v, selected: e.v === cur, text: e.label })));
  }
  if (d.type === 'ref') {
    const people = store.ledger.items.filter((it) => d.kinds.includes(it.kind));
    return h('select', { id: 'set-' + key, 'aria-label': d.label },
      h('option', { value: '', text: '（未設定）' }),
      people.map((p) => h('option', { value: p.id, selected: p.id === cur, text: `${p.title}（${p.id}）` })));
  }
  return h('input', { type: 'number', id: 'set-' + key, 'aria-label': d.label, min: d.min, max: d.max, step: d.type === 'int' ? '1' : 'any', value: cur == null ? '' : String(cur) });
}

function renderSettings(root, app) {
  root.appendChild(h('h2', { text: '設定' }));

  // 読めなかった台帳の退避データ（上書きで消えないように残してある）
  const rec = Object.entries(store.recovery);
  if (rec.length) {
    root.appendChild(h('section', { class: 'card stack recovery', id: 'recovery' },
      h('h3', { text: `読めなかった台帳の退避データ（${rec.length}件）` }),
      h('p', { class: 'small', text: '今の版では読めなかった案件の元のデータを、暗号化して退避してあります。書き出して保管するか、要らなければ消してください。' }),
      rec.map(([id, text]) => h('div', { class: 'row' },
        h('span', { class: 'mono small', text: id }),
        h('button', { class: 'btn small', type: 'button', 'data-fk': 'rec-export-' + id, onclick: () => download(`退避データ_${id}_${Date.now()}.json`, text) }, '書き出す'),
        h('button', { class: 'btn small danger', type: 'button', 'data-fk': 'rec-discard-' + id, onclick: async () => {
          if (await confirmDialog('この退避データを消します。元に戻せません。', '消す')) { await store.discardRecovery(id); toast('退避データを消しました'); }
        } }, '消す')))));
  }

  // 案件の一覧（P5）
  const projects = store.projects();
  if (projects.length) {
    root.appendChild(h('section', { class: 'card stack', id: 'project-list' },
      h('h3', { text: `ブラウザの中の案件（${projects.length}件）` }),
      h('ul', { class: 'ref-list' }, projects.map((p) => h('li', { 'data-project': p.id },
        p.id === store.activeId ? h('span', { class: 'badge accent', text: '開いている' }) : h('button', { class: 'btn small', type: 'button', 'data-fk': 'open-' + p.id, onclick: () => { store.switchProject(p.id); toast(`「${p.name}」を開きました`); } }, '開く'),
        h('span', { class: 'title', text: p.name }),
        h('span', { class: 'small muted', text: `rev ${p.revision}・${lastExportText(p)}` }),
        p.dirty ? h('span', { class: 'badge mid', text: '未書き出し' }) : null,
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn small danger', type: 'button', 'data-fk': 'remove-' + p.id, onclick: async () => {
          const ok = await confirmDialog(`「${p.name}」をブラウザから外します。`, '外す',
            `${p.dirty ? '最後の書き出しより後の変更があります。外すと失われます。先に書き出してください。' : '書き出したファイルがあれば、あとで読み込み直せます。'}（${lastExportText(p)}）`);
          if (ok) { store.removeProject(p.id); toast('案件を外しました'); }
        } }, 'ブラウザから外す'))))));
  }

  // 新規案件
  const name = h('input', { type: 'text', id: 'new-name', placeholder: '例: ○○社 受発注システム刷新', 'aria-label': '案件名' });
  const starter = h('select', { id: 'new-starter', 'aria-label': '案件の型' },
    Object.entries(STARTERS).map(([id, st]) => h('option', { value: id, text: st.label })),
    h('option', { value: '', text: '型を使わない（空の台帳）' }));
  const desc = h('p', { class: 'muted small' });
  const updateDesc = () => { desc.textContent = starter.value ? STARTERS[starter.value].desc : '項目のない台帳から始めます'; };
  starter.addEventListener('change', updateDesc);
  updateDesc();
  root.appendChild(h('section', { class: 'card stack' },
    h('h3', { text: '新しい案件を作る' }),
    h('p', { class: 'muted small', text: '今の案件はそのまま残り、新しい案件が追加されます。' }),
    h('div', { class: 'row' }, name, starter,
      h('button', { class: 'btn primary', type: 'button', id: 'new-create', onclick: async () => {
        const n = name.value.trim();
        if (!n) { toast('案件名を入れてください'); name.focus(); return; }
        if (!(await ensureVaultReady())) return;
        store.addProject(createLedger(n, starter.value || null, nowIso()));
        toast(`「${n}」を作りました`);
        app.go('overview');
      } }, '作る')),
    desc));

  // 読み込み
  const input = h('input', { type: 'file', accept: '.json,application/json', id: 'load-file', 'aria-label': '台帳ファイルを選ぶ' });
  input.addEventListener('change', () => loadFile(input.files[0], app));
  const zone = h('section', { class: 'card stack dropzone', id: 'dropzone' },
    h('h3', { text: '台帳ファイルを読み込む' }),
    h('p', { class: 'muted small', text: '書き出した JSON ファイルを選ぶか、この枠にドラッグ&ドロップします。新しい案件として足します。同じ案件名の案件があるときは、置き換えるか別の案件として足すかを選べます。' }),
    input);
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('over');
    loadFile(e.dataTransfer.files[0], app);
  });
  if (settingsState.loadErrors) {
    const le = settingsState.loadErrors;
    zone.appendChild(h('div', { class: 'notice error', id: 'load-errors' },
      h('strong', { text: `「${le.name}」は読み込めませんでした。台帳は変わっていません。` }),
      h('ul', null, le.errors.map((e) => h('li', { text: e }))),
      le.more ? h('div', { text: `ほか ${le.more}件` }) : null));
  }
  root.appendChild(zone);

  // この案件の設定（台帳に保存する。変更は取り消せる）
  if (store.ledger) {
    const rows = Object.entries(SETTINGS).map(([key, d]) => {
      const cur = settingOf(store.ledger, key);
      const el = settingInput(key, d, cur);
      el.addEventListener('change', () => {
        let v = el.value;
        if (d.type === 'int') v = Number.parseInt(v, 10);
        else if (d.type === 'number') v = v === '' ? null : Number(v);
        else if (d.type === 'ref') v = v === '' ? null : v;
        if (v === cur) return;
        const r = store.updateSettings({ [key]: v });
        toast(r.ok ? `${d.label}を変えました（取り消し可）` : r.errors.join(' / '));
      });
      return h('label', { class: 'field' }, d.label, el);
    });
    root.appendChild(h('section', { class: 'card stack' },
      h('h3', { text: 'この案件の設定' }),
      h('div', { class: 'row settings-row' }, rows)));
  }

  // 書き出し
  if (store.ledger) {
    root.appendChild(h('section', { class: 'card stack' },
      h('h3', { text: '書き出す' }),
      h('p', { class: 'muted small', text: `今開いている案件を JSON ファイルで保存します（${store.exportFilename()}）。ブラウザの保存は消えることがあるので、区切りごとに書き出してください。ファイルには案件の情報が入るため、社外へ持ち出さないでください。` }),
      h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: () => {
        download(store.exportFilename(), store.exportText());
        store.markExported();
        toast('書き出しました');
      } }, '書き出し'))));
  }

  // 保存の大きさ
  const size = store.storageSize();
  root.appendChild(h('section', { class: 'card stack', id: 'storage-size' },
    h('h3', { text: 'ブラウザの保存の大きさ' }),
    h('p', { class: ['small', size > STORAGE_WARN && 'notice error'], text: `約 ${(size / 1024 / 1024).toFixed(2)} MB（目安の上限 5 MB）。${size > STORAGE_WARN ? '4 MB を超えています。使っていない案件を書き出してからブラウザから外してください。' : ''}` })));

  // 配布（GitHub Pages で開いたときだけ）
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    root.appendChild(h('section', { class: 'card stack' },
      h('h3', { text: 'このツールをダウンロードする' }),
      h('p', { class: 'muted small', text: 'HTML ファイル1つで動きます。保存したファイルをダブルクリックで開けば、通信なしで使えます。' }),
      h('div', { class: 'row' }, h('a', { class: 'btn primary', href: './index.html', download: 'anken-workbench.html', id: 'download-html' }, 'HTML をダウンロード'))));
  }

  root.appendChild(h('section', { class: 'card stack' },
    h('h3', { text: 'データの扱い' }),
    h('ul', { class: 'small' },
      h('li', { text: '台帳は合言葉で暗号化して、このブラウザの中（localStorage）に保存します。合言葉と鍵は保存しません。合言葉はすべての案件で共通です' }),
      h('li', { text: '書き出したファイルは暗号化されていません。社内の決められた場所に保存してください' }),
      h('li', { text: 'このツールは外部と一切通信しません（ブラウザのセキュリティ設定 CSP で禁止しています）' }),
      h('li', { text: 'Gemini への受け渡しは、コピーと貼り付けだけで行います' }))));
}


// ---- ui/views/hearing.js ----
// ヒヤリング画面: 会議を選ぶ → ヒヤリングシート（その会議で聞く質問）→ その場で回答。候補を会議に割り当てる


const hearingState = { meetingId: null, picked: new Set(), drafts: {} };
const TYPE_VALUES = KINDS.meeting.fields.meetingType.values;

function meetings(ledger) {
  return ledger.items.filter((it) => it.kind === 'meeting').sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id.localeCompare(a.id));
}

// 既定の会議: 今日以降で最も近い予定の会議、無ければ最も新しい会議
function defaultMeeting(list, today) {
  const upcoming = list.filter((m) => m.status === 'planned' && m.date >= today).sort((a, b) => a.date.localeCompare(b.date));
  return (upcoming[0] || list[0] || {}).id || null;
}

function addMeetingForm(app) {
  const title = h('input', { type: 'text', id: 'mt-title', placeholder: '例: 第3回ヒヤリング（経理）', 'aria-label': '会議名' });
  const date = h('input', { type: 'date', id: 'mt-date', 'aria-label': '日付', value: todayStr() });
  const type = h('select', { id: 'mt-type', 'aria-label': '種類' }, TYPE_VALUES.map((t) => h('option', { value: t.v, selected: t.v === 'hearing', text: t.label })));
  return h('details', { class: 'card small' },
    h('summary', { text: '会議を追加する' }),
    h('div', { class: 'row' }, title, date, type,
      h('button', { class: 'btn', type: 'button', id: 'mt-add', onclick: () => {
        if (!title.value.trim()) { toast('会議名を入れてください'); return; }
        const r = store.applyLocal([{ op: 'add', item: { kind: 'meeting', title: title.value.trim(), date: date.value, meetingType: type.value, confidence: 'fact', sources: [{ type: 'other', ref: 'ヒヤリング画面で追加' }] } }], 'hearing');
        if (!r.ok) { toast(r.errors.join(' / ')); return; }
        hearingState.meetingId = r.ledger.items.at(-1).id;
        toast('会議を追加しました（取り消し可）');
        app.refresh();
      } }, '追加')));
}

function sheetRow(q, meeting, app) {
  const ledger = store.view();
  const answered = q.status !== 'open';
  const draft = hearingState.drafts[q.id] ?? q.answer ?? '';
  const ta = h('textarea', { rows: '2', 'data-fk': 'ans-' + q.id, 'aria-label': `${q.title} の回答`, placeholder: 'その場で回答を書く' });
  ta.value = draft;
  ta.addEventListener('input', () => { hearingState.drafts[q.id] = ta.value; });
  const save = () => {
    const ans = ta.value.trim();
    if (!ans) { toast('回答を書いてください'); ta.focus(); return; }
    const r = store.applyLocal([{ op: 'update', id: q.id, set: { answer: ans, status: 'answered', askedAt: q.askedAt || meeting.date || todayStr() } }], 'hearing');
    if (!r.ok) { toast(r.errors.join(' / ')); return; }
    delete hearingState.drafts[q.id];
    toast('回答済みにしました（取り消し可）');
  };
  return h('li', { class: ['sheet-item', answered && 'answered'], 'data-id': q.id },
    h('div', { class: 'row' },
      idButton(q.id, app), statusBadge(q.kind, q.status),
      h('strong', { class: 'sheet-title', text: q.title }),
      q.askTo ? h('span', { class: 'muted small', text: '質問先: ' + (itemTitle(q.askTo, ledger) || q.askTo) }) : h('span', { class: 'badge mid', text: '質問先なし' }),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn small', type: 'button', 'data-fk': 'unassign-' + q.id, onclick: () => {
        const r = store.applyLocal([{ op: 'update', id: q.id, set: { meeting: null } }], 'hearing');
        toast(r.ok ? 'このシートから外しました（取り消し可）' : r.errors.join(' / '));
      } }, 'シートから外す')),
    q.body ? h('p', { class: 'small body-text', text: q.body }) : null,
    answered
      ? h('p', { class: 'answer' }, h('span', { class: 'muted small', text: `回答（${q.askedAt || '日付不明'}）: ` }), q.answer || '（回答の記録なし）')
      : h('div', { class: 'row' }, ta, h('button', { class: 'btn primary small', type: 'button', 'data-fk': 'save-' + q.id, onclick: save }, '回答済みにする')));
}

function renderHearing(root, app) {
  const ledger = store.view();
  const today = todayStr();
  const list = meetings(ledger);
  if (!hearingState.meetingId || !list.some((m) => m.id === hearingState.meetingId)) hearingState.meetingId = defaultMeeting(list, today);

  root.appendChild(h('h2', { text: 'ヒヤリング' }));
  root.appendChild(addMeetingForm(app));

  if (!list.length) {
    root.appendChild(h('div', { class: 'empty', text: 'まだ会議がありません。上の「会議を追加する」から作るか、議事録を取り込んでください。' }));
  } else {
    const sel = h('select', { id: 'hearing-meeting', 'aria-label': '会議を選ぶ' },
      list.map((m) => h('option', { value: m.id, selected: m.id === hearingState.meetingId, text: `${m.date}　${m.title}（${enumLabel(TYPE_VALUES, m.meetingType)}・${statusLabel('meeting', m.status)}）` })));
    sel.addEventListener('change', () => { hearingState.meetingId = sel.value; hearingState.picked = new Set(); app.refresh(); });
    const m = list.find((x) => x.id === hearingState.meetingId);
    const sheet = ledger.items.filter((it) => it.kind === 'question' && it.meeting === m.id);
    const open = sheet.filter((q) => q.status === 'open').length;

    root.appendChild(h('section', { class: 'card stack' },
      h('div', { class: 'row' }, h('label', { class: 'row' }, '会議', sel), idButton(m.id, app)),
      h('div', { class: 'small row' },
        h('span', { class: 'muted', text: '出席者:' }),
        (m.attendees || []).length ? m.attendees.map((id) => idButton(id, app, { withTitle: true })) : h('span', { class: 'muted', text: '未登録' })),
      (m.agenda || []).length ? h('div', { class: 'small' }, h('span', { class: 'muted', text: '議題: ' }), m.agenda.join(' ／ ')) : null,
      h('div', { class: 'row' },
        h('button', { class: 'btn', type: 'button', id: 'hearing-minutes', onclick: () => app.go('prompts', { purpose: 'minutes', meetingId: m.id }) }, 'この会議の議事録の指示文を作る'),
        m.status === 'planned' ? h('button', { class: 'btn', type: 'button', id: 'hearing-held', onclick: () => {
          const r = store.applyLocal([{ op: 'update', id: m.id, set: { status: 'held' } }], 'hearing');
          toast(r.ok ? '開催済みにしました（取り消し可）' : r.errors.join(' / '));
        } }, '開催済みにする') : null)));

    root.appendChild(h('h3', { text: `ヒヤリングシート（${sheet.length}件 ／ 未回答 ${open}件）` }));
    root.appendChild(sheet.length
      ? h('ol', { class: 'sheet stack', id: 'hearing-sheet' }, sheet.map((q) => sheetRow(q, m, app)))
      : h('p', { class: 'muted', text: 'この会議で聞く質問はまだありません。下の候補から割り当ててください。' }));

    // 候補
    const cands = hearingCandidates(ledger, today);
    const label = { question: '未割り当ての質問', gap: '台帳の空欄', nfr: '非機能の未着手' };
    root.appendChild(h('h3', { text: `次のヒヤリングの候補（${cands.length}件）` }));
    if (!cands.length) {
      root.appendChild(h('p', { class: 'muted', text: '候補はありません。' }));
    } else {
      const items = cands.map((c) => h('li', { class: 'row cand' },
        h('input', { type: 'checkbox', id: 'cand-' + c.key.replace(/[^A-Za-z0-9_-]/g, '_'), 'data-fk': 'cand-' + c.key, checked: hearingState.picked.has(c.key), 'aria-label': c.text,
          onchange: (e) => { if (e.target.checked) hearingState.picked.add(c.key); else hearingState.picked.delete(c.key); app.refresh(); } }),
        h('span', { class: 'badge', text: label[c.type] }),
        h('span', { class: 'cand-text', text: c.text }),
        c.type !== 'nfr' ? idButton(c.ref, app) : null));
      root.appendChild(h('ul', { class: 'cand-list stack', id: 'hearing-cands' }, items));
      const n = cands.filter((c) => hearingState.picked.has(c.key)).length;
      root.appendChild(h('div', { class: 'row' },
        h('button', { class: 'btn small', type: 'button', onclick: () => { hearingState.picked = new Set(cands.map((c) => c.key)); app.refresh(); } }, 'すべて選ぶ'),
        h('button', { class: 'btn primary', type: 'button', id: 'hearing-assign', disabled: n === 0, onclick: () => {
          const ops = cands.filter((c) => hearingState.picked.has(c.key)).flatMap((c) => c.ops(m.id));
          const r = store.applyLocal(ops, 'hearing');
          if (!r.ok) { toast(r.errors.join(' / ')); return; }
          hearingState.picked = new Set();
          toast(`${n}件をこの会議に割り当てました（取り消し可）`);
        } }, `選んだ ${n} 件をこの会議に割り当てる`)));
    }
  }
}


// ---- ui/views/issues.js ----
// 課題と質問: ボール（誰の対応待ちか）ごとの件数と一覧。待ち日数の長い順


const issuesState = { ball: '' };

function openItemsByBall(ledger, today) {
  const rows = ledger.items
    .filter((it) => (it.kind === 'issue' || it.kind === 'question') && isOpen(it))
    .map((it) => ({ it, ball: ballOf(it, ledger), wait: waitDays(it, ledger, today), notAsked: notAskedYet(it, ledger) }));
  // 待ち日数の長い順。待ち日数の無いもの（まだ聞いていない）は後ろ
  rows.sort((a, b) => (b.wait ?? -1) - (a.wait ?? -1) || a.it.id.localeCompare(b.it.id));
  return rows;
}

function renderIssues(root, app) {
  const ledger = store.view();
  const today = todayStr();
  const rows = openItemsByBall(ledger, today);
  const limit = settingOf(ledger, 'ballWaitDays');

  root.appendChild(h('h2', { text: '課題と質問' }));
  root.appendChild(h('p', { class: 'muted small', text: `未完了の課題・質問を「誰の対応待ちか」で分けています。質問は質問先、課題は担当の立場で決まります。顧客待ちが ${limit} 日以上のものは健康診断にも出ます（日数は設定で変えられます）。` }));

  const counts = Object.fromEntries(BALL.map((b) => [b.v, rows.filter((r) => r.ball === b.v).length]));
  root.appendChild(h('div', { class: 'grid cols-4', id: 'ball-counts' }, BALL.map((b) => h('button', {
    class: ['card stat', issuesState.ball === b.v && 'active'], type: 'button', 'data-ball': b.v, 'aria-pressed': String(issuesState.ball === b.v),
    onclick: () => { issuesState.ball = issuesState.ball === b.v ? '' : b.v; app.refresh(); },
  }, h('span', { class: 'num', text: String(counts[b.v]) }), h('span', { class: 'lab', text: b.label })))));

  const shown = issuesState.ball ? rows.filter((r) => r.ball === issuesState.ball) : rows;
  root.appendChild(h('p', { class: 'muted small', id: 'issues-count', text: issuesState.ball ? `${BALL.find((b) => b.v === issuesState.ball).label}: ${shown.length}件（もう一度押すと全件）` : `全 ${rows.length}件` }));
  if (!shown.length) { root.appendChild(h('div', { class: 'empty', text: '該当する課題・質問はありません' })); return; }

  const thead = h('thead', null, h('tr', null, ['ID', '種別', '題名', '状態', '誰の対応待ちか', '相手', '待ち日数', '期限'].map((t) => h('th', { scope: 'col', text: t }))));
  const tbody = h('tbody', null, shown.map((r) => {
    const who = r.it.kind === 'question' ? r.it.askTo : r.it.owner;
    const over = r.ball === 'customer' && r.wait !== null && r.wait >= limit;
    return h('tr', {
      tabindex: '0', 'data-id': r.it.id, class: store.selectedId === r.it.id ? 'selected' : null, 'aria-label': `${r.it.id} ${r.it.title}`,
      onclick: () => app.openItem(r.it.id),
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); app.openItem(r.it.id); } },
    },
    h('td', { class: 'mono small', text: r.it.id }),
    h('td', null, h('span', { class: 'badge', text: kindLabel(r.it.kind) })),
    h('td', { class: 'title', text: r.it.title }),
    h('td', null, statusBadge(r.it.kind, r.it.status)),
    h('td', null, h('span', { class: ['badge', r.ball === 'customer' ? 'mid' : r.ball === 'unknown' ? 'high' : 'accent'], text: r.notAsked ? '自社（まだ聞いていない）' : BALL.find((b) => b.v === r.ball).label })),
    h('td', { class: 'small wrap', text: who ? (itemTitle(who, ledger) || who) : '未定' }),
    h('td', { class: ['small mono', over && 'over'], text: r.wait === null ? '—' : `${r.wait}日${over ? '（長い）' : ''}` }),
    h('td', { class: 'small mono', text: r.it.due || '' }));
  }));
  root.appendChild(h('div', { class: 'table-wrap' }, h('table', { class: 'list', id: 'issues-table' }, thead, tbody)));
}

// ---- ui/views/scope.js ----
// スコープ: ベースラインの記録、ベースラインと今の差、要望・要件の範囲の一覧


const scopeState = { baselineId: null };
const SCOPE_TONE = { in: 'ok', out: 'high', tbd: 'mid' };

function scopeBadge(scope) {
  const v = scope || 'tbd';
  return h('span', { class: `badge ${SCOPE_TONE[v]}`, text: enumLabel(SCOPE, v) });
}

function diffSection(title, rows, empty) {
  return h('section', { class: 'card' },
    h('h3', { text: `${title}（${rows.length}件）` }),
    rows.length ? h('ul', { class: 'ref-list' }, rows) : h('p', { class: 'muted small', text: empty }));
}

function renderScope(root, app) {
  const ledger = store.view();
  const bls = ledger.baselines || [];
  if (!scopeState.baselineId || !bls.some((b) => b.id === scopeState.baselineId)) scopeState.baselineId = bls.length ? bls[bls.length - 1].id : null;

  root.appendChild(h('h2', { text: 'スコープ' }));

  const name = h('input', { type: 'text', id: 'bl-name', placeholder: '例: 要件定義 合意版', 'aria-label': 'ベースラインの名前' });
  const date = h('input', { type: 'date', id: 'bl-date', value: todayStr(), 'aria-label': 'ベースラインの日付' });
  root.appendChild(h('section', { class: 'card stack' },
    h('h3', { text: 'ベースラインを記録する' }),
    h('p', { class: 'small muted', text: '今の要望・要件の ID・題名・範囲・状態を、名前と日付をつけて残します。合意した時点で記録すると、その後に増えた要望が分かります。' }),
    h('div', { class: 'row' }, name, date, h('button', { class: 'btn primary', type: 'button', id: 'bl-record', onclick: () => {
      if (!name.value.trim()) { toast('名前を入れてください'); name.focus(); return; }
      const id = store.recordBaseline(name.value.trim(), date.value || todayStr());
      scopeState.baselineId = id;
      toast(`ベースライン ${id} を記録しました（取り消し可）`);
    } }, '記録する'))));

  if (!bls.length) {
    root.appendChild(h('p', { class: 'notice', text: 'まだベースラインがありません。要望・要件を顧客と合意したら記録してください。' }));
  } else {

// WBS: 作業の階層の表。親は子から集計。末端の作業は進捗と実績をその場で入力できる


function numInput(id, field, value, label, max) {
  const el = h('input', { type: 'number', class: 'num-in', min: '0', max: String(max), step: field === 'progress' ? '5' : '0.5', 'data-fk': `${field}-${id}`, 'aria-label': label, value: value == null ? '' : String(value) });
  el.addEventListener('change', () => {
    const v = el.value === '' ? null : Number(el.value);
    if (v !== null && (!Number.isFinite(v) || v < 0 || v > max || (field === 'progress' && !Number.isInteger(v)))) { toast(`${label}は 0〜${max}${field === 'progress' ? ' の整数' : ''}で入れてください`); el.value = value == null ? '' : String(value); return; }
    const r = store.applyLocal([{ op: 'update', id, set: { [field]: v } }]);
    toast(r.ok ? `${label}を更新しました（取り消し可）` : r.errors.join(' / '));
  });
  return el;
}

function renderWbs(root, app) {

// ガント: 作業を日付の横棒で出す。今日の線・進捗・マイルストーン・前の作業からの矢印・遅れ


const ganttState = { unit: 'week' };

function renderGantt(root, app) {
  const ledger = visibleLedger(store.ledger, store.presentation);

// ---- ui/views/data.js ----
// データ設計: ER 図・テーブル定義・DDL（方言を選んでコピー）・物理名の点検


// 文字幅の概算で箱に収まるように切る（全角 12.5px・半角 7px）
function clipText(str, maxW) {
  let w = 0;
  let out = '';
  for (const ch of String(str)) {
    w += ch.charCodeAt(0) > 0xff ? 12.5 : 7;
    if (w > maxW - 10) return out + '…';
    out += ch;
  }
  return out;
}

function erSvg(L, selectedId, app) {
  const svg = s('svg', { class: 'chart er', width: L.width, height: L.height, viewBox: `0 0 ${L.width} ${L.height}`, role: 'img', 'aria-label': 'ER 図' });
  svg.appendChild(s('defs', null, s('marker', { id: 'er-arrow', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' }, s('path', { d: 'M0,0 L10,5 L0,10 z', class: 'er-head' }))));
  for (const ln of L.lines) {
    const d = ln.points.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join(' ');
    svg.appendChild(s('path', { class: ['er-line', (ln.from === selectedId || ln.to === selectedId) && 'hl'].filter(Boolean).join(' '), d, 'marker-end': 'url(#er-arrow)' }, s('title', null, `${ln.from}.${ln.column} → ${ln.to}`)));
  }
  for (const b of L.boxes) {

// ---- ui/views/crud.js ----
// CRUD 表: 機能（画面・連携・バッチ）× テーブル。作成されないテーブル・どの機能も触らないテーブルに印


function crudMatrix(ledger) {
  const funcs = ledger.items.filter((it) => ['screen', 'interface', 'batch'].includes(it.kind) && it.status !== 'dropped');
  const ents = ledger.items.filter((it) => it.kind === 'entity' && it.status !== 'dropped');
  const cell = new Map();
  for (const f of funcs) for (const c of f.crud || []) if (c && c.entity) cell.set(f.id + '|' + c.entity, c.ops);
  const created = new Set();
  const touched = new Set();
  for (const [k, ops] of cell) {
    const e = k.split('|')[1];
    touched.add(e);
    if (/C/.test(ops)) created.add(e);
  }
  return { funcs, ents, cell, created, touched };
}

function renderCrud(root, app) {
  const ledger = store.view();
  const m = crudMatrix(ledger);
  root.appendChild(h('h2', { text: 'CRUD 表' }));
  if (!m.funcs.length || !m.ents.length) { root.appendChild(h('div', { class: 'empty', text: '画面・連携・バッチとテーブルがそろうと表が出ます。' })); return; }
  root.appendChild(h('p', { class: 'muted small', text: 'C 作成・R 参照・U 更新・D 削除。列の見出しの「作成なし」は、どの機能からも作られないテーブル（外部参照のテーブルを除く）、「未使用」はどの機能も触らないテーブルです。' }));
  const head = h('tr', null, h('th', { scope: 'col', text: '機能 ＼ テーブル' }), m.ents.map((e) => {
    const noCreate = e.fileType !== 'external' && !m.created.has(e.id);
    const unused = !m.touched.has(e.id);
    return h('th', { scope: 'col', class: ['crud-col', (noCreate || unused) && 'warn'], 'data-entity': e.id },
      h('button', { type: 'button', class: 'linklike', onclick: () => app.openItem(e.id) }, e.title),
      h('div', { class: 'mono small muted', text: e.physicalName }),
      unused ? h('span', { class: 'badge high', text: '未使用' }) : noCreate ? h('span', { class: 'badge mid', text: '作成なし' }) : null,
      e.fileType === 'external' ? h('span', { class: 'badge', text: '外部' }) : null);
  }));
  const body = m.funcs.map((f) => h('tr', { class: 'nocursor', 'data-id': f.id },
    h('th', { scope: 'row', class: 'crud-row' }, h('button', { type: 'button', class: 'linklike', onclick: () => app.openItem(f.id) }, f.title), h('span', { class: 'badge small', text: kindLabel(f.kind) })),
    m.ents.map((e) => {
      const ops = m.cell.get(f.id + '|' + e.id) || '';
      return h('td', { class: ['crud-cell', ops && 'on', /C/.test(ops) && 'c'], text: ops, 'aria-label': ops ? `${f.title} は ${e.title} を ${ops}` : null });
    })));
  root.appendChild(h('div', { class: 'table-wrap' }, h('table', { class: 'list crud-table', id: 'crud-table' }, h('thead', null, head), h('tbody', null, body))));
}

const ENCODINGS = [{ v: 'auto', label: '自動（UTF-8 → Shift_JIS）' }, { v: 'utf-8', label: 'UTF-8' }, { v: 'shift_jis', label: 'Shift_JIS' }];
let masterState = null;
const fresh = () => ({ entityId: null, encoding: 'auto', main: null, refs: {}, result: null });

function dataInput(id, label, onLoad) {
  const ta = h('textarea', { rows: '6', id: id + '-text', 'aria-label': label, placeholder: 'CSV / TSV を貼り付けるか、下でファイルを選びます（1 行目は見出し）' });

  });
  const btn = h('button', { class: 'btn small', type: 'button', id: id + '-use', onclick: () => { if (ta.value.trim()) onLoad({ name: '貼り付け', text: ta.value, encoding: '貼り付け' }); } }, '貼った内容を使う');
  return h('div', { class: 'stack' }, ta, h('div', { class: 'row' }, file, btn));

function renderMaster(root, app) {
  if (!masterState) masterState = fresh();

  const masters = ents.filter((e) => e.master);
  root.appendChild(h('h2', { text: 'マスタ点検' }));
  root.appendChild(h('p', { class: 'notice small', text: '貼った元データはこの画面の中だけで点検し、台帳にもブラウザの保存にも残しません。別の画面に移ると消えます。' }));
  if (!masters.length) { root.appendChild(h('div', { class: 'empty', text: 'マスタの印のあるテーブルがありません。データ設計でテーブルを master: true にしてください。' })); return; }

    for (const [eid, d] of Object.entries(st.refs)) {

    st.result = checkMaster(ent, parseDelimited(st.main.text), refData, ents);

    dataInput('master-main', `${ent.title}の元データ`, (d) => { st.main = d; run(); })));

  }

  const r = st.result;
  if (!r) return;
  root.appendChild(h('h3', { text: `点検結果（データ ${r.dataRows} 行・違反 ${r.total} 件）` }));

// ---- ui/views/trace.js ----
// トレーサビリティ: 要件ごとの 要望・設計・テストと判定。判定と工程で絞り込む


const traceState = { verdict: '', level: '' };
const TONE = { none: 'high', failed: 'high', pending: 'mid', passed: 'ok' };
const LEVELS = KINDS.test.fields.level.values;

// 工程で絞ったときは、その工程のテストだけで判定し直す
function judge(tests) {
  if (!tests.length) return 'none';
  if (tests.some((t) => t.status === 'failed')) return 'failed';
  if (tests.some((t) => t.status !== 'passed')) return 'pending';
  return 'passed';
}

function renderTrace(root, app) {
  const ledger = store.view();
  const rows = traceRows(ledger).map((r) => {
    const tests = traceState.level ? r.tests.filter((t) => t.level === traceState.level) : r.tests;
    return { ...r, tests, verdict: judge(tests) };
  });
  root.appendChild(h('div', { class: 'row' },
    h('h2', { text: 'トレーサビリティ（要件 → 設計 → テスト）' }),
    h('span', { class: 'spacer' }),
    store.presentation ? null : h('button', { class: 'btn', type: 'button', onclick: () => app.go('prompts', { purpose: 'test-viewpoints' }) }, 'テスト観点の生成の指示文へ')));
  root.appendChild(h('p', { class: 'muted small', text: '要件とつながる設計の項目（画面・連携・バッチ・テーブル）に結びついたテストも、その要件のテストとして数えます。' }));
  const counts = Object.fromEntries(VERDICTS.map((v) => [v.v, rows.filter((r) => r.verdict === v.v).length]));
  const sel = (id, label, value, options, on) => {
    const el = h('select', { id, 'aria-label': label }, options.map(([v, t]) => h('option', { value: v, selected: v === value, text: t })));
    el.addEventListener('change', () => on(el.value));
    return el;
  };
  root.appendChild(h('div', { class: 'row filters' },
    VERDICTS.map((v) => h('button', {
      type: 'button', class: ['btn small', traceState.verdict === v.v && 'primary'], 'aria-pressed': String(traceState.verdict === v.v), 'data-fk': 'verdict-' + v.v,
      onclick: () => { traceState.verdict = traceState.verdict === v.v ? '' : v.v; app.refresh(); },
    }, `${v.label}（${counts[v.v]}）`)),
    h('span', { class: 'spacer' }),
    h('label', { class: 'row small' }, '工程', sel('trace-level', '工程', traceState.level, [['', 'すべて'], ...LEVELS.map((l) => [l.v, l.label])], (v) => { traceState.level = v; app.refresh(); }))));
  const shown = traceState.verdict ? rows.filter((r) => r.verdict === traceState.verdict) : rows;
  if (!shown.length) { root.appendChild(h('div', { class: 'empty', text: '該当する要件はありません' })); return; }
  const refs = (list) => list.length ? h('div', null, list.map((x) => h('div', null, idButton(x.id, app, { withTitle: true })))) : h('span', { class: 'muted', text: '—' });
  const thead = h('thead', null, h('tr', null, ['要件', '状態', '要望', '設計', 'テスト', '判定'].map((t) => h('th', { scope: 'col', text: t }))));
  const tbody = h('tbody', null, shown.map((r) => h('tr', { class: 'nocursor', 'data-id': r.req.id },
    h('td', { class: 'title' }, idButton(r.req.id, app), ' ', r.req.title),
    h('td', { class: 'small', text: statusLabel('requirement', r.req.status) }),
    h('td', { class: 'wrap small' }, refs(r.requests)),
    h('td', { class: 'wrap small' }, refs(r.design)),
    h('td', { class: 'wrap small' }, r.tests.length
      ? h('div', null, r.tests.map((t) => h('div', null, idButton(t.id, app), ` ${statusLabel('test', t.status)}`)))
      : h('span', { class: 'muted', text: '—' })),
    h('td', null, h('span', { class: `badge ${TONE[r.verdict]}`, text: enumLabel(VERDICTS, r.verdict) })))));
  root.appendChild(h('div', { class: 'table-wrap' }, h('table', { class: 'list', id: 'trace-table' }, thead, tbody)));
}


// ---- ui/views/tests.js ----
// テスト: 工程・観点・状態で絞り込める一覧、工程ごとの合格率。状態と実施日はその場で変えられる


const testState = { level: '', viewpoint: '', status: '' };
const F = KINDS.test.fields;

function renderTests(root, app) {
  const ledger = store.view();
  const all = ledger.items.filter((it) => it.kind === 'test');
  root.appendChild(h('div', { class: 'row' },
    h('h2', { text: 'テスト' }),
    h('span', { class: 'spacer' }),
    store.presentation ? null : h('button', { class: 'btn', type: 'button', onclick: () => app.go('prompts', { purpose: 'test-viewpoints' }) }, 'テスト観点の生成の指示文へ')));
  if (!all.length) { root.appendChild(h('div', { class: 'empty', text: 'まだテストがありません。「テスト観点の生成」の指示文で、要件や画面からテストを作らせてください。' })); return; }

  root.appendChild(h('div', { class: 'grid cols-4', id: 'pass-rates' }, passRates(ledger, F.level.values).map((r) => h('div', { class: 'card stat', 'data-level': r.level },
    h('span', { class: 'num', text: r.rate === null ? '—' : `${r.rate}%` }),
    h('span', { class: 'lab', text: `${r.label}テストの合格率（${r.passed} / ${r.total}${r.failed ? `・不合格 ${r.failed}` : ''}）` })))));

  const sel = (id, label, key, values) => {
    const el = h('select', { id, 'aria-label': label }, [['', `すべての${label}`], ...values.map((v) => [v.v, v.label])].map(([v, t]) => h('option', { value: v, selected: v === testState[key], text: t })));
    el.addEventListener('change', () => { testState[key] = el.value; app.refresh(); });
    return el;
  };
  root.appendChild(h('div', { class: 'filters' },
    sel('test-level', '工程', 'level', F.level.values),
    sel('test-viewpoint', '観点', 'viewpoint', F.viewpoint.values),
    sel('test-status', '状態', 'status', KINDS.test.statuses)));
  const list = all.filter((t) => (!testState.level || t.level === testState.level) && (!testState.viewpoint || t.viewpoint === testState.viewpoint) && (!testState.status || t.status === testState.status));
  root.appendChild(h('p', { class: 'muted small', id: 'tests-count', text: `${list.length}件 ／ 全${all.length}件。状態と実施日はこの表で直接変えられます（取り消し可）。` }));

  const thead = h('thead', null, h('tr', null, ['ID', 'テスト', '工程', '観点', '状態', '実施日'].map((t) => h('th', { scope: 'col', text: t }))));
  const tbody = h('tbody', null, list.map((t) => {
    const st = h('select', { 'data-fk': 'status-' + t.id, 'aria-label': `${t.title}の状態`, disabled: store.presentation }, KINDS.test.statuses.map((s) => h('option', { value: s.v, selected: s.v === t.status, text: s.label })));
    st.addEventListener('change', () => {
      const set = { status: st.value };
      // 合格・不合格にしたとき、実施日が空なら今日を入れる
      if ((st.value === 'passed' || st.value === 'failed') && !t.executedAt) set.executedAt = todayStr();
      const r = store.applyLocal([{ op: 'update', id: t.id, set }]);
      toast(r.ok ? '状態を変えました（取り消し可）' : r.errors.join(' / '));
    });
    const dt = h('input', { type: 'date', 'data-fk': 'exec-' + t.id, 'aria-label': `${t.title}の実施日`, value: t.executedAt || '', disabled: store.presentation });
    dt.addEventListener('change', () => {
      const r = store.applyLocal([{ op: 'update', id: t.id, set: { executedAt: dt.value || null } }]);
      toast(r.ok ? '実施日を変えました（取り消し可）' : r.errors.join(' / '));
    });
    return h('tr', { 'data-id': t.id, class: store.selectedId === t.id ? 'selected' : null },
      h('td', { class: 'mono small' }, h('button', { class: 'linklike', type: 'button', onclick: () => app.openItem(t.id) }, t.id)),
      h('td', { class: 'title' }, t.title, ' ', statusBadge(t.kind, t.status)),
      h('td', { class: 'small', text: enumLabel(F.level.values, t.level) }),
      h('td', { class: 'small', text: enumLabel(F.viewpoint.values, t.viewpoint) }),
      h('td', null, st),
      h('td', null, dt));
  }));
  root.appendChild(h('div', { class: 'table-wrap' }, h('table', { class: 'list', id: 'tests-table' }, thead, tbody)));
}

// ---- ui/views/guide.js ----
// 使い方: 左の目次と右の本文。文章は core/guide-text.js、画面の一覧は core/screens.js、指示文の名前は PURPOSES から引く


const CHAPTERS = [
  { id: 'g-intro', title: 'はじめに' },
  { id: 'g-first', title: '最初の 10 分' },
  { id: 'g-round', title: 'Gemini との往復' },
  { id: 'g-phases', title: '案件の進め方' },

  { id: 'g-terms', title: '用語' },
];

const screenOf = (id) => SCREENS.find((s) => s.id === id);
// 説明用の表示では、隠れる画面と道具の指示文の案内を出さない
const showScreen = (id) => !(store.presentation && hiddenScreenInPresentation(screenOf(id)));
const showPurposes = () => !store.presentation;

// 「この画面を開く」。開けないときは押せず、理由を出す
function openButton(app, id, label) {
  const c = app.canOpen(id);
  return h('span', { class: 'open-wrap' },
    h('button', { class: 'btn small', type: 'button', 'data-fk': 'go-' + id + '-' + label.length, disabled: !c.ok, title: c.ok ? '' : c.reason, onclick: () => app.go(id) }, label),
    c.ok ? null : h('span', { class: 'muted small', text: c.reason }));
}

function purposeButton(app, pid) {
  const p = PURPOSES.find((x) => x.id === pid);
  const c = app.canOpen('prompts');
  return h('li', { class: 'purpose-item' },
    h('strong', { text: p ? p.label : pid }), ' ', h('span', { class: 'small muted', text: p ? p.desc : '' }), ' ',
    h('button', { class: 'btn small', type: 'button', 'data-fk': 'purpose-' + pid, disabled: !c.ok, title: c.ok ? '' : c.reason, onclick: () => app.go('prompts', { purpose: pid }) }, 'この指示文を開く'));
}

// 「この指示文を開く」（開けないときは理由も出す）
function purposeOpen(app, pid) {
  const c = app.canOpen('prompts');
  return h('span', { class: 'open-wrap' },
    h('button', { class: 'btn small', type: 'button', 'data-fk': 'flow-purpose-' + pid, disabled: !c.ok, title: c.ok ? '' : c.reason, onclick: () => app.go('prompts', { purpose: pid }) }, 'この指示文を開く'),
    c.ok ? null : h('span', { class: 'muted small', text: c.reason }));
}

// 番号つきのカードと矢印の流れ図
function flow(steps, app) {
  const out = [];
  steps.forEach((st, i) => {
    if (i) out.push(h('div', { class: 'flow-arrow', 'aria-hidden': 'true', text: '→' }));
    out.push(h('div', { class: 'flow-card', role: 'group', 'aria-label': `手順 ${i + 1}` },
      h('div', { class: 'flow-num', text: String(i + 1) }),
      h('div', { class: 'flow-title', text: st.title }),
      h('p', { class: 'flow-desc', text: st.desc }),
      app && st.screen ? openButton(app, st.screen, 'この画面を開く') : null,
      app && st.purpose && showPurposes() ? purposeOpen(app, st.purpose) : null));
  });
  return h('div', { class: 'flow' }, out);
}

function chapter(id, title, ...children) {
  return h('section', { class: 'guide-chapter', id, 'aria-labelledby': id + '-h' }, h('h2', { id: id + '-h', text: title }), ...children);

// 起動・画面切替・上部の状態表示


// 画面の描画関数（画面の id → 関数）。分類と画面の一覧は core/screens.js が正
const RENDERERS = {
  cross: renderCross, overview: renderOverview, graph: renderGraph, list: renderList, decisions: renderDecisions, health: renderHealth,
  hearing: renderHearing, issues: renderIssues, nfr: renderNfr, scope: renderScope,
  wbs: renderWbs, gantt: renderGantt, progress: renderProgress, changes: renderChanges, 'meeting-report': renderMeetingReport,
  data: renderData, functions: renderFunctions, crud: renderCrud, estimate: renderEstimate, master: renderMaster,
  trace: renderTrace, tests: renderTests,
  prompts: renderPrompts, import: renderImport, settings: renderSettings,
  guide: renderGuide,
};
const VIEWS = SCREENS.map((sc) => ({ ...sc, render: RENDERERS[sc.id] }));
// 台帳が無いと開けない画面
const NEEDS_LEDGER = new Set(VIEWS.filter((v) => !NO_LEDGER_OK.includes(v.id)).map((v) => v.id));
// 再描画をまたいで保つスクロール位置（画面の中の横スクロール領域も含む）
const SCROLLERS = ['#view', '.graph-wrap', '.table-wrap', '#detail'];

// フォーカスしている要素を、再描画後に探し直せる形で覚える
function focusSelector(el) {
  if (!el || el === document.body || !el.closest) return null;
  if (!el.closest('#view, #detail, #tabs, #groups, .topbar')) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  if (el.dataset && el.dataset.fk) return `[data-fk="${CSS.escape(el.dataset.fk)}"]`;
  if (el.dataset && el.dataset.id) return `${el.tagName.toLowerCase()}[data-id="${CSS.escape(el.dataset.id)}"]`;
  return null;
}

function captureUi() {
  const scroll = SCROLLERS.map((sel) => { const e = document.querySelector(sel); return e ? [sel, e.scrollTop, e.scrollLeft] : null; }).filter(Boolean);
  return { scroll, focus: focusSelector(document.activeElement) };
}

function restoreUi(st) {
  for (const [sel, top, left] of st.scroll) {
    const e = document.querySelector(sel);
    if (e) { e.scrollTop = top; e.scrollLeft = left; }
  }
  if (st.focus) {
    const f = document.querySelector(st.focus);
    if (f) f.focus({ preventScroll: true });
  }
}

const app = {
  view: 'overview',
  viewOpts: {},
  opener: null,
  // 画面を切り替える（先頭から表示する）
  go(view, opts) {
    if (!VIEWS.some((v) => v.id === view) || hiddenInPresentation(view)) view = 'overview';
    const same = view === this.view;
    // マスタ点検の元データは、画面を離れたら捨てる（保存しない）
    if (!same && this.view === 'master') clearMasterState();
    this.view = view;
    this.viewOpts = opts || {};
    if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
    if (same) { this.refresh(); return; }
    renderAll();
    document.getElementById('view').scrollTop = 0;
    const cur = document.querySelector('#tabs [aria-current="page"]');
    if (cur && document.activeElement && document.activeElement.closest && document.activeElement.closest('#tabs, #groups')) cur.focus();
  },
  // 同じ画面を描き直す（スクロール位置とフォーカスを保つ）
  refresh() {
    const st = captureUi();
    renderAll();
    restoreUi(st);
  },
  openItem(id) {
    this.opener = focusSelector(document.activeElement);
    store.select(id);
    const t = document.getElementById('detail-title');
    if (t) t.focus({ preventScroll: true });
  },
  closeDetail() {
    const back = this.opener;
    store.select(null);
    if (back) { const e = document.querySelector(back); if (e) e.focus({ preventScroll: true }); }
  },
  // 画面を開けるか。タブのボタンと使い方のボタンの両方がこれを使う。戻り値: { ok, reason }
  canOpen(viewId) {
    if (!VIEWS.some((v) => v.id === viewId)) return { ok: false, reason: 'その画面はありません' };
    if (locked()) return viewId === 'guide' ? { ok: true } : { ok: false, reason: '合言葉で開いてから使えます' };
    if (!store.ledger && NEEDS_LEDGER.has(viewId)) return { ok: false, reason: '先に「設定」で案件を作るか、読み込んでください' };
    if (hiddenInPresentation(viewId)) return { ok: false, reason: '説明用の表示中は開けません' };
    return { ok: true };
  },
  views() { return VIEWS; },
  health() {
    // 説明用の表示では健康診断を出さない（社内向けの点検のため）
    return store.ledger && !store.presentation ? runHealth(store.ledger, todayStr()) : [];
  },
};

// 説明用の表示で開けない画面（道具の分類と健康診断）
function hiddenInPresentation(viewId) {
  if (!store.presentation) return false;
  return hiddenScreenInPresentation(VIEWS.find((x) => x.id === viewId));
}

function locked() {
  return store.vaultState === 'locked' || store.vaultState === 'legacy';
}

// 分類ごとに最後に開いた画面（分類を押したときに戻る先）
const lastInGroup = {};

function renderTabs() {
  const groupsEl = clear(document.getElementById('groups'));
  const tabs = clear(document.getElementById('tabs'));
  if (locked()) return;
  const highCount = app.health().filter((f) => f.severity === 'high').length;
  const curView = VIEWS.find((v) => v.id === app.view);
  lastInGroup[curView.group] = curView.id;
  for (const g of GROUPS) {
    const views = VIEWS.filter((v) => v.group === g.id && !hiddenInPresentation(v.id));
    if (!views.length) continue;
    groupsEl.appendChild(h('button', {
      class: 'group', type: 'button', id: 'group-' + g.id, 'aria-current': g.id === curView.group ? 'true' : null,
      onclick: () => app.go(lastInGroup[g.id] || (g.id === 'grasp' ? 'overview' : views[0].id)),
    }, g.label));
  }
  for (const v of VIEWS.filter((x) => x.group === curView.group && !hiddenInPresentation(x.id))) {
    // 台帳が無いときの「概要」タブは押せてようこそ画面を出す（初回の入口）
    const disabled = !app.canOpen(v.id).ok && !(v.id === 'overview' && !store.ledger);
    tabs.appendChild(h('button', {
      class: 'tab', type: 'button', id: 'tab-' + v.id, 'aria-current': app.view === v.id ? 'page' : null, disabled,
      onclick: () => app.go(v.id),
    }, v.label, v.id === 'health' && highCount ? h('span', { class: 'count', text: String(highCount), 'aria-label': `（重要度 高 ${highCount}件）` }) : null));
  }
}

function renderTopbar() {
  const name = clear(document.getElementById('project-name'));
  const projects = store.projects();
  // 案件が複数あるときは切り替えの一覧を出す。説明用の表示では、他の顧客の案件名を見せないよう今の案件名だけ
  if (projects.length > 1 && !store.presentation && !locked()) {
    const sel = h('select', { id: 'project-switch', 'aria-label': '案件を切り替える' },
      projects.map((p) => h('option', { value: p.id, selected: p.id === store.activeId, text: p.name + (p.dirty ? '（未書き出し）' : '') })));
    sel.addEventListener('change', () => { store.switchProject(sel.value); toast('案件を切り替えました'); });
    name.appendChild(sel);
  } else {
    name.textContent = store.ledger ? store.ledger.project.name : '';
  }
  const status = clear(document.getElementById('topbar-status'));
  if (store.saveError) status.appendChild(h('span', { class: 'badge high', text: '保存に失敗', title: store.saveError }));
  if (store.vaultState === 'nostore') status.appendChild(h('span', { class: 'badge high', text: 'ブラウザに保存しません', title: store.loadError || '' }));
  if (store.presentation) status.appendChild(h('span', { class: 'badge accent', id: 'presentation-badge', text: '説明用の表示中' }));
  if (store.ledger && !store.presentation) {
    status.appendChild(h('span', { class: 'muted small', text: `rev ${store.ledger.revision}` }));
    if (store.isDirty()) status.appendChild(h('span', { class: 'badge mid', id: 'dirty-badge', text: '未書き出しの変更あり' }));
    else status.appendChild(h('span', { class: 'badge ok', text: '書き出し済み' }));
  }
  const actions = clear(document.getElementById('topbar-actions'));
  if (store.ledger) {
    actions.appendChild(h('button', {
      class: ['btn', store.presentation && 'primary'], type: 'button', id: 'btn-presentation', 'aria-pressed': String(store.presentation),
      title: '顧客に画面を見せるときの表示。社内のみの項目・健康診断・実績の値・道具の画面を隠す',
      onclick: () => { store.setPresentation(!store.presentation); toast(store.presentation ? '説明用の表示にしました' : '通常の表示に戻しました'); },
    }, store.presentation ? '通常の表示に戻す' : '説明用の表示'));
  }
  if (store.ledger && !store.presentation) {
    actions.appendChild(h('button', {
      class: 'btn', type: 'button', id: 'btn-undo', disabled: !store.canUndo(), title: '直前の1回の変更を取り消す',
      onclick: () => { if (store.undo()) toast('直前の変更を取り消しました'); },
    }, '取り消し'));
    actions.appendChild(h('button', {
      class: 'btn primary', type: 'button', id: 'btn-export', title: '台帳を JSON ファイルに保存する',
      onclick: () => { download(store.exportFilename(), store.exportText()); store.markExported(); toast('書き出しました（保存ダイアログを閉じた場合は保存されていません）'); },
    }, '書き出し'));
  }
  if (store.vaultState === 'unlocked') {
    actions.appendChild(h('button', {
      class: 'btn', type: 'button', id: 'btn-lock', title: '台帳と鍵をメモリから消し、合言葉を入れるまで開けないようにする',
      onclick: () => { store.lock(); toast('ロックしました'); },
    }, 'ロック'));
  }
}

function renderView() {
  const root = clear(document.getElementById('view'));
  if (locked()) {
    // ロック中でも使い方だけは読める（案件のデータは出さない）
    if (app.view === 'guide') {
      root.appendChild(h('div', { class: 'row guide-back' }, h('button', { class: 'btn', type: 'button', id: 'guide-back-lock', onclick: () => app.go('overview') }, '← 合言葉の画面に戻る')));
      renderGuide(root, app, app.viewOpts);
    } else renderLock(root, app);
    return;
  }
  if (store.loadError) root.appendChild(h('p', { class: 'notice error', text: store.loadError }));
  if (store.saveError) root.appendChild(h('p', { class: 'notice error', text: store.saveError }));
  const v = VIEWS.find((x) => x.id === app.view);
  if (!store.ledger && NEEDS_LEDGER.has(v.id)) {
    renderWelcome(root);
    return;
  }
  v.render(root, app, app.viewOpts);
}

function renderWelcome(root) {
  root.appendChild(h('div', { class: 'card stack welcome' },
    h('h2', { text: '案件ワークベンチへようこそ' }),
    h('p', { text: 'まだ台帳がありません。「設定」から新しい案件を作るか、書き出した台帳ファイルを読み込んでください。' }),
    h('p', { class: 'muted small', text: '台帳は合言葉で暗号化してこのブラウザの中に保存し、書き出したファイルにも保存できます。外部へは一切送信しません。' }),
    h('div', { class: 'row' },
      h('button', { class: 'btn primary', type: 'button', onclick: () => app.go('settings') }, '設定を開く'),
      h('button', { class: 'btn', type: 'button', id: 'welcome-guide', onclick: () => app.go('guide') }, '使い方を見る'))));
}

function renderAll() {
  renderTabs();
  renderTopbar();
  renderView();
  renderDetail(document.getElementById('detail'), app);
}

function boot() {
  // 他人のページの枠の中では動かない（クリックジャッキング対策。GitHub Pages ではヘッダで防げないため）
  if (window.top !== window.self) {
    document.body.textContent = 'このツールは単独のタブで開いてください。';
    return;
  }
  store.init();
  const fromHash = location.hash.replace('#', '');
  app.view = VIEWS.some((v) => v.id === fromHash) ? fromHash : 'overview';
  store.subscribe((reason) => {
    if (reason === 'select') {
      // 選んだ項目を画面の中でも強調する画面は、描き直す
      if (['graph', 'list', 'data', 'gantt', 'wbs', 'issues', 'scope', 'changes', 'functions', 'tests'].includes(app.view)) app.refresh();
      else renderDetail(document.getElementById('detail'), app);
      return;
    }
    if (reason === 'save-error') { renderTopbar(); return; }
    if (reason === 'vault') clearMasterState();
    if (reason === 'presentation' && hiddenInPresentation(app.view)) { app.go('overview'); return; }
    app.refresh();
  });
  window.addEventListener('hashchange', () => {
    const id = location.hash.replace('#', '');
    if (id !== app.view && VIEWS.some((v) => v.id === id)) app.go(id);
    else if (hiddenInPresentation(id)) app.go('overview');
  });
  // Esc で詳細パネルを閉じる（ダイアログが開いているときはダイアログ側が受ける）
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && store.selectedId && !document.querySelector('dialog[open]')) { e.preventDefault(); app.closeDetail(); }
  });
  // 自動確認用の入口。URL に ?debug を付けたときだけ公開する（普段は台帳をメモリから取り出せないようにする）
  if (new URLSearchParams(location.search).has('debug')) {
    window.__workbench = { store, app, core: { createLedger, validatePatch, extractJson } };
  }
  renderAll();
}

boot();

})();
</script>
