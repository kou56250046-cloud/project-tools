// DOM の小道具。外部由来の文字列は必ず textContent / setAttribute で入れる（innerHTML を使わない）

const SVG_NS = 'http://www.w3.org/2000/svg';

function setAttrs(el, attrs) {
  if (!attrs) return;
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.setAttribute('class', Array.isArray(v) ? v.filter(Boolean).join(' ') : v);
    else if (k === 'text') el.textContent = String(v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k === 'value' && 'value' in el) el.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'hidden') { el[k] = !!v; }
    else el.setAttribute(k, v === true ? '' : String(v));
  }
}

function append(el, children) {
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  setAttrs(el, attrs);
  append(el, children);
  return el;
}

function s(tag, attrs, ...children) {
  const el = document.createElementNS(SVG_NS, tag);
  setAttrs(el, attrs);
  append(el, children);
  return el;
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
  return el;
}

let toastTimer = 0;
function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function download(filename, text, type) {
  const blob = new Blob([text], { type: type || 'application/json;charset=utf-8' });
  const a = h('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function fallbackCopy(text) {
  const ta = h('textarea', { class: 'offscreen', 'aria-hidden': 'true' });
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

// クリップボードへコピー。file:// では isSecureContext が偽のことがあるので代替経路を持つ
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* 代替へ */ }
  }
  return fallbackCopy(text);
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function nowIso() { return new Date().toISOString(); }

// ブラウザの confirm() の代わり（自動操作を止めないよう <dialog> を使う）
function confirmDialog(message, okLabel, detail) {
  return new Promise((resolve) => {
    const dlg = h('dialog', { class: 'dialog' },
      h('p', { class: 'dialog-msg', text: message }),
      detail ? h('p', { class: 'muted small', text: detail }) : null,
      h('div', { class: 'row dialog-actions' },
        h('button', { class: 'btn', type: 'button', 'data-act': 'cancel', onclick: () => done(false) }, 'やめる'),
        h('button', { class: 'btn primary', type: 'button', 'data-act': 'ok', onclick: () => done(true) }, okLabel || 'OK')));
    function done(v) { dlg.close(); dlg.remove(); resolve(v); }
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); done(false); });
    document.body.appendChild(dlg);
    dlg.showModal();
  });
}

function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// 3 つ以上の選択肢を出すダイアログ。choices: [{ value, label, primary? }]。やめたら null
function choiceDialog(message, choices, detail) {
  return new Promise((resolve) => {
    const dlg = h('dialog', { class: 'dialog' },
      h('p', { class: 'dialog-msg', text: message }),
      detail ? h('p', { class: 'muted small', text: detail }) : null,
      h('div', { class: 'row dialog-actions' },
        h('button', { class: 'btn', type: 'button', 'data-act': 'cancel', onclick: () => done(null) }, 'やめる'),
        choices.map((c) => h('button', { class: ['btn', c.primary && 'primary'], type: 'button', 'data-act': c.value, onclick: () => done(c.value) }, c.label))));
    function done(v) { dlg.close(); dlg.remove(); resolve(v); }
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); done(null); });
    document.body.appendChild(dlg);
    dlg.showModal();
  });
}


// ---- ui/store.js ----
// 画面の状態。台帳・取り消し・書き出し状態を持ち、localStorage に「暗号化して」保存する。
//
// 保存の状態（vaultState）:
//   empty    保存された台帳が無い。新しく作る・読み込むときに合言葉を決める
//   legacy   P1 の平文の保存が残っている。合言葉を決めると暗号化し、平文を消す
//   locked   暗号化した台帳がある。合言葉を入れるまで開けない
//   unlocked 開いている。鍵はメモリにだけある
//   nostore  この環境では暗号化が使えない。ブラウザには保存しない（書き出しが正本）
//
// P5 から箱の中身は複数案件の入れ物（workspace）。ledger・undoLedger・exportedRevision・exportedAt は
// 「今開いている案件」の値を返す getter にしてあり、画面側は今までどおり store.ledger を読めばよい


const KEY_VAULT = 'anken-workbench:v1:vault';
const KEY_RECOVERY = 'anken-workbench:v1:recovery';
const KEY_LEGACY = 'anken-workbench:v1:ledger';
const KEY_EXPORTED = 'anken-workbench:v1:exportedRevision';
const KEY_EXPORTED_AT = 'anken-workbench:v1:exportedAt';

function lsGet(key) {
  try { return window.localStorage.getItem(key); } catch (e) { return null; }
}
function lsSet(key, value) {
  try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
}
function lsRemove(key) {
  try { window.localStorage.removeItem(key); } catch (e) { /* 何もしない */ }
}

// 台帳のオブジェクトを移行して検査する。戻り値: { ok, ledger, migrated } / { ok: false, errors }
function checkLedgerObject(obj) {
  const m = migrateLedger(obj);
  if (m.error) return { ok: false, errors: [m.error] };
  let errs;
  try { errs = validateLedger(m.ledger, { allowDanglingRefs: true }); } catch (e) {
    errs = ['台帳の検査中に問題が起きました（' + String(e && e.message || e) + '）'];
  }
  if (errs.length) return { ok: false, errors: errs };
  return { ok: true, ledger: normalizeCounters(m.ledger), migrated: m.migrated };
}

// 台帳の文字列を検査して読む
function readLedgerText(text) {
  let obj;
  try { obj = safeParse(String(text).replace(/^﻿/, '')); } catch (e) {
    return { ok: false, errors: ['JSON として読めません'] };
  }
  return checkLedgerObject(obj);
}

const store = {
  workspace: emptyWorkspace(),
  undoById: new Map(),     // 案件ごとの取り消し用の適用前の台帳（メモリのみ）
  legacyExported: null,    // P4 までの書き出し状態（移行で使う）
  recovery: {},            // 読めなかった案件の元の文字列 { 案件ID: 文字列 }（暗号化して退避する）
  gen: 0,                  // 台帳が変わるたびに増える世代（revision は取り消しや新規作成で重なるため別に持つ）
  token: '',               // 台帳を置き換えるたびに変わる印（取込の下書きを捨てる判定に使う）
  vaultState: 'empty',
  key: null,
  salt: null,
  saving: Promise.resolve(),
  saveError: null,
  loadError: null,
  selectedId: null,
  presentation: false,     // 説明用の表示（保存しない。開き直すと通常に戻る）
  listeners: new Set(),

  // ---- 今開いている案件 ----
  get activeId() { return this.workspace.activeId; },
  get ledger() {
    const id = this.workspace.activeId;
    return id ? this.workspace.ledgers[id] || null : null;
  },
  set ledger(v) {
    if (!v) return;
    if (!this.workspace.activeId) {
      const id = newProjectId();
      this.workspace.activeId = id;
      this.workspace.exported[id] = { revision: null, at: null };
    }
    this.workspace.ledgers[this.workspace.activeId] = v;
  },
  get undoLedger() { return this.undoById.get(this.workspace.activeId) || null; },
  set undoLedger(v) {
    const id = this.workspace.activeId;
    if (!id) return;
    if (v) this.undoById.set(id, v); else this.undoById.delete(id);
  },
  get exportedRevision() { const e = this.workspace.exported[this.workspace.activeId]; return e ? e.revision : null; },
  get exportedAt() { const e = this.workspace.exported[this.workspace.activeId]; return e ? e.at : null; },
  get recoveryText() {
    const v = Object.values(this.recovery);
    return v.length ? v.join('\n\n') : null;
  },

  init() {
    const ex = lsGet(KEY_EXPORTED);
    this.legacyExported = { revision: ex === null || ex === '' ? null : Number(ex), at: lsGet(KEY_EXPORTED_AT) || null };
    if (!cryptoAvailable()) {
      this.vaultState = 'nostore';
      this.loadError = 'このブラウザでは暗号化が使えないため、台帳をブラウザに保存しません。作業の区切りごとに必ず「書き出し」をしてください';
      return;
    }
    if (lsGet(KEY_VAULT)) { this.vaultState = 'locked'; return; }
    const legacy = lsGet(KEY_LEGACY);
    if (legacy) {
      this.vaultState = 'legacy';
      const r = readLedgerText(legacy);
      if (r.ok) {
        this.ledger = r.ledger;
        this.workspace.exported[this.workspace.activeId] = r.migrated ? { revision: null, at: null } : { ...this.legacyExported };
      } else { this.recovery = { legacy }; this.loadError = '以前の保存が壊れているため開けませんでした。「設定」から元のデータを書き出せます'; }
      this.token = Math.random().toString(36).slice(2);
    }
  },

  subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit(reason) { for (const fn of this.listeners) fn(reason); },

  needsPassphraseSetup() { return this.vaultState === 'empty' || this.vaultState === 'legacy'; },

  // 合言葉を決める（新規・平文からの移行）
  async setPassphrase(pass) {
    this.salt = newSalt();
    this.key = await deriveKey(pass, this.salt);
    this.vaultState = 'unlocked';
    if (this.recoveryText) await this.saveRecovery();
    lsRemove(KEY_LEGACY);
    lsRemove(KEY_EXPORTED); lsRemove(KEY_EXPORTED_AT);
    await this.persist();
    this.emit('vault');
  },

  // 合言葉で開ける。戻り値: { ok } / { ok: false, error }
  async unlock(pass) {
    const box = parseBox(lsGet(KEY_VAULT));
    if (!box) return { ok: false, error: '保存されたデータの形式が正しくありません' };
    const key = await deriveKey(pass, box.salt, box.iter);
    let text;
    try { text = await openBox(key, box); } catch (e) { return { ok: false, error: '合言葉が違います' }; }
    this.key = key;
    this.salt = box.salt;
    this.vaultState = 'unlocked';
    this.undoById.clear();
    this.loadError = null;
    // 以前の退避を先に読む（今回の退避と合わせて残すため）
    const rec = parseBox(lsGet(KEY_RECOVERY));
    let recovery = {};
    if (rec) {
      try {
        const t = await openBox(key, rec);
        let o = null;
        try { o = JSON.parse(t); } catch (e) { o = null; }
        recovery = o && o.type === 'recovery' && o.items ? o.items : { legacy: t };   // P1〜P4 の退避は文字列1つ
      } catch (e) { /* 別の合言葉の退避は扱わない */ }
    }
    let obj = null;
    try { obj = safeParse(text); } catch (e) { obj = null; }
    const m = obj ? migrateWorkspace(obj, this.legacyExported) : { error: 'JSON として読めません' };
    let changed = false;
    if (m.error) {
      // 中身の形が分からない。上書きで消えないように丸ごと退避する
      this.workspace = emptyWorkspace();
      recovery.all = text;
      this.loadError = '保存されていた台帳を開けませんでした（' + m.error + '）。元のデータは退避してあり、「設定」から書き出せます';
      changed = true;
    } else {
      const o = openWorkspace(m.workspace, checkLedgerObject);
      this.workspace = o.workspace;
      const brokenIds = Object.keys(o.broken);
      for (const id of brokenIds) recovery[id] = o.broken[id];
      if (brokenIds.length) this.loadError = `読めない案件が ${brokenIds.length} 件あったため、その案件だけを退避しました。「設定」から元のデータを書き出せます`;
      changed = m.wrapped || brokenIds.length > 0 || o.migratedIds.length > 0;
    }
    this.recovery = recovery;
    if (Object.keys(recovery).length) await this.saveRecovery();
    if (changed) {
      lsRemove(KEY_EXPORTED); lsRemove(KEY_EXPORTED_AT);
      this.persist();
    }
    this.token = Math.random().toString(36).slice(2);
    this.gen++;
    this.emit('vault');
    return { ok: true };
  },

  // 鍵と台帳をメモリから消す
  lock() {
    if (this.vaultState !== 'unlocked') return;
    this.workspace = emptyWorkspace(); this.undoById.clear(); this.key = null; this.selectedId = null; this.recovery = {};
    this.vaultState = lsGet(KEY_VAULT) ? 'locked' : 'empty';
    this.gen++;
    this.emit('vault');
  },

  // 合言葉を忘れたとき: ブラウザ内の暗号化データを消して始め直す
  resetVault() {
    lsRemove(KEY_VAULT); lsRemove(KEY_RECOVERY);
    this.workspace = emptyWorkspace(); this.undoById.clear(); this.key = null; this.salt = null; this.recovery = {}; this.loadError = null;
    this.vaultState = 'empty';
    this.gen++;
    this.emit('vault');
  },

  async saveRecovery() {
    if (!this.key) return;
    if (!Object.keys(this.recovery).length) { lsRemove(KEY_RECOVERY); return; }
    lsSet(KEY_RECOVERY, await sealText(this.key, this.salt, PBKDF2_ITERATIONS, JSON.stringify({ type: 'recovery', items: this.recovery })));
  },
  // id を省くとすべて消す
  async discardRecovery(id) {
    if (id) delete this.recovery[id]; else this.recovery = {};
    await this.saveRecovery();
    this.emit('vault');
  },

  // 暗号化して保存する。書き込みの順序が入れ替わらないよう直列にする
  persist() {
    if (this.vaultState !== 'unlocked' || !this.key) return this.saving;
    const text = JSON.stringify(this.workspace);
    const key = this.key;
    const salt = this.salt;
    this.saving = this.saving.then(async () => {
      try {
        const ok = lsSet(KEY_VAULT, await sealText(key, salt, PBKDF2_ITERATIONS, text));
        this.saveError = ok ? null : 'ブラウザへの保存に失敗しました。容量不足の可能性があります。今すぐ「書き出し」で JSON を保存してください';
      } catch (e) {
        this.saveError = 'ブラウザへの保存（暗号化）に失敗しました。今すぐ「書き出し」で JSON を保存してください';
      }
      if (this.saveError) this.emit('save-error');
    });
    return this.saving;
  },

  setExported(rev, at) {
    const id = this.workspace.activeId;
    if (!id) return;
    const cur = this.workspace.exported[id] || { revision: null, at: null };
    this.workspace.exported[id] = { revision: rev, at: at === undefined ? cur.at : at };
  },

  isDirty() {
    return !!this.ledger && this.ledger.revision !== this.exportedRevision;
  },

  // ---- 案件の追加・置き換え・切り替え・外す（P5） ----
  // 新しい案件として足して開く。合言葉の設定は呼び出し側で済ませておく
  addProject(ledger, { exported, migrated } = {}) {
    const id = newProjectId();
    this.workspace.ledgers[id] = normalizeCounters(ledger);
    this.workspace.exported[id] = { revision: exported && !migrated ? ledger.revision : null, at: exported && !migrated ? nowIso() : null };
    this.openProject(id, 'replace');
    return id;
  },
  // 既存の案件（同じ案件名など）を置き換えて開く
  replaceProject(id, ledger, { exported, migrated } = {}) {
    if (!this.workspace.ledgers[id]) return this.addProject(ledger, { exported, migrated });
    this.workspace.ledgers[id] = normalizeCounters(ledger);
    this.workspace.exported[id] = { revision: exported && !migrated ? ledger.revision : null, at: exported && !migrated ? nowIso() : null };
    this.undoById.delete(id);
    this.openProject(id, 'replace');
    return id;
  },
  // 互換: 新しい案件として足す
  replace(ledger, opts) { return this.addProject(ledger, opts); },
  openProject(id, reason = 'switch') {
    this.workspace.activeId = id;
    this.selectedId = null;
    if (reason !== 'switch') this.loadError = null;
    this.token = Math.random().toString(36).slice(2);
    this.gen++;
    this.persist();
    this.emit(reason);
  },
  switchProject(id) {
    if (!this.workspace.ledgers[id] || id === this.workspace.activeId) return false;
    this.openProject(id, 'switch');
    return true;
  },
  removeProject(id) {
    if (!this.workspace.ledgers[id]) return;
    delete this.workspace.ledgers[id];
    delete this.workspace.exported[id];
    this.undoById.delete(id);
    const next = this.workspace.activeId === id ? (Object.keys(this.workspace.ledgers)[0] || null) : this.workspace.activeId;
    this.openProject(next, 'replace');
  },
  projects() {
    return Object.entries(this.workspace.ledgers).map(([id, l]) => {
      const e = this.workspace.exported[id] || {};
      return { id, name: l.project.name, revision: l.revision, dirty: l.revision !== e.revision, exportedAt: e.at || null };
    });
  },
  findProjectByName(name) { return findByName(this.workspace, name); },
  // 保存の大きさ（文字数。localStorage はおよそ 5MB まで）
  storageSize() {
    return (lsGet(KEY_VAULT) || '').length + (lsGet(KEY_RECOVERY) || '').length;
  },

  // 取込画面から: validatePatch の結果と採用集合を適用する
  applyValidated(validated, accepted) {
    const before = this.ledger;
    const r = applyPatch(before, validated, accepted, nowIso(), 'import');
    this.undoLedger = before;
    this.ledger = r.ledger;
    this.gen++;
    this.persist();
    this.emit('apply');
    return r;
  },

  // 画面の内部の変更（詳細パネルなど）
  applyLocal(ops, source = 'local') {
    const before = this.ledger;
    const r = applyLocalOps(before, ops, nowIso(), source);
    if (!r.ok) return r;
    this.undoLedger = before;
    this.ledger = r.ledger;
    this.gen++;
    this.persist();
    this.emit('apply');
    return r;
  },

  // 差分の外の変更（設定・ベースライン）を、取り消し・記録・revision の対象として適用する
  commitExternal(mutate, change) {
    const before = this.ledger;
    const next = structuredClone(before);
    const now = nowIso();
    mutate(next);
    next.revision = before.revision + 1;
    next.updatedAt = now;
    appendChange(next, { rev: next.revision, at: now, source: 'local', changes: [change] });
    this.undoLedger = before;
    this.ledger = next;
    this.gen++;
    this.persist();
    this.emit('apply');
    return next;
  },

  // 台帳の設定を変える（AC: 設定の変更は revision +1・取り消し可・記録あり）
  updateSettings(partial) {
    const errors = validateSettings(partial);
    if (errors.length) return { ok: false, errors };
    this.commitExternal((next) => { next.settings = { ...(next.settings || {}), ...partial }; }, { id: 'settings', op: 'settings', fields: Object.keys(partial) });
    return { ok: true };
  },

  // ベースラインを記録する（要望・要件の ID・題名・範囲・状態の写し）
  recordBaseline(name, date) {
    let id;
    this.commitExternal((next) => {
      next.counters[BASELINE_PREFIX] = (next.counters[BASELINE_PREFIX] || 0) + 1;
      id = formatId(BASELINE_PREFIX, next.counters[BASELINE_PREFIX]);
      const items = next.items
        .filter((it) => it.kind === 'request' || it.kind === 'requirement')
        .map((it) => ({ id: it.id, kind: it.kind, title: it.title, scope: it.scope || 'tbd', status: it.status }));
      next.baselines.push({ id, name, date, items });
    }, { id: 'baseline', op: 'baseline' });
    return id;
  },

  canUndo() { return !!this.undoLedger; },
  undo() {
    if (!this.undoLedger) return false;
    this.ledger = this.undoLedger;
    this.undoLedger = null;
    this.gen++;
    // 書き出したものより前に戻ったら、同じ revision でも中身が違いうるので未書き出し扱いにする
    if (this.exportedRevision !== null && this.exportedRevision > this.ledger.revision) this.setExported(null, null);
    if (this.selectedId && !this.ledger.items.some((it) => it.id === this.selectedId)) this.selectedId = null;
    this.persist();
    this.emit('undo');
    return true;
  },

  exportText() {
    return JSON.stringify(this.ledger, null, 2) + '\n';
  },
  exportFilename() {
    const name = (this.ledger.project.name || '案件').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
    const d = new Date();
    const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    return `${name}_rev${this.ledger.revision}_${ymd}.json`;
  },
  // 保存ダイアログで取り消されても検知できないため、「書き出しを試みた」記録として扱う
  markExported() {
    this.setExported(this.ledger.revision, nowIso());
    this.persist();
    this.emit('exported');
  },

  // ファイルから読み込む前の検査。置き換えは呼び出し側が確認を取ってから replace する
  parseLedgerFile(text) {
    let obj;
    try { obj = safeParse(String(text).replace(/^﻿/, '')); } catch (e) {
      return { ok: false, errors: ['JSON として読めません。台帳の書き出しファイルか確かめてください'] };
    }
    if (obj && obj.type === 'ledger-patch') return { ok: false, errors: ['これは差分のファイルです。差分は「取込」画面に貼り付けてください'] };
    const r = checkLedgerObject(obj);
    if (!r.ok) return { ok: false, errors: r.errors.slice(0, 10), more: Math.max(0, r.errors.length - 10) };
    return { ok: true, ledger: r.ledger, migrated: r.migrated };
  },

  select(id) {
    this.selectedId = id;
    this.emit('select');
  },

  // 説明用の表示を反映した台帳（画面の一覧・集計はこれを使う）
  view() {
    return this.ledger ? visibleLedger(this.ledger, this.presentation) : null;
  },
  // 説明用の表示で隠れる項目か
  isHidden(id) {
    if (!this.presentation || !this.ledger) return false;
    const it = this.ledger.items.find((x) => x.id === id);
    return !!(it && it.internal);
  },
  setPresentation(on) {
    this.presentation = !!on;
    if (on && this.selectedId && this.isHidden(this.selectedId)) this.selectedId = null;
    this.emit('presentation');
  },

  item(id) {
    return this.ledger ? this.ledger.items.find((it) => it.id === id) || null : null;
  },
};


// ---- ui/lock.js ----
// 合言葉の画面: 開く（locked）・決める（empty / legacy）


const MIN_PASSPHRASE = 8;

// 新しい合言葉を2回入れてもらう。やめたら null
function askNewPassphrase(reason) {
  return new Promise((resolve) => {
    const p1 = h('input', { type: 'password', id: 'pass-new-1', autocomplete: 'new-password', 'aria-label': '合言葉' });
    const p2 = h('input', { type: 'password', id: 'pass-new-2', autocomplete: 'new-password', 'aria-label': '合言葉（確認）' });
    const err = h('p', { class: 'notice error', role: 'alert', hidden: true });
    const dlg = h('dialog', { class: 'dialog', 'aria-labelledby': 'pass-title' },
      h('form', { method: 'dialog', class: 'stack', onsubmit: (e) => { e.preventDefault(); submit(); } },
        h('h2', { id: 'pass-title', text: '合言葉を決める' }),
        reason ? h('p', { class: 'small', text: reason }) : null,
        h('p', { class: 'small', text: `台帳はこの合言葉で暗号化してブラウザに保存します。${MIN_PASSPHRASE}文字以上にしてください。` }),
        h('p', { class: 'small notice warn', text: '合言葉を忘れると、ブラウザ内の台帳は開けません（書き出したファイルからは戻せます）。合言葉はこのツールの外には保存されません。' }),
        h('label', { class: 'field' }, '合言葉', p1),
        h('label', { class: 'field' }, 'もう一度', p2),
        err,
        h('div', { class: 'row dialog-actions' },
          h('button', { class: 'btn', type: 'button', 'data-act': 'cancel', onclick: () => done(null) }, 'やめる'),
          h('button', { class: 'btn primary', type: 'submit', 'data-act': 'ok' }, '決める'))));
    function fail(msg) { err.textContent = msg; err.hidden = false; }
    function submit() {
      if (p1.value.length < MIN_PASSPHRASE) return fail(`${MIN_PASSPHRASE}文字以上にしてください`);
      if (p1.value !== p2.value) return fail('2回の入力が一致しません');
      done(p1.value);
    }
    function done(v) { dlg.close(); dlg.remove(); resolve(v); }
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); done(null); });
    document.body.appendChild(dlg);
    dlg.showModal();
    p1.focus();
  });
}

// 台帳を置き換える前に呼ぶ。合言葉が未設定なら決めてもらう。決められなければ false
async function ensureVaultReady() {
  if (!store.needsPassphraseSetup()) return true;
  const pass = await askNewPassphrase();
  if (!pass) return false;
  await store.setPassphrase(pass);
  return true;
}

// ---- ui/detail.js ----
// 詳細パネルと、値の表示に使う共通の部品


function itemTitle(id, ledger) {
  if (store.isHidden(id)) return '（社内のみ）';
  const it = ledger.items.find((x) => x.id === id);
  return it ? it.title : null;
}

// ID のボタン。台帳に無い ID は取り消し線で表示する
function idButton(id, app, opts = {}) {
  if (TEMP_ID_RE.test(id)) return h('span', { class: 'mono small badge', text: id });
  if (store.isHidden(id)) return h('span', { class: 'muted small', text: '（社内のみ）' });
  const exists = !!store.item(id);
  if (!exists) return h('span', { class: 'idlink dangling', text: id, title: '台帳にない ID' });
  const title = opts.withTitle ? itemTitle(id, store.ledger) : null;
  return h('span', { class: 'idref' },
    h('button', { class: 'idlink', type: 'button', onclick: (e) => { e.stopPropagation(); app.openItem(id); }, text: id }),
    title ? h('span', { text: ' ' + title }) : null);
}

function confBadge(conf) {
  return h('span', { class: `badge conf-${conf}`, text: enumLabel(CONFIDENCE, conf) });
}

function statusBadge(kind, status) {
  const done = ['closed', 'answered', 'resolved', 'agreed', 'accepted', 'valid'].includes(status);
  const off = ['rejected', 'dropped', 'superseded', 'inactive', 'retired', 'deferred'].includes(status);
  return h('span', { class: ['badge', done ? 'ok' : off ? '' : 'accent'], text: statusLabel(kind, status) });
}

function kindBadge(kind) {
  return h('span', { class: 'badge', text: kindLabel(kind) });
}

function sourceText(src, ledger) {
  const parts = [enumLabel(SOURCE_TYPES, src.type) + ': ' + src.ref];
  if (src.date) parts.push(src.date);
  if (src.speaker) {
    const n = itemTitle(src.speaker, ledger);
    parts.push('発言者: ' + (n ? `${n}（${src.speaker}）` : src.speaker));
  }
  if (src.note) parts.push(src.note);
  return parts.join(' ／ ');
}

// フィールドの値を表示用の要素にする（ID はボタンになる）
function fieldValue(kind, name, value, app) {
  const spec = fieldSpec(kind, name);
  if (value === undefined || value === null || value === '') return h('span', { class: 'muted', text: '—' });
  if (!spec) return h('span', { text: typeof value === 'string' ? value : JSON.stringify(value) });
  switch (spec.type) {
    case 'enum': return h('span', { text: enumLabel(spec.values, value) });
    case 'status': return statusBadge(kind, value);
    case 'ref': return idButton(value, app, { withTitle: true });
    case 'refs':
      if (!Array.isArray(value) || !value.length) return h('span', { class: 'muted', text: '—' });
      return h('span', { class: 'refs' }, value.map((id, i) => [i ? '、' : null, idButton(id, app, { withTitle: true })]));
    case 'strings': return h('span', { text: Array.isArray(value) ? value.join(' / ') : String(value) });
    case 'sources':
      return h('div', null, (Array.isArray(value) ? value : []).map((sx) => h('div', { class: 'source small', text: sourceText(sx, store.ledger) })));
    case 'text': return h('span', { class: 'body-text', text: String(value) });
    case 'boolean': return h('span', { text: value ? 'はい' : 'いいえ' });
    case 'crud':
      return h('div', { class: 'small' }, (Array.isArray(value) ? value : []).map((c) => h('div', null, idButton(c.entity, app, { withTitle: true }), ` … ${c.ops}`)));
    case 'columns':
    case 'fields':
      return h('div', { class: 'small nested-lines' }, (Array.isArray(value) ? value : []).map((el) => h('div', { text: nestedLine(spec.type, el) })));
    default: return h('span', { text: String(value) });
  }
}

// 列・項目の1行の説明（例: customer_code 得意先コード code(8) 主キー 必須 → EN-001.customer_code）
function nestedLine(type, el) {
  if (!el || typeof el !== 'object') return String(el);
  const ref = type === 'columns' ? el.fk : el.source;
  return [
    el.name, el.logical, el.type ? `${el.type}${el.length ? `(${el.length}${el.scale ? ',' + el.scale : ''})` : ''}` : null,
    el.pk ? '主キー' : null, el.required ? '必須' : null,
    ref && ref.entity ? `→ ${ref.entity}.${ref.column || ''}` : null,
    el.pattern ? `形 ${el.pattern}` : null,
  ].filter(Boolean).join(' ');
}

// 取込のカードなどで使う、値の短い文字列表現
function valueText(kind, name, value, ledger) {
  if (value === undefined) return '（なし）';
  if (value === null) return '（消す）';
  const spec = fieldSpec(kind, name);
  const ref = (id) => { const t = itemTitle(id, ledger); return t ? `${id} ${t}` : id; };
  if (!spec) return typeof value === 'string' ? value : JSON.stringify(value);
  switch (spec.type) {
    case 'enum': return enumLabel(spec.values, value);
    case 'status': return statusLabel(kind, value);
    case 'ref': return ref(value);
    case 'refs': return Array.isArray(value) && value.length ? value.map(ref).join('、') : '（なし）';
    case 'strings': return Array.isArray(value) ? value.join(' / ') : String(value);
    case 'sources': return Array.isArray(value) && value.length ? value.map((sx) => sourceText(sx, ledger)).join('\n') : '（なし）';
    case 'boolean': return value ? 'はい' : 'いいえ';
    case 'crud': return Array.isArray(value) && value.length ? value.map((c) => `${ref(c.entity)} … ${c.ops}`).join('\n') : '（なし）';
    case 'columns':
    case 'fields': return Array.isArray(value) && value.length ? value.map((el) => nestedLine(spec.type, el)).join('\n') : '（なし）';
    default: return String(value);
  }
}

      }))
      : h('p', { class: 'muted', text: 'なし' })));

  const back = (buildBackrefs(ledger).get(it.id) || []).filter((b) => !store.isHidden(b.from));
  root.appendChild(section('この項目を参照している項目',
    back.length

          h('span', { text: t ? t.title : '台帳にありません' }));
      }))
      : h('p', { class: 'muted', text: 'なし' })));
}


// ---- ui/chart.js ----
// 描画部品: 日付軸の折れ線（S カーブ）とガント。実行時に SVG を組む（style 属性・外部参照を使わない）


function textW(str, size) {
  let w = 0;
  for (const ch of String(str)) w += ch.charCodeAt(0) > 0xff ? size : size * 0.56;
  return w;
}
function clip(str, maxW, size) {
  if (textW(str, size) <= maxW) return str;
  let out = '';
  for (const ch of String(str)) { if (textW(out + ch + '…', size) > maxW) break; out += ch; }
  return out + '…';
}

// 日付の目盛り。週なら月曜、月なら 1 日
function ticks(d0, d1, unit) {
  const out = [];
  if (unit === 'week') {
    let d = d0 - ((d0 + 3) % 7 + 7) % 7;
    for (; d <= d1; d += 7) if (d >= d0) out.push(d);
  } else {
    const a = new Date(d0 * 86400000);
    let y = a.getUTCFullYear();
    let m = a.getUTCMonth();
    for (;;) {
      const d = Date.UTC(y, m, 1) / 86400000;
      if (d > d1) break;
      if (d >= d0) out.push(d);
      m++; if (m > 11) { m = 0; y++; }
    }
  }
  return out;
}

const md = (d) => { const x = dayToYmd(d); return `${Number(x.slice(5, 7))}/${Number(x.slice(8, 10))}`; };

// 折れ線。series: [{ key, label, points: [{ date, value | null }] }]
function lineChart({ series, width = 760, height = 300, today, unit = 'week', ariaLabel = '折れ線グラフ' }) {
  const pad = { l: 48, r: 96, t: 16, b: 32 };
  const all = series.flatMap((sr) => sr.points.filter((p) => p.value !== null && p.value !== undefined));
  const svg = s('svg', { class: 'chart line-chart', width, height, viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': ariaLabel });
  if (!all.length) return svg;
  const days = series.flatMap((sr) => sr.points.map((p) => dayNumber(p.date)));
  const d0 = Math.min(...days);
  const d1 = Math.max(...days);
  const vmax = Math.max(1, ...all.map((p) => p.value)) * 1.08;
  const x = (d) => pad.l + (d1 === d0 ? 0 : (d - d0) / (d1 - d0)) * (width - pad.l - pad.r);
  const y = (v) => height - pad.b - (v / vmax) * (height - pad.t - pad.b);

  // 目盛り（縦は 5 本、横は週か月）
  for (let i = 0; i <= 4; i++) {
    const v = (vmax / 1.08) * i / 4;
    svg.appendChild(s('line', { class: 'grid', x1: pad.l, x2: width - pad.r, y1: y(v), y2: y(v) }));
    svg.appendChild(s('text', { class: 'axis', x: pad.l - 6, y: y(v) + 4, 'text-anchor': 'end' }, String(Math.round(v))));
  }
  const tk = ticks(d0, d1, (d1 - d0) > 120 ? 'month' : unit);
  const step = Math.max(1, Math.ceil(tk.length / 10));
  tk.forEach((d, i) => { if (i % step === 0) svg.appendChild(s('text', { class: 'axis', x: x(d), y: height - pad.b + 18, 'text-anchor': 'middle' }, md(d))); });
  svg.appendChild(s('line', { class: 'axis-line', x1: pad.l, x2: width - pad.r, y1: height - pad.b, y2: height - pad.b }));
  if (today) {
    const td = dayNumber(today);
    if (td >= d0 && td <= d1) {
      svg.appendChild(s('line', { class: 'today', x1: x(td), x2: x(td), y1: pad.t, y2: height - pad.b }));
      svg.appendChild(s('text', { class: 'today-label', x: x(td) + 4, y: pad.t + 10 }, '今日'));
    }
  }
  // 系列（線の端に名前を置く。色だけに頼らず線の形も変える）
  const used = [];
  for (const sr of series) {
    const pts = sr.points.filter((p) => p.value !== null && p.value !== undefined);
    if (!pts.length) continue;
    const dAttr = pts.map((p, i) => `${i ? 'L' : 'M'}${x(dayNumber(p.date)).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
    svg.appendChild(s('path', { class: `series s-${sr.key}`, d: dAttr }, s('title', null, sr.label)));
    for (const p of pts) svg.appendChild(s('circle', { class: `pt s-${sr.key}`, cx: x(dayNumber(p.date)), cy: y(p.value), r: 2.5 }, s('title', null, `${sr.label} ${p.date}: ${p.value}`)));
    const last = pts[pts.length - 1];
    let ly = y(last.value) + 4;
    while (used.some((u) => Math.abs(u - ly) < 13)) ly += 13;
    used.push(ly);
    svg.appendChild(s('text', { class: `end-label s-${sr.key}`, x: x(dayNumber(last.date)) + 6, y: ly }, `${sr.label} ${last.value}`));
  }
  return svg;
}

// ガント。rows: [{ id, label, depth, start, end, progress, milestone, leaf, delayed, dependsOn }]
function ganttChart({ rows, unit = 'week', today, onSelect, selectedId }) {
  const ROW = 26;
  const LABEL = 280;
  const pxDay = unit === 'week' ? 14 : 3.2;
  const dated = rows.filter((r) => r.start && r.end);
  const svg = s('svg', { class: 'chart gantt', role: 'img', 'aria-label': 'ガントチャート' });
  if (!dated.length) { svg.setAttribute('width', 400); svg.setAttribute('height', 40); return svg; }
  const td = today ? dayNumber(today) : null;
  let d0 = Math.min(...dated.map((r) => dayNumber(r.start)));
  let d1 = Math.max(...dated.map((r) => dayNumber(r.end)));
  if (td !== null) { d0 = Math.min(d0, td); d1 = Math.max(d1, td); }
  d0 -= 3; d1 += 7;
  const top = 34;
  // 作業名は左に固定した別の SVG に描く（横に送っても名前が見えるように）
  const width = (d1 - d0 + 1) * pxDay + 20;
  const height = top + rows.length * ROW + 10;
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  const labels = s('svg', { class: 'chart gantt gantt-labels', width: LABEL, height, viewBox: `0 0 ${LABEL} ${height}`, 'aria-hidden': 'true' },
    s('rect', { class: 'label-bg', x: 0, y: 0, width: LABEL, height }));
  const x = (d) => (d - d0) * pxDay;

  svg.appendChild(s('defs', null, s('marker', { id: 'gt-arrow', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse' }, s('path', { d: 'M0,0 L10,5 L0,10 z', class: 'dep-head' }))));
  // 目盛り
  const tk = ticks(d0, d1, unit);
  for (const d of tk) {
    svg.appendChild(s('line', { class: 'grid', x1: x(d), x2: x(d), y1: top - 6, y2: height }));
    svg.appendChild(s('text', { class: 'axis', x: x(d) + 2, y: top - 12 }, unit === 'week' ? md(d) : dayToYmd(d).slice(0, 7)));
  }
  // 行
  const rowY = new Map();
  rows.forEach((r, i) => {
    const yy = top + i * ROW;
    rowY.set(r.id, yy);
    const g = s('g', {
      class: ['grow', r.delayed && 'delayed', r.id === selectedId && 'selected', !r.leaf && 'summary'].filter(Boolean).join(' '),
      'data-id': r.id, tabindex: '0', role: 'button', 'aria-label': `${r.label}${r.delayed ? '（遅れ）' : ''}`,
      onclick: () => onSelect && onSelect(r.id),
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (onSelect) onSelect(r.id); } },
    });
    g.appendChild(s('rect', { class: 'row-bg', x: 0, y: yy, width, height: ROW }));
    labels.appendChild(s('g', {
      class: ['grow', r.delayed && 'delayed', r.id === selectedId && 'selected', !r.leaf && 'summary'].filter(Boolean).join(' '),
      onclick: () => onSelect && onSelect(r.id),
    },
    s('rect', { class: 'row-bg', x: 0, y: yy, width: LABEL, height: ROW }),
    s('text', { class: 'row-label', x: 8 + r.depth * 14, y: yy + 17 }, clip(r.label, LABEL - 16 - r.depth * 14, 12.5)),
    s('title', null, `${r.id} ${r.label}`)));
    if (r.start && r.end) {
      const xs = x(dayNumber(r.start));
      const xe = x(dayNumber(r.end) + 1);
      if (r.milestone) {
        const cx = x(dayNumber(r.start)) + pxDay / 2;
        const cy = yy + ROW / 2;
        g.appendChild(s('path', { class: 'milestone', d: `M${cx},${cy - 7} L${cx + 7},${cy} L${cx},${cy + 7} L${cx - 7},${cy} z` }));
        g.appendChild(s('text', { class: 'bar-note', x: cx + 10, y: cy + 4 }, r.start));
      } else if (!r.leaf) {
        g.appendChild(s('rect', { class: 'bar-summary', x: xs, y: yy + 9, width: Math.max(2, xe - xs), height: 8 }));
      } else {
        g.appendChild(s('rect', { class: 'bar', x: xs, y: yy + 6, width: Math.max(2, xe - xs), height: 14, rx: 3 }));
        const pw = Math.max(0, (xe - xs) * Math.min(100, r.progress || 0) / 100);
        if (pw > 0) g.appendChild(s('rect', { class: 'bar-progress', x: xs, y: yy + 6, width: pw, height: 14, rx: 3 }));
        g.appendChild(s('text', { class: 'bar-note', x: xe + 4, y: yy + 17 }, `${r.progress || 0}%${r.delayed ? '　遅れ' : ''}`));
      }
    }
    g.appendChild(s('title', null, `${r.id} ${r.label}${r.start ? `\n${r.start}〜${r.end}` : ''}${r.leaf && !r.milestone ? `\n進捗 ${r.progress || 0}%` : ''}${r.delayed ? '\n予定より遅れています' : ''}`));
    svg.appendChild(g);
  });
  // 前の作業からの矢印（終了 → 開始）
  const byId = new Map(rows.map((r) => [r.id, r]));
  for (const r of rows) {
    for (const p of r.dependsOn || []) {
      const a = byId.get(p);
      if (!a || !a.end || !r.start) continue;
      const x1 = a.milestone ? x(dayNumber(a.start)) + pxDay / 2 + 7 : x(dayNumber(a.end) + 1);
      const y1 = rowY.get(a.id) + ROW / 2;
      const x2 = r.milestone ? x(dayNumber(r.start)) + pxDay / 2 - 7 : x(dayNumber(r.start));
      const y2 = rowY.get(r.id) + ROW / 2;
      const mx = Math.max(x1 + 6, Math.min(x2 - 6, x1 + 12));
      svg.appendChild(s('path', { class: 'dep', d: `M${x1},${y1} H${mx} V${y2} H${x2}`, 'marker-end': 'url(#gt-arrow)' }));
    }
  }
  if (td !== null) {
    svg.appendChild(s('line', { class: 'today', x1: x(td) + pxDay / 2, x2: x(td) + pxDay / 2, y1: top - 6, y2: height }));
    svg.appendChild(s('text', { class: 'today-label', x: x(td) + pxDay / 2 + 3, y: top - 22 }, '今日'));
  }
  return h('div', { class: 'gantt-split', 'data-today-x': td === null ? '' : String(Math.round(x(td))) }, labels, svg);
}


// ---- ui/views/overview.js ----
// 概要: 案件情報・種別ごとの件数・次にやること（健康診断の上位5件）


function renderOverview(root, app) {
  const ledger = store.view();
  const p = ledger.project;

  const kv = h('dl', { class: 'kv wide' });
  const row = (k, v) => { if (v) { kv.appendChild(h('dt', { text: k })); kv.appendChild(h('dd', { class: 'body-text', text: v })); } };
  row('顧客', p.customer);
  row('目的', p.purpose);
  row('期間', p.periodStart || p.periodEnd ? `${p.periodStart || '?'} 〜 ${p.periodEnd || '?'}` : '');
  row('概要', p.summary);
  const goals = Array.isArray(p.goals) && p.goals.length ? h('ul', { class: 'goals' }, p.goals.map((g) => h('li', { text: g }))) : null;

  root.appendChild(h('section', { class: 'card stack' },
    h('h2', { text: p.name }),
    kv.childNodes.length ? kv : h('p', { class: 'muted', text: '案件の目的や期間はまだありません。「指示文」の「初期作成」で資料から設定できます。' }),
    goals ? h('div', null, h('h3', { text: 'ゴール' }), goals) : null));

  // 種別ごとの件数（押すと一覧をその種別で開く）
  const stats = KIND_IDS.map((k) => {
    const items = ledger.items.filter((it) => it.kind === k);
    const open = items.filter(isOpen).length;
    return h('button', {
      class: 'card stat', type: 'button', 'data-kind': k,
      onclick: () => app.go('list', { filter: { kind: k } }),
    },
    h('span', { class: 'num', text: String(items.length) }),
    h('span', { class: 'lab', text: kindLabel(k) + (k === 'issue' || k === 'question' ? `（未完了 ${open}）` : '') }));
  });
  root.appendChild(h('h3', { text: '件数' }));
  root.appendChild(h('div', { class: 'grid cols-4' }, stats));

  const findings = app.health();
  if (store.presentation) return;  // 説明用の表示では「次にやること」と始め方を出さない
  root.appendChild(h('div', { class: 'row' },
    h('h3', { text: '次にやること' }),
    h('span', { class: 'spacer' }),
    findings.length > 5 ? h('button', { class: 'btn small', type: 'button', onclick: () => app.go('health') }, `健康診断をすべて見る（${findings.length}件）`) : null));
  root.appendChild(findings.length
    ? h('div', { class: 'card next-actions' }, findings.slice(0, 5).map((f) => findingRow(f, app)))
    : h('div', { class: 'card empty', text: '健康診断の指摘はありません' }));

  if (ledger.items.length < 10) {
    root.appendChild(h('div', { class: 'notice stack' },
      h('strong', { text: '始め方' }),
      h('ol', null,
        h('li', { text: '「指示文」で「初期作成」を選んでコピーし、提案依頼書やメモと一緒に Gemini に貼る' }),
        h('li', { text: 'Gemini の返答を「取込」に貼って確認し、適用する' }),
        h('li', { text: '会議のあとは「議事録の取込」、節目ごとに「レビュー」を回す' }))));
  }
}


// ---- ui/views/graph.js ----
// 関係図: 関係者とシステムを立場ごとの列に並べ、関係を線とラベルで描く（実行時に SVG を描く）


const COLS = [
  { key: 'customer', label: '顧客' },
  { key: 'own', label: '自社' },
  { key: 'vendor', label: '協力会社' },
  { key: 'system', label: 'システム' },
];
const NODE_W = 160;
const NODE_H = 40;
const GAP_Y = 64;
const COL_GAP = 96;
const PAD_X = 40;
const TOP = 56;
const LABEL_STEP = 16;
const LABEL_TRIES = 6;

function colOf(it) { return it.kind === 'system' ? 'system' : it.side; }

// 文字幅の概算（全角 12.5px・半角 7px）。SVG の getBBox を使わずに配置を決めるため
function textWidth(str, size) {
  let w = 0;
  for (const ch of str) w += ch.charCodeAt(0) > 0xff ? size : size * 0.56;
  return w;
}

function truncate(str, maxW, size) {
  if (textWidth(str, size) <= maxW) return str;
  let out = '';
  for (const ch of str) {
    if (textWidth(out + ch + '…', size) > maxW) break;
    out += ch;
  }
  return out + '…';
}

const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

// レイアウトを計算する（DOM に依存しない）
function layoutGraph(ledger) {
  const nodes = ledger.items.filter((it) => it.kind === 'stakeholder' || it.kind === 'system');
  const pos = new Map();
  let maxRows = 0;
  COLS.forEach((c, ci) => {
    const inCol = nodes.filter((n) => colOf(n) === c.key).sort((a, b) => a.id.localeCompare(b.id));
    maxRows = Math.max(maxRows, inCol.length);
    inCol.forEach((n, ri) => pos.set(n.id, { x: PAD_X + ci * (NODE_W + COL_GAP), y: TOP + ri * GAP_Y, col: ci, node: n }));
  });
  const width = PAD_X * 2 + COLS.length * NODE_W + (COLS.length - 1) * COL_GAP;
  const height = TOP + Math.max(1, maxRows) * GAP_Y + 20;

  const placed = [];       // 置いたラベルの矩形
  const nodeRects = [...pos.values()].map((p) => ({ x: p.x, y: p.y, w: NODE_W, h: NODE_H }));
  const edges = [];
  let hidden = 0;
  for (const r of ledger.relations) {
    const a = pos.get(r.from);
    const b = pos.get(r.to);
    if (!a || !b) continue;
    let d;
    let mx;
    let my;
    if (a.col === b.col) {
      // 同じ列: 列の外側へ弧を描く
      const right = a.col < COLS.length - 1;
      const x0 = right ? a.x + NODE_W : a.x;
      const bulge = (right ? 1 : -1) * (40 + Math.abs(b.y - a.y) * 0.25);
      const y1 = a.y + NODE_H / 2;
      const y2 = b.y + NODE_H / 2;
      d = `M${x0},${y1} C${x0 + bulge},${y1} ${x0 + bulge},${y2} ${x0},${y2}`;
      mx = x0 + bulge * 0.75;
      my = (y1 + y2) / 2;
    } else {
      const leftToRight = a.x < b.x;
      const x1 = leftToRight ? a.x + NODE_W : a.x;
      const x2 = leftToRight ? b.x : b.x + NODE_W;
      const y1 = a.y + NODE_H / 2;
      const y2 = b.y + NODE_H / 2;
      const cx = (x1 + x2) / 2;
      d = `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
      mx = cx;
      my = (y1 + y2) / 2;
    }
    // ラベルの重なりを避ける: 縦に 16px ずつずらし、だめなら省略
    const lw = textWidth(r.label, 11) + 8;
    const lh = 16;
    let rect = null;
    for (let t = 0; t <= LABEL_TRIES; t++) {
      const offset = t === 0 ? 0 : (t % 2 ? 1 : -1) * Math.ceil(t / 2) * LABEL_STEP;
      const cand = { x: mx - lw / 2, y: my - lh / 2 + offset, w: lw, h: lh };
      if (!placed.some((p) => overlap(p, cand)) && !nodeRects.some((p) => overlap(p, cand))) { rect = cand; break; }
    }
    if (rect) placed.push(rect); else hidden++;
    edges.push({ rel: r, d, label: rect });
  }
  return { pos, edges, width, height, hidden };
}

function renderGraph(root, app) {
  const ledger = store.view();
  const sel = store.selectedId;
  const L = layoutGraph(ledger);

  root.appendChild(h('h2', { text: '関係図' }));
  root.appendChild(h('div', { class: 'legend' },
    COLS.map((c) => h('span', null, h('span', { class: `sw sw-${c.key}` }), c.label)),
    h('span', { class: 'muted', text: '点線の枠: システム ／ 細い点線: 関与なし・廃止 ／ 矢印: 関係の向き（例: 発注する側 → される側）' }),
    L.hidden ? h('span', { class: 'badge mid', id: 'graph-hidden', text: `重なるためラベルを省略した線 ${L.hidden}本（線を押すと読めます）` }) : null));

  if (!L.pos.size) {
    root.appendChild(h('div', { class: 'empty', text: '関係者もシステムもまだありません。「指示文」の「初期作成」で洗い出せます' }));
    return;
  }

  // 強調: 選択ノードとつながるノード・線
  const neighbors = new Set();
  const hlEdges = new Set();
  const selIsNode = sel && L.pos.has(sel);
  if (selIsNode) {
    neighbors.add(sel);
    for (const e of L.edges) {
      if (e.rel.from === sel || e.rel.to === sel) { neighbors.add(e.rel.from); neighbors.add(e.rel.to); hlEdges.add(e.rel.id); }
    }
  }

  const svg = s('svg', { class: 'graph', width: L.width, height: L.height, viewBox: `0 0 ${L.width} ${L.height}`, role: 'img', 'aria-label': '関係者とシステムの関係図' });
  // 線の向き（from → to）を矢印で示す。強調時は色を変えた矢印を使う
  const arrow = (id, cls) => s('marker', { id, viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' },
    s('path', { d: 'M0,0 L10,5 L0,10 z', class: cls }));
  svg.appendChild(s('defs', null, arrow('wb-arrow', 'arrowhead'), arrow('wb-arrow-hl', 'arrowhead hl-head')));
  svg.appendChild(s('rect', { x: 0, y: 0, width: L.width, height: L.height, fill: 'transparent', onclick: () => { if (selIsNode) app.closeDetail(); } }));
  COLS.forEach((c, ci) => {
    svg.appendChild(s('text', { class: 'col-title', x: PAD_X + ci * (NODE_W + COL_GAP) + NODE_W / 2, y: 28, 'text-anchor': 'middle' }, c.label));
  });

  const edgeLayer = s('g', { class: 'edges' });
  for (const e of L.edges) {
    const dim = selIsNode && !hlEdges.has(e.rel.id);
    const title = `${e.rel.id}: ${e.rel.label}`;
    const g = s('g', { class: ['edge', dim && 'dim', hlEdges.has(e.rel.id) && 'hl'], 'data-rel': e.rel.id },
      s('title', null, title),
      s('path', { d: e.d, 'marker-end': hlEdges.has(e.rel.id) ? 'url(#wb-arrow-hl)' : 'url(#wb-arrow)' }),
      s('path', { d: e.d, class: 'hit', onclick: (ev) => { ev.stopPropagation(); app.openItem(e.rel.from); } }));
    if (e.label) {
      g.appendChild(s('rect', { class: 'elabel-bg', x: e.label.x, y: e.label.y, width: e.label.w, height: e.label.h, rx: 3 }));
      g.appendChild(s('text', { x: e.label.x + e.label.w / 2, y: e.label.y + 12, 'text-anchor': 'middle' }, e.rel.label));
    }
    edgeLayer.appendChild(g);
  }
  svg.appendChild(edgeLayer);

  for (const [id, p] of L.pos) {
    const n = p.node;
    const dim = selIsNode && !neighbors.has(id);
    const inactive = n.status === 'inactive' || n.status === 'retired';
    const sub = n.kind === 'system' ? (n.status === 'planned' ? '新規予定' : n.status === 'retired' ? '廃止' : '既存') : [n.org, n.role].filter(Boolean).join(' ');
    svg.appendChild(s('g', {
      class: ['node', `side-${colOf(n)}`, dim && 'dim', id === sel && 'selected', inactive && 'inactive'],
      transform: `translate(${p.x},${p.y})`, tabindex: '0', role: 'button', 'aria-label': `${n.title}（${id}）`, 'data-id': id,
      onclick: (ev) => { ev.stopPropagation(); if (id === sel) app.closeDetail(); else app.openItem(id); },
      onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); if (id === sel) app.closeDetail(); else app.openItem(id); } },
    },
    s('title', null, `${id} ${n.title}${sub ? ' / ' + sub : ''}`),
    s('rect', { width: NODE_W, height: NODE_H }),
    s('text', { x: 10, y: 17 }, truncate(n.title, NODE_W - 20, 12.5)),
    s('text', { class: 'sub', x: 10, y: 32 }, truncate(sub || id, NODE_W - 20, 11))));
  }
  root.appendChild(h('div', { class: 'graph-wrap' }, svg));
  root.appendChild(h('p', { class: 'muted small', text: `関係者・システム ${L.pos.size}件 ／ 関係 ${L.edges.length}本。四角を押すと、つながる相手以外が薄くなり、右に関係する項目が出ます。` }));
}


// ---- ui/views/list.js ----
// 一覧画面: 全種別の項目を絞り込み・並べ替えして表で出す


const PRIORITIES = ['Must', 'Should', 'Could', 'Wont'];
const SEVERITY_LABEL = { high: '高', mid: '中', low: '低' };

const filter = { kind: '', confidence: '', status: '', openOnly: false, priority: '', q: '' };
const sort = { key: 'id', dir: 1 };

function personOf(it) {
  if (it.owner) return it.owner;
  if (it.askTo) return it.askTo;
  if (Array.isArray(it.decidedBy) && it.decidedBy.length) return it.decidedBy[0];
  return null;
}

function dateOf(it) { return it.due || it.decidedAt || null; }

function rankOf(it) {
  if (it.priority) return it.priority;
  if (it.severity) return '重要度 ' + SEVERITY_LABEL[it.severity];
  return null;
}

// 並べ替えの値。null は常に末尾へ
const COLUMNS = [
  { key: 'id', label: 'ID', value: (it) => KIND_IDS.indexOf(it.kind) * 100000 + Number(it.id.split('-')[1]) },
  { key: 'kind', label: '種別', value: (it) => KIND_IDS.indexOf(it.kind) },
  { key: 'title', label: '題名', value: (it) => it.title },
  { key: 'status', label: '状態', value: (it) => statusLabel(it.kind, it.status) },
  { key: 'confidence', label: '確度', value: (it) => ['guess', 'fact', 'confirmed'].indexOf(it.confidence) },
  { key: 'rank', label: '優先度', value: (it) => { const p = PRIORITIES.indexOf(it.priority); if (p >= 0) return p; return it.severity ? ['high', 'mid', 'low'].indexOf(it.severity) : null; } },
  { key: 'person', label: '担当・相手', value: (it) => { const p = personOf(it); return p ? itemTitle(p, store.view()) || p : null; } },
  { key: 'date', label: '期限・決定日', value: dateOf },
  { key: 'updatedAt', label: '更新', value: (it) => it.updatedAt },
];

function compare(a, b) {
  if (a === null || a === undefined) return (b === null || b === undefined) ? 0 : 1;
  if (b === null || b === undefined) return -1;
  if (typeof a === 'number' && typeof b === 'number') return (a - b) * sort.dir;
  return String(a).localeCompare(String(b), 'ja') * sort.dir;
}

function setListFilter(opts) {
  Object.assign(filter, { kind: '', confidence: '', status: '', openOnly: false, priority: '', q: '' }, opts || {});
}

function matches(it) {
  if (filter.kind && it.kind !== filter.kind) return false;
  if (filter.confidence && it.confidence !== filter.confidence) return false;
  if (filter.status && it.status !== filter.status) return false;
  if (filter.openOnly && !isOpen(it)) return false;
  if (filter.priority) {
    if (filter.priority === 'none' ? !!it.priority : it.priority !== filter.priority) return false;
  }
  if (filter.q) {
    const q = filter.q.toLowerCase();
    const hay = [it.id, it.title, it.body, it.answer, it.reason, ...(it.tags || [])].filter(Boolean).join('\n').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function select(label, value, options, onChange) {
  const el = h('select', { 'aria-label': label, 'data-fk': 'filter-' + label }, options.map(([v, t]) => h('option', { value: v, selected: v === value, text: t })));
  el.addEventListener('change', () => onChange(el.value));
  return el;
}

function renderList(root, app, opts) {
  if (opts && opts.filter) { setListFilter(opts.filter); app.viewOpts = {}; }
  const ledger = store.view();
  const rerender = () => app.refresh();

  root.appendChild(h('h2', { text: '一覧' }));
  const statusOptions = filter.kind ? KINDS[filter.kind].statuses.map((s) => [s.v, s.label]) : [];
  const q = h('input', { type: 'search', placeholder: '題名・内容・ID・タグで探す', 'aria-label': '文字列で絞り込む', value: filter.q, id: 'list-q' });
  q.addEventListener('input', () => {
    filter.q = q.value;
    const pos = q.selectionStart;
    rerender();
    const again = document.getElementById('list-q');
    if (again) again.setSelectionRange(pos, pos);
  });
  root.appendChild(h('div', { class: 'filters' },
    select('種別', filter.kind, [['', 'すべての種別'], ...KIND_IDS.map((k) => [k, kindLabel(k)])], (v) => { filter.kind = v; filter.status = ''; rerender(); }),
    filter.kind ? select('状態', filter.status, [['', 'すべての状態'], ...statusOptions], (v) => { filter.status = v; rerender(); }) : null,
    select('確度', filter.confidence, [['', 'すべての確度'], ...CONFIDENCE.map((c) => [c.v, c.label])], (v) => { filter.confidence = v; rerender(); }),
    select('優先度', filter.priority, [['', 'すべての優先度'], ...PRIORITIES.map((p) => [p, p]), ['none', '優先度なし']], (v) => { filter.priority = v; rerender(); }),
    h('label', { class: 'row small' },
      h('input', { type: 'checkbox', id: 'list-open-only', checked: filter.openOnly, onchange: (e) => { filter.openOnly = e.target.checked; rerender(); } }),
      '未完了の課題・質問だけ'),
    q));

  // 効いている絞り込みを見えるようにする（別の画面から戻ったときに気づけるように）
  const active = [
    filter.kind && `種別: ${kindLabel(filter.kind)}`,
    filter.status && `状態: ${statusLabel(filter.kind, filter.status)}`,
    filter.confidence && `確度: ${CONFIDENCE.find((c) => c.v === filter.confidence).label}`,
    filter.priority && `優先度: ${filter.priority === 'none' ? 'なし' : filter.priority}`,
    filter.openOnly && '未完了だけ',
    filter.q && `「${filter.q}」を含む`,
  ].filter(Boolean);
  if (active.length) {
    root.appendChild(h('div', { class: 'row active-filters', role: 'status' },
      h('span', { class: 'small', text: '絞り込み中:' }),
      active.map((a) => h('span', { class: 'badge accent', text: a })),
      h('button', { class: 'btn small', type: 'button', id: 'list-reset', onclick: () => { setListFilter({}); rerender(); } }, '絞り込みを解除')));
  }

  const rows = ledger.items.filter(matches);
  const after = afterBaselineIds(ledger);
  const col = COLUMNS.find((c) => c.key === sort.key) || COLUMNS[0];
  rows.sort((a, b) => compare(col.value(a), col.value(b)) || a.id.localeCompare(b.id));

  root.appendChild(h('p', { class: 'muted small', id: 'list-count', text: `${rows.length}件 ／ 全${ledger.items.length}件` }));
  if (!rows.length) { root.appendChild(h('div', { class: 'empty', text: '条件に合う項目がありません' })); return; }

  const thead = h('thead', null, h('tr', null, COLUMNS.map((c) => h('th', {
    'aria-sort': sort.key === c.key ? (sort.dir === 1 ? 'ascending' : 'descending') : 'none', scope: 'col',
  }, h('button', { type: 'button', 'data-fk': 'sort-' + c.key, onclick: () => { if (sort.key === c.key) sort.dir *= -1; else { sort.key = c.key; sort.dir = 1; } rerender(); } },
    c.label, sort.key === c.key ? (sort.dir === 1 ? ' ▲' : ' ▼') : '')))));

  const tbody = h('tbody', null, rows.map((it) => {
    const person = personOf(it);
    return h('tr', {
      class: store.selectedId === it.id ? 'selected' : null, tabindex: '0', 'data-id': it.id,
      onclick: () => app.openItem(it.id),
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); app.openItem(it.id); } },
      'aria-label': `${it.id} ${it.title}`,
    },
    h('td', { class: 'mono small', text: it.id }),
    h('td', null, h('span', { class: 'badge', text: kindLabel(it.kind) })),
    h('td', { class: 'title' }, it.title, after.has(it.id) ? h('span', { class: 'badge accent after-bl', text: 'ベースライン後' }) : null),
    h('td', null, statusBadge(it.kind, it.status)),
    h('td', null, confBadge(it.confidence)),
    h('td', { class: 'small wrap', text: rankOf(it) || '' }),
    h('td', { class: 'small wrap', text: person ? (itemTitle(person, ledger) || person) : '' }),
    h('td', { class: 'small mono', text: dateOf(it) || '' }),
    h('td', { class: 'small muted mono', text: (it.updatedAt || '').slice(0, 10) }));
  }));
  root.appendChild(h('div', { class: 'table-wrap' }, h('table', { class: 'list' }, thead, tbody)));
}
