// ---- core/impact.js ----
// 変更の影響範囲: 対象の項目から、参照フィールド（両方向）・links・関係を幅優先で 2 段までたどる
// 関係者とシステムは影響範囲に含めるが、そこから先へはたどらない（担当者つながりで無関係な作業が入らないように）


const TERMINAL = new Set(['stakeholder', 'system']);

// 戻り値: { items: { item, depth }[], byKind: Record<kind, Item[]>, tasks: Item[], taskEstimate: number }
function impactOf(ledger, rootIds, depth = 2) {
  // メモは影響範囲に入れず、メモを通ってたどることもしない（社内のメモが変更要求書に出ないように）
  const byId = new Map(ledger.items.filter((it) => it.kind !== 'memo').map((it) => [it.id, it]));
  const back = buildBackrefs(ledger);
  const links = linkIndex(ledger);
  const neighbors = (id) => {
    const it = byId.get(id);
    const out = new Set();
    // 親子（parent）はたどらない。子から親へ上がると兄弟の作業まで入るため。子孫は下でまとめて足す
    if (it) for (const r of refsOf(it)) if (r.field !== 'parent') out.add(r.id);
    for (const b of back.get(id) || []) if (b.field !== 'parent') out.add(b.from);
    for (const x of links.get(id) || []) out.add(x);
    return out;
  };
  const roots = new Set(rootIds);
  const seen = new Map();
  let frontier = [...roots];
  for (let d = 1; d <= depth && frontier.length; d++) {
    const next = [];
    for (const id of frontier) {
      const it = byId.get(id);
      // 根でない関係者・システムからは先へ進まない
      if (it && TERMINAL.has(it.kind) && !roots.has(id)) continue;
      for (const n of neighbors(id)) {
        if (roots.has(n) || seen.has(n) || !byId.has(n)) continue;
        seen.set(n, d);
        next.push(n);
      }
    }
    frontier = next;
  }
  // たどり着いた作業の子孫も含める（親だけがつながっていても、子の見積を数えるため）
  const children = new Map();
  for (const it of ledger.items) if (it.kind === 'task' && it.parent) {
    if (!children.has(it.parent)) children.set(it.parent, []);
    children.get(it.parent).push(it.id);
  }
  const addDesc = (id, d) => {
    for (const c of children.get(id) || []) {
      if (!seen.has(c) && !roots.has(c)) { seen.set(c, d); addDesc(c, d); }
    }
  };
  for (const [id, d] of [...seen]) if (byId.get(id).kind === 'task') addDesc(id, d);

  const items = [...seen].map(([id, d]) => ({ item: byId.get(id), depth: d }));
  const byKind = {};
  for (const k of LEDGER_KINDS) byKind[k] = [];
  for (const x of items) byKind[x.item.kind].push(x.item);
  // 見積は末端の作業だけを足す（親と子を二重に数えない）
  const tasks = byKind.task || [];
  const leafEst = tasks.filter((t) => !children.has(t.id) && t.status !== 'cancelled').reduce((a, t) => a + (t.estimate || 0), 0);
  return { items, byKind, tasks, taskEstimate: Math.round(leafEst * 10) / 10 };
}

// 変更要求書の下書き（平文）
function changeRequestText(ledger, cr, imp) {
  const name = (id) => { const it = ledger.items.find((x) => x.id === id); return it ? `${it.title}（${id}）` : id; };
  const L = [];
  L.push(`変更要求書（下書き）　${cr.id}`, '');
  L.push(`■ 件名: ${cr.title}`);
  if (cr.requestedBy) L.push(`■ 依頼者: ${name(cr.requestedBy)}`);
  L.push(`■ 状態: ${statusLabel('change', cr.status)}`);
  if (cr.body) L.push('', '■ 内容', cr.body);
  L.push('', '■ 対象');
  const targets = (cr.links || []).filter((id) => { const it = ledger.items.find((x) => x.id === id); return !it || (it.kind !== 'memo' && !it.internal); });
  for (const id of targets) L.push(`・${name(id)}`);
  if (!targets.length) L.push('・（未指定）');
  L.push('', '■ 影響範囲（台帳から機械的に求めたもの）');
  for (const [k, list] of Object.entries(imp.byKind)) {
    const shown = list.filter((it) => !it.internal);   // 社内のみの項目は変更要求書の文面に出さない
    if (!shown.length || k === 'stakeholder' || k === 'system') continue;
    L.push(`【${kindLabel(k)}】`);
    for (const it of shown) L.push(`・${it.title}（${it.id}${it.kind === 'task' && typeof it.estimate === 'number' ? `・見積 ${it.estimate} 人日` : ''}）`);
  }
  const people = [...(imp.byKind.stakeholder || []), ...(imp.byKind.system || [])].filter((it) => !it.internal);
  if (people.length) L.push('【関係者・システム】', ...people.map((it) => `・${it.title}（${it.id}）`));
  L.push('', `■ 影響する作業の見積の合計: ${imp.taskEstimate} 人日`);
  L.push(`■ 追加工数の見込み: ${typeof cr.extraEstimate === 'number' ? cr.extraEstimate + ' 人日' : '未見積'}`);
  L.push('', '■ 判断', '（承認 / 却下 / 保留。決定者と日付を記入）');
  return L.join('\n');
}


// ---- core/report.js ----
// 定例会資料と週報の文面: 期間の変更・EVM・遅れ・顧客待ち・新しい決定・次回までの作業


const DONE = new Set(['done', 'closed', 'answered', 'agreed', 'accepted', 'approved', 'achieved']);
const NEXT_DAYS = 14;

// 前回の会議: 開催済みの定例のうち、今日より前で最も新しいもの。無ければ 7 日前
function previousMeetingDate(ledger, today) {
  const t = dayNumber(today);
  const ms = ledger.items.filter((it) => it.kind === 'meeting' && it.meetingType === 'regular' && it.status === 'held' && it.date && dayNumber(it.date) < t)
    .sort((a, b) => b.date.localeCompare(a.date));
  return ms.length ? ms[0].date : dayToYmd(t - 7);
}

// 戻り値: { from, to, added, completed, statusChanged, decisions, evm, delayed, waiting, next }
function buildReport(ledgerAll, { from, to, today, presentation }) {
  const ledger = visibleLedger(ledgerAll, presentation);
  const byId = new Map(ledger.items.map((it) => [it.id, it]));
  const f = dayNumber(from);
  const tt = dayNumber(to);
  const added = new Map();
  const completed = new Map();
  const statusChanged = new Map();
  for (const e of ledger.changelog || []) {
    if (e.source === 'snapshot') continue;
    const d = localDayNumber(e.at);
    if (d < f || d > tt) continue;
    for (const c of e.changes || []) {
      const it = byId.get(c.id);
      if (!it) continue;   // 社内のみで隠れた項目・関係など
      if (c.op === 'add') added.set(it.id, it);
      else if (c.statusTo && DONE.has(c.statusTo)) { completed.set(it.id, { item: it, from: c.statusFrom, to: c.statusTo }); statusChanged.delete(it.id); }
      else if (c.statusTo) statusChanged.set(it.id, { item: it, from: c.statusFrom, to: c.statusTo });
    }
  }
  const decisions = ledger.items.filter((it) => it.kind === 'decision' && it.decidedAt && dayNumber(it.decidedAt) >= f && dayNumber(it.decidedAt) <= tt);
  const hasTasks = ledger.items.some((it) => it.kind === 'task');
  const evm = hasTasks ? computeEvm(ledger, today) : null;
  const tree = buildTree(ledger, today);
  const delayed = tree.flat.filter((n) => n.delayed).map((n) => n.item);
  const waiting = ledger.items
    .filter((it) => ballOf(it, ledger) === 'customer')
    .map((it) => ({ item: it, wait: waitDays(it, ledger, today) }))
    .sort((a, b) => (b.wait ?? -1) - (a.wait ?? -1));
  const limit = dayNumber(to) + NEXT_DAYS;
  const next = tree.flat.filter((n) => n.leaf && n.item.end && !['done', 'cancelled'].includes(n.item.status) && dayNumber(n.item.end) <= limit && dayNumber(n.item.end) > tt)
    .map((n) => n.item).sort((a, b) => a.end.localeCompare(b.end));
  return {
    from, to, presentation: !!presentation,
    added: [...added.values()], completed: [...completed.values()], statusChanged: [...statusChanged.values()],
    decisions, evm, delayed, waiting, next,
  };
}

const line = (it) => `・${it.title}（${it.id}）`;

// 週報の平文（メールや Chat に貼る）。説明用の表示では実績（AC・CPI・EAC）を書かない
function reportText(r, projectName) {
  const L = [];
  L.push(`【${projectName}】週次報告（${r.from}〜${r.to}）`, '');
  L.push('■ 今週の進捗');
  if (r.evm) {
    const base = `計画 ${r.evm.pv} 人日に対し出来高 ${r.evm.ev} 人日（SPI ${r.evm.spi ?? '—'}）`;
    L.push(r.presentation ? `・${base}` : `・${base}、実績 ${r.evm.ac} 人日（CPI ${r.evm.cpi ?? '—'}）`);
  }
  for (const c of r.completed) L.push(`・完了: ${c.item.title}（${kindLabel(c.item.kind)}）`);
  for (const it of r.added) L.push(`・追加: ${it.title}（${kindLabel(it.kind)}）`);
  if (!r.completed.length && !r.added.length) L.push('・期間中の追加・完了はありません');
  if (r.delayed.length) {
    L.push('', '■ 遅れている作業');
    for (const it of r.delayed) L.push(`${line(it)} 予定 ${it.start}〜${it.end}・進捗 ${it.progress || 0}%`);
  }
  L.push('', '■ 決まったこと');
  if (r.decisions.length) for (const d of r.decisions) L.push(`・${d.decidedAt} ${d.title}${d.reason ? '（理由: ' + d.reason + '）' : ''}`);
  else L.push('・期間中の決定はありません');
  L.push('', '■ お願い（ご回答・ご対応をお待ちしています）');
  if (r.waiting.length) for (const w of r.waiting) L.push(`・${w.item.title}${w.item.due ? '（期限 ' + w.item.due + '）' : ''}${w.wait !== null ? ' ' + w.wait + '日経過' : ''}`);
  else L.push('・ありません');
  L.push('', `■ 来週以降の予定（${NEXT_DAYS}日以内に終わる予定の作業）`);
  if (r.next.length) for (const it of r.next) L.push(`・${it.end} ${it.title}（${statusLabel('task', it.status)}・${it.progress || 0}%）`);
  else L.push('・ありません');
  return L.join('\n');
}


// ---- core/fp.js ----
// ファンクションポイントの概算（NESMA 概算法）と、WBS の見積（BAC）との突き合わせ


const FP_TYPES = [
  { v: 'ILF', label: '内部論理ファイル（自システムのテーブル）', weight: 35 },
  { v: 'EIF', label: '外部インタフェースファイル（外部参照のテーブル）', weight: 15 },
  { v: 'EI', label: '外部入力（入力画面・受信連携・更新するバッチ）', weight: 4 },
  { v: 'EO', label: '外部出力（帳票・送信連携・参照だけのバッチ）', weight: 5 },
  { v: 'EQ', label: '外部照会（照会画面）', weight: 4 },
];
const FP_GAP_ALERT = 0.3;

// 機能の種類を決める。数えないものは null と理由
function fpTypeOf(it) {
  if (it.status === 'dropped') return { type: null, reason: '取り下げ' };
  if (it.kind === 'entity') return { type: it.fileType === 'external' ? 'EIF' : 'ILF' };
  if (it.kind === 'screen') return { type: { input: 'EI', report: 'EO', inquiry: 'EQ' }[it.screenType] || null, reason: '画面の区分が無い' };
  if (it.kind === 'interface') return { type: it.direction === 'in' ? 'EI' : it.direction === 'out' ? 'EO' : null, reason: '向きが無い' };
  if (it.kind === 'batch') {
    const ops = (it.crud || []).map((c) => c.ops || '').join('');
    if (!ops) return { type: null, reason: 'CRUD が無く、種類を決められない' };
    return { type: /[CUD]/.test(ops) ? 'EI' : 'EO' };
  }
  return null;
}

// 戻り値: { rows: [{ v, label, weight, items, count, fp }], total, uncounted: [{ item, reason }] }
function countFp(ledger) {
  const rows = FP_TYPES.map((t) => ({ ...t, items: [], count: 0, fp: 0 }));
  const uncounted = [];
  for (const it of ledger.items) {
    const r = fpTypeOf(it);
    if (!r) continue;
    if (!r.type) { uncounted.push({ item: it, reason: r.reason }); continue; }
    rows.find((x) => x.v === r.type).items.push(it);
  }
  for (const r of rows) { r.count = r.items.length; r.fp = r.count * r.weight; }
  return { rows, total: rows.reduce((a, r) => a + r.fp, 0), uncounted };
}

// 見積の工数と BAC の比較。生産性が無ければ effort 以降は null
function fpEstimate(ledger, today) {
  const fp = countFp(ledger);
  const productivity = settingOf(ledger, 'productivity');
  const bac = ledger.items.some((it) => it.kind === 'task') ? computeEvm(ledger, today).bac : 0;
  if (!productivity) return { ...fp, productivity: null, effort: null, bac, gap: null };
  const effort = Math.round(fp.total * productivity * 10) / 10;
  const gap = bac > 0 ? Math.round(((effort - bac) / bac) * 1000) / 1000 : null;
  return { ...fp, productivity, effort, bac, gap };
}


// ---- core/ddl.js ----
// DDL の生成（PostgreSQL / SQL Server / Oracle）と、物理名の点検

const DIALECTS = [
  { v: 'postgres', label: 'PostgreSQL' },
  { v: 'sqlserver', label: 'SQL Server' },
  { v: 'oracle', label: 'Oracle' },
];

const DEFAULT_LEN = { string: 255, code: 20 };

// 論理型 → 方言ごとの物理型
function physType(col, dialect) {
  const n = col.length || DEFAULT_LEN[col.type];
  const p = col.length || 18;
  const sc = col.scale || 0;
  const map = {
    postgres: { string: `VARCHAR(${n})`, code: `VARCHAR(${n})`, text: 'TEXT', int: 'INTEGER', bigint: 'BIGINT', decimal: `NUMERIC(${p},${sc})`, date: 'DATE', datetime: 'TIMESTAMP', boolean: 'BOOLEAN' },
    sqlserver: { string: `NVARCHAR(${n})`, code: `NVARCHAR(${n})`, text: 'NVARCHAR(MAX)', int: 'INT', bigint: 'BIGINT', decimal: `DECIMAL(${p},${sc})`, date: 'DATE', datetime: 'DATETIME2', boolean: 'BIT' },
    oracle: { string: `VARCHAR2(${n} CHAR)`, code: `VARCHAR2(${n} CHAR)`, text: 'CLOB', int: 'NUMBER(10)', bigint: 'NUMBER(19)', decimal: `NUMBER(${p},${sc})`, date: 'DATE', datetime: 'TIMESTAMP', boolean: 'NUMBER(1)' },
  };
  return map[dialect][col.type] || map[dialect].string;
}

const ident = (name, namingCase) => (namingCase === 'upper' ? String(name).toUpperCase() : String(name).toLowerCase());
const quote = (s) => String(s == null ? '' : s).replace(/'/g, "''");

// 外部キーの参照先が先に来る順に並べる。循環する外部キーは後から ALTER で足す
function orderTables(entities) {
  const ids = new Set(entities.map((e) => e.id));
  const deps = new Map(entities.map((e) => [e.id, new Set((e.columns || []).map((c) => c.fk && c.fk.entity).filter((x) => x && x !== e.id && ids.has(x)))]));
  const order = [];
  const deferred = [];   // { from, colName }
  const state = new Map();
  const visit = (id, path) => {
    if (state.get(id) === 2) return;
    state.set(id, 1);
    for (const d of deps.get(id)) {
      if (state.get(d) === 1) { deferred.push({ from: id, to: d }); continue; }
      visit(d, path);
    }
    state.set(id, 2);
    order.push(id);
  };
  for (const e of [...entities].sort((a, b) => a.id.localeCompare(b.id))) if (!state.has(e.id)) visit(e.id);
  return { order: order.map((id) => entities.find((e) => e.id === id)), deferred };
}

// 戻り値: 文字列（そのまま流せる SQL）
function generateDdl(ledger, dialect = 'postgres', namingCase = 'lower') {
  const all = ledger.items.filter((it) => it.kind === 'entity' && it.status !== 'dropped');
  const internal = all.filter((e) => e.fileType !== 'external');
  const byId = new Map(all.map((e) => [e.id, e]));
  const created = new Set(internal.map((e) => e.id));
  const { order, deferred } = orderTables(internal);
  const deferredSet = new Set(deferred.map((d) => d.from + '>' + d.to));
  const id = (n) => ident(n, namingCase);
  const L = [`-- ${ledger.project.name} のテーブル定義（${DIALECTS.find((d) => d.v === dialect).label}）`, '-- 案件ワークベンチで生成。外部参照のテーブルは作成しない'];
  const external = all.filter((e) => e.fileType === 'external');
  if (external.length) L.push(`-- 外部参照のテーブル（作成しない）: ${external.map((e) => `${id(e.physicalName)}（${e.title}）`).join(', ')}`);
  const alters = [];
  const comments = [];
  for (const e of order) {
    const t = id(e.physicalName);
    const cols = e.columns || [];
    const lines = cols.map((c) => `  ${id(c.name)} ${physType(c, dialect)}${c.required || c.pk ? ' NOT NULL' : ''}`);
    const pk = cols.filter((c) => c.pk).map((c) => id(c.name));
    if (pk.length) lines.push(`  CONSTRAINT ${id('pk_' + e.physicalName)} PRIMARY KEY (${pk.join(', ')})`);
    for (const c of cols) {
      if (!c.fk || !c.fk.entity) continue;
      const ref = byId.get(c.fk.entity);
      if (!ref) continue;
      const fkName = id(`fk_${e.physicalName}_${c.name}`);
      const clause = `FOREIGN KEY (${id(c.name)}) REFERENCES ${id(ref.physicalName)} (${id(c.fk.column)})`;
      if (!created.has(ref.id)) { lines.push(`  -- ${clause}（参照先は外部参照のため制約を作らない）`); continue; }
      if (deferredSet.has(e.id + '>' + ref.id)) alters.push(`ALTER TABLE ${t} ADD CONSTRAINT ${fkName} ${clause};`);
      else lines.push(`  CONSTRAINT ${fkName} ${clause}`);
    }
    // 最後の行のカンマを正しく付ける（コメント行には付けない）
    const body = [];
    const real = lines.map((x, i) => ({ x, i, comment: x.trim().startsWith('--') }));
    const lastReal = Math.max(...real.filter((r) => !r.comment).map((r) => r.i));
    for (const r of real) body.push(r.comment || r.i === lastReal ? r.x : r.x + ',');
    L.push('', `CREATE TABLE ${t} (`, ...body, ');');
    // コメント
    if (dialect === 'sqlserver') {
      comments.push(`EXEC sp_addextendedproperty N'MS_Description', N'${quote(e.title)}', N'SCHEMA', N'dbo', N'TABLE', N'${t}';`);
      for (const c of cols) if (c.logical || c.note) comments.push(`EXEC sp_addextendedproperty N'MS_Description', N'${quote([c.logical, c.note].filter(Boolean).join(' '))}', N'SCHEMA', N'dbo', N'TABLE', N'${t}', N'COLUMN', N'${id(c.name)}';`);
    } else {
      comments.push(`COMMENT ON TABLE ${t} IS '${quote(e.title)}';`);
      for (const c of cols) if (c.logical || c.note) comments.push(`COMMENT ON COLUMN ${t}.${id(c.name)} IS '${quote([c.logical, c.note].filter(Boolean).join(' '))}';`);
    }
  }
  if (alters.length) L.push('', '-- 循環する外部キー（テーブルを作った後に足す）', ...alters);
  if (comments.length) L.push('', '-- 表と列のコメント', ...comments);
  return L.join('\n') + '\n';
}

// 方言ごとの主な予約語（すべてではない。よく衝突するものを中心に）
const RESERVED_COMMON = ['add', 'all', 'alter', 'and', 'any', 'as', 'asc', 'between', 'by', 'case', 'check', 'column', 'constraint', 'create', 'current_date', 'current_time', 'default', 'delete', 'desc', 'distinct', 'drop', 'else', 'end', 'exists', 'foreign', 'from', 'grant', 'group', 'having', 'in', 'index', 'insert', 'into', 'is', 'join', 'key', 'like', 'not', 'null', 'on', 'or', 'order', 'primary', 'references', 'select', 'set', 'table', 'then', 'to', 'union', 'unique', 'update', 'user', 'values', 'view', 'when', 'where', 'with'];
const RESERVED = {
  postgres: [...RESERVED_COMMON, 'analyse', 'analyze', 'array', 'limit', 'offset', 'returning', 'window', 'only', 'placing'],
  sqlserver: [...RESERVED_COMMON, 'backup', 'browse', 'file', 'identity', 'key', 'open', 'percent', 'plan', 'rule', 'schema', 'top', 'transaction', 'tran'],
  oracle: [...RESERVED_COMMON, 'access', 'comment', 'date', 'file', 'level', 'mode', 'number', 'resource', 'rowid', 'rownum', 'session', 'size', 'start', 'uid', 'long', 'raw'],
};

// 戻り値: [{ itemId, message }]
function lintNames(ledger, dialect = 'postgres', namingCase = 'lower') {
  const out = [];
  const re = namingCase === 'upper' ? /^[A-Z][A-Z0-9_]*$/ : /^[a-z][a-z0-9_]*$/;
  const rule = namingCase === 'upper' ? '英大文字・数字・下線（先頭は英字）' : '英小文字・数字・下線（先頭は英字）';
  const reserved = new Set(RESERVED[dialect]);
  const check = (itemId, what, name) => {
    if (!re.test(name)) out.push({ itemId, message: `${what}「${name}」は${rule}だけにしてください` });
    if (reserved.has(String(name).toLowerCase())) out.push({ itemId, message: `${what}「${name}」は ${DIALECTS.find((d) => d.v === dialect).label} の予約語です` });
    if (dialect === 'oracle' && String(name).length > 30) out.push({ itemId, message: `${what}「${name}」が 30 文字を超えています（古い Oracle では使えません）` });
  };
  for (const e of ledger.items.filter((it) => it.kind === 'entity' && it.status !== 'dropped')) {
    check(e.id, 'テーブル名', e.physicalName);
    for (const c of e.columns || []) if (c && c.name) check(e.id, `列名（${e.physicalName}）`, c.name);
  }
  return out;
}


// ---- core/erlayout.js ----
// ER 図の配置（DOM に依存しない）。外部キーの向きで層に分け、参照先を左、参照元を右に置く
// 層割りと並べ替えは ~/.claude/skills/dashboard/assets/dash.js の layering を改変して流用

const ER = { BOX_W: 230, HEAD: 26, ROW: 18, MAX_ROWS: 20, GAP_X: 90, GAP_Y: 28, PAD: 20 };

// 有向グラフを層に分ける。逆向きの辺（循環）を見つけ、最長経路で層を決め、重心法で並び替える
function layering(ids, edges) {
  const out = new Map(ids.map((id) => [id, []]));
  edges.forEach((e, i) => out.get(e.s).push(i));
  const state = new Map();
  const back = new Set();
  const visit = (u) => {
    state.set(u, 1);
    for (const i of out.get(u)) {
      const v = edges[i].t;
      const st = state.get(v);
      if (st === 1) back.add(i); else if (!st) visit(v);
    }
    state.set(u, 2);
  };
  ids.forEach((id) => { if (!state.get(id)) visit(id); });
  const fwd = edges.map((_, i) => i).filter((i) => !back.has(i));
  const indeg = new Map(ids.map((id) => [id, 0]));
  for (const i of fwd) indeg.set(edges[i].t, indeg.get(edges[i].t) + 1);
  const rank = new Map(ids.map((id) => [id, 0]));
  const queue = ids.filter((id) => !indeg.get(id));
  while (queue.length) {
    const u = queue.shift();
    for (const i of out.get(u)) {
      if (back.has(i)) continue;
      const v = edges[i].t;
      rank.set(v, Math.max(rank.get(v), rank.get(u) + 1));
      indeg.set(v, indeg.get(v) - 1);
      if (!indeg.get(v)) queue.push(v);
    }
  }
  const maxRank = Math.max(0, ...rank.values());
  const layers = Array.from({ length: maxRank + 1 }, () => []);
  ids.forEach((id) => layers[rank.get(id)].push(id));
  const pos = new Map();
  const index = () => layers.forEach((L) => L.forEach((id, i) => pos.set(id, i)));
  index();
  const preds = new Map(ids.map((id) => [id, []]));
  const succs = new Map(ids.map((id) => [id, []]));
  for (const i of fwd) { preds.get(edges[i].t).push(edges[i].s); succs.get(edges[i].s).push(edges[i].t); }
  const bary = (id, nb) => { const ns = nb.get(id); return ns.length ? ns.reduce((a, x) => a + pos.get(x), 0) / ns.length : pos.get(id); };
  for (let it = 0; it < 6; it++) {
    for (let r = 1; r <= maxRank; r++) { const b = new Map(layers[r].map((id) => [id, bary(id, preds)])); layers[r].sort((x, y) => b.get(x) - b.get(y)); index(); }
    for (let r = maxRank - 1; r >= 0; r--) { const b = new Map(layers[r].map((id) => [id, bary(id, succs)])); layers[r].sort((x, y) => b.get(x) - b.get(y)); index(); }
  }
  return { rank, layers };
}

// 戻り値: { boxes: [{ id, x, y, w, h, title, physicalName, external, rows: [{ name, type, pk, fk }], more }], lines: [{ from, to, column, points }], width, height }
function layoutEr(ledger) {
  const ents = ledger.items.filter((it) => it.kind === 'entity' && it.status !== 'dropped').sort((a, b) => a.id.localeCompare(b.id));
  const ids = ents.map((e) => e.id);
  const idSet = new Set(ids);
  const edges = [];
  for (const e of ents) for (const c of e.columns || []) {
    if (c && c.fk && idSet.has(c.fk.entity) && c.fk.entity !== e.id) edges.push({ s: c.fk.entity, t: e.id });
  }
  const { layers } = layering(ids, edges);
  const byId = new Map(ents.map((e) => [e.id, e]));
  const boxes = new Map();
  let height = 0;
  layers.forEach((layer, r) => {
    let y = ER.PAD;
    for (const id of layer) {
      const e = byId.get(id);
      const cols = (e.columns || []).filter(Boolean);
      const shown = cols.slice(0, ER.MAX_ROWS);
      const more = cols.length - shown.length;
      const h = ER.HEAD + (shown.length + (more > 0 ? 1 : 0)) * ER.ROW + 6;
      boxes.set(id, {
        id, x: ER.PAD + r * (ER.BOX_W + ER.GAP_X), y, w: ER.BOX_W, h,
        title: e.title, physicalName: e.physicalName, external: e.fileType === 'external',
        rows: shown.map((c) => ({ name: c.name, type: c.type, pk: !!c.pk, fk: !!c.fk })), more,
      });
      y += h + ER.GAP_Y;
    }
    height = Math.max(height, y);
  });
  const rowY = (box, name) => {
    const i = box.rows.findIndex((r) => String(r.name).toLowerCase() === String(name).toLowerCase());
    return box.y + ER.HEAD + (i < 0 ? 0 : i) * ER.ROW + ER.ROW / 2;
  };
  // 線: 参照元の列の行から、参照先の列の行へ。左右の辺の上に端を置き、直交の折れ線で結ぶ
  const lines = [];
  for (const e of ents) {
    const child = boxes.get(e.id);
    for (const c of e.columns || []) {
      if (!c || !c.fk || !boxes.has(c.fk.entity) || c.fk.entity === e.id) continue;
      const parent = boxes.get(c.fk.entity);
      const y1 = rowY(child, c.name);
      const y2 = rowY(parent, c.fk.column);
      let points;
      if (parent.x + parent.w <= child.x) {
        const x1 = child.x;
        const x2 = parent.x + parent.w;
        const mx = Math.round((x1 + x2) / 2);
        points = [[x1, y1], [mx, y1], [mx, y2], [x2, y2]];
      } else if (child.x + child.w <= parent.x) {
        const x1 = child.x + child.w;
        const x2 = parent.x;
        const mx = Math.round((x1 + x2) / 2);
        points = [[x1, y1], [mx, y1], [mx, y2], [x2, y2]];
      } else {
        // 同じ列（循環で同じ層に来たとき）: 右の辺から外へ出て回り込む
        const x1 = child.x + child.w;
        const x2 = parent.x + parent.w;
        const ox = Math.max(x1, x2) + 24;
        points = [[x1, y1], [ox, y1], [ox, y2], [x2, y2]];
      }
      lines.push({ from: e.id, to: c.fk.entity, column: c.name, points });
    }
  }
  // 同じすき間を通る線の縦の部分が重ならないよう、少しずつずらす
  const groups = new Map();
  for (const ln of lines) {
    const key = `${ln.points[0][0]}|${ln.points[3][0]}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(ln);
  }
  for (const list of groups.values()) {
    list.sort((a, b) => a.points[0][1] - b.points[0][1]);
    list.forEach((ln, i) => {
      const off = Math.round((i - (list.length - 1) / 2) * 10);
      ln.points[1][0] += off;
      ln.points[2][0] += off;
    });
  }
  const width = ER.PAD * 2 + layers.length * ER.BOX_W + Math.max(0, layers.length - 1) * ER.GAP_X + 30;
  return { boxes: [...boxes.values()], lines, width, height: height + ER.PAD };
}


// ---- core/csv.js ----
// CSV / TSV の読み取り。引用符・"" のエスケープ・引用符の中の改行・CRLF・BOM に対応する状態機械
// ~/projects/薬膳/index.html の parseCSV を改変して流用（区切り文字を引数にし、BOM 除去を足した）

function stripBom(text) {
  return String(text).replace(/^﻿/, '');
}

// 1 行目のタブとカンマの数で区切りを決める（引用符の中は数えない）
function detectDelimiter(text) {
  let tabs = 0;
  let commas = 0;
  let inQ = false;
  for (const ch of text) {
    if (ch === '"') inQ = !inQ;
    else if (!inQ && (ch === '\n' || ch === '\r')) break;
    else if (!inQ && ch === '\t') tabs++;
    else if (!inQ && ch === ',') commas++;
  }
  return tabs > commas ? '\t' : ',';
}

// 戻り値: string[][]（空行は除く）
function parseDelimited(text, delim) {
  const src = stripBom(text);
  const d = delim || detectDelimiter(src);
  const rows = [];
  let row = [];
  let cell = '';
  let inQ = false;
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (inQ) {
      if (ch === '"') {
        if (src[i + 1] === '"') { cell += '"'; i++; } else inQ = false;
      } else cell += ch;
      continue;
    }
    if (ch === '"') inQ = true;
    else if (ch === d) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && src[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); if (row.length > 1 || row[0] !== '') rows.push(row); }
  return rows;
}

// バイト列を文字列にする。auto なら UTF-8 として読み、読めなければ Shift_JIS（TextDecoder は標準機能）
function decodeBytes(buffer, encoding = 'auto') {
  const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
  if (encoding === 'shift_jis') return { text: new TextDecoder('shift_jis').decode(bytes), encoding: 'shift_jis' };
  if (encoding === 'utf-8') return { text: new TextDecoder('utf-8').decode(bytes), encoding: 'utf-8' };
  try {
    return { text: new TextDecoder('utf-8', { fatal: true }).decode(bytes), encoding: 'utf-8' };
  } catch (e) {
    return { text: new TextDecoder('shift_jis').decode(bytes), encoding: 'shift_jis' };
  }
}


// ---- core/zip.js ----
// zip の読み書きと、Office の XML を読む小道具。DOM に触れない。
// 読み取りは gemini-kit src/js/xlsx.js の entries・inflate、書き出しは gemini-kit src/js/pptx.js の zip・crc32 を写したもの（2026-11-26）。
// 展開は標準の DecompressionStream('deflate-raw')（Node 22 以上・新しい Chrome / Edge）。書き出しは無圧縮

const zipUtf8 = new TextDecoder('utf-8');
const zu16 = (b, o) => b[o] | (b[o + 1] << 8);
const zu32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;

// bytes（Uint8Array）→ Map<名前, { method, data }>
function zipEntries(bytes) {
  const b = bytes;
  if (b.length < 22 || zu32(b, 0) !== 0x04034b50) throw new Error('zip として読めません');
  let e = -1;
  for (let i = b.length - 22; i >= Math.max(0, b.length - 22 - 65535); i--) if (zu32(b, i) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('zip として読めません（終わりが見つかりません）');
  const count = zu16(b, e + 10);
  let p = zu32(b, e + 16);
  if (p === 0xffffffff) throw new Error('大きすぎる zip（ZIP64）は読めません');
  const map = new Map();
  for (let k = 0; k < count; k++) {
    if (zu32(b, p) !== 0x02014b50) throw new Error('zip として読めません（目次が壊れています）');
    const flag = zu16(b, p + 8), method = zu16(b, p + 10), size = zu32(b, p + 20);
    const nlen = zu16(b, p + 28), xlen = zu16(b, p + 30), clen = zu16(b, p + 32), local = zu32(b, p + 42);
    const name = zipUtf8.decode(b.subarray(p + 46, p + 46 + nlen));
    if (flag & 1) throw new Error('パスワード付きのファイルは読めません');
    const start = local + 30 + zu16(b, local + 26) + zu16(b, local + 28);
    map.set(name, { method, data: b.subarray(start, start + size) });
    p += 46 + nlen + xlen + clen;
  }
  return map;
}

async function zipInflate(data) {
  if (typeof DecompressionStream !== 'function') throw new Error('このブラウザは圧縮されたファイルを展開できません（新しい Chrome / Edge で開いてください）');
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const reader = stream.getReader();
  const parts = [];
  let n = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); n += value.length; }
  const out = new Uint8Array(n);
  let o = 0;
  for (const x of parts) { out.set(x, o); o += x.length; }
  return out;
}

// 中のファイルのバイト列。無ければ null
async function zipBytes(zip, name) {
  const e = zip.get(name);
  if (!e) return null;
  if (e.method === 0) return e.data;
  if (e.method === 8) return zipInflate(e.data);
  throw new Error(`圧縮方式 ${e.method} は読めません`);
}
// 中のファイルの文字列（UTF-8）。無ければ null
async function zipText(zip, name) {
  const b = await zipBytes(zip, name);
  return b === null ? null : zipUtf8.decode(b);
}

// rels の Target を、その rels が属するファイルのフォルダからの相対として解決する（../ と ./ を扱う）
// owner: 'ppt/slides/slide1.xml' のような持ち主のパス。Target が / で始まればパッケージの根から
function resolvePart(owner, target) {
  const t = String(target || '');
  if (t.startsWith('/')) return t.slice(1);
  const parts = owner.split('/').slice(0, -1);
  for (const seg of t.split('/')) {
    if (seg === '..') parts.pop();
    else if (seg !== '.' && seg !== '') parts.push(seg);
  }
  return parts.join('/');
}
// 'ppt/slides/slide1.xml' → 'ppt/slides/_rels/slide1.xml.rels'
function relsPathOf(part) {
  const i = part.lastIndexOf('/');
  return `${part.slice(0, i + 1)}_rels/${part.slice(i + 1)}.rels`;
}

// ---- XML の小道具（正規表現で読む。Node のテストに DOMParser が無いため） ----
const xmlUnescape = (s) => String(s).replace(/&(lt|gt|amp|quot|apos|#x[0-9a-fA-F]+|#\d+);/g, (m, k) =>
  (k === 'lt' ? '<' : k === 'gt' ? '>' : k === 'amp' ? '&' : k === 'quot' ? '"' : k === 'apos' ? "'" : String.fromCodePoint(k[1] === 'x' ? parseInt(k.slice(2), 16) : +k.slice(1))));
function xmlAttrs(s) {
  const o = Object.create(null);
  for (const m of String(s).matchAll(/([\w:.-]+)\s*=\s*"([^"]*)"/g)) o[m[1]] = xmlUnescape(m[2]);
  return o;
}
// rels の XML → Map<Id, Target>
function relsMap(xml) {
  const m = new Map();
  for (const r of String(xml || '').matchAll(/<Relationship\b([^>]*?)\/?>/g)) { const a = xmlAttrs(r[1]); m.set(a.Id, { target: a.Target || '', type: a.Type || '', mode: a.TargetMode || '' }); }
  return m;
}

// ---- 書き出し（無圧縮） ----
const ZIP_CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xffffffff;
  for (let i = 0; i < buf.length; i++) c = ZIP_CRC[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
// files: [{ name, data: 文字列 | Uint8Array }] → Uint8Array（zip）
function zipWrite(files, date) {
  const enc = new TextEncoder();
  const d = date || new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const chunks = [];
  const central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;

}

// Excel（.xlsx）を読む。zip の中央ディレクトリを読み、無圧縮はそのまま、deflate はブラウザ標準の DecompressionStream で展開する。

// 数式は再計算せず、保存されている値を読む。DOM は使わない
const XLSX = (() => {

  const dec = new TextDecoder("utf-8");
  const u16 = (b, o) => b[o] | (b[o + 1] << 8);
  const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;

  function entries(bytes) {
    const b = bytes;

    if (b.length < 22 || u32(b, 0) !== 0x04034b50) throw new Error("xlsx として読めません（zip ではありません）");
    let e = -1;
    for (let i = b.length - 22; i >= Math.max(0, b.length - 22 - 65535); i--) if (u32(b, i) === 0x06054b50) { e = i; break; }

    let p = u32(b, e + 16);

    const map = new Map();

      if (u32(b, p) !== 0x02014b50) throw new Error("xlsx として読めません（目次が壊れています）");

      const nlen = u16(b, p + 28), xlen = u16(b, p + 30), clen = u16(b, p + 32), local = u32(b, p + 42);
      const name = dec.decode(b.subarray(p + 46, p + 46 + nlen));

    for (const rm of String(xml).matchAll(/<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g)) {
      const ra = attrs(rm[1]);

  }

  // bytes（Uint8Array）→ [{ name, rows }]。rows は 2 次元の文字列の配列（1 行目が見出し）
  async function sheets(bytes) {
    const zip = entries(bytes);
    if (zip.has("EncryptedPackage")) throw new Error("パスワード付きの xlsx は読めません");
    const wb = await text(zip, "xl/workbook.xml");

      const a = attrs(m[1]);
      const t = String(a.Target || "");
      target.set(a.Id, t.startsWith("/") ? t.slice(1) : "xl/" + t.replace(/^\.\//, ""));

    const dates = dateStyles(await text(zip, "xl/styles.xml"));
    const out = [];
    for (const m of wb.matchAll(/<sheet\b([^>]*?)\/?>/g)) {
      const a = attrs(m[1]);
      const path = target.get(a["r:id"]);
      const xml = path && (await text(zip, path));
      if (xml == null) continue; // グラフのシートなど
      out.push({ name: a.name || `シート${out.length + 1}`, rows: sheetRows(xml, sst, dates) });
    }
    if (!out.length) throw new Error("xlsx にシートがありません");
    return out;
  }

  return { sheets, entries, isDateCode, serialToDate, colIndex };
})();

// ・データは 1 行 1 レコードで列名を毎回書く（断片に切られても列名が残る）。決めた行数ごとにファイルを分ける
// 表は { name, source, sheet, cols: [列名], rows: [[文字列]] }（rows は見出しを除く）
const TABLEPREP = (() => {

  const CODE_MAX = 50; // 異なる値がこれ以下なら「コード値の一覧」に全部の値を載せる
  const TOP = 10;
  const TYPICAL = 30;
  const EXCEPT_MAX = 30;

      prof.map((p, i) => [i + 1, p.name, p.type, pct(p.blank, p.n), fmtNum(p.distinct), showMin(p), showMax(p), p.top.slice(0, 3).map((x) => x[0]).join("、")])));
    for (const p of prof) {
      L.push("", `## ${p.name}`, "", `- 型：${p.type}`, `- 意味：（ここに書き足すと、NotebookLM が答えに使えます）`,
        `- 空：${fmtNum(p.blank)} 行（${pct(p.blank, p.n)}）`, `- 異なる値の数：${fmtNum(p.distinct)}`);
      if (p.type === "数値" || p.type === "日付") L.push(`- 最小：${showMin(p)}`, `- 最大：${showMax(p)}`);
      if (p.type === "数値") L.push(`- 合計：${fmtNum(p.sum)}`, `- 平均：${fmtNum(p.mean)}`);
      if (!p.filled) continue;
      if (p.codes) {
        L.push("", `コード値の一覧（全 ${p.codes.length} 種類。件数の多い順）`, "", mdTable(["値", "件数", "割合"], p.codes.map(([v, k]) => [v, fmtNum(k), pct(k, p.n)])));
      } else {
        L.push("", `よく出る値（上位 ${p.top.length}）`, "", mdTable(["値", "件数", "割合"], p.top.map(([v, k]) => [v, fmtNum(k), pct(k, p.n)])));
      }
    }
    return L.join("\n") + "\n";
  }

  // groupCol：分類 × 数値列のクロス表にする列の名前（なければ作らない）
  function summaryMd(t, prof, groupCol, o) {
    const numCols = prof.filter((p) => p.type === "数値");
    const catCols = prof.filter((p) => p.codes && p.type !== "数値");
    const L = head(`# 集計：${t.name}`, t, o, [NOTE_CALC(t, o), ""]);
    L.push("## 数値の列", "");
    if (numCols.length) L.push(mdTable(["列", "件数", "合計", "平均", "最小", "最大"], numCols.map((p) => [p.name, fmtNum(p.filled), fmtNum(p.sum), fmtNum(p.mean), fmtNum(p.min), fmtNum(p.max)])));
    else L.push("数値の列はありません。");
    L.push("", "## 分類の列：値ごとの件数", "");
    if (!catCols.length) L.push(`値の種類が ${CODE_MAX} 以下の列はありません。`);
    for (const p of catCols) {
      const rows = p.codes.map(([v, k]) => [v, fmtNum(k), pct(k, p.n)]);
      if (p.blank) rows.push(["（空）", fmtNum(p.blank), pct(p.blank, p.n)]);
      rows.push(["合計", fmtNum(p.n), "100%"]);
      L.push(`### ${p.name}`, "", mdTable(["値", "件数", "割合"], rows), "");
    }
    const g = prof.find((p) => p.name === groupCol && p.codes);
    if (g) {
      L.push(`## ${g.name} 別の集計`, "", NOTE_CALC(t, o), "");
      const groups = new Map();
      for (const r of t.rows) {
        const k = str(r[g.index]).trim() || "（空）";
        if (!groups.has(k)) groups.set(k, { n: 0, sums: numCols.map(() => 0) });
        const x = groups.get(k);
        x.n++;
        numCols.forEach((p, i) => { const v = num(r[p.index]); if (v != null) x.sums[i] += v; });
      }
      const keys = [...groups.keys()].sort((a, b) => groups.get(b).n - groups.get(a).n || (a < b ? -1 : 1));
      const total = { n: t.rows.length, sums: numCols.map((p) => p.sum) };
      L.push(mdTable([g.name, "件数", ...numCols.map((p) => `${p.name}の合計`)],
        [...keys.map((k) => [k, fmtNum(groups.get(k).n), ...groups.get(k).sums.map(fmtNum)]), ["合計", fmtNum(total.n), ...total.sums.map(fmtNum)]]), "");
    }
    return L.join("\n").replace(/\n+$/, "") + "\n";
  }

  // ---------- 代表サンプル ----------
  // 典型：分類の列のよく出る値を順に拾い、空のない行で埋める。例外：空がある・最小・最大・1 回しか出ない値
  function pickSamples(t, prof) {
    const cats = prof.filter((p) => p.codes && p.type !== "数値" && p.distinct > 1);
    const usual = prof.filter((p) => p.blank * 2 <= p.n).map((p) => p.index); // 空が半分を超える列は空が普通なので見ない
    const noBlank = (r) => usual.every((c) => !isBlank(r[c]));
    const typical = [];
    const used = new Set();
    const add = (i) => { if (!used.has(i) && typical.length < TYPICAL) { used.add(i); typical.push(i); } };
    for (let rank = 0; rank < TOP && typical.length < TYPICAL; rank++) {
      for (const p of cats) {
        const v = p.top[rank] && p.top[rank][0];
        if (v == null || p.top[rank][1] < 2) continue;
        const i = t.rows.findIndex((r, j) => !used.has(j) && noBlank(r) && str(r[p.index]).trim() === v);
        if (i >= 0) add(i);
      }
    }
    // 残りは、よく出る値をたくさん含む行から
    const score = (r) => cats.reduce((s, p) => s + (p.counts.get(str(r[p.index]).trim()) || 0) / Math.max(1, p.n), 0);
    t.rows.map((r, i) => [i, noBlank(r) ? score(r) : -1]).sort((a, b) => b[1] - a[1] || a[0] - b[0]).forEach(([i]) => add(i));
    typical.sort((a, b) => a - b);

    const ex = new Map(); // 行 → 理由
    const why = (i, s) => { if (!ex.has(i)) { if (ex.size >= EXCEPT_MAX) return; ex.set(i, []); } if (!ex.get(i).includes(s)) ex.get(i).push(s); };
    for (const p of prof) {
      if (p.type === "数値" || p.type === "日付") {
        const key = p.type === "数値" ? num : dateKey;
        const iMin = t.rows.findIndex((r) => !isBlank(r[p.index]) && key(r[p.index]) === p.min);
        const iMax = t.rows.findIndex((r) => !isBlank(r[p.index]) && key(r[p.index]) === p.max);
        if (iMin >= 0) why(iMin, `${p.name}が最小`);
        if (iMax >= 0) why(iMax, `${p.name}が最大`);
      }
    }
    for (const p of cats) {
      for (const [v, k] of p.codes) if (k === 1) { const i = t.rows.findIndex((r) => str(r[p.index]).trim() === v); if (i >= 0) why(i, `${p.name}「${v}」は 1 回しか出ない`); }
    }
    // 空がある行（空になりがちな列は除く：空が半分を超える列は空が普通）
    for (const p of prof) {
      if (!p.blank || p.blank * 2 > p.n) continue;
      const i = t.rows.findIndex((r) => isBlank(r[p.index]));
      if (i >= 0) why(i, `${p.name}が空`);
    }
    return { typical, exceptions: [...ex.entries()].sort((a, b) => a[0] - b[0]) };
  }
  const recordMd = (t, r, i) => [`### 行 ${i + 1}`, ...t.cols.map((c, k) => (isBlank(r[k]) ? null : `${c}：${str(r[k]).replace(/\r?\n/g, " ")}`)).filter(Boolean)].join("\n");
  function sampleMd(t, prof, o) {
    const s = pickSamples(t, prof);
    const L = head(`# 代表サンプル：${t.name}`, t, o, [`全 ${fmtNum(t.rows.length)} 行のうち、典型の行 ${s.typical.length} 行と例外の行 ${s.exceptions.length} 行です。列の意味は${ref(o, "def")}、件数は${ref(o, "sum")}を見てください。行の番号は元の表の見出しを除いた順番です。空の項目は省いています。`, ""]);
    L.push("## 典型の行", "", `よく出る値を含む行を選んでいます。`, "");
    for (const i of s.typical) L.push(recordMd(t, t.rows[i], i), "");
    L.push("## 例外の行", "");
    if (!s.exceptions.length) L.push("例外にあたる行はありません。");
    for (const [i, reasons] of s.exceptions) L.push(recordMd(t, t.rows[i], i), `選んだ理由：${reasons.join("／")}`, "");
    return L.join("\n").replace(/\n+$/, "") + "\n";
  }

  // ---------- データ本体 ----------
  // o.format: "md" | "json" | "csv"、o.ext: JSON の拡張子（"json" | "txt"）、o.size: 1 ファイルの行数
  function dataFiles(t, o) {
    const fmt = (o && o.format) || "md";
    const size = Math.max(1, Math.floor((o && o.size) || 500));
    const ext = fmt === "json" ? ((o && o.ext) === "txt" ? "txt" : "json") : fmt;
    const files = [];
    const parts = Math.max(1, Math.ceil(t.rows.length / size));
    const w = Math.max(3, String(parts).length);
    for (let k = 0; k < parts; k++) {
      const from = k * size, to = Math.min(t.rows.length, from + size);
      const rows = t.rows.slice(from, to);
      let data;
      if (fmt === "json") {
        const recs = rows.map((r) => JSON.stringify(Object.fromEntries(t.cols.map((c, j) => [c, str(r[j])]))));
        data = `[\n${recs.join(",\n")}\n]\n`;
      } else if (fmt === "csv") {
        data = prepToCsv([t.cols, ...rows]) + "\r\n";
      } else {
        data = [`# ${t.name}：データ ${k + 1} / ${parts}（行 ${from + 1}〜${to}／全 ${fmtNum(t.rows.length)} 行）`, "",
          `列：${t.cols.join("、")}`, "", `1 行を 1 つの見出しにして「列名：値」で書いています。空の項目は省いています。件数・合計は${ref(o, "sum")}を使ってください。`, "",
          ...rows.map((r, j) => recordMd(t, r, from + j) + "\n")].join("\n");
      }
      files.push({ name: `${(o && o.prefix) || ""}10_データ_${String(k + 1).padStart(w, "0")}.${ext}`, data, from: from + 1, to });
    }
    return files;
  }

  // ファイル名に使える形にする（Windows で使えない文字と空白を _ に）
  const fileSafe = (s) => str(s).trim().replace(/[\\/:*?"<>|\s]+/g, "_").replace(/^[._]+|[._]+$/g, "").slice(0, 40) || "表";
  // 見出しを 1 段下げる（まとめた 1 ファイルの章にするため）
  const demote = (md) => md.replace(/^(#{1,5}) /gm, "#$1 ");

  // NotebookLM はファイルを互いに無関係なソースとして扱うので、Markdown のファイルには先頭に「1 組の案内」を入れる
  function guideMd(t, set) {
    const L = [`> **この表「${t.name}」は、次の ${set.count} 個のファイルで 1 組です。** 質問の目的に合うファイルを使ってください。`];
    for (const [name, what] of set.list) L.push(`> - ${name}：${what}`);
    L.push(">", `> 件数・合計・平均は ${set.sumName}にある表の数字で答え、データのファイルから数え直さないでください。`);
    return L.join("\n");
  }
  const withGuide = (md, guide) => md.replace(/^(# [^\n]*\n)/, (m) => `${m}\n${guide}\n`);

  // ファイル一式。o: { groupCol, format, ext, size, date, merge }
  // merge：項目定義書・集計・代表サンプルを 1 つのファイルにまとめる（ソースの数が減り、定義と集計を取り違えにくい）
  function bundle(t, o) {
    o = o || {};
    const prof = profile(t);
    const p = fileSafe(t.name) + "_";
    const data = dataFiles(t, Object.assign({}, o, { prefix: p, ref: {} })); // 名前と行の範囲を先に決める
    const dataLabel = data.length > 1 ? `${data[0].name} 〜 ${data[data.length - 1].name}` : data[0].name;
    const dataWhat = `1 行ずつのデータ（全 ${fmtNum(t.rows.length)} 行${data.length > 1 ? `を ${data.length} 個に分けたもの` : ""}）。個々の行を探すときに使う`;
    const names = o.merge
      ? { all: `${p}00_定義・集計・サンプル.md` }
      : { def: `${p}00_項目定義書.md`, sum: `${p}01_集計.md`, sample: `${p}02_代表サンプル.md` };
    const sumName = o.merge ? `${names.all} の「集計」の章` : names.sum;
    const set = {
      count: (o.merge ? 1 : 3) + data.length,
      sumName,
      list: [
        ...(o.merge
          ? [[names.all, "列の意味・型・コード値の一覧（項目定義書）、件数と合計（集計。全行から計算済み）、典型と例外の行（代表サンプル）"]]
          : [[names.def, "列の意味・型・コード値の一覧"], [names.sum, "件数と合計（全行から計算済み）"], [names.sample, "典型の行と例外の行"]]),
        [dataLabel, dataWhat],
      ],
    };
    const guide = guideMd(t, set);
    const out = [];
    if (o.merge) {
      const ref = { def: "このファイルの「項目定義書」の章", sum: "このファイルの「集計」の章", data: "データのファイル" };
      const sub = Object.assign({}, o, { bare: true, ref });
      const md = [`# 定義・集計・サンプル：${t.name}`, "", guide, "", about(t, o), "",
        demote(dictionaryMd(t, prof, sub)), demote(summaryMd(t, prof, o.groupCol, sub)), demote(sampleMd(t, prof, sub))].join("\n");
      out.push({ name: names.all, data: md.replace(/\n{3,}/g, "\n\n") });
    } else {
      const ref = { def: names.def, sum: names.sum, data: "データのファイル" };
      const sub = Object.assign({}, o, { ref });
      out.push(
        { name: names.def, data: withGuide(dictionaryMd(t, prof, sub), guide) },
        { name: names.sum, data: withGuide(summaryMd(t, prof, o.groupCol, sub), guide) },
        { name: names.sample, data: withGuide(sampleMd(t, prof, sub), guide) });
    }
    const files = dataFiles(t, Object.assign({}, o, { prefix: p, ref: { sum: sumName } }));
    for (const f of files) out.push(f.name.endsWith(".md") ? Object.assign(f, { data: withGuide(f.data, guide) }) : f);
    return out;
  }

  return { CODE_MAX, num, dateKey, fmtNum, fromRows, fromText, fromJSON, profile, dictionaryMd, summaryMd, sampleMd, pickSamples, dataFiles, bundle, fileSafe };
})();


// ---- core/convert.js ----
// 資料の変換: ファイルの形式を判定し、Markdown にする。DOM に触れない（node --test で試す）。
// Excel・CSV・JSON・Word（.docx）・PowerPoint（.pptx）・HTML・md・txt。PDF と画像は gemini-convert.js（Gemini に任せる）。
// 決まりは .claude/specs/workbench-p6b/design.md（「レビューを受けて決めたこと」が正）。


const CONVERT_MAX_BYTES = 30 * 1024 * 1024;
const CONVERT_METHOD = '案件ワークベンチ（ブラウザの中で変換）';

const head4 = (b, arr) => arr.every((x, i) => b[i] === x);
const extOf = (name) => { const m = /\.([^.]+)$/.exec(String(name)); return m ? m[1].toLowerCase() : ''; };
const baseName = (name) => String(name).replace(/\.[^.]+$/, '');

// ---- 文字として読む（BOM を見る。無ければ UTF-8 → Shift_JIS） ----
function decodeText(bytes) {
  if (bytes.length >= 3 && head4(bytes, [0xef, 0xbb, 0xbf])) return { text: new TextDecoder('utf-8').decode(bytes.subarray(3)), encoding: 'utf-8' };
  if (bytes.length >= 2 && head4(bytes, [0xff, 0xfe])) return { text: new TextDecoder('utf-16le').decode(bytes.subarray(2)), encoding: 'utf-16le' };
  if (bytes.length >= 2 && head4(bytes, [0xfe, 0xff])) return { text: new TextDecoder('utf-16be').decode(bytes.subarray(2)), encoding: 'utf-16be' };
  return decodeBytes(bytes);
}

// 区切りの表として読めるか（空でない先頭 20 行のうち 2 行以上、区切りを含む行が 8 割以上、区切りの数が同じ行が 8 割以上）
function delimiterOf(text) {
  const lines = String(text).split(/\r?\n/).filter((l) => l.trim() !== '').slice(0, 20);
  if (lines.length < 2) return null;
  for (const d of ['\t', ',']) {
    const counts = lines.map((l) => l.split(d).length - 1);
    const withD = counts.filter((c) => c > 0);
    if (withD.length < lines.length * 0.8) continue;
    const freq = new Map();
    for (const c of withD) freq.set(c, (freq.get(c) || 0) + 1);
    const top = Math.max(...freq.values());
    if (top >= lines.length * 0.8) return d;
  }
  return null;
}

// 形式の判定。上から順に当てはめる。戻り値 { kind, text?, delim?, reason? }。kind が 'reject' なら reason を出して断る
async function detectKind(name, bytes) {
  const ext = extOf(name);
  if (bytes.length > CONVERT_MAX_BYTES) return { kind: 'reject', reason: '30MB を超えるファイルは読めません' };
  if (bytes.length >= 4 && head4(bytes, [0xd0, 0xcf, 0x11, 0xe0])) {
    return { kind: 'reject', reason: '古い形式（.xls・.doc・.ppt）か、パスワード・秘密度ラベルで暗号化されたファイルです。古い形式なら新しい形式で保存し直してください。暗号化されたものは、暗号化を外せる場合だけ読めます' };
  }
  if (bytes.length >= 4 && head4(bytes, [0x50, 0x4b, 0x03, 0x04])) {
    let zip;
    try { zip = zipEntries(bytes); } catch (e) { return { kind: 'reject', reason: String(e.message || e) }; }
    if (zip.has('xl/workbook.xml')) return { kind: 'xlsx' };
    if (zip.has('word/document.xml')) return { kind: 'docx', zip };
    if (zip.has('ppt/presentation.xml')) return { kind: 'pptx', zip };
    return { kind: 'reject', reason: '対応していない zip 形式です（.xlsb・.vsdx・ただの zip など）' };
  }
  if (bytes.length >= 5 && head4(bytes, [0x25, 0x50, 0x44, 0x46, 0x2d])) return { kind: 'pdf' };
  if (head4(bytes, [0x89, 0x50, 0x4e, 0x47]) || head4(bytes, [0xff, 0xd8, 0xff]) || head4(bytes, [0x47, 0x49, 0x46, 0x38]) || head4(bytes, [0x42, 0x4d])
    || (head4(bytes, [0x52, 0x49, 0x46, 0x46]) && bytes.length >= 12 && head4(bytes.subarray(8), [0x57, 0x45, 0x42, 0x50]))) return { kind: 'image' };
  if (ext === 'mht' || ext === 'mhtml') return { kind: 'reject', reason: 'Web ページ（単一ファイル）形式は読めません。HTML で保存し直してください' };
  const { text } = decodeText(bytes);
  const lead = text.replace(/^\s+/, '').slice(0, 20).toLowerCase();
  if (lead.startsWith('<!doctype html') || lead.startsWith('<html') || ext === 'html' || ext === 'htm') return { kind: 'html', text };
  if (ext === 'json' || lead.startsWith('[') || lead.startsWith('{')) {
    try { safeParse(text.replace(/^﻿/, '')); return { kind: 'json', text }; } catch (e) {
      if (ext === 'json') return { kind: 'reject', reason: 'JSON として読めません' };
    }
  }
  const delim = delimiterOf(text);
  if (delim) return { kind: delim === '\t' ? 'tsv' : 'csv', text, delim };
  return { kind: 'text', text };
}

// ---- Markdown の部品 ----
const mdCellText = (v) => String(v == null ? '' : v).replace(/\r?\n/g, '<br>').replace(/\|/g, '\\|').trim();
// rows: 2 次元の配列（1 行目が見出し）。行の長さは最長の行にそろえる
function mdTable(rows) {
  if (!rows.length) return '';
  const w = Math.max(1, ...rows.map((r) => r.length));
  const pad = (r) => Array.from({ length: w }, (_, i) => mdCellText(r[i]));
  const [h, ...body] = rows;
  return [`| ${pad(h).join(' | ')} |`, `|${Array(w).fill('---').join('|')}|`, ...body.map((r) => `| ${pad(r).join(' | ')} |`)].join('\n');
}
const tidy = (lines) => lines.join('\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
function mdHeader(name, today, method, counts) {
  return `<!-- 出典: ${name} / 変換: ${today} / 方式: ${method} / ${counts} -->\n# ${baseName(name)}\n\n`;
}

// ---- 小さな XML の木（Office の XML 用。名前空間の接頭辞はそのまま名前に残す） ----
function parseXml(xml) {
  const root = { name: '#root', attrs: Object.create(null), children: [] };
  const stack = [root];
  const re = /<!\[CDATA\[([\s\S]*?)\]\]>|<!--[\s\S]*?-->|<\?[\s\S]*?\?>|<!DOCTYPE[^>]*>|<\/([\w:.-]+)\s*>|<([\w:.-]+)((?:\s+[\w:.-]+\s*=\s*(?:"[^"]*"|'[^']*'))*)\s*(\/?)>|([^<]+)/g;
  for (const m of String(xml).matchAll(re)) {
    const top = stack[stack.length - 1];
    if (m[1] !== undefined) top.children.push(m[1]);
    else if (m[2]) { if (stack.length > 1) stack.pop(); }
    else if (m[3]) {
      const el = { name: m[3], attrs: xmlAttrs(String(m[4] || '').replace(/'([^']*)'/g, '"$1"')), children: [] };
      top.children.push(el);
      if (!m[5]) stack.push(el);
    } else if (m[6] !== undefined) top.children.push(xmlUnescape(m[6]));
  }
  return root;
}
const kids = (n, name) => (n ? n.children.filter((c) => typeof c !== 'string' && (!name || c.name === name)) : []);
const kid = (n, name) => kids(n, name)[0] || null;
function find(n, name) {
  if (!n || typeof n === 'string') return null;
  for (const c of n.children) {
    if (typeof c === 'string') continue;
    if (c.name === name) return c;
    const f = find(c, name);
    if (f) return f;
  }
  return null;
}
const attr = (n, a) => (n && n.attrs[a] !== undefined ? n.attrs[a] : null);

// ======== Excel・CSV・JSON ========
async function xlsxToMd(bytes) {
  const sheets = await XLSX.sheets(bytes);
  const out = [];
  let rows = 0;
  for (const s of sheets) {
    out.push(`## ${s.name}`, '');
    out.push(s.rows.length ? mdTable(s.rows) : '（空のシート）', '');
    rows += Math.max(0, s.rows.length - 1);
  }

// ======== Word（.docx） ========
const ORDERED_FMT = new Set(['decimal', 'decimalZero', 'decimalFullWidth', 'decimalHalfWidth', 'decimalEnclosedCircle', 'decimalEnclosedParen', 'decimalEnclosedFullstop',

    const pPr = kid(s, 'w:pPr');
    const numPr = kid(pPr, 'w:numPr');

      name: attr(kid(s, 'w:name'), 'w:val') || '',

      numId: numPr ? attr(kid(numPr, 'w:numId'), 'w:val') : null,

function docxNumbering(xml) {

// 見出しの段（1〜6）か null。スタイル名 → basedOn をたどる → outlineLvl（段落、無ければスタイル）
function docxHeading(pPr, styles) {

    return /^(title|タイトル)$/i.test(String(name).trim()) ? 1 : null;
  };

    const n = byName(st.name) || byName(id);
    if (n) return n;
    id = st.basedOn;
  }

function docxNumPr(pPr, styles) {

// 段落の文字。テキストボックスの段落は boxes に集める。mc:Fallback は捨てる

    if (typeof c === 'string') continue;
    switch (c.name) {
      case 'w:t': s += c.children.filter((x) => typeof x === 'string').join(''); break;
      case 'w:tab': s += ' '; break;
      case 'w:br': case 'w:cr': s += '\n'; break;
      case 'w:txbxContent': boxes.push(...kids(c).filter((x) => x.name === 'w:p' || x.name === 'w:tbl')); break;
      case 'mc:Fallback': case 'w:instrText': case 'w:delText': case 'w:pPr': case 'w:rPr': break;
      case 'w:drawing': case 'w:pict': {

      const tcPr = kid(tc, 'w:tcPr');
      const vm = kid(tcPr, 'w:vMerge');

      const span = +(attr(kid(tcPr, 'w:gridSpan'), 'w:val') || 1);

}
async function docxToMd(zip) {
  const ctx = {

    nums: docxNumbering(await zipText(zip, 'word/numbering.xml')),

  const out = [];

  const endList = () => { if (inList) { out.push(''); inList = false; } };
  const para = (p) => {
    const pPr = kid(p, 'w:pPr');
    const boxes = [];
    const text = docxRunText(p, ctx, boxes).replace(/\n/g, '  \n').trim();
    if (text) {
      paras++;
      const hl = docxHeading(pPr, ctx.styles);
      const np = hl ? null : docxNumPr(pPr, ctx.styles);
      if (hl) { endList(); out.push(`${'#'.repeat(Math.min(6, hl + 1))} ${text}`, ''); headings++; }

    }

  };

    if (n.name === 'w:p') para(n);
    else if (n.name === 'w:tbl') { endList(); out.push(mdTable(docxTableRows(n, ctx)), ''); tables++; }
    else if (n.name === 'w:sdt') for (const c of kids(kid(n, 'w:sdtContent'))) block(c);

// ======== PowerPoint（.pptx） ========
const aParaText = (p) => {
  let s = '';
  const walk = (n) => {
    for (const c of n.children) {
      if (typeof c === 'string') continue;
      if (c.name === 'a:t') s += c.children.filter((x) => typeof x === 'string').join('');
      else if (c.name === 'a:br') s += ' ';
      else if (c.name !== 'a:pPr' && c.name !== 'a:rPr' && c.name !== 'a:endParaRPr') walk(c);
    }
  };
  walk(p);
  return s.trim();
};
const phType = (sp) => { const ph = find(kid(sp, 'p:nvSpPr'), 'p:ph'); return ph ? (attr(ph, 'type') || 'body') : null; };
function pptTableRows(tbl) {
  const rows = [];
  for (const tr of kids(tbl, 'a:tr')) {
    const row = [];
    for (const tc of kids(tr, 'a:tc')) {
      const merged = attr(tc, 'hMerge') === '1' || attr(tc, 'vMerge') === '1';
      row.push(merged ? '' : kids(kid(tc, 'a:txBody'), 'a:p').map(aParaText).filter((x) => x).join('<br>'));
    }
    rows.push(row);
  }
  return rows;
}
// 図形の木をたどって、タイトル・本文の行・表を集める
function pptShapes(tree, acc) {
  for (const n of kids(tree)) {
    if (n.name === 'p:sp') {
      const t = phType(n);
      const paras = kids(kid(n, 'p:txBody'), 'a:p');
      if (t === 'title' || t === 'ctrTitle') { const s = paras.map(aParaText).filter((x) => x).join(' '); if (s && !acc.title) acc.title = s; continue; }
      for (const p of paras) {
        const s = aParaText(p);
        if (!s) continue;
        const lvl = +(attr(kid(p, 'a:pPr'), 'lvl') || 0);
        acc.lines.push(`${'  '.repeat(lvl)}- ${s}`);
      }
    } else if (n.name === 'p:grpSp') pptShapes(n, acc);
    else if (n.name === 'p:graphicFrame') {
      const tbl = find(n, 'a:tbl');
      if (tbl) { acc.blocks.push(mdTable(pptTableRows(tbl))); acc.tables++; } else acc.lines.push('- [図]');
    } else if (n.name === 'p:pic') acc.lines.push('- [図]');
    else if (n.name === 'mc:AlternateContent') pptShapes(kid(n, 'mc:Choice') || { children: [] }, acc);
  }
}
async function pptxToMd(zip) {
  const pres = parseXml(await zipText(zip, 'ppt/presentation.xml'));
  const rels = relsMap(await zipText(zip, 'ppt/_rels/presentation.xml.rels'));
  const ids = kids(find(pres, 'p:sldIdLst'), 'p:sldId');
  const out = [];
  let hidden = 0, tables = 0, n = 0;
  for (const sid of ids) {
    const r = rels.get(attr(sid, 'r:id'));
    if (!r) continue;
    const part = resolvePart('ppt/presentation.xml', r.target);
    const xml = await zipText(zip, part);
    if (xml === null) continue;
    n++;
    const sld = find(parseXml(xml), 'p:sld');
    const isHidden = attr(sld, 'show') === '0';
    if (isHidden) hidden++;
    const acc = { title: '', lines: [], blocks: [], tables: 0 };
    pptShapes(find(sld, 'p:spTree'), acc);
    tables += acc.tables;
    out.push(`## スライド ${n}: ${acc.title || '（タイトルなし）'}${isHidden ? '（非表示）' : ''}`, '');
    if (acc.lines.length) out.push(...acc.lines, '');
    for (const b of acc.blocks) out.push(b, '');
    // ノート: スライドの rels から notesSlide を引き、placeholder が body の図形だけ読む
    const srels = relsMap(await zipText(zip, relsPathOf(part)));
    for (const x of srels.values()) {
      if (!/\/notesSlide$/.test(x.type)) continue;
      const nxml = await zipText(zip, resolvePart(part, x.target));
      if (nxml === null) continue;
      const notes = [];
      for (const sp of kids(find(parseXml(nxml), 'p:spTree'), 'p:sp')) {
        if (phType(sp) !== 'body') continue;
        for (const p of kids(kid(sp, 'p:txBody'), 'a:p')) { const s = aParaText(p); if (s) notes.push(s); }
      }
      if (notes.length) out.push(`> ノート: ${notes[0]}`, ...notes.slice(1).map((s) => `> ${s}`), '');
    }
  }
  return { body: tidy(out), counts: `スライド ${n}（うち非表示 ${hidden}）・表 ${tables}` };
}

// ======== HTML ========
const HTML_ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ', copy: '©', reg: '®', trade: '™', hellip: '…', mdash: '—', ndash: '–', laquo: '«', raquo: '»', yen: '¥', times: '×', divide: '÷', middot: '·', bull: '•' };
const htmlUnescape = (s) => String(s).replace(/&(#x[0-9a-fA-F]+|#\d+|[a-zA-Z]+);/g, (m, k) => {
  if (k[0] === '#') { const cp = k[1] === 'x' || k[1] === 'X' ? parseInt(k.slice(2), 16) : +k.slice(1); return Number.isFinite(cp) && cp > 0 && cp <= 0x10ffff ? String.fromCodePoint(cp) : m; }
  return Object.prototype.hasOwnProperty.call(HTML_ENT, k) ? HTML_ENT[k] : m;

const HTML_SKIP = new Set(['script', 'style', 'head', 'noscript', 'template']);
const HTML_BLOCK = new Set(['p', 'div', 'section', 'article', 'header', 'footer', 'main', 'aside', 'nav', 'blockquote', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'ul', 'ol', 'table', 'pre', 'hr', 'form', 'dl', 'dt', 'dd', 'figure', 'address']);

function htmlAttrs(s) {
  const o = Object.create(null);
  for (const m of String(s).matchAll(/([\w:-]+)\s*(?:=\s*("([^"]*)"|'([^']*)'|([^\s>]+)))?/g)) o[m[1].toLowerCase()] = htmlUnescape(m[3] ?? m[4] ?? m[5] ?? '');

}
function htmlToMd(html) {
  const out = [];

  let liOpen = false;
  let pOpen = false;
  let heading = 0;
  const tstack = [];     // 表: { rows, row, cell, pending, inCell }
  const links = [];      // { href, at }
  const curTable = () => tstack[tstack.length - 1] || null;
  const inCell = () => { const t = curTable(); return !!(t && t.cell !== null); };
  const text = (s) => {
    const t = s.replace(/\s+/g, ' ');
    if (inCell()) curTable().cell.text += t; else buf += t;
  };
  const brk = () => { if (inCell()) curTable().cell.text += '<br>'; else buf += '\n'; };
  const flush = () => {
    const s = buf.split('\n').map((x) => x.trim()).filter((x) => x).join('  \n');
    buf = '';
    if (!s) return;
    if (heading) { out.push(`${'#'.repeat(Math.min(6, heading + 1))} ${s}`, ''); headings++; }
    else if (liOpen && lists.length) { const l = lists[lists.length - 1]; out.push(`${'  '.repeat(lists.length - 1)}${l.ordered ? '1.' : '-'} ${s}`); }
    else out.push(s, '');
  };
  const closeCell = () => {
    const t = curTable();
    if (!t || t.cell === null) return;
    const c = t.cell;
    t.cell = null;
    if (!t.row) t.row = [];
    while ((t.pending[t.row.length] || 0) > 0) { t.pending[t.row.length]--; t.row.push(''); }
    const at = t.row.length;
    t.row.push(c.text.replace(/(\s*<br>\s*)+/g, '<br>').replace(/(<br>)+$/g, '').replace(/^(<br>)+/, '').replace(/\s+/g, ' ').trim());
    for (let i = 1; i < c.colspan; i++) t.row.push('');
    if (c.rowspan > 1) for (let i = 0; i < c.colspan; i++) t.pending[at + i] = c.rowspan - 1;
  };
  const closeRow = () => {
    const t = curTable();
    if (!t) return;
    closeCell();
    if (t.row) {
      for (let i = t.row.length; i < t.pending.length; i++) if ((t.pending[i] || 0) > 0) { t.pending[i]--; t.row[i] = ''; }
      t.rows.push(Array.from(t.row, (x) => x ?? ''));

    if (m[1]) {

      if (inCell() && tag !== 'td' && tag !== 'th' && tag !== 'tr' && tag !== 'table' && HTML_BLOCK.has(tag)) { brk(); continue; }

      else if (tag === 'li') closeLi();
      else if (tag === 'ul' || tag === 'ol') { closeLi(); lists.pop(); liOpen = false; if (!lists.length) out.push(''); }
      else if (tag === 'td' || tag === 'th') closeCell();

          const label = src.slice(l.at).trim();

            const md = `[${label}](${l.href})`;

    }

    const a = htmlAttrs(m[3] || '');
    if (HTML_SKIP.has(tag) && !m[4]) {
      const close = new RegExp(`</\\s*${tag}\\s*>`, 'ig');
