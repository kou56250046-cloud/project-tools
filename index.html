  root.appendChild(section('この項目を参照している項目',
    back.length
      ? h('ul', { class: 'ref-list' }, back.map((b) => {
        const t = store.item(b.from);
        return h('li', null, idButton(b.from, app), h('span', { class: 'badge', text: refFieldLabel(b.field, t && t.kind) + (b.label ? '：' + b.label : '') }),
          h('span', { text: t ? t.title : '台帳にありません' }));
      }))
      : h('p', { class: 'muted', text: 'なし' })));
}


// ---- ui/chart.js ----
// 描画部品: 日付軸の折れ線（S カーブ）とガント。実行時に SVG を組む（style 属性・外部参照を使わない）


function textW(str, size) {
  let w = 0;
  for (const ch of String(str)) w += ch.charCodeAt(0) > 0xff ? size : size * 0.56;
  return w;
}
function clip(str, maxW, size) {
  if (textW(str, size) <= maxW) return str;
  let out = '';
  for (const ch of String(str)) { if (textW(out + ch + '…', size) > maxW) break; out += ch; }
  return out + '…';
}

// 日付の目盛り。週なら月曜、月なら 1 日
function ticks(d0, d1, unit) {
  const out = [];
  if (unit === 'week') {
    let d = d0 - ((d0 + 3) % 7 + 7) % 7;
    for (; d <= d1; d += 7) if (d >= d0) out.push(d);
  } else {
    const a = new Date(d0 * 86400000);
    let y = a.getUTCFullYear();
    let m = a.getUTCMonth();
    for (;;) {
      const d = Date.UTC(y, m, 1) / 86400000;
      if (d > d1) break;
      if (d >= d0) out.push(d);
      m++; if (m > 11) { m = 0; y++; }
    }
  }
  return out;
}

const md = (d) => { const x = dayToYmd(d); return `${Number(x.slice(5, 7))}/${Number(x.slice(8, 10))}`; };

// 折れ線。series: [{ key, label, points: [{ date, value | null }] }]
function lineChart({ series, width = 760, height = 300, today, unit = 'week', ariaLabel = '折れ線グラフ' }) {
  const pad = { l: 48, r: 96, t: 16, b: 32 };
  const all = series.flatMap((sr) => sr.points.filter((p) => p.value !== null && p.value !== undefined));
  const svg = s('svg', { class: 'chart line-chart', width, height, viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': ariaLabel });
  if (!all.length) return svg;
  const days = series.flatMap((sr) => sr.points.map((p) => dayNumber(p.date)));
  const d0 = Math.min(...days);
  const d1 = Math.max(...days);
  const vmax = Math.max(1, ...all.map((p) => p.value)) * 1.08;
  const x = (d) => pad.l + (d1 === d0 ? 0 : (d - d0) / (d1 - d0)) * (width - pad.l - pad.r);
  const y = (v) => height - pad.b - (v / vmax) * (height - pad.t - pad.b);

  // 目盛り（縦は 5 本、横は週か月）
  for (let i = 0; i <= 4; i++) {
    const v = (vmax / 1.08) * i / 4;
    svg.appendChild(s('line', { class: 'grid', x1: pad.l, x2: width - pad.r, y1: y(v), y2: y(v) }));
    svg.appendChild(s('text', { class: 'axis', x: pad.l - 6, y: y(v) + 4, 'text-anchor': 'end' }, String(Math.round(v))));
  }
  const tk = ticks(d0, d1, (d1 - d0) > 120 ? 'month' : unit);
  const step = Math.max(1, Math.ceil(tk.length / 10));
  tk.forEach((d, i) => { if (i % step === 0) svg.appendChild(s('text', { class: 'axis', x: x(d), y: height - pad.b + 18, 'text-anchor': 'middle' }, md(d))); });
  svg.appendChild(s('line', { class: 'axis-line', x1: pad.l, x2: width - pad.r, y1: height - pad.b, y2: height - pad.b }));
  if (today) {
    const td = dayNumber(today);
    if (td >= d0 && td <= d1) {
      svg.appendChild(s('line', { class: 'today', x1: x(td), x2: x(td), y1: pad.t, y2: height - pad.b }));
      svg.appendChild(s('text', { class: 'today-label', x: x(td) + 4, y: pad.t + 10 }, '今日'));
    }
  }
  // 系列（線の端に名前を置く。色だけに頼らず線の形も変える）
  const used = [];
  for (const sr of series) {
    const pts = sr.points.filter((p) => p.value !== null && p.value !== undefined);
    if (!pts.length) continue;
    const dAttr = pts.map((p, i) => `${i ? 'L' : 'M'}${x(dayNumber(p.date)).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
    svg.appendChild(s('path', { class: `series s-${sr.key}`, d: dAttr }, s('title', null, sr.label)));
    for (const p of pts) svg.appendChild(s('circle', { class: `pt s-${sr.key}`, cx: x(dayNumber(p.date)), cy: y(p.value), r: 2.5 }, s('title', null, `${sr.label} ${p.date}: ${p.value}`)));
    const last = pts[pts.length - 1];
    let ly = y(last.value) + 4;
    while (used.some((u) => Math.abs(u - ly) < 13)) ly += 13;
    used.push(ly);
    svg.appendChild(s('text', { class: `end-label s-${sr.key}`, x: x(dayNumber(last.date)) + 6, y: ly }, `${sr.label} ${last.value}`));
  }
  return svg;
}

// ガント。rows: [{ id, label, depth, start, end, progress, milestone, leaf, delayed, dependsOn }]
function ganttChart({ rows, unit = 'week', today, onSelect, selectedId }) {
  const ROW = 26;
  const LABEL = 280;
  const pxDay = unit === 'week' ? 14 : 3.2;
  const dated = rows.filter((r) => r.start && r.end);
  const svg = s('svg', { class: 'chart gantt', role: 'img', 'aria-label': 'ガントチャート' });
  if (!dated.length) { svg.setAttribute('width', 400); svg.setAttribute('height', 40); return svg; }
  const td = today ? dayNumber(today) : null;
  let d0 = Math.min(...dated.map((r) => dayNumber(r.start)));
  let d1 = Math.max(...dated.map((r) => dayNumber(r.end)));
  if (td !== null) { d0 = Math.min(d0, td); d1 = Math.max(d1, td); }
  d0 -= 3; d1 += 7;
  const top = 34;
  // 作業名は左に固定した別の SVG に描く（横に送っても名前が見えるように）
  const width = (d1 - d0 + 1) * pxDay + 20;
  const height = top + rows.length * ROW + 10;
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  const labels = s('svg', { class: 'chart gantt gantt-labels', width: LABEL, height, viewBox: `0 0 ${LABEL} ${height}`, 'aria-hidden': 'true' },
    s('rect', { class: 'label-bg', x: 0, y: 0, width: LABEL, height }));
  const x = (d) => (d - d0) * pxDay;

  svg.appendChild(s('defs', null, s('marker', { id: 'gt-arrow', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse' }, s('path', { d: 'M0,0 L10,5 L0,10 z', class: 'dep-head' }))));
  // 目盛り
  const tk = ticks(d0, d1, unit);
  for (const d of tk) {
    svg.appendChild(s('line', { class: 'grid', x1: x(d), x2: x(d), y1: top - 6, y2: height }));
    svg.appendChild(s('text', { class: 'axis', x: x(d) + 2, y: top - 12 }, unit === 'week' ? md(d) : dayToYmd(d).slice(0, 7)));
  }
  // 行
  const rowY = new Map();
  rows.forEach((r, i) => {
    const yy = top + i * ROW;
    rowY.set(r.id, yy);
    const g = s('g', {
      class: ['grow', r.delayed && 'delayed', r.id === selectedId && 'selected', !r.leaf && 'summary'].filter(Boolean).join(' '),
      'data-id': r.id, tabindex: '0', role: 'button', 'aria-label': `${r.label}${r.delayed ? '（遅れ）' : ''}`,
      onclick: () => onSelect && onSelect(r.id),
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (onSelect) onSelect(r.id); } },
    });
    g.appendChild(s('rect', { class: 'row-bg', x: 0, y: yy, width, height: ROW }));
    labels.appendChild(s('g', {
      class: ['grow', r.delayed && 'delayed', r.id === selectedId && 'selected', !r.leaf && 'summary'].filter(Boolean).join(' '),
      onclick: () => onSelect && onSelect(r.id),
    },
    s('rect', { class: 'row-bg', x: 0, y: yy, width: LABEL, height: ROW }),
    s('text', { class: 'row-label', x: 8 + r.depth * 14, y: yy + 17 }, clip(r.label, LABEL - 16 - r.depth * 14, 12.5)),
    s('title', null, `${r.id} ${r.label}`)));
    if (r.start && r.end) {
      const xs = x(dayNumber(r.start));
      const xe = x(dayNumber(r.end) + 1);
      if (r.milestone) {
        const cx = x(dayNumber(r.start)) + pxDay / 2;
        const cy = yy + ROW / 2;
        g.appendChild(s('path', { class: 'milestone', d: `M${cx},${cy - 7} L${cx + 7},${cy} L${cx},${cy + 7} L${cx - 7},${cy} z` }));
        g.appendChild(s('text', { class: 'bar-note', x: cx + 10, y: cy + 4 }, r.start));
      } else if (!r.leaf) {
        g.appendChild(s('rect', { class: 'bar-summary', x: xs, y: yy + 9, width: Math.max(2, xe - xs), height: 8 }));
      } else {
        g.appendChild(s('rect', { class: 'bar', x: xs, y: yy + 6, width: Math.max(2, xe - xs), height: 14, rx: 3 }));
        const pw = Math.max(0, (xe - xs) * Math.min(100, r.progress || 0) / 100);
        if (pw > 0) g.appendChild(s('rect', { class: 'bar-progress', x: xs, y: yy + 6, width: pw, height: 14, rx: 3 }));
        g.appendChild(s('text', { class: 'bar-note', x: xe + 4, y: yy + 17 }, `${r.progress || 0}%${r.delayed ? '　遅れ' : ''}`));
      }
    }
    g.appendChild(s('title', null, `${r.id} ${r.label}${r.start ? `\n${r.start}〜${r.end}` : ''}${r.leaf && !r.milestone ? `\n進捗 ${r.progress || 0}%` : ''}${r.delayed ? '\n予定より遅れています' : ''}`));
    svg.appendChild(g);
  });
  // 前の作業からの矢印（終了 → 開始）
  const byId = new Map(rows.map((r) => [r.id, r]));
  for (const r of rows) {
    for (const p of r.dependsOn || []) {
      const a = byId.get(p);
      if (!a || !a.end || !r.start) continue;
      const x1 = a.milestone ? x(dayNumber(a.start)) + pxDay / 2 + 7 : x(dayNumber(a.end) + 1);
      const y1 = rowY.get(a.id) + ROW / 2;
      const x2 = r.milestone ? x(dayNumber(r.start)) + pxDay / 2 - 7 : x(dayNumber(r.start));
      const y2 = rowY.get(r.id) + ROW / 2;
      const mx = Math.max(x1 + 6, Math.min(x2 - 6, x1 + 12));
      svg.appendChild(s('path', { class: 'dep', d: `M${x1},${y1} H${mx} V${y2} H${x2}`, 'marker-end': 'url(#gt-arrow)' }));
    }
  }
  if (td !== null) {
    svg.appendChild(s('line', { class: 'today', x1: x(td) + pxDay / 2, x2: x(td) + pxDay / 2, y1: top - 6, y2: height }));
    svg.appendChild(s('text', { class: 'today-label', x: x(td) + pxDay / 2 + 3, y: top - 22 }, '今日'));
  }
  return h('div', { class: 'gantt-split', 'data-today-x': td === null ? '' : String(Math.round(x(td))) }, labels, svg);
}


// ---- ui/views/overview.js ----
// 概要（ダッシュボード）: 案件情報・始め方・指標カード 4 枚・グラフ（要件の状態・ボール・S カーブ・確度・期限）・次にやること・種別ごとの件数
// 集計は core/dashboard.js、描画は dashboard スキルの部品（src/vendor/dash.js の window.Dash。gemini-kit と同じ）


const EMPTY = 'まだありません';
const NO_COMPARE = [{ label: '比べる値なし', delta: 0, better: 'none' }];

// グラフを置く入れ物。描く前に文書に入れておく（dash.js は幅を測って描く）
function slot(parent, id) {
  const el = h('section', { class: 'card dash-card', id });
  parent.appendChild(el);
  return el;
}

// 合計が 0 のグラフは分類を空にして、dash.js の空の表示（まだありません）を出す
const barSpec = (chart, spec) => (seriesTotal(chart) ? { ...spec, categories: chart.categories, series: chart.series } : { ...spec, categories: [], series: chart.series });

function renderDashboard(root, app, ledger) {
  const Dash = window.Dash;
  if (!Dash) return;
  const today = todayStr();
  const hide = store.presentation;
  const d = dashboardData(store.ledger, { today, presentation: hide });
  const meta = { asOf: today, source: `台帳 rev ${ledger.revision}`, empty: EMPTY };
  const k = d.kpi;

  // ---- KPI ----
  const kpis = h('div', { class: 'dash-kpis', id: 'dash-kpis' });
  root.appendChild(kpis);
  const kpi = (id, spec, open) => {
    const wrap = h('div', { class: 'dash-kpi' });
    kpis.appendChild(wrap);
    const host = slot(wrap, id);
    Dash.kpi(host, { ...meta, ...spec });
    wrap.appendChild(h('button', { class: 'btn small dash-open', type: 'button', 'data-fk': 'open-' + id, onclick: open.go }, open.label));
  };
  if (!hide) {
    kpi('k-wait', {
      title: '顧客待ち', value: k.customerWait.count, unit: '件',
      compare: [{ label: '目標 0 件との差', delta: k.customerWait.count, unit: '件', better: 'down' }],
      note: k.customerWait.count ? (k.customerWait.maxDays !== null ? `いちばん長い待ち ${k.customerWait.maxDays} 日` : null) : '顧客の返事を待っている課題・質問はありません',
    }, { label: '課題と質問を開く', go: () => app.go('issues') });
    const bk = k.overdue.byKind;
    kpi('k-overdue', {
      title: '期限切れ', value: k.overdue.count, unit: '件',
      compare: [{ label: '目標 0 件との差', delta: k.overdue.count, unit: '件', better: 'down' }],
      note: k.overdue.count ? Object.entries(bk).filter(([, n]) => n).map(([kd, n]) => `${kindLabel(kd)} ${n}`).join('・') : '期限を過ぎたものはありません',
    }, { label: '健康診断を開く', go: () => app.go('health') });
  }
  const a = k.agreement;
  const pct = (r) => Math.round(r * 1000) / 10;
  kpi('k-agree', a.rate === null
    ? { title: '要件の合意率', value: null, unit: '%', compare: NO_COMPARE, note: '合意の対象の要件がまだありません' }
    : {
      title: '要件の合意率', value: pct(a.rate), unit: '%', digits: 1,
      compare: a.baselineRate !== null
        ? [{ label: 'ベースラインから', delta: pct(a.rate) - pct(a.baselineRate), unit: 'pt', digits: 1, better: 'up' }]
        : [{ label: '目標 100% との差', delta: pct(a.rate) - 100, unit: 'pt', digits: 1, better: 'up' }],
      note: `合意 ${a.agreed} / ${a.total} 件（取り下げを除く）`,
    }, { label: '要件の一覧を開く', go: () => app.go('list', { filter: { kind: 'requirement' } }) });
  const sp = k.spi;
  const spiNote = !sp.hasTasks ? 'WBS を作ると出ます' : !sp.hasTargets ? '見積・開始日・終了日を入れると出ます' : sp.value === null ? '計画の開始日を過ぎると出ます' : 'EV ÷ PV。1 未満は遅れ';
  kpi('k-spi', sp.value === null
    ? { title: 'SPI（スケジュール効率）', value: null, compare: NO_COMPARE, note: spiNote }
    : { title: 'SPI（スケジュール効率）', value: sp.value, digits: 2, compare: [{ label: '基準 1.00 との差', delta: Math.round((sp.value - 1) * 100) / 100, digits: 2, better: 'up' }], note: spiNote },
  { label: '進捗を開く', go: () => app.go('progress') });

  // ---- 要件の状態 ／ ボールの状況 ----
  const row1 = h('div', { class: 'dash-grid' });
  root.appendChild(row1);
  Dash.bar(slot(row1, 'g-req'), barSpec(d.requirements, { ...meta, title: '要件の状態（分類ごと）', unit: '件', mode: 'stack', orientation: 'h', sort: 'none', sub: '案の多い順' }));
  if (!hide) Dash.bar(slot(row1, 'g-ball'), barSpec(d.ball, { ...meta, title: 'ボールの状況（誰の対応待ちか × 待ち日数）', unit: '件', mode: 'stack', orientation: 'h', sort: 'none', sub: `区切りは設定の「顧客待ちを知らせる日数」（${d.ballWaitDays} 日）` }));

  // ---- 進捗の S カーブ（EVM の対象の作業があるときだけ） ----
  if (d.curve) {
    const series = [
      { name: 'PV 計画', values: d.curve.map((p) => p.pv), role: 'reference' },
      { name: 'EV 出来高', values: d.curve.map((p) => p.ev), focus: true },
    ];
    if (!hide) series.push({ name: 'AC 実績', values: d.curve.map((p) => p.ac) });
    Dash.line(slot(root, 'g-curve'), { ...meta, title: '進捗の S カーブ（週ごと・人日の累計）', unit: '人日', x: d.curve.map((p) => p.date), series });
  }

  // ---- 確度の内訳 ／ 期限の分布 ----
  const row2 = h('div', { class: 'dash-grid' });
  root.appendChild(row2);
  if (!hide) Dash.bar(slot(row2, 'g-conf'), barSpec(d.confidence, { ...meta, title: '確度の内訳（要望・要件・制約）', unit: '件', mode: 'stack', orientation: 'h', sort: 'none', sub: '取り下げ・不採用・解消を除く' }));
  Dash.bar(slot(row2, 'g-due'), barSpec(d.due, { ...meta, title: '期限の分布（未完了）', unit: '件', mode: 'stack', orientation: 'v', sort: 'none', sub: '週は月曜始まり。健康診断の期限切れと同じ対象' }));
}

function renderOverview(root, app) {
  const ledger = store.view();
  const p = ledger.project;

  const kv = h('dl', { class: 'kv wide' });
  const row = (k, v) => { if (v) { kv.appendChild(h('dt', { text: k })); kv.appendChild(h('dd', { class: 'body-text', text: v })); } };
  row('顧客', p.customer);
  row('目的', p.purpose);

  root.appendChild(h('section', { class: 'card stack' },

    goals ? h('div', null, h('h3', { text: 'ゴール' }), goals) : null));

        h('li', { text: 'Gemini の返答を「取込」に貼って確認し、適用する' }),

  renderDashboard(root, app, ledger);

  // 次にやること（説明用の表示では出さない）

      h('span', { class: 'spacer' }),
      findings.length > 5 ? h('button', { class: 'btn small', type: 'button', onclick: () => app.go('health') }, `健康診断をすべて見る（${findings.length}件）`) : null));
    root.appendChild(findings.length
      ? h('div', { class: 'card next-actions' }, findings.slice(0, 5).map((f) => findingRow(f, app)))
      : h('div', { class: 'card empty', text: '健康診断の指摘はありません' }));
  }

  // 種別ごとの件数（押すと一覧をその種別で開く。説明用の表示でも出す）
  const stats = LEDGER_KINDS.map((kd) => {
    const items = ledger.items.filter((it) => it.kind === kd);
    const open = items.filter(isOpen).length;
    return h('button', {
      class: 'card stat', type: 'button', 'data-kind': kd,
      onclick: () => app.go('list', { filter: { kind: kd } }),
    },
    h('span', { class: 'num', text: String(items.length) }),
    h('span', { class: 'lab', text: kindLabel(kd) + (kd === 'issue' || kd === 'question' ? `（未完了 ${open}）` : '') }));
  });
  root.appendChild(h('h3', { text: '件数' }));
  root.appendChild(h('div', { class: 'grid cols-4' }, stats));
}


// ---- ui/views/graph.js ----
// 関係図: 関係者とシステムを立場ごとの列に並べ、関係を線とラベルで描く（実行時に SVG を描く）


const COLS = [
  { key: 'customer', label: '顧客' },
  { key: 'own', label: '自社' },
  { key: 'vendor', label: '協力会社' },
  { key: 'system', label: 'システム' },
];
const NODE_W = 160;
const NODE_H = 40;
const GAP_Y = 64;
const COL_GAP = 96;
const PAD_X = 40;
const TOP = 56;
const LABEL_STEP = 16;
const LABEL_TRIES = 6;

function colOf(it) { return it.kind === 'system' ? 'system' : it.side; }

// 文字幅の概算（全角 12.5px・半角 7px）。SVG の getBBox を使わずに配置を決めるため
function textWidth(str, size) {
  let w = 0;
  for (const ch of str) w += ch.charCodeAt(0) > 0xff ? size : size * 0.56;
  return w;
}

function truncate(str, maxW, size) {
  if (textWidth(str, size) <= maxW) return str;
  let out = '';
  for (const ch of str) {
    if (textWidth(out + ch + '…', size) > maxW) break;
    out += ch;
  }
  return out + '…';
}

const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

// レイアウトを計算する（DOM に依存しない）
function layoutGraph(ledger) {
  const nodes = ledger.items.filter((it) => it.kind === 'stakeholder' || it.kind === 'system');
  const pos = new Map();
  let maxRows = 0;
  COLS.forEach((c, ci) => {
    const inCol = nodes.filter((n) => colOf(n) === c.key).sort((a, b) => a.id.localeCompare(b.id));
    maxRows = Math.max(maxRows, inCol.length);
    inCol.forEach((n, ri) => pos.set(n.id, { x: PAD_X + ci * (NODE_W + COL_GAP), y: TOP + ri * GAP_Y, col: ci, node: n }));
  });
  const width = PAD_X * 2 + COLS.length * NODE_W + (COLS.length - 1) * COL_GAP;
  const height = TOP + Math.max(1, maxRows) * GAP_Y + 20;

  const placed = [];       // 置いたラベルの矩形
  const nodeRects = [...pos.values()].map((p) => ({ x: p.x, y: p.y, w: NODE_W, h: NODE_H }));
  const edges = [];
  let hidden = 0;
  for (const r of ledger.relations) {
    const a = pos.get(r.from);
    const b = pos.get(r.to);
    if (!a || !b) continue;
    let d;
    let mx;
    let my;
    if (a.col === b.col) {
      // 同じ列: 列の外側へ弧を描く
      const right = a.col < COLS.length - 1;
      const x0 = right ? a.x + NODE_W : a.x;
      const bulge = (right ? 1 : -1) * (40 + Math.abs(b.y - a.y) * 0.25);
      const y1 = a.y + NODE_H / 2;
      const y2 = b.y + NODE_H / 2;
      d = `M${x0},${y1} C${x0 + bulge},${y1} ${x0 + bulge},${y2} ${x0},${y2}`;
      mx = x0 + bulge * 0.75;
      my = (y1 + y2) / 2;
    } else {
      const leftToRight = a.x < b.x;
      const x1 = leftToRight ? a.x + NODE_W : a.x;
      const x2 = leftToRight ? b.x : b.x + NODE_W;
      const y1 = a.y + NODE_H / 2;
      const y2 = b.y + NODE_H / 2;
      const cx = (x1 + x2) / 2;
      d = `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
      mx = cx;
      my = (y1 + y2) / 2;
    }
    // ラベルの重なりを避ける: 縦に 16px ずつずらし、だめなら省略
    const lw = textWidth(r.label, 11) + 8;
    const lh = 16;
    let rect = null;
    for (let t = 0; t <= LABEL_TRIES; t++) {
      const offset = t === 0 ? 0 : (t % 2 ? 1 : -1) * Math.ceil(t / 2) * LABEL_STEP;
      const cand = { x: mx - lw / 2, y: my - lh / 2 + offset, w: lw, h: lh };
      if (!placed.some((p) => overlap(p, cand)) && !nodeRects.some((p) => overlap(p, cand))) { rect = cand; break; }
    }
    if (rect) placed.push(rect); else hidden++;
    edges.push({ rel: r, d, label: rect });
  }
  return { pos, edges, width, height, hidden };
}

function renderGraph(root, app) {
  const ledger = store.view();
  const sel = store.selectedId;
  const L = layoutGraph(ledger);

  root.appendChild(h('h2', { text: '関係図' }));
  root.appendChild(h('div', { class: 'legend' },
    COLS.map((c) => h('span', null, h('span', { class: `sw sw-${c.key}` }), c.label)),
    h('span', { class: 'muted', text: '点線の枠: システム ／ 細い点線: 関与なし・廃止 ／ 矢印: 関係の向き（例: 発注する側 → される側）' }),
    L.hidden ? h('span', { class: 'badge mid', id: 'graph-hidden', text: `重なるためラベルを省略した線 ${L.hidden}本（線を押すと読めます）` }) : null));

  if (!L.pos.size) {
    root.appendChild(h('div', { class: 'empty', text: '関係者もシステムもまだありません。「指示文」の「初期作成」で洗い出せます' }));
    return;
  }

  // 強調: 選択ノードとつながるノード・線
  const neighbors = new Set();
  const hlEdges = new Set();
  const selIsNode = sel && L.pos.has(sel);
  if (selIsNode) {
    neighbors.add(sel);
    for (const e of L.edges) {
      if (e.rel.from === sel || e.rel.to === sel) { neighbors.add(e.rel.from); neighbors.add(e.rel.to); hlEdges.add(e.rel.id); }
    }
  }

  const svg = s('svg', { class: 'graph', width: L.width, height: L.height, viewBox: `0 0 ${L.width} ${L.height}`, role: 'img', 'aria-label': '関係者とシステムの関係図' });
  // 線の向き（from → to）を矢印で示す。強調時は色を変えた矢印を使う
  const arrow = (id, cls) => s('marker', { id, viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' },
    s('path', { d: 'M0,0 L10,5 L0,10 z', class: cls }));
  svg.appendChild(s('defs', null, arrow('wb-arrow', 'arrowhead'), arrow('wb-arrow-hl', 'arrowhead hl-head')));
  svg.appendChild(s('rect', { x: 0, y: 0, width: L.width, height: L.height, fill: 'transparent', onclick: () => { if (selIsNode) app.closeDetail(); } }));
  COLS.forEach((c, ci) => {
    svg.appendChild(s('text', { class: 'col-title', x: PAD_X + ci * (NODE_W + COL_GAP) + NODE_W / 2, y: 28, 'text-anchor': 'middle' }, c.label));
  });

  const edgeLayer = s('g', { class: 'edges' });
  for (const e of L.edges) {
    const dim = selIsNode && !hlEdges.has(e.rel.id);
    const title = `${e.rel.id}: ${e.rel.label}`;
    const g = s('g', { class: ['edge', dim && 'dim', hlEdges.has(e.rel.id) && 'hl'], 'data-rel': e.rel.id },
      s('title', null, title),
      s('path', { d: e.d, 'marker-end': hlEdges.has(e.rel.id) ? 'url(#wb-arrow-hl)' : 'url(#wb-arrow)' }),
      s('path', { d: e.d, class: 'hit', onclick: (ev) => { ev.stopPropagation(); app.openItem(e.rel.from); } }));
    if (e.label) {
      g.appendChild(s('rect', { class: 'elabel-bg', x: e.label.x, y: e.label.y, width: e.label.w, height: e.label.h, rx: 3 }));
      g.appendChild(s('text', { x: e.label.x + e.label.w / 2, y: e.label.y + 12, 'text-anchor': 'middle' }, e.rel.label));
    }
    edgeLayer.appendChild(g);
  }
  svg.appendChild(edgeLayer);

  for (const [id, p] of L.pos) {
    const n = p.node;
    const dim = selIsNode && !neighbors.has(id);
    const inactive = n.status === 'inactive' || n.status === 'retired';
    const sub = n.kind === 'system' ? (n.status === 'planned' ? '新規予定' : n.status === 'retired' ? '廃止' : '既存') : [n.org, n.role].filter(Boolean).join(' ');
    svg.appendChild(s('g', {
      class: ['node', `side-${colOf(n)}`, dim && 'dim', id === sel && 'selected', inactive && 'inactive'],
      transform: `translate(${p.x},${p.y})`, tabindex: '0', role: 'button', 'aria-label': `${n.title}（${id}）`, 'data-id': id,
      onclick: (ev) => { ev.stopPropagation(); if (id === sel) app.closeDetail(); else app.openItem(id); },
      onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); if (id === sel) app.closeDetail(); else app.openItem(id); } },
    },
    s('title', null, `${id} ${n.title}${sub ? ' / ' + sub : ''}`),
    s('rect', { width: NODE_W, height: NODE_H }),
    s('text', { x: 10, y: 17 }, truncate(n.title, NODE_W - 20, 12.5)),
    s('text', { class: 'sub', x: 10, y: 32 }, truncate(sub || id, NODE_W - 20, 11))));
  }
  root.appendChild(h('div', { class: 'graph-wrap' }, svg));
  root.appendChild(h('p', { class: 'muted small', text: `関係者・システム ${L.pos.size}件 ／ 関係 ${L.edges.length}本。四角を押すと、つながる相手以外が薄くなり、右に関係する項目が出ます。` }));
}


// ---- ui/views/list.js ----
// 一覧画面: 全種別の項目を絞り込み・並べ替えして表で出す


const PRIORITIES = ['Must', 'Should', 'Could', 'Wont'];
const SEVERITY_LABEL = { high: '高', mid: '中', low: '低' };

const filter = { kind: '', confidence: '', status: '', openOnly: false, priority: '', q: '' };
const sort = { key: 'id', dir: 1 };

function personOf(it) {
  if (it.owner) return it.owner;
  if (it.askTo) return it.askTo;
  if (Array.isArray(it.decidedBy) && it.decidedBy.length) return it.decidedBy[0];
  return null;
}

function dateOf(it) { return it.due || it.decidedAt || null; }

function rankOf(it) {
  if (it.kind === 'risk') return `点数 ${riskScore(it)}`;
  if (it.priority) return it.priority;
  if (it.severity) return '重要度 ' + SEVERITY_LABEL[it.severity];
  return null;
}

// 並べ替えの値。null は常に末尾へ
const COLUMNS = [
  { key: 'id', label: 'ID', value: (it) => KIND_IDS.indexOf(it.kind) * 100000 + Number(it.id.split('-')[1]) },
  { key: 'kind', label: '種別', value: (it) => KIND_IDS.indexOf(it.kind) },
  { key: 'title', label: '題名', value: (it) => it.title },
  { key: 'status', label: '状態', value: (it) => statusLabel(it.kind, it.status) },
  { key: 'confidence', label: '確度', value: (it) => ['guess', 'fact', 'confirmed'].indexOf(it.confidence) },
  { key: 'rank', label: '優先度', value: (it) => { const p = PRIORITIES.indexOf(it.priority); if (p >= 0) return p; return it.severity ? ['high', 'mid', 'low'].indexOf(it.severity) : null; } },
  { key: 'person', label: '担当・相手', value: (it) => { const p = personOf(it); return p ? itemTitle(p, store.view()) || p : null; } },
  { key: 'date', label: '期限・決定日', value: dateOf },
  { key: 'updatedAt', label: '更新', value: (it) => it.updatedAt },
];

function compare(a, b) {
  if (a === null || a === undefined) return (b === null || b === undefined) ? 0 : 1;
  if (b === null || b === undefined) return -1;
  if (typeof a === 'number' && typeof b === 'number') return (a - b) * sort.dir;
  return String(a).localeCompare(String(b), 'ja') * sort.dir;
}

function setListFilter(opts) {
  Object.assign(filter, { kind: '', confidence: '', status: '', openOnly: false, priority: '', q: '' }, opts || {});
}

function matches(it) {
  if (filter.kind && it.kind !== filter.kind) return false;
  if (filter.confidence && it.confidence !== filter.confidence) return false;
  if (filter.status && it.status !== filter.status) return false;
  if (filter.openOnly && !isOpen(it)) return false;
  if (filter.priority) {
    if (filter.priority === 'none' ? !!it.priority : it.priority !== filter.priority) return false;
  }
  if (filter.q) {
    const q = filter.q.toLowerCase();
    const hay = [it.id, it.title, it.body, it.answer, it.reason, ...(it.tags || [])].filter(Boolean).join('\n').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function select(label, value, options, onChange) {
  const el = h('select', { 'aria-label': label, 'data-fk': 'filter-' + label }, options.map(([v, t]) => h('option', { value: v, selected: v === value, text: t })));
  el.addEventListener('change', () => onChange(el.value));
  return el;
}

function renderList(root, app, opts) {
  if (opts && opts.filter) { setListFilter(opts.filter); app.viewOpts = {}; }
  // メモは一覧に出さない（メモの画面で扱う）
  const view = store.view();
  const ledger = { ...view, items: view.items.filter((it) => it.kind !== 'memo') };
  const rerender = () => app.refresh();

  root.appendChild(h('h2', { text: '一覧' }));
  const statusOptions = filter.kind ? KINDS[filter.kind].statuses.map((s) => [s.v, s.label]) : [];
  const q = h('input', { type: 'search', placeholder: '題名・内容・ID・タグで探す', 'aria-label': '文字列で絞り込む', value: filter.q, id: 'list-q' });
  q.addEventListener('input', () => {
    filter.q = q.value;
    const pos = q.selectionStart;
    rerender();
    const again = document.getElementById('list-q');
    if (again) again.setSelectionRange(pos, pos);
  });
  root.appendChild(h('div', { class: 'filters' },
    select('種別', filter.kind, [['', 'すべての種別'], ...LEDGER_KINDS.map((k) => [k, kindLabel(k)])], (v) => { filter.kind = v; filter.status = ''; rerender(); }),
    filter.kind ? select('状態', filter.status, [['', 'すべての状態'], ...statusOptions], (v) => { filter.status = v; rerender(); }) : null,
    select('確度', filter.confidence, [['', 'すべての確度'], ...CONFIDENCE.map((c) => [c.v, c.label])], (v) => { filter.confidence = v; rerender(); }),
    select('優先度', filter.priority, [['', 'すべての優先度'], ...PRIORITIES.map((p) => [p, p]), ['none', '優先度なし']], (v) => { filter.priority = v; rerender(); }),
    h('label', { class: 'row small' },
      h('input', { type: 'checkbox', id: 'list-open-only', checked: filter.openOnly, onchange: (e) => { filter.openOnly = e.target.checked; rerender(); } }),
      '未完了の課題・質問だけ'),
    q));

  // 効いている絞り込みを見えるようにする（別の画面から戻ったときに気づけるように）
  const active = [
    filter.kind && `種別: ${kindLabel(filter.kind)}`,
    filter.status && `状態: ${statusLabel(filter.kind, filter.status)}`,
    filter.confidence && `確度: ${CONFIDENCE.find((c) => c.v === filter.confidence).label}`,
    filter.priority && `優先度: ${filter.priority === 'none' ? 'なし' : filter.priority}`,
    filter.openOnly && '未完了だけ',
    filter.q && `「${filter.q}」を含む`,
  ].filter(Boolean);
  if (active.length) {
    root.appendChild(h('div', { class: 'row active-filters', role: 'status' },
      h('span', { class: 'small', text: '絞り込み中:' }),
      active.map((a) => h('span', { class: 'badge accent', text: a })),
      h('button', { class: 'btn small', type: 'button', id: 'list-reset', onclick: () => { setListFilter({}); rerender(); } }, '絞り込みを解除')));
  }

  const rows = ledger.items.filter(matches);
  const after = afterBaselineIds(ledger);
  const col = COLUMNS.find((c) => c.key === sort.key) || COLUMNS[0];
  rows.sort((a, b) => compare(col.value(a), col.value(b)) || a.id.localeCompare(b.id));

  root.appendChild(h('p', { class: 'muted small', id: 'list-count', text: `${rows.length}件 ／ 全${ledger.items.length}件` }));
  if (!rows.length) { root.appendChild(h('div', { class: 'empty', text: '条件に合う項目がありません' })); return; }

  const thead = h('thead', null, h('tr', null, COLUMNS.map((c) => h('th', {
    'aria-sort': sort.key === c.key ? (sort.dir === 1 ? 'ascending' : 'descending') : 'none', scope: 'col',
  }, h('button', { type: 'button', 'data-fk': 'sort-' + c.key, onclick: () => { if (sort.key === c.key) sort.dir *= -1; else { sort.key = c.key; sort.dir = 1; } rerender(); } },
    c.label, sort.key === c.key ? (sort.dir === 1 ? ' ▲' : ' ▼') : '')))));

  const tbody = h('tbody', null, rows.map((it) => {
    const person = personOf(it);
    return h('tr', {
      class: store.selectedId === it.id ? 'selected' : null, tabindex: '0', 'data-id': it.id,
      onclick: () => app.openItem(it.id),
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); app.openItem(it.id); } },
      'aria-label': `${it.id} ${it.title}`,
    },
    h('td', { class: 'mono small', text: it.id }),
    h('td', null, h('span', { class: 'badge', text: kindLabel(it.kind) })),
    h('td', { class: 'title' }, it.title, after.has(it.id) ? h('span', { class: 'badge accent after-bl', text: 'ベースライン後' }) : null),
    h('td', null, statusBadge(it.kind, it.status)),
    h('td', null, confBadge(it.confidence)),
    h('td', { class: 'small wrap', text: rankOf(it) || '' }),
    h('td', { class: 'small wrap', text: person ? (itemTitle(person, ledger) || person) : '' }),
    h('td', { class: 'small mono', text: dateOf(it) || '' }),
    h('td', { class: 'small muted mono', text: (it.updatedAt || '').slice(0, 10) }));
  }));
  root.appendChild(h('div', { class: 'table-wrap' }, h('table', { class: 'list' }, thead, tbody)));
}


// ---- ui/views/decisions.js ----
// 決定ログ: 決定を日付の新しい順に並べる


const opt = { showSuperseded: true };

function renderDecisions(root, app) {
  const ledger = store.view();
  const back = buildBackrefs(ledger);
  const all = ledger.items.filter((it) => it.kind === 'decision');
  const list = all
    .filter((d) => opt.showSuperseded || d.status !== 'superseded')
    .sort((a, b) => (b.decidedAt || '').localeCompare(a.decidedAt || '') || b.id.localeCompare(a.id));

  root.appendChild(h('div', { class: 'row' },
    h('h2', { text: '決定ログ' }),
    h('span', { class: 'spacer' }),
    h('label', { class: 'row small' },
      h('input', { type: 'checkbox', checked: opt.showSuperseded, id: 'dec-show-superseded', onchange: (e) => { opt.showSuperseded = e.target.checked; app.refresh(); } }),
      '置き換え済みも表示')));
  root.appendChild(h('p', { class: 'muted small', text: `有効 ${all.filter((d) => d.status === 'valid').length}件 ／ 置き換え済み ${all.filter((d) => d.status === 'superseded').length}件` }));
  if (!list.length) { root.appendChild(h('div', { class: 'empty', text: 'まだ決定がありません。議事録を取り込むと、ここに並びます' })); return; }

  root.appendChild(h('div', { class: 'stack' }, list.map((d) => {
    const replacedBy = (back.get(d.id) || []).filter((b) => b.field === 'supersedes').map((b) => b.from);
    return h('article', {
      class: ['decision', d.status === 'superseded' && 'superseded'], tabindex: '0', role: 'button', 'data-id': d.id, 'aria-label': `${d.decidedAt || ''} ${d.title}`,
      onclick: () => app.openItem(d.id), onkeydown: (e) => { if (e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); app.openItem(d.id); } },
    },
    h('div', { class: 'row' },
      h('span', { class: 'date', text: d.decidedAt || '日付不明' }),
      h('span', { class: 'mono small muted', text: d.id }),
      statusBadge(d.kind, d.status), confBadge(d.confidence)),
    h('div', { class: 'decision-title', text: d.title }),
    d.reason ? h('div', { class: 'small' }, h('span', { class: 'muted', text: '理由: ' }), d.reason) : null,
    Array.isArray(d.alternatives) && d.alternatives.length
      ? h('div', { class: 'small' }, h('span', { class: 'muted', text: '検討した他の案:' }), h('ul', { class: 'alts' }, d.alternatives.map((a) => h('li', { text: a }))))
      : null,
    h('div', { class: 'small row' },
      h('span', { class: 'muted', text: '決めた人:' }),
      Array.isArray(d.decidedBy) && d.decidedBy.length ? d.decidedBy.map((id) => idButton(id, app, { withTitle: true })) : h('span', { class: 'muted', text: '不明' }),
      d.supersedes ? [h('span', { class: 'muted', text: '　置き換えた決定:' }), idButton(d.supersedes, app, { withTitle: true })] : null,
      replacedBy.length ? [h('span', { class: 'muted', text: '　この決定を置き換えた決定:' }), replacedBy.map((id) => idButton(id, app, { withTitle: true }))] : null));
  })));
}

    class: 'finding', tabindex: f.itemId ? '0' : null, role: f.itemId ? 'button' : null, 'data-code': f.code,
    onclick: () => { if (f.itemId) app.openItem(f.itemId); },
    onkeydown: (e) => { if ((e.key === 'Enter' || e.key === ' ') && f.itemId) { e.preventDefault(); app.openItem(f.itemId); } },
    'data-fk': f.itemId ? `finding-${f.code}-${f.itemId}` : null,
  },
  h('span', { class: `badge ${f.severity}`, text: enumLabel(SEVERITY, f.severity) }),
  h('span', { class: 'msg', text: f.message }),
  h('span', { class: 'muted small', text: HEALTH_CODES[f.code] || f.code }),
  f.itemId ? h('span', { class: 'mono small muted', text: f.itemId }) : null);
}

const healthState = { code: '' };

function renderHealth(root, app) {
  const all = app.health();
  const list = healthState.code ? all.filter((f) => f.code === healthState.code) : all;
  root.appendChild(h('h2', { text: '健康診断' }));
  root.appendChild(h('p', { class: 'muted small', text: '台帳を機械的に点検した結果です（AIは使っていません）。押すとその項目の詳細が開きます。並びは 重要度 → 期限 → ID の順です。' }));

  const counts = {};
  for (const f of all) counts[f.code] = (counts[f.code] || 0) + 1;
  root.appendChild(h('div', { class: 'row filters' },
    SEVERITY.map((sv) => h('span', { class: `badge ${sv.v}`, text: `${sv.label} ${all.filter((f) => f.severity === sv.v).length}件` })),
    h('span', { class: 'spacer' }),
    h('button', { class: ['btn small', !healthState.code && 'primary'], type: 'button', 'data-fk': 'hf-all', 'aria-pressed': String(!healthState.code), onclick: () => { healthState.code = ''; app.refresh(); } }, `すべて（${all.length}）`),
    Object.keys(HEALTH_CODES).filter((c) => counts[c]).map((c) => h('button', {
      class: ['btn small', healthState.code === c && 'primary'], type: 'button', 'data-fk': 'hf-' + c, 'aria-pressed': String(healthState.code === c), onclick: () => { healthState.code = c; app.refresh(); },
    }, `${HEALTH_CODES[c]}（${counts[c]}）`))));

  if (!list.length) {
    root.appendChild(h('div', { class: 'empty', text: all.length ? 'この種類の指摘はありません' : '指摘はありません。良い状態です' }));
    return;
  }
  root.appendChild(h('div', { class: 'card health-list' }, list.map((f) => findingRow(f, app))));
}


// ---- ui/views/import.js ----
// 取込画面: Gemini の返答を貼る → 差分をカードで確認 → 採用分だけ適用


// 取込の下書き（画面を切り替えても残す。再読み込みでは消える）
const draft = {
  text: '',
  extracted: null,   // extractJson の結果
  validated: null,   // validatePatch の結果
  gen: null,         // 検証したときの台帳の世代（revision は重なることがあるので使わない）
  token: null,       // 検証したときの台帳の印。台帳が置き換わったら下書きを捨てる
  accepted: new Set(),
  result: null,      // 直前の適用結果
  justRead: false,   // 読み取った直後（結果へスクロールする）
};

function clearDraft(keepText) {
  if (!keepText) draft.text = '';
  draft.extracted = null; draft.validated = null; draft.result = null; draft.accepted = new Set();
}

function runExtract(text) {
  draft.text = text;
  draft.result = null;
  draft.validated = null;
  try {
    draft.extracted = extractJson(text);
    if (draft.extracted.ok) revalidate(true);
  } catch (e) {
    draft.extracted = { ok: false, error: '読み取り中に問題が起きました（' + String(e && e.message || e) + '）' };
    draft.validated = null;
  }
  draft.justRead = true;
}

function revalidate(resetAccepted) {
  draft.validated = validatePatch(draft.extracted.value, store.ledger);
  draft.gen = store.gen;
  draft.token = store.token;
  if (resetAccepted) draft.accepted = new Set(draft.validated.ops.filter((p) => !p.errors.length).map((p) => p.index));
}

// 読み取った直後だけ、結果を読み上げ、結果の位置へスクロールしてフォーカスを移す
function announce(root, message, targetId) {
  if (!draft.justRead) return;
  draft.justRead = false;
  root.appendChild(h('p', { class: 'sr-only', role: 'status', 'aria-live': 'polite', text: message }));
  setTimeout(() => {
    const t = document.getElementById(targetId);
    if (t) { t.scrollIntoView({ block: 'start' }); t.focus({ preventScroll: true }); }
  }, 0);
}

function opTitle(p, ledger) {
  const op = p.op;
  if (!op || typeof op !== 'object') return '（読めない操作）';
  if (op.op === 'add') return op.item && typeof op.item.title === 'string' ? op.item.title : '（題名なし）';
  if (op.op === 'update') return `${op.id || '?'} ${itemTitle(op.id, ledger) || ''}`.trim();
  if (op.op === 'relate') {
    const n = (id) => itemTitle(id, ledger) || id;
    return `${n(op.from)} → ${n(op.to)}：${op.label || ''}`;
  }
  if (op.op === 'project') return '案件情報';
  return `op: ${String(op.op)}`;
}

function errorLines(v) {
  const lines = [...v.errors];
  for (const p of v.ops) {
    for (const e of p.errors) lines.push(`操作${p.index + 1}（${opLabel(p.type)}${p.kind && KINDS[p.kind] ? '・' + kindLabel(p.kind) : ''}）: ${e}`);
  }
  return lines;
}

function addBody(p, ledger) {
  const item = p.op.item || {};
  const kind = item.kind;
  const rows = h('div', { class: 'diff add' });
  const names = ['body', 'status', 'confidence', ...Object.keys(KINDS[kind] ? KINDS[kind].fields : {}), 'links', 'sources', 'tags'];
  for (const name of names) {
    if (item[name] === undefined) continue;
    const spec = KINDS[kind] ? fieldSpec(kind, name) : null;
    rows.appendChild(h('div', { class: 'k', text: spec ? spec.label : name }));
    rows.appendChild(h('div', { class: 'after span3', text: valueText(kind, name, item[name], ledger) }));
  }
  if (p.tempId) {
    rows.appendChild(h('div', { class: 'k', text: '仮ID' }));
    rows.appendChild(h('div', { class: 'after span3 mono', text: p.tempId }));
  }
  return rows;
}

function updateBody(p, ledger) {
  const t = ledger.items.find((x) => x.id === p.op.id);
  if (!t) return null;
  const rows = h('div', { class: 'diff' });
  for (const r of updateRows(ledger, p.op)) {
    rows.appendChild(h('div', { class: 'k', text: r.label }));
    rows.appendChild(h('div', { class: 'before', text: valueText(t.kind, r.field, r.before, ledger) }));
    rows.appendChild(h('div', { class: 'arrow', text: '→' }));
    rows.appendChild(h('div', { class: 'after', text: valueText(t.kind, r.field, r.after, ledger) }));
  }
  if (typeof p.op.reason === 'string') {
    rows.appendChild(h('div', { class: 'k', text: '理由' }));
    rows.appendChild(h('div', { class: 'after span3', text: p.op.reason }));
  }
  return rows;
}

const PROJECT_LABELS = { name: '案件名', customer: '顧客', purpose: '目的', periodStart: '開始日', periodEnd: '終了日', goals: 'ゴール', summary: '概要', starter: '案件の型' };

function projectBody(p, ledger) {
  const rows = h('div', { class: 'diff' });
  for (const [k, v] of Object.entries(p.op.set || {})) {
    const fmt = (x) => (x === undefined ? '（なし）' : x === null ? '（消す）' : Array.isArray(x) ? x.join(' / ') : String(x));
    rows.appendChild(h('div', { class: 'k', text: PROJECT_LABELS[k] || k }));
    rows.appendChild(h('div', { class: 'before', text: fmt(ledger.project[k]) }));
    rows.appendChild(h('div', { class: 'arrow', text: '→' }));
    rows.appendChild(h('div', { class: 'after', text: fmt(v) }));
  }
  return rows;
}

function card(p, plan, rerender, app) {
  const ledger = store.ledger;
  const hasError = p.errors.length > 0;
  const accepted = draft.accepted.has(p.index) && !hasError;
  const auto = plan.autoRejected.has(p.index);
  const willApply = plan.apply.has(p.index);
  const toggle = h('div', { class: 'toggle', role: 'group', 'aria-label': `操作${p.index + 1}を採用するか` },
    h('button', { class: 'accept', type: 'button', 'data-fk': `op-${p.index}-accept`, 'aria-pressed': String(accepted), disabled: hasError, onclick: () => { draft.accepted.add(p.index); rerender(); } }, '採用'),
    h('button', { class: 'reject', type: 'button', 'data-fk': `op-${p.index}-reject`, 'aria-pressed': String(!accepted), disabled: hasError, onclick: () => { draft.accepted.delete(p.index); rerender(); } }, '却下'));

  let body = null;
  if (!hasError || (p.op && p.op.op === 'update' && store.item(p.op.id))) {
    if (p.type === 'add' && p.op.item) body = addBody(p, ledger);
    else if (p.type === 'update') body = updateBody(p, ledger);
    else if (p.type === 'project') body = projectBody(p, ledger);
  }
  const msgs = [
    ...p.errors.map((e) => h('li', { class: 'error', text: e })),
    ...p.warnings.map((w) => h('li', { class: 'warning', text: w })),
    ...((plan.warnings.get(p.index) || []).map((w) => h('li', { class: 'warning', text: w }))),
  ];
  return h('article', { class: ['op-card', hasError && 'has-error', !willApply && 'rejected'], 'data-index': String(p.index) },
    h('div', { class: 'op-head' },
      h('span', { class: 'muted small mono', text: `#${p.index + 1}` }),
      h('span', { class: ['badge', p.type === 'add' ? 'ok' : p.type === 'update' ? 'accent' : ''], text: opLabel(p.type) }),
      p.kind && KINDS[p.kind] ? h('span', { class: 'badge', text: kindLabel(p.kind) }) : null,
      h('span', { class: 'op-title', text: opTitle(p, ledger) }),
      p.type === 'update' && store.item(p.op.id) ? idButton(p.op.id, app) : null,
      auto ? h('span', { class: 'badge mid', text: '自動で却下' }) : null,
      toggle),
    body,
    msgs.length ? h('ul', { class: 'msgs' }, msgs) : null);
}

// ほかの画面（判断・データ）から差分の文を渡すとき、置き換える前に下書きがあるかを確かめるのに使う
function importDraftText() { return draft.text; }

function renderImport(root, app, opts) {
  const ledger = store.ledger;
  // ほかの画面から渡された文（app.go('import', { text })）。呼ぶ側が下書きの置き換えを確かめてから渡す
  if (opts && typeof opts.text === 'string') {
    clearDraft(false);
    runExtract(opts.text);
    app.viewOpts = {};
  }
  // 台帳が置き換わっていたら下書きを捨てる。同じ台帳が変わっただけなら検証し直す
  if (draft.validated && draft.token !== store.token) clearDraft(true);
  else if (draft.validated && draft.gen !== store.gen) revalidate(false);

  root.appendChild(h('h2', { text: '取込' }));
  root.appendChild(h('ol', { class: 'steps muted small' },
    h('li', { text: '「指示文」画面で指示文をコピーし、資料と一緒に Gemini に貼る' }),
    h('li', { text: 'Gemini の返答をまるごとコピーして、下の欄に貼る（```json の囲みや説明文が付いていてもかまいません）' }),
    h('li', { text: '1件ずつ内容を確かめ、要らないものは「却下」にしてから「適用」を押す' })));

  const ta = h('textarea', { rows: '9', id: 'import-text', 'aria-label': 'Gemini の返答', placeholder: 'ここに Gemini の返答を貼り付けます' });
  ta.value = draft.text;
  // 読み取る前でも、貼った内容を画面の切り替えで失わない
  ta.addEventListener('input', () => { draft.text = ta.value; });
  root.appendChild(ta);
  root.appendChild(h('div', { class: 'row' },
    h('button', { class: 'btn primary', type: 'button', id: 'import-read', onclick: () => { runExtract(ta.value); app.refresh(); } }, '読み取る'),
    h('button', { class: 'btn', type: 'button', id: 'import-clear', onclick: () => { clearDraft(false); app.refresh(); } }, 'クリア')));

  if (draft.result) {
    const r = draft.result;
    root.appendChild(h('div', { class: 'notice', id: 'import-result', tabindex: '-1', role: 'status' },
      h('strong', { text: `${r.applied}件を取り込みました（rev ${r.revision}）。` }),
      ' 間違えたときは上部の「取り消し」で戻せます。',
      r.idMap.length ? h('div', { class: 'small' }, '振られた ID: ', r.idMap.map(([t, id], i) => [i ? '、' : '', `${t} → `, idButton(id, app)])) : null));
  }

  const ex = draft.extracted;
  if (!ex) return;
  if (!ex.ok) {
    announce(root, ex.error, 'import-error');
    root.appendChild(h('div', { class: 'notice error stack', id: 'import-error', tabindex: '-1' },
      h('p', { text: ex.error }),
      h('button', { class: 'btn', type: 'button', onclick: async () => {
        const ok = await copyText(buildFixPrompt([ex.error + '。JSON の文法（括弧・カンマ・引用符）を直し、途中で切れないように出力してください'], ledger));
        toast(ok ? '修正依頼文をコピーしました。Gemini に貼ってください' : 'コピーできませんでした');
      } }, 'Gemini への修正依頼文をコピー')));
    return;
  }
  if (ex.notes.length) root.appendChild(h('ul', { class: 'muted small' }, ex.notes.map((n) => h('li', { text: n }))));

  const v = draft.validated;
  if (v.warnings.length) root.appendChild(h('div', { class: 'notice warn' }, v.warnings.map((w) => h('div', { text: w }))));
  if (v.errors.length) root.appendChild(h('div', { class: 'notice error' }, v.errors.map((e) => h('div', { text: e }))));

  const plan = planPatch(v, draft.accepted);
  // 採用した操作を仮に適用し、項目をまたぐ誤り（循環など）が新しく出ないか確かめる
  const integ = plan.apply.size ? previewPatch(ledger, v, draft.accepted, nowIso()).integrityErrors : [];
  if (integ.length) {
    root.appendChild(h('div', { class: 'notice error', id: 'import-integrity' },
      h('strong', { text: 'このまま適用すると、項目をまたぐ誤りが出るため適用できません。関係する操作を却下するか、Gemini に直させてください。' }),
      h('ul', null, integ.map((e) => h('li', { text: `${e.itemId}: ${e.message}` })))));
  }
  const errCount = v.ops.filter((p) => p.errors.length).length;
  const lines = errorLines(v);
  for (const e of integ) lines.push(`項目をまたぐ誤り ${e.itemId}: ${e.message}`);
  const rerender = () => app.refresh();

  root.appendChild(h('div', { class: 'row import-summary', id: 'import-summary', tabindex: '-1' },
    h('strong', { text: `操作 ${v.ops.length}件` }),
    h('span', { class: 'badge ok', text: `適用 ${plan.apply.size}` }),
    h('span', { class: 'badge', text: `却下 ${v.ops.length - plan.apply.size - errCount}` }),
    errCount ? h('span', { class: 'badge high', text: `誤り ${errCount}` }) : null,
    h('span', { class: 'spacer' }),
    h('button', { class: 'btn small', type: 'button', 'data-fk': 'accept-all', onclick: () => { draft.accepted = new Set(v.ops.filter((p) => !p.errors.length).map((p) => p.index)); rerender(); } }, 'すべて採用'),
    h('button', { class: 'btn small', type: 'button', 'data-fk': 'reject-all', onclick: () => { draft.accepted = new Set(); rerender(); } }, 'すべて却下')));

  root.appendChild(h('div', { class: 'stack op-list' }, v.ops.map((p) => card(p, plan, rerender, app))));
  announce(root, `操作 ${v.ops.length}件を読み取りました。適用 ${plan.apply.size}件${errCount ? `、誤り ${errCount}件` : ''}`, 'import-summary');

  root.appendChild(h('div', { class: 'sticky-bar row' },
    h('button', {
      class: 'btn primary', type: 'button', id: 'import-apply', disabled: plan.apply.size === 0 || integ.length > 0,
      onclick: () => {
        const r = store.applyValidated(v, draft.accepted);
        draft.result = { applied: r.applied, revision: r.ledger.revision, idMap: [...r.idMap.entries()] };
        draft.text = ''; draft.extracted = null; draft.validated = null;
        toast(`${r.applied}件を取り込みました`);
        app.refresh();
        document.getElementById('view').scrollTop = 0;
        const res = document.getElementById('import-result');
        if (res) res.focus({ preventScroll: true });
      },
    }, `適用（${plan.apply.size}件）`),
    lines.length ? h('button', { class: 'btn', type: 'button', id: 'import-fix', onclick: async () => {
      const ok = await copyText(buildFixPrompt(lines, ledger));
      toast(ok ? '修正依頼文をコピーしました。Gemini に貼ってください' : 'コピーできませんでした');
    } }, `修正依頼文をコピー（誤り ${lines.length}件）`) : null,
    plan.apply.size === 0 ? h('span', { class: 'muted small', text: '採用できる操作がないため、適用できません' }) : null));
}


// ---- ui/views/prompts.js ----
// 指示文画面: 目的を選ぶ → 指示文を作る → コピーして Gemini / NotebookLM に貼る


const promptState = { purpose: 'minutes', freeText: '', meetingId: '', changeId: '', reportText: '', targetIds: [], memoIds: [], flowId: '' };

const GUIDE = {
  notebooklm: 'NotebookLM に資料を入れたうえで、この文を質問欄に貼ります。返ってきた箇条書きは、「資料からの追加」の指示文と一緒に Gemini に貼ってください（指示文の末尾の「ここから資料」の下に貼ります）。',
  default: 'コピーした指示文を Gemini に貼り、末尾の「--- ここから資料 ---」の下に資料・議事録を貼って送ります。返答は「取込」画面に貼ります。',
  review: 'レビューは台帳そのものが材料です。補足の資料が無ければ、そのまま送ってかまいません。返答は「取込」画面に貼ります。',
};

function renderPrompts(root, app, opts) {
  const ledger = store.ledger;
  // 他の画面から目的と会議を指定して開かれたとき
  if (opts && opts.purpose) {
    promptState.purpose = opts.purpose;
    if (opts.meetingId) promptState.meetingId = opts.meetingId;
    if (opts.changeId) promptState.changeId = opts.changeId;
    if (Array.isArray(opts.targetIds)) promptState.targetIds = opts.targetIds;
    if (Array.isArray(opts.memoIds)) promptState.memoIds = opts.memoIds;
    if (opts.flowId !== undefined) promptState.flowId = opts.flowId;
    if (opts.reportText !== undefined) promptState.reportText = opts.reportText;
    app.viewOpts = {};
  }
  if (promptState.meetingId && !ledger.items.some((it) => it.id === promptState.meetingId)) promptState.meetingId = '';
  if (promptState.flowId && !ledger.items.some((it) => it.id === promptState.flowId && it.kind === 'bizflow')) promptState.flowId = '';
  root.appendChild(h('h2', { text: '指示文' }));

  const list = h('div', { class: 'purpose-list', role: 'group', 'aria-label': '指示文の目的' });
  let group = null;
  for (const p of PURPOSES) {
    if (p.group !== group) { group = p.group; list.appendChild(h('div', { class: 'muted small group-title', text: group })); }
    list.appendChild(h('button', {
      class: 'purpose', type: 'button', 'aria-pressed': String(promptState.purpose === p.id), 'data-purpose': p.id,
      onclick: () => { promptState.purpose = p.id; app.refresh(); },
    }, h('span', { class: 't', text: p.label }), h('span', { class: 'd', text: p.desc })));
  }

  const right = h('div', { class: 'stack' });
  const isJudge = ['judge-flow', 'table-def', 'judge-master', 'judge-cases'].includes(promptState.purpose);
  const guide = isJudge ? 'Gemini に要件定義書などを添付した会話で、この文を送ります。返ってきた囲み（flow か markdown）は「判断・データ」の画面の欄に貼ります。差分ではないので「取込」には貼りません。' : promptState.purpose === 'report-polish' ? '返ってきた文面をそのままメールや Chat に使います。差分ではないので「取込」には貼りません。' : promptState.purpose === 'notebooklm' ? GUIDE.notebooklm : promptState.purpose.startsWith('review-') ? GUIDE.review : GUIDE.default;
  right.appendChild(h('p', { class: 'notice', text: guide }));

  const preview = h('textarea', { class: 'prompt-preview', id: 'prompt-text', readonly: true, 'aria-label': '生成された指示文', rows: '24' });
  const refresh = () => { preview.value = buildPrompt(promptState.purpose, ledger, { today: todayStr(), freeText: promptState.freeText, meetingId: promptState.purpose === 'minutes' ? promptState.meetingId : '', changeId: promptState.changeId, reportText: promptState.reportText, targetIds: promptState.targetIds, memoIds: promptState.memoIds, flowId: promptState.flowId }); };

  if (promptState.purpose === 'minutes') {
    const ms = ledger.items.filter((it) => it.kind === 'meeting').sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const sel = h('select', { id: 'prompt-meeting', 'aria-label': 'どの会議の議事録か' },
      h('option', { value: '', text: '会議を指定しない' }),
      ms.map((m) => h('option', { value: m.id, selected: m.id === promptState.meetingId, text: `${m.date}　${m.title}` })));
    sel.addEventListener('change', () => { promptState.meetingId = sel.value; refresh(); });
    right.appendChild(h('label', { class: 'field' }, 'どの会議の議事録か（指定すると、出席者とヒヤリングシートの質問が指示文に入ります）', sel));
  }
  if (promptState.purpose === 'bizflow') {
    const fs = ledger.items.filter((it) => it.kind === 'bizflow');
    const phases = KINDS.bizflow.fields.phase.values;
    const sel = h('select', { id: 'prompt-flow', 'aria-label': 'どのフローを直すか' },
      h('option', { value: '', text: '新しいフローを作らせる' }),
      fs.map((f) => h('option', { value: f.id, selected: f.id === promptState.flowId, text: `${f.id} ${f.title}（${enumLabel(phases, f.phase)}）` })));
    sel.addEventListener('change', () => { promptState.flowId = sel.value; refresh(); });
    right.appendChild(h('label', { class: 'field' }, 'どのフローを直すか（選ぶと、そのフローの記法が全文入ります）', sel));
  }
  if (promptState.purpose === 'change-review') {
    const crs = ledger.items.filter((it) => it.kind === 'change');
    const sel = h('select', { id: 'prompt-change', 'aria-label': 'どの変更要求か' },
      h('option', { value: '', text: '変更要求を選ぶ' }),
      crs.map((c) => h('option', { value: c.id, selected: c.id === promptState.changeId, text: `${c.id} ${c.title}` })));
    sel.addEventListener('change', () => { promptState.changeId = sel.value; refresh(); });
    right.appendChild(h('label', { class: 'field' }, 'どの変更要求をレビューさせるか', sel));
  }
  if (promptState.purpose === 'test-viewpoints') {
    promptState.targetIds = promptState.targetIds.filter((id) => ledger.items.some((it) => it.id === id));
    const cands = ledger.items.filter((it) => (it.kind === 'requirement' && it.status !== 'dropped') || it.kind === 'screen');
    const box = h('div', { class: 'target-list', id: 'prompt-targets', role: 'group', 'aria-label': 'テストの対象' }, cands.map((it) => h('label', { class: 'row small' },
      h('input', { type: 'checkbox', 'data-fk': 'target-' + it.id, checked: promptState.targetIds.includes(it.id), onchange: (e) => {
        promptState.targetIds = e.target.checked ? [...promptState.targetIds, it.id] : promptState.targetIds.filter((x) => x !== it.id);
        app.refresh();
      } }),
      h('span', { class: 'mono', text: it.id }), it.title)));
    right.appendChild(h('div', { class: 'field' }, h('span', { text: `テストの対象（${promptState.targetIds.length}件選択中）` }), box));
  }
  // メモからの取込: メモを選ぶ（本文の合計が上限を超えたら指示文を作らない）
  let memoOver = false;
  if (promptState.purpose === 'memo') {
    promptState.memoIds = promptState.memoIds.filter((id) => ledger.items.some((it) => it.id === id && it.kind === 'memo'));
    const memos = ledger.items.filter((it) => it.kind === 'memo');
    const mm = memoMaterial(ledger, promptState.memoIds);
    memoOver = mm.over;
    const box = h('div', { class: 'target-list', id: 'prompt-memos', role: 'group', 'aria-label': '取り込むメモ' }, memos.length ? memos.map((it) => h('label', { class: 'row small' },
      h('input', { type: 'checkbox', 'data-fk': 'memo-' + it.id, checked: promptState.memoIds.includes(it.id), onchange: (e) => {
        promptState.memoIds = e.target.checked ? [...promptState.memoIds, it.id] : promptState.memoIds.filter((x) => x !== it.id);
        app.refresh();
      } }),
      h('span', { class: 'mono', text: it.id }), `${it.title}（${String(it.body || '').length.toLocaleString()} 字）`)) : h('span', { class: 'small muted', text: 'メモがありません。「メモ」の画面でチャットを貼ってメモにしてください' }));
    right.appendChild(h('div', { class: 'field' }, h('span', { text: `取り込むメモ（${promptState.memoIds.length} 件・${mm.total.toLocaleString()} 字選択中）` }), box));
    if (memoOver) right.appendChild(h('p', { class: 'notice error small', role: 'alert', id: 'memo-over', text: `選んだメモの本文が合計 ${mm.total.toLocaleString()} 字で、上限の ${MEMO_PROMPT_MAX.toLocaleString()} 字を超えています。Gemini に一度に貼れる量の目安を超えるため、メモを減らして分けて取り込んでください` }));
  }
  if (promptState.purpose === 'report-polish') {
    const ta = h('textarea', { rows: '6', id: 'prompt-report-text', 'aria-label': '週報の下書き', placeholder: '定例会資料の画面から開くと、週報の下書きが入ります。ここに直接貼ってもかまいません' });
    ta.value = promptState.reportText;
    ta.addEventListener('input', () => { promptState.reportText = ta.value; refresh(); });
    right.appendChild(h('label', { class: 'field' }, '週報の下書き', ta));
  }
  if (promptState.purpose === 'free') {
    const free = h('textarea', { rows: '4', 'aria-label': '自由指示', placeholder: '例: 課題の重要度を、期限と影響の大きさから見直してください' });
    free.value = promptState.freeText;
    free.addEventListener('input', () => { promptState.freeText = free.value; refresh(); });
    right.appendChild(h('label', { class: 'field' }, '指示', free));
  }
  refresh();

  right.appendChild(h('div', { class: 'row' },
    h('button', { class: 'btn primary', type: 'button', id: 'prompt-copy', disabled: memoOver, title: memoOver ? '選んだメモが多すぎます' : '', onclick: async () => {
      const ok = await copyText(preview.value);
      if (ok) toast('コピーしました');
      else { preview.select(); toast('コピーできませんでした。選択した状態にしたので Ctrl+C でコピーしてください'); }
    } }, '指示文をコピー'),
    h('span', { class: 'muted small', text: `${preview.value.length.toLocaleString()} 文字 ／ 台帳 rev ${ledger.revision}` }),
    promptState.purpose === 'notebooklm' ? h('button', { class: 'btn', type: 'button', onclick: () => { promptState.purpose = 'material'; app.refresh(); } }, '「資料からの追加」へ') : null,
    isJudge ? h('button', { class: 'btn', type: 'button', onclick: () => app.go('judge') }, '判断・データへ') : promptState.purpose !== 'notebooklm' && promptState.purpose !== 'report-polish' ? h('button', { class: 'btn', type: 'button', onclick: () => app.go('import') }, '取込へ') : null));
  right.appendChild(preview);

  root.appendChild(h('div', { class: 'prompt-layout' }, list, right));
}


// ---- ui/views/settings.js ----
// 設定画面: 案件の一覧（切り替え・外す）・新規案件・読み込み・この案件の設定・書き出し・HTML のダウンロード・保存の大きさ


const settingsState = { loadErrors: null, changingPass: false, passError: null };

// 案件の型の選択（新規・中身を空に戻す で共通）
function starterSelect(id, selected) {
  return h('select', { id, 'aria-label': '案件の型' },
    Object.entries(STARTERS).map(([sid, st]) => h('option', { value: sid, selected: sid === selected, text: st.label })),
    h('option', { value: '', selected: selected === null, text: '型を使わない（空の台帳）' }));
}
function starterDesc(v) { return v ? STARTERS[v].desc : '項目のない台帳から始めます'; }

// 新しい案件を作って開く（設定画面と上部の「＋ 新しい案件」で共通）。作れたら true
async function createProject(n, starterId, app) {
  if (!n) { toast('案件名を入れてください'); return false; }
  if (!(await ensureVaultReady())) return false;
  store.addProject(createLedger(n, starterId || null, nowIso()));
  toast(`「${n}」を作りました`);
  app.go('overview');
  return true;
}

// 上部の「＋ 新しい案件」: 案件名と型を入れる小さな画面

  const starter = starterSelect('dlg-new-starter', Object.keys(STARTERS)[0]);

  starter.addEventListener('change', () => { desc.textContent = starterDesc(starter.value); });

      e.preventDefault();
      const n = name.value.trim();
      if (!n) { err.textContent = '案件名を入れてください'; err.hidden = false; name.focus(); return; }
      close();

        h('button', { class: 'btn primary', type: 'submit', 'data-act': 'ok' }, '作る'))));
  function close() { dlg.close(); dlg.remove(); }
  dlg.addEventListener('cancel', (e) => { e.preventDefault(); close(); });

  dlg.showModal();
  name.focus();
}

// この案件の中身を空に戻す（案件情報と設定は残す。取り消しで戻せる）
async function resetCurrent(starterId) {
  const l = store.ledger;
  const p = store.projects().find((x) => x.id === store.activeId);
  const ok = await confirmDialog(`「${l.project.name}」の中身を空に戻します。`, '空に戻す',
    `項目 ${l.items.length} 件・関係 ${l.relations.length} 件・ベースライン ${l.baselines.length} 件と変更の記録が消えます。案件情報とこの案件の設定は残ります（「自分」の設定は外れます）。` +
    `「取り消し」で元に戻せます（再読み込みやロックの後は戻せません）。${lastExportText(p)}。` +
    (p.dirty ? '最後の書き出しより後の変更があります。先に書き出してください。' : ''));
  if (!ok) return;
  store.resetProject(starterId || null);
  toast('中身を空に戻しました（取り消し可）');
}

// 合言葉を変える
async function changePass(cur, p1, p2, app) {
  const fail = (msg) => { settingsState.passError = msg; app.refresh(); };
  if (p1.length < MIN_PASSPHRASE) return fail(`新しい合言葉は ${MIN_PASSPHRASE} 文字以上にしてください`);
  if (p1 !== p2) return fail('新しい合言葉の 2 回の入力が一致しません');
  settingsState.changingPass = true; settingsState.passError = null;
  app.refresh();
  const r = await store.changePassphrase(cur, p1);
  settingsState.changingPass = false;
  if (!r.ok) return fail(r.error);
  toast('合言葉を変えました。次からは新しい合言葉で開きます');
  app.refresh();
}
// localStorage はおよそ 5MB（文字数で約 500 万）。4MB を超えたら知らせる
const STORAGE_WARN = 4 * 1024 * 1024;

function lastExportText(p) {
  return p.exportedAt ? `最後の書き出し: ${fmtDateTime(p.exportedAt)}` : 'まだ一度も書き出していません';
}

async function loadFile(file, app) {
  if (!file) return;
  let text;
  try { text = await file.text(); } catch (e) {
    settingsState.loadErrors = { name: file.name, errors: ['ファイルを読めませんでした'], more: 0 };
    app.refresh();
    return;
  }
  const r = store.parseLedgerFile(text);
  if (!r.ok) {
    settingsState.loadErrors = { name: file.name, errors: r.errors, more: r.more || 0 };
    app.refresh();
    return;
  }
  settingsState.loadErrors = null;
  // 同じ案件名の案件があれば、置き換えるか別の案件として足すかを選ぶ（P5 AC-06）
  const same = store.findProjectByName(r.ledger.project.name);
  let mode = 'add';
  if (same) {
    const p = store.projects().find((x) => x.id === same);
    mode = await choiceDialog(
      `同じ案件名「${p.name}」の案件がすでにあります。`,
      [{ value: 'add', label: '別の案件として足す' }, { value: 'replace', label: '置き換える', primary: true }],
      `今ある案件: rev ${p.revision}・${lastExportText(p)}${p.dirty ? '・その後に変更があります（置き換えると失われます）' : ''}。読み込むファイル: rev ${r.ledger.revision}`);
    if (!mode) return;
  }
  if (!(await ensureVaultReady())) return;
  if (mode === 'replace') store.replaceProject(same, r.ledger, { exported: true, migrated: r.migrated });
  else store.addProject(r.ledger, { exported: true, migrated: r.migrated });
  toast(`「${r.ledger.project.name}」を${mode === 'replace' ? '置き換えて' : ''}読み込みました`);
  app.go('overview');
}

function settingInput(key, d, cur) {
  if (d.type === 'enum') {
    return h('select', { id: 'set-' + key, 'aria-label': d.label }, d.values.map((e) => h('option', { value: e.v, selected: e.v === cur, text: e.label })));
  }
  if (d.type === 'ref') {
    const people = store.ledger.items.filter((it) => d.kinds.includes(it.kind));
    return h('select', { id: 'set-' + key, 'aria-label': d.label },
      h('option', { value: '', text: '（未設定）' }),
      people.map((p) => h('option', { value: p.id, selected: p.id === cur, text: `${p.title}（${p.id}）` })));
  }
  return h('input', { type: 'number', id: 'set-' + key, 'aria-label': d.label, min: d.min, max: d.max, step: d.type === 'int' ? '1' : 'any', value: cur == null ? '' : String(cur) });
}

function renderSettings(root, app) {
  root.appendChild(h('h2', { text: '設定' }));

  // 読めなかった台帳の退避データ（上書きで消えないように残してある）
  const rec = Object.entries(store.recovery);
  if (rec.length) {
    root.appendChild(h('section', { class: 'card stack recovery', id: 'recovery' },
      h('h3', { text: `読めなかった台帳の退避データ（${rec.length}件）` }),
      h('p', { class: 'small', text: '今の版では読めなかった案件の元のデータを、暗号化して退避してあります。書き出して保管するか、要らなければ消してください。' }),
      rec.map(([id, text]) => h('div', { class: 'row' },
        h('span', { class: 'mono small', text: id }),
        h('button', { class: 'btn small', type: 'button', 'data-fk': 'rec-export-' + id, onclick: () => download(`退避データ_${id}_${Date.now()}.json`, text) }, '書き出す'),
        h('button', { class: 'btn small danger', type: 'button', 'data-fk': 'rec-discard-' + id, onclick: async () => {
          if (await confirmDialog('この退避データを消します。元に戻せません。', '消す')) { await store.discardRecovery(id); toast('退避データを消しました'); }
        } }, '消す')))));
  }

  // 案件の一覧（P5）
  const projects = store.projects();
  if (projects.length) {
    root.appendChild(h('section', { class: 'card stack', id: 'project-list' },
      h('h3', { text: `ブラウザの中の案件（${projects.length}件）` }),
      h('ul', { class: 'ref-list' }, projects.map((p) => h('li', { 'data-project': p.id },
        p.id === store.activeId ? h('span', { class: 'badge accent', text: '開いている' }) : h('button', { class: 'btn small', type: 'button', 'data-fk': 'open-' + p.id, onclick: () => { store.switchProject(p.id); toast(`「${p.name}」を開きました`); } }, '開く'),
        h('span', { class: 'title', text: p.name }),
        h('span', { class: 'small muted', text: `rev ${p.revision}・${lastExportText(p)}` }),
        p.dirty ? h('span', { class: 'badge mid', text: '未書き出し' }) : null,
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn small danger', type: 'button', 'data-fk': 'remove-' + p.id, onclick: async () => {
          const ok = await confirmDialog(`「${p.name}」をブラウザから外します。`, '外す',
            `${p.dirty ? '最後の書き出しより後の変更があります。外すと失われます。先に書き出してください。' : '書き出したファイルがあれば、あとで読み込み直せます。'}（${lastExportText(p)}）`);
          if (ok) { store.removeProject(p.id); toast('案件を外しました'); }
        } }, 'ブラウザから外す'))))));
  }

  // 新規案件
  const name = h('input', { type: 'text', id: 'new-name', placeholder: '例: ○○社 受発注システム刷新', 'aria-label': '案件名' });
  const starter = starterSelect('new-starter', Object.keys(STARTERS)[0]);
  const desc = h('p', { class: 'muted small', text: starterDesc(starter.value) });
  starter.addEventListener('change', () => { desc.textContent = starterDesc(starter.value); });
  root.appendChild(h('section', { class: 'card stack' },
    h('h3', { text: '新しい案件を作る' }),
    h('p', { class: 'muted small', text: '今の案件はそのまま残り、新しい案件が追加されます。' }),
    h('div', { class: 'row' }, name, starter,
      h('button', { class: 'btn primary', type: 'button', id: 'new-create', onclick: async () => {
        if (!(await createProject(name.value.trim(), starter.value, app))) name.focus();
      } }, '作る')),
    desc));

  // 読み込み
  const input = h('input', { type: 'file', accept: '.json,application/json', id: 'load-file', 'aria-label': '台帳ファイルを選ぶ' });
  input.addEventListener('change', () => loadFile(input.files[0], app));
  const zone = h('section', { class: 'card stack dropzone', id: 'dropzone' },
    h('h3', { text: '台帳ファイルを読み込む' }),
    h('p', { class: 'muted small', text: '書き出した JSON ファイルを選ぶか、この枠にドラッグ&ドロップします。新しい案件として足します。同じ案件名の案件があるときは、置き換えるか別の案件として足すかを選べます。' }),
    input);
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('over');
    loadFile(e.dataTransfer.files[0], app);
  });
  if (settingsState.loadErrors) {
    const le = settingsState.loadErrors;
    zone.appendChild(h('div', { class: 'notice error', id: 'load-errors' },
      h('strong', { text: `「${le.name}」は読み込めませんでした。台帳は変わっていません。` }),
      h('ul', null, le.errors.map((e) => h('li', { text: e }))),
      le.more ? h('div', { text: `ほか ${le.more}件` }) : null));
  }
  root.appendChild(zone);

  // この案件の設定（台帳に保存する。変更は取り消せる）
  if (store.ledger) {
    const rows = Object.entries(SETTINGS).map(([key, d]) => {
      const cur = settingOf(store.ledger, key);
      const el = settingInput(key, d, cur);
      el.addEventListener('change', () => {
        let v = el.value;
        if (d.type === 'int') v = Number.parseInt(v, 10);
        else if (d.type === 'number') v = v === '' ? null : Number(v);
        else if (d.type === 'ref') v = v === '' ? null : v;
        if (v === cur) return;
        const r = store.updateSettings({ [key]: v });
        toast(r.ok ? `${d.label}を変えました（取り消し可）` : r.errors.join(' / '));
      });
      return h('label', { class: 'field' }, d.label, el);
    });
    root.appendChild(h('section', { class: 'card stack' },
      h('h3', { text: 'この案件の設定' }),
      h('div', { class: 'row settings-row' }, rows)));

    // この案件の中身を空に戻す
    const rs = starterSelect('reset-starter', store.ledger.project.starter || null);
    const rsDesc = h('p', { class: 'muted small', text: starterDesc(rs.value) });
    rs.addEventListener('change', () => { rsDesc.textContent = starterDesc(rs.value); });
    root.appendChild(h('section', { class: 'card stack', id: 'reset-project' },
      h('h3', { text: 'この案件の中身を空に戻す' }),
      h('p', { class: 'muted small', text: '案件名・顧客・目的などの案件情報と、この案件の設定は残したまま、項目・関係・ベースライン・変更の記録を消して最初からやり直します。型を選び直せます。' }),
      h('div', { class: 'row' }, rs,
        h('button', { class: 'btn danger', type: 'button', id: 'reset-run', onclick: () => resetCurrent(rs.value) }, '中身を空に戻す')),
      rsDesc));
  }

  // 合言葉を変える（全案件で共通）
  if (store.vaultState === 'unlocked') {
    const pw = (id, label, ac) => h('input', { type: 'password', id, autocomplete: ac, 'aria-label': label });
    const cur = pw('pass-cur', '今の合言葉', 'current-password');
    const n1 = pw('pass-next-1', '新しい合言葉', 'new-password');
    const n2 = pw('pass-next-2', '新しい合言葉（確認）', 'new-password');
    const busy = settingsState.changingPass;
    root.appendChild(h('section', { class: 'card stack', id: 'change-pass' },
      h('h3', { text: '合言葉を変える' }),

  // 保存の大きさ
