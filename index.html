<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-F4wgRpP7uyKWK5yt9HwYxLURko7Z4dZR7QOI2wcLQ2o='; style-src 'sha256-rfdP8fjihAyz4T+6T+8cmJCL8daFfXKHNaQuF3ZzzmQ='; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>案件ワークベンチ</title>
<style>
:root {
  /* 色は gemini-kit と同じ dash.css の配色（デジタル庁デザインシステム）。名前はこのツールの変数のまま値だけそろえる */
  --bg: #F8F8FB;
  --panel: #FFFFFF;
  --ink: #000000;
  --ink-2: #626264;
  --ink-3: #626264;
  --line: #CCCCCC;
  --line-2: #F1F1F4;
  --surface: #F1F1F4;
  --hover: #E8F1FE;
  --accent: #0017C1;
  --accent-strong: #000060;
  --accent-soft: #E8F1FE;
  --gold: #A58000;
  --head-text: #C9D4E3;
  --edge: #666666;
  --bar: #C5D7FB;
  --bar-line: #3460FB;
  --high: #CE0000;
  --high-soft: #FDECEA;
  --mid: #8A5A00;
  --mid-soft: #FFF4E0;
  --low: #2B4FCF;
  --low-soft: #EDF2F8;
  --ok: #1A6B35;
  --ok-soft: #E6F4EC;
  --side-customer: #3460FB;
  --side-own: #1A6B35;
  --side-vendor: #8A5A00;
  --side-system: #5B4A9E;
  /* dashboard スキルの部品（src/vendor/dash.css・dash.js）が使う名前。値は上と同じ配色 */
  --d-text: #000000;
  --d-label: #626264;
  --d-link: #0017C1;
  --d-bg: #F8F8FB;
  --d-card: #FFFFFF;
  --d-control: #F1F1F4;
  --d-line: #CCCCCC;
  --d-grid: #E6E6EA;
  --d-s1: #0017C1;
  --d-s2: #000060;
  --d-s3: #3460FB;
  --d-s4: #A58000;
  --d-ref: #666666;
  --d-mute: #999999;
  --d-link-flow: #C5D7FB;
  --d-hl: #E8F1FE;
  --d-pos: #3460FB;
  --d-neg: #FE3939;
  --d-neg-text: #CE0000;
  --d-gap: 16px;
  --d-radius: 8px;
  --d-font: Arial, "メイリオ", Meiryo, "Yu Gothic", sans-serif;
  --heat-1: #EEF2F6;
  --heat-2: #FFF4D6;
  --heat-3: #FFE0B8;
  --heat-4: #FBC9C9;
  /* 業務フロー・判断の図（P7c）。区分（AI・ルール・人・外部）の色は gemini-kit flow.js の ROLES と同じ値 */
  --role-ai: #6A4C9C;
  --role-rule: #2F5F8F;
  --role-human: #8A5A1F;
  --role-ext: #5F6B78;
  --lane-a: #F4F6FA;
  --lane-b: #FFFFFF;
  --lane-head: #E8ECF3;
  --fl-branch-yes: #2B4FCF;
  --fl-branch-no: #CE0000;
  --radius: 8px;
  --font: Arial, "メイリオ", Meiryo, "Yu Gothic", sans-serif;
  --mono: "Consolas", "BIZ UDGothic", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  display: flex;
  flex-direction: column;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- 上部（gemini-kit と同じ濃紺の 2 段。1 段目 = 名前・案件・状態・操作、2 段目 = 分類のタブ） ---- */
.topbar { background: var(--accent-strong); color: #fff; position: sticky; top: 0; z-index: 10; flex: none; }
.topbar-in { max-width: 1600px; margin: 0 auto; padding: 0 20px; display: flex; flex-wrap: wrap; align-items: center; column-gap: 16px; min-height: 44px; }
.brand { font-size: 16px; margin: 0; white-space: nowrap; letter-spacing: .02em; display: flex; align-items: center; color: #fff; }
.brand small { color: var(--head-text); font-weight: normal; margin-left: 8px; font-size: 12px; }
.project-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.project-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-name .btn { flex: none; font-weight: 400; }
.history-dialog { width: min(640px, 92vw); }
.topbar-status { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.topbar-actions { display: flex; gap: 8px; padding: 6px 0; }
/* 濃紺の上で読めるようにする上書き */
.topbar select { color: var(--ink); background: #fff; }
.topbar .muted { color: var(--head-text); }
.topbar .btn { background: transparent; border-color: var(--head-text); color: #fff; }
.topbar .btn:hover:not(:disabled) { background: rgba(255, 255, 255, .12); border-color: #fff; color: #fff; }
.topbar .btn.primary { background: #fff; border-color: #fff; color: var(--accent); font-weight: 600; }
.topbar .btn.primary:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
.topbar :focus-visible { outline-color: var(--gold); }

.tabs {
  display: flex; gap: 2px; padding: 0 20px;
  background: var(--panel); border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.tab {
  border: 0; background: none; cursor: pointer;
  padding: 10px 14px; color: var(--ink-2);
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab .count { margin-left: 6px; font-size: 12px; color: var(--high); font-weight: 600; }

.layout { flex: 1; display: flex; min-height: 0; }
.view { flex: 1; overflow: auto; padding: 20px 24px 60px; min-width: 0; }
.view:focus { outline: none; }
.detail {
  width: 420px; flex: none; overflow: auto;
  background: var(--panel); border-left: 1px solid var(--line);
  padding: 16px 20px 40px;
}

/* ---- 部品 ---- */
h2 { font-size: 18px; margin: 0 0 12px; }
h3 { font-size: 15px; margin: 20px 0 8px; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack > * + * { margin-top: 12px; }
.spacer { flex: 1; }

.btn {
  border: 1px solid var(--line); background: var(--panel);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); color: #fff; }
.btn.danger { color: var(--high); }
.btn.small { padding: 2px 8px; font-size: 12px; }
a.btn { text-decoration: none; display: inline-block; }

.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px;
}
.grid { display: grid; gap: 12px; }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.stat { display: flex; flex-direction: column; gap: 2px; cursor: pointer; text-align: left; }
.stat .num { font-size: 22px; font-weight: 700; }
.stat .lab { color: var(--ink-2); font-size: 12px; }

.badge {
  display: inline-block; padding: 0 7px; border-radius: 10px;
  font-size: 12px; line-height: 20px; white-space: nowrap;
  background: var(--line-2); color: var(--ink-2);
}
.badge.high { background: var(--high-soft); color: var(--high); }
.badge.mid { background: var(--mid-soft); color: var(--mid); }
.badge.low { background: var(--low-soft); color: var(--low); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.conf-guess { background: var(--mid-soft); color: var(--mid); border: 1px dashed var(--mid); }
.badge.conf-fact { background: var(--low-soft); color: var(--low); }
.badge.conf-confirmed { background: var(--ok-soft); color: var(--ok); }

.idlink {
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--accent); font-family: var(--mono); font-size: 12px;
  text-decoration: underline; text-underline-offset: 2px;
}
.idlink.dangling { color: var(--high); text-decoration: line-through; cursor: default; }

input[type="text"], input[type="search"], input[type="date"], select, textarea {
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: #fff;
}
textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; resize: vertical; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }

.notice { padding: 10px 14px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); }
.notice.warn { background: var(--mid-soft); }
.notice.error { background: var(--high-soft); color: var(--high); }
.empty { padding: 40px; text-align: center; color: var(--ink-3); }

/* ---- 表 ---- */
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
table.list { width: 100%; border-collapse: collapse; }
table.list th, table.list td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
table.list th { position: sticky; top: 0; background: var(--surface); font-weight: 600; font-size: 12px; color: var(--ink-2); z-index: 1; }
table.list th button { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; }
table.list tbody tr { cursor: pointer; }
table.list tbody tr:hover { background: var(--hover); }
table.list tbody tr.selected { background: var(--accent-soft); }
table.list td.title { max-width: 520px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }

/* ---- 詳細パネル ---- */
.detail-head { display: flex; align-items: flex-start; gap: 8px; }
.detail-head h2 { flex: 1; font-size: 16px; margin: 0; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; margin: 12px 0; }
.kv dt { color: var(--ink-3); font-size: 12px; padding-top: 1px; }
.kv dd { margin: 0; word-break: break-word; }
.body-text { white-space: pre-wrap; word-break: break-word; }
.source { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 6px 0; }
.ref-list { list-style: none; padding: 0; margin: 0; }
.ref-list li { padding: 4px 0; border-bottom: 1px solid var(--line-2); display: flex; gap: 8px; align-items: baseline; }

/* ---- 健康診断 ---- */
.finding { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.finding:hover { background: var(--hover); }
.finding .msg { flex: 1; }

/* ---- 取込 ---- */
.op-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 12px 14px; }
.op-card.rejected { background: var(--surface); border-style: dashed; }
.op-card.rejected .op-title::after { content: '（取り込まない）'; color: var(--ink-2); font-weight: 400; font-size: 12px; margin-left: 6px; }
.op-card.has-error { border-color: var(--high); opacity: 1; }
.op-card .op-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.op-card .op-title { font-weight: 600; flex: 1; }
.op-card ul.msgs { margin: 6px 0 0; padding-left: 18px; }
.op-card ul.msgs li.error { color: var(--high); }
.op-card ul.msgs li.warning { color: var(--mid); }
.diff { display: grid; grid-template-columns: 110px 1fr 18px 1fr; gap: 2px 8px; font-size: 13px; }
.diff .k { color: var(--ink-3); }
.diff .before { color: var(--ink-3); text-decoration: line-through; word-break: break-word; }
.diff .after { word-break: break-word; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.toggle button { border: 0; background: #fff; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.toggle button[aria-pressed="true"].accept { background: var(--ok); color: #fff; }
.toggle button[aria-pressed="true"].reject { background: var(--ink-2); color: #fff; }
.toggle button:disabled { cursor: not-allowed; }
.sticky-bar {
  position: sticky; bottom: -60px; margin: 16px -24px 0; padding: 12px 24px;
  background: var(--bg); border-top: 1px solid var(--line);
}

/* ---- 指示文 ---- */
.purpose-list { display: flex; flex-direction: column; gap: 4px; }
.purpose { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.purpose[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.purpose .t { font-weight: 600; display: block; }
.purpose .d { font-size: 12px; color: var(--ink-2); }
.prompt-layout { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
.prompt-preview { min-height: 480px; }

/* ---- 関係図 ---- */
.graph-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; }
svg.graph { display: block; }
svg.graph .col-title { font-size: 13px; font-weight: 600; fill: var(--ink-2); }
svg.graph .node rect { fill: #fff; stroke-width: 1.5; rx: 6; }
svg.graph .node text { font-size: 12.5px; fill: var(--ink); }
svg.graph .node .sub { font-size: 11px; fill: var(--ink-3); }
svg.graph .node { cursor: pointer; }
svg.graph .node.side-customer rect { stroke: var(--side-customer); }
svg.graph .node.side-own rect { stroke: var(--side-own); }
svg.graph .node.side-vendor rect { stroke: var(--side-vendor); }
svg.graph .node.side-system rect { stroke: var(--side-system); stroke-dasharray: 4 2; }
svg.graph .node.inactive rect { stroke-dasharray: 2 3; }
svg.graph .node.selected rect { stroke-width: 3; fill: var(--accent-soft); }
svg.graph .edge path { fill: none; stroke: var(--edge); stroke-width: 1.4; }
svg.graph .edge .elabel-bg { fill: #fff; opacity: .92; }
svg.graph .edge text { font-size: 11px; fill: var(--ink-2); }
svg.graph .dim { opacity: .28; }
svg.graph .hl path { stroke: var(--accent); stroke-width: 2.2; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend .sw { display: inline-block; width: 12px; height: 12px; border: 2px solid; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }

/* ---- 決定ログ ---- */
.decision { border-left: 3px solid var(--accent); padding: 8px 14px; background: var(--panel); border-radius: 0 var(--radius) var(--radius) 0; cursor: pointer; }
.decision.superseded { border-left-color: var(--ink-3); border-left-style: dashed; background: var(--surface); }
.decision .date { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.decision .alts { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); }

/* ---- 通知 ---- */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 6px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
.dropzone.over { outline: 2px dashed var(--accent); outline-offset: 4px; }

/* ---- 確認ダイアログ ---- */
dialog.dialog { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 24px; max-width: 460px; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
dialog.dialog::backdrop { background: rgba(20, 30, 45, .35); }
.dialog-msg { margin: 0 0 8px; font-weight: 600; white-space: pre-wrap; }
.dialog-actions { justify-content: flex-end; margin-top: 16px; }
.diff .span3 { grid-column: span 3; white-space: pre-wrap; word-break: break-word; }
.diff .arrow { color: var(--ink-3); }
.group-title { margin: 8px 0 2px; }
.steps { margin: 0 0 10px; padding-left: 20px; }
.import-summary { margin: 14px 0 8px; }
.detail-title { font-size: 16px; margin: 8px 0; }
.detail-actions { margin-top: 10px; }
.decision-title { font-weight: 600; margin: 2px 0 4px; }
.idref { display: inline-flex; gap: 2px; align-items: baseline; }
table.list th, table.list td { white-space: nowrap; }
table.list td.title { white-space: normal; min-width: 240px; }
.detail { width: 380px; }
svg.graph .edge path.hit { stroke: transparent; stroke-width: 10; cursor: pointer; }
.legend .sw-customer { border-color: var(--side-customer); }
.legend .sw-own { border-color: var(--side-own); }
.legend .sw-vendor { border-color: var(--side-vendor); }
.legend .sw-system { border-color: var(--side-system); border-style: dashed; }
.idlink { white-space: nowrap; }
.kv.wide { grid-template-columns: 72px 1fr; }
.goals { margin: 0; padding-left: 20px; }
.next-actions, .health-list { padding: 4px 0; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.detail { width: 340px; }
.lock { max-width: 560px; margin: 40px auto; }
.lock form input { flex: 1; }
.active-filters { margin: -4px 0 10px; }
table.list td.wrap { white-space: normal; min-width: 72px; }
.btn.small { min-height: 28px; }
input[type="checkbox"] { width: 16px; height: 16px; }
.recovery { border-color: var(--mid); }
svg.graph .arrowhead { fill: var(--edge); stroke: none; }
svg.graph .arrowhead.hl-head { fill: var(--accent); }
.groups { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 2px; border-top: 1px solid rgba(255, 255, 255, .12); }
.group { border: 0; border-bottom: 3px solid transparent; background: none; cursor: pointer; padding: 0 14px; min-height: 40px; color: var(--head-text); font-size: 14px; white-space: nowrap; }
.group:hover { color: #fff; }
.group[aria-current="true"] { color: #fff; font-weight: 700; border-bottom-color: var(--gold); }
.tabs { background: var(--panel); }
.sheet { list-style: none; padding: 0; margin: 0; }
.sheet-item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.sheet-item.answered { background: var(--ok-soft); }
.sheet-item textarea { flex: 1; font-family: var(--font); font-size: 13px; }
.sheet-title { font-weight: 600; }
.answer { margin: 6px 0 0; white-space: pre-wrap; }
.cand-list { list-style: none; padding: 0; margin: 0; }
.cand { background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 10px; flex-wrap: nowrap; }
.cand-text { flex: 1; }
.stat.active { border-color: var(--accent); background: var(--accent-soft); }
td.over { color: var(--high); font-weight: 600; }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.points { margin: 0; padding-left: 16px; }
tr.nocursor { cursor: default; }
.after-bl { margin-left: 6px; }
.scope-edit textarea { font-family: var(--font); font-size: 13px; }
/* ---- グラフ ---- */
.chart-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; padding: 8px; }
svg.chart .grid { stroke: var(--line-2); stroke-width: 1; }
svg.chart .axis { font-size: 11px; fill: var(--ink-2); }
svg.chart .axis-line { stroke: var(--line); }
svg.chart .today { stroke: var(--high); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg.chart .today-label { font-size: 11px; fill: var(--high); }
svg.line-chart .series { fill: none; stroke-width: 2.2; }
svg.line-chart path.s-pv { stroke: var(--edge); stroke-dasharray: 6 4; }
svg.line-chart path.s-ev { stroke: var(--accent); }
svg.line-chart path.s-ac { stroke: var(--mid); stroke-dasharray: 2 3; stroke-width: 2.6; }
svg.line-chart circle.pt { stroke: none; }
svg.line-chart circle.s-pv { fill: var(--edge); }
svg.line-chart circle.s-ev { fill: var(--accent); }
svg.line-chart circle.s-ac { fill: var(--mid); }
svg.line-chart .end-label { font-size: 12px; font-weight: 600; }
svg.line-chart text.s-pv { fill: var(--ink-2); }
svg.line-chart text.s-ev { fill: var(--accent); }
svg.line-chart text.s-ac { fill: var(--mid); }
svg.gantt .row-bg { fill: transparent; }
svg.gantt .grow:hover .row-bg, svg.gantt .grow.selected .row-bg { fill: var(--accent-soft); }
svg.gantt .grow { cursor: pointer; }
svg.gantt .row-label { font-size: 12.5px; fill: var(--ink); }
svg.gantt .summary .row-label { font-weight: 600; }
svg.gantt .bar { fill: var(--bar); stroke: var(--bar-line); }
svg.gantt .bar-progress { fill: var(--accent); }
svg.gantt .bar-summary { fill: var(--ink-2); }
svg.gantt .milestone { fill: var(--ink); }
svg.gantt .bar-note { font-size: 11px; fill: var(--ink-2); }
svg.gantt .delayed .bar { stroke: var(--high); stroke-width: 2; }
svg.gantt .delayed .bar-note { fill: var(--high); font-weight: 600; }
svg.gantt .dep { fill: none; stroke: var(--edge); stroke-width: 1.2; }
svg.gantt .dep-head { fill: var(--edge); }
.num-in { width: 72px; padding: 2px 6px; }
td.num { text-align: right; }
.linklike { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); font: inherit; text-align: left; }

.nested-lines div { padding: 1px 0; border-bottom: 1px dotted var(--line-2); }
.crud-table th.crud-col { text-align: center; white-space: normal; min-width: 92px; }
.crud-table th.crud-col.warn { background: var(--mid-soft); }
.crud-table th.crud-row { background: var(--surface); position: sticky; left: 0; z-index: 1; white-space: normal; min-width: 180px; }
.crud-table td.crud-cell { text-align: center; font-family: var(--mono); font-weight: 600; }
.crud-table td.crud-cell.on { background: var(--accent-soft); }
.crud-table td.crud-cell.c { background: var(--ok-soft); color: var(--ok); }
.target-list { max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: #fff; }
#project-switch { font-weight: 600; max-width: 420px; }
.settings-row { align-items: flex-end; }
span.over { color: var(--high); font-weight: 600; }
/* ---- 使い方 ---- */
.guide { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: start; }
.guide-toc { position: sticky; top: 0; display: flex; flex-direction: column; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
.toc-item { text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--ink); }
.toc-item:hover { background: var(--accent-soft); color: var(--accent); }
.guide-body { display: flex; flex-direction: column; gap: 32px; max-width: 980px; }
.guide-chapter > h2 { font-size: 19px; border-left: 4px solid var(--accent); padding-left: 10px; margin-bottom: 10px; }
.guide-chapter h3 { font-size: 15px; }
.guide-lead { font-size: 15px; line-height: 1.8; }
.guide-list { margin: 4px 0; padding-left: 18px; }
.guide-list li { margin: 4px 0; }
.guide-points .card h3 { margin-top: 0; color: var(--accent); }
.flow { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
.flow-card { flex: 1 1 180px; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.flow-num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.flow-title { font-weight: 700; font-size: 14.5px; }
.flow-desc { margin: 0; font-size: 13px; color: var(--ink-2); flex: 1; }
.flow-arrow { align-self: center; font-size: 22px; color: var(--accent); font-weight: 700; }
.tip h4 { margin: 0 0 4px; }
.phases { display: flex; flex-direction: column; gap: 12px; }
.phase-num { width: 26px; height: 26px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
.phase h3 { margin: 0; }
.phase-cols { display: grid; grid-template-columns: 1fr 1.4fr; gap: 16px; }
.phase-cols h4 { margin: 6px 0 2px; font-size: 13px; color: var(--ink-2); }
.purpose-item { margin: 6px 0; }
.open-wrap { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.screen-group h3 { margin: 16px 0 6px; }
.guide-table td.wrap { white-space: normal; }
.faq { display: flex; flex-direction: column; gap: 6px; }
.faq-item summary { cursor: pointer; font-weight: 600; }
.faq-item p { margin: 8px 0 0; }
.terms { display: grid; grid-template-columns: 200px 1fr; gap: 6px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.terms dt { font-weight: 600; }
.terms dd { margin: 0; color: var(--ink-2); }
.guide-back { margin-bottom: 12px; }
.guide-chapter > h2:focus { outline: none; }
.flow { flex-wrap: nowrap; }
.flow-card { flex: 1 1 0; min-width: 0; }
/* ---- 使い方の流れ図（gemini-kit の使い方にならう。色は変数だけ） ---- */
.fl-legend { list-style: none; padding: 0; margin: 0 0 8px; display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12.5px; align-items: center; }
.fl-now { border-left: 4px solid var(--accent); }
.fl-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; }
.fl-svg { display: block; max-width: none; font-family: var(--font); }
.fl-loop { fill: var(--hover); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 5; }
.fl-loop.is-now { stroke-width: 3; stroke-dasharray: 6 4; }
.fl-loop-label { font-size: 15px; font-weight: 700; fill: var(--accent); }
.fl-loop-sub { font-size: 12.5px; fill: var(--ink-2); }
.fl-edge { fill: none; stroke: var(--edge); stroke-width: 1.6; }
.fl-back { stroke-dasharray: 5 4; }
.fl-arrowhead { fill: var(--edge); }
.fl-elabel rect { fill: var(--panel); }
.fl-elabel text { font-size: 12px; fill: var(--ink-2); }
.fl-node { cursor: pointer; outline: none; }
.fl-node rect { fill: var(--panel); stroke: var(--accent); stroke-width: 1.6; }
.fl-node .fl-name { font-size: 14px; font-weight: 600; fill: var(--ink); }
.fl-node .fl-name.is-long { font-size: 13px; }
.fl-node .fl-where { font-size: 12px; fill: var(--ink-2); }
.fl-node.fl-todo rect, .fl-node.fl-optional rect { stroke: var(--ink-3); stroke-dasharray: 5 4; }

.fl-node.fl-active .fl-name { font-weight: 700; }
.fl-node:hover rect { fill: var(--hover); }
.fl-node:focus-visible rect { stroke: var(--gold); stroke-width: 3; stroke-dasharray: none; }
.fl-steps { display: flex; flex-direction: column; gap: 12px; }
.fl-step { scroll-margin-top: 12px; }
.fl-step.fl-step-active { border-color: var(--accent); border-width: 2px; }
.fl-step-head h3 { margin: 0; font-size: 16px; }
.fl-step-head h3:focus { outline: none; }
.fl-frames { display: flex; align-items: stretch; gap: 6px; margin: 10px 0; }
.fl-frame { flex: 1 1 0; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--surface); font-size: 12.5px; }
.fl-frame ul { margin: 0; padding-left: 16px; }
.fl-frame-h { margin: 0 0 4px; font-weight: 700; font-size: 12px; color: var(--ink-2); }
.fl-frame.fl-at { flex: 0 0 auto; background: var(--panel); }
.fl-arrow { align-self: center; color: var(--accent); font-weight: 700; }
.fl-how { margin: 6px 0; padding-left: 22px; font-size: 13.5px; }
.fl-how li { margin: 3px 0; }
.fl-actions { margin-top: 6px; }
.fl-timeline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.fl-tl-when { margin: 0 0 6px; font-weight: 700; color: var(--accent); }
.fl-tl-col ul { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.fl-tl-col li { margin: 6px 0; }
/* ---- 概要のダッシュボード（描画は dash.js。並べ方だけここで決める） ---- */
.dash-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 16px 0 12px; }
.dash-kpi { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.dash-kpi .dash-card { flex: 1; }
.dash-open { align-self: flex-start; }
.dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.dash-card { min-width: 0; overflow: hidden; }
#g-curve { margin-bottom: 12px; }
@media (max-width: 960px) {
  .dash-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash-grid { grid-template-columns: minmax(0, 1fr); }
}
/* ---- 資料の変換 ---- */
.cv-bar { margin: 12px 0 8px; }
.cv-card { margin-bottom: 10px; }
.cv-card.cv-ng { border-color: var(--high); }
.cv-name { word-break: break-all; }
.cv-pre { max-height: 360px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; }
.cv-preview summary, .cv-bundle summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
.cv-bundle { border-top: 1px dashed var(--line); padding-top: 8px; }
.cv-inspect { margin: 0; padding-left: 26px; }

tr.memo-raw td { color: var(--ink-2); font-style: italic; }
.mk-prefix { width: 8em; }
.pp-chart { min-width: 0; }
/* ---- KPI の木・リスク（P7a） ---- */
.kt-indent { display: inline-block; }
.kt-indent[data-depth="1"] { width: 16px; }
.kt-indent[data-depth="2"] { width: 32px; }
.kt-indent[data-depth="3"] { width: 48px; }
.kt-indent[data-depth="4"] { width: 64px; }
.kt-indent[data-depth="5"] { width: 80px; }
.kt-indent[data-depth="6"], .kt-indent[data-depth="7"], .kt-indent[data-depth="8"] { width: 96px; }
tr.kt-purpose td, tr.kt-goal td { background: var(--surface); }
.kt-table td.kt-name { white-space: normal; }
.rk-matrix td.rk-cell { padding: 3px; text-align: center; }
.rk-heat { border: 1px solid var(--line); border-radius: 6px; min-width: 56px; min-height: 40px; color: var(--ink); font-weight: 700; cursor: pointer; }
.rk-heat.is-on { outline: 3px solid var(--accent); outline-offset: 1px; }
.rk-heat-1 { background: var(--heat-1); }
.rk-heat-2 { background: var(--heat-2); }
.rk-heat-3 { background: var(--heat-3); }
.rk-heat-4 { background: var(--heat-4); }
.rk-score { display: inline-block; min-width: 32px; text-align: center; border-radius: 10px; padding: 0 6px; font-weight: 700; color: var(--ink); }
/* ---- 体制図・RACI（P7b） ---- */
.org-svg { display: block; font-family: var(--font); }
.org-col-title { font-size: 14px; font-weight: 700; fill: var(--ink-2); }
.org-group { font-size: 12px; font-weight: 700; fill: var(--accent); }
.org-node { cursor: pointer; outline: none; }
.org-node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.org-node:hover rect { fill: var(--hover); }
.org-node:focus-visible rect { stroke: var(--gold); stroke-width: 3; }
.org-node.is-selected rect { stroke: var(--accent); stroke-width: 2.4; fill: var(--accent-soft); }
.org-node.is-inactive rect { stroke-dasharray: 4 3; }
.org-node.is-inactive text { fill: var(--ink-3); }
.org-name { font-size: 13px; font-weight: 600; fill: var(--ink); }
.org-sub { font-size: 11.5px; fill: var(--ink-2); }
.org-edge { fill: none; stroke: var(--edge); stroke-width: 1.3; }
.org-edge.is-cross { stroke-dasharray: 5 4; }
.org-arrowhead { fill: var(--edge); }
.raci-table th.raci-col { text-align: center; white-space: normal; min-width: 72px; font-size: 12px; }
.raci-table th.raci-col.is-inactive { color: var(--ink-3); }
.raci-table th.raci-row { white-space: normal; min-width: 220px; font-weight: 400; text-align: left; }
.raci-table td.raci-cell { text-align: center; padding: 3px; }
.raci-btn { min-width: 36px; min-height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-weight: 700; cursor: pointer; color: var(--ink-2); }
.raci-btn:disabled { cursor: default; }
.raci-btn.role-R { background: var(--ok-soft); color: var(--ok); }
.raci-btn.role-A { background: var(--accent-soft); color: var(--accent); }
.raci-btn.role-C { background: var(--mid-soft); color: var(--mid); }
.raci-btn.role-I { background: var(--low-soft); color: var(--low); }
.raci-btn.is-derived { border-style: dashed; font-weight: 400; }
/* ---- 業務フロー・判断の図（P7c。src/ui/flowsvg.js） ---- */
.fl-svg { display: block; font-family: var(--font); }
.fl-bg { fill: #fff; }
.fl-title { font-size: 16px; font-weight: 700; fill: var(--accent-strong); }
.fl-lane { stroke: var(--line); stroke-width: 1; }
.fl-lane.is-a { fill: var(--lane-a); }
.fl-lane.is-b { fill: var(--lane-b); }
.fl-lane-head { fill: var(--lane-head); stroke: var(--line); stroke-width: 1; }
.fl-lane-bar { fill: var(--accent); }
.fl-lane-name { font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
.fl-edge-under { fill: none; stroke: #fff; stroke-width: 5; stroke-linejoin: round; }
.fl-edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.fl-edge.is-dashed { stroke-dasharray: 5 4; }
.fl-edge.tone-pos, .fl-edge.tone-neg { stroke-width: 1.8; }
.fl-arrowhead { fill: var(--edge); }
.fl-edge.tone-pos, .fl-edge-label.tone-pos { stroke: var(--fl-branch-yes); }
.fl-edge.tone-neg, .fl-edge-label.tone-neg { stroke: var(--fl-branch-no); }
.fl-arrowhead.tone-pos { fill: var(--fl-branch-yes); }
.fl-arrowhead.tone-neg { fill: var(--fl-branch-no); }
.fl-edge-label { font-weight: 700; fill: var(--ink-2); stroke: #fff; stroke-width: 3; paint-order: stroke; stroke-linejoin: round; }
.fl-edge-label.tone-pos { fill: var(--fl-branch-yes); stroke: #fff; }
.fl-edge-label.tone-neg { fill: var(--fl-branch-no); stroke: #fff; }
.fl-node { fill: #fff; stroke: var(--edge); }
.fl-node.type-start, .fl-node.type-data, .fl-node.type-doc { fill: var(--lane-head); }
.fl-node.type-end { fill: var(--lane-head); stroke: var(--accent-strong); }
.fl-node.type-decision { fill: var(--mid-soft); stroke: var(--gold); }
.fl-node.role-ai, .fl-sub-line.role-ai, .fl-legend-box.role-ai { stroke: var(--role-ai); }
.fl-node.role-rule, .fl-sub-line.role-rule, .fl-legend-box.role-rule { stroke: var(--role-rule); }
.fl-node.role-human, .fl-sub-line.role-human, .fl-legend-box.role-human { stroke: var(--role-human); }
.fl-node.role-ext, .fl-sub-line.role-ext, .fl-legend-box.role-ext { stroke: var(--role-ext); }
.fl-node.role-ai, .fl-node.role-rule, .fl-node.role-human, .fl-node.role-ext { fill: #fff; }
.fl-sub-line { stroke: var(--edge); stroke-width: 1.2; }
.fl-node-text { fill: var(--ink); text-anchor: middle; }
.fl-node-text.is-bold { font-weight: 700; }
.fl-note-no { font-size: 10px; font-weight: 700; fill: var(--mid); text-anchor: end; }
.fl-role-label { font-size: 10px; font-weight: 700; stroke: #fff; stroke-width: 3; paint-order: stroke; stroke-linejoin: round; }
.fl-role-label.role-ai, .fl-legend-role.role-ai { fill: var(--role-ai); }
.fl-role-label.role-rule, .fl-legend-role.role-rule { fill: var(--role-rule); }
.fl-role-label.role-human, .fl-legend-role.role-human { fill: var(--role-human); }
.fl-role-label.role-ext, .fl-legend-role.role-ext { fill: var(--role-ext); }
.fl-legend { font-size: 12px; fill: var(--ink); }
.fl-legend-box { fill: #fff; stroke-width: 1.5; }
.fl-legend-role { font-size: 12px; font-weight: 700; }
.fl-taken { fill: none; stroke: var(--bar); stroke-width: 9; stroke-linejoin: round; stroke-linecap: round; }
.fl-mark-frame { fill: none; stroke-width: 2.6; stroke-dasharray: 6 3; }
.fl-mark-frame.mark-open { stroke: var(--mid); }
.fl-mark-frame.mark-none { stroke: var(--high); }
.fl-current { fill: none; stroke: var(--accent); stroke-width: 4.5; }
.fl-visited { fill: none; stroke: var(--accent); stroke-width: 2.2; }
.fl-mark { stroke: #fff; stroke-width: 2; }
.fl-mark.mark-ok { fill: var(--ok); }
.fl-mark.mark-open { fill: var(--mid); }
.fl-mark.mark-none { fill: var(--high); }
.fl-mark-sym { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; pointer-events: none; }
.fl-hit { fill: transparent; stroke: none; cursor: pointer; outline: none; }
.fl-hit:focus-visible { stroke: var(--gold); stroke-width: 3; }
.fl-hit.is-focus { stroke: var(--gold); stroke-width: 2.4; }
/* ---- 業務フローの画面（P7c） ---- */
.bf-layout { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
.bf-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.bf-item { width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 6px 8px; cursor: pointer; color: var(--ink); font: inherit; }
.bf-item:hover { background: var(--hover); }
.bf-item.is-selected { border-color: var(--accent); background: var(--accent-soft); }
.bf-figure { overflow: auto; }
#bf-notation { width: 100%; font-family: var(--mono); font-size: 13px; }
@media (max-width: 900px) { .bf-layout { grid-template-columns: 1fr; } }
/* ---- 構成図（P7c） ---- */
.arch-svg { display: block; font-family: var(--font); }
.arch-col { font-size: 13px; font-weight: 700; fill: var(--ink-2); }
.arch-node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.4; }
.arch-node[role=button] { cursor: pointer; outline: none; }
.arch-node[role=button]:hover rect { fill: var(--hover); }
.arch-node:focus-visible rect { stroke: var(--gold); stroke-width: 3; }
.arch-node.is-self rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.arch-node.is-retired rect { stroke-dasharray: 5 4; }
.arch-node.is-selected rect { stroke: var(--accent); stroke-width: 2.6; }
.arch-name { font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
.arch-sub { font-size: 11px; fill: var(--ink-2); text-anchor: middle; }
.arch-edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.arch-arrowhead { fill: var(--edge); }
.arch-label { font-size: 11.5px; fill: var(--ink-2); stroke: #fff; stroke-width: 3; paint-order: stroke; stroke-linejoin: round; }
.arch-batch { font-size: 12px; fill: var(--ink); }
.btn.is-retired { border-style: dashed; }
/* ---- 判断・データ（P7c） ---- */
.jd-layout { display: grid; grid-template-columns: minmax(320px, 2fr) minmax(0, 3fr); gap: 16px; align-items: start; }
.jd-tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.jd-tab { border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 6px 0 0; background: var(--surface); padding: 6px 12px; cursor: pointer; color: var(--ink); font: inherit; display: inline-flex; gap: 6px; align-items: center; }
.jd-tab[aria-selected=true] { background: var(--panel); font-weight: 700; color: var(--accent); }
.jd-src { width: 100%; font-family: var(--mono); font-size: 13px; }
.jd-band { gap: 8px; }
.jd-figure { overflow: auto; }
.jd-log { margin: 0; padding-left: 1.6em; }
.jd-log-stop { color: var(--high); font-weight: 700; }
.jd-log-done { color: var(--ok); font-weight: 700; }
@media (max-width: 1000px) { .jd-layout { grid-template-columns: 1fr; } }

/* 写した部品: ~/.claude/skills/dashboard/assets/dash.css（2026-11-26 に写す）
   変えたところ: :root を styles.css へ移した・目盛線の灰色を var(--d-grid)・印刷用の枠の灰色を var(--d-mute) にした */
/* dashboard スキルの部品。依存ゼロ。
   色はデジタル庁デザインシステムの Blue パレット。変えたら scripts/contrast.mjs を通す。 */
/* :root の --d-* は src/styles.css の :root に移した（ワークベンチの色の決まりに合わせるため） */

.d-page {
  margin: 0;
  background: var(--d-bg);
  color: var(--d-text);
  font-family: var(--d-font);
  font-size: 16px;
  line-height: 1.6;
}

/* ---- 画面の枠 ---- */
.d-header {

// ---- vendor/dash.js ----
// 写した部品: ~/.claude/skills/dashboard/assets/dash.js（2026-11-26 に写す。gemini-kit も同じ部品を使う）

(function (root) {

  function setAttrs(n, attrs) {

    const h = m[1].length === 3 ? m[1].split('').map((c) => c + c).join('') : m[1];

  function textColor(color) {

  function fmt(v, digits) {
    if (v == null || Number.isNaN(v)) return '—';
    const d = digits != null ? digits : (Number.isInteger(v) || Math.abs(v) >= 100 ? 0 : 1);

      if (textW(cur + ch, size) > maxW && cur) { lines.push(cur); cur = ch; } else cur += ch;

    if (cur) lines.push(cur);

    hi = Math.ceil(hi / step - 1e-9) * step;
    if (hi <= lo) hi = lo + step;
    const ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(10));

  /** Largest-Triangle-Three-Buckets。形を保ったまま threshold 点に間引き、残す添字を返す */

    const idx = [0], every = (n - 2) / (threshold - 2);
    let a = 0;

      for (let j = s; j < e; j++) { ax += j; ay += values[j]; }
