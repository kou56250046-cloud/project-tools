// ---- ui/views/hearing.js ----
// ヒヤリング画面: 会議を選ぶ → ヒヤリングシート（その会議で聞く質問）→ その場で回答。候補を会議に割り当てる


const hearingState = { meetingId: null, picked: new Set(), drafts: {} };
const TYPE_VALUES = KINDS.meeting.fields.meetingType.values;

function meetings(ledger) {
  return ledger.items.filter((it) => it.kind === 'meeting').sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id.localeCompare(a.id));
}

// 既定の会議: 今日以降で最も近い予定の会議、無ければ最も新しい会議
function defaultMeeting(list, today) {
  const upcoming = list.filter((m) => m.status === 'planned' && m.date >= today).sort((a, b) => a.date.localeCompare(b.date));
  return (upcoming[0] || list[0] || {}).id || null;
}

function addMeetingForm(app) {
  const title = h('input', { type: 'text', id: 'mt-title', placeholder: '例: 第3回ヒヤリング（経理）', 'aria-label': '会議名' });
  const date = h('input', { type: 'date', id: 'mt-date', 'aria-label': '日付', value: todayStr() });
  const type = h('select', { id: 'mt-type', 'aria-label': '種類' }, TYPE_VALUES.map((t) => h('option', { value: t.v, selected: t.v === 'hearing', text: t.label })));
  return h('details', { class: 'card small' },
    h('summary', { text: '会議を追加する' }),
    h('div', { class: 'row' }, title, date, type,
      h('button', { class: 'btn', type: 'button', id: 'mt-add', onclick: () => {
        if (!title.value.trim()) { toast('会議名を入れてください'); return; }
        const r = store.applyLocal([{ op: 'add', item: { kind: 'meeting', title: title.value.trim(), date: date.value, meetingType: type.value, confidence: 'fact', sources: [{ type: 'other', ref: 'ヒヤリング画面で追加' }] } }], 'hearing');
        if (!r.ok) { toast(r.errors.join(' / ')); return; }
        hearingState.meetingId = r.ledger.items.at(-1).id;
        toast('会議を追加しました（取り消し可）');
        app.refresh();
      } }, '追加')));
}

function sheetRow(q, meeting, app) {
  const ledger = store.view();
  const answered = q.status !== 'open';
  const draft = hearingState.drafts[q.id] ?? q.answer ?? '';
  const ta = h('textarea', { rows: '2', 'data-fk': 'ans-' + q.id, 'aria-label': `${q.title} の回答`, placeholder: 'その場で回答を書く' });
  ta.value = draft;
  ta.addEventListener('input', () => { hearingState.drafts[q.id] = ta.value; });
  const save = () => {
    const ans = ta.value.trim();
    if (!ans) { toast('回答を書いてください'); ta.focus(); return; }
    const r = store.applyLocal([{ op: 'update', id: q.id, set: { answer: ans, status: 'answered', askedAt: q.askedAt || meeting.date || todayStr() } }], 'hearing');
    if (!r.ok) { toast(r.errors.join(' / ')); return; }
    delete hearingState.drafts[q.id];
    toast('回答済みにしました（取り消し可）');
  };
  return h('li', { class: ['sheet-item', answered && 'answered'], 'data-id': q.id },
    h('div', { class: 'row' },
      idButton(q.id, app), statusBadge(q.kind, q.status),
      h('strong', { class: 'sheet-title', text: q.title }),
      q.askTo ? h('span', { class: 'muted small', text: '質問先: ' + (itemTitle(q.askTo, ledger) || q.askTo) }) : h('span', { class: 'badge mid', text: '質問先なし' }),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn small', type: 'button', 'data-fk': 'unassign-' + q.id, onclick: () => {
        const r = store.applyLocal([{ op: 'update', id: q.id, set: { meeting: null } }], 'hearing');
        toast(r.ok ? 'このシートから外しました（取り消し可）' : r.errors.join(' / '));
      } }, 'シートから外す')),
    q.body ? h('p', { class: 'small body-text', text: q.body }) : null,
    answered
      ? h('p', { class: 'answer' }, h('span', { class: 'muted small', text: `回答（${q.askedAt || '日付不明'}）: ` }), q.answer || '（回答の記録なし）')
      : h('div', { class: 'row' }, ta, h('button', { class: 'btn primary small', type: 'button', 'data-fk': 'save-' + q.id, onclick: save }, '回答済みにする')));
}

function renderHearing(root, app) {
  const ledger = store.view();
  const today = todayStr();
  const list = meetings(ledger);
  if (!hearingState.meetingId || !list.some((m) => m.id === hearingState.meetingId)) hearingState.meetingId = defaultMeeting(list, today);

  root.appendChild(h('h2', { text: 'ヒヤリング' }));
  root.appendChild(addMeetingForm(app));

  if (!list.length) {
    root.appendChild(h('div', { class: 'empty', text: 'まだ会議がありません。上の「会議を追加する」から作るか、議事録を取り込んでください。' }));
  } else {
    const sel = h('select', { id: 'hearing-meeting', 'aria-label': '会議を選ぶ' },
      list.map((m) => h('option', { value: m.id, selected: m.id === hearingState.meetingId, text: `${m.date}　${m.title}（${enumLabel(TYPE_VALUES, m.meetingType)}・${statusLabel('meeting', m.status)}）` })));
    sel.addEventListener('change', () => { hearingState.meetingId = sel.value; hearingState.picked = new Set(); app.refresh(); });
    const m = list.find((x) => x.id === hearingState.meetingId);
    const sheet = ledger.items.filter((it) => it.kind === 'question' && it.meeting === m.id);
    const open = sheet.filter((q) => q.status === 'open').length;

    root.appendChild(h('section', { class: 'card stack' },
      h('div', { class: 'row' }, h('label', { class: 'row' }, '会議', sel), idButton(m.id, app)),
      h('div', { class: 'small row' },
        h('span', { class: 'muted', text: '出席者:' }),
        (m.attendees || []).length ? m.attendees.map((id) => idButton(id, app, { withTitle: true })) : h('span', { class: 'muted', text: '未登録' })),
      (m.agenda || []).length ? h('div', { class: 'small' }, h('span', { class: 'muted', text: '議題: ' }), m.agenda.join(' ／ ')) : null,
      h('div', { class: 'row' },
        h('button', { class: 'btn', type: 'button', id: 'hearing-minutes', onclick: () => app.go('prompts', { purpose: 'minutes', meetingId: m.id }) }, 'この会議の議事録の指示文を作る'),
        m.status === 'planned' ? h('button', { class: 'btn', type: 'button', id: 'hearing-held', onclick: () => {
          const r = store.applyLocal([{ op: 'update', id: m.id, set: { status: 'held' } }], 'hearing');
          toast(r.ok ? '開催済みにしました（取り消し可）' : r.errors.join(' / '));
        } }, '開催済みにする') : null)));

    root.appendChild(h('h3', { text: `ヒヤリングシート（${sheet.length}件 ／ 未回答 ${open}件）` }));
    root.appendChild(sheet.length
      ? h('ol', { class: 'sheet stack', id: 'hearing-sheet' }, sheet.map((q) => sheetRow(q, m, app)))
      : h('p', { class: 'muted', text: 'この会議で聞く質問はまだありません。下の候補から割り当ててください。' }));

    // 候補
    const cands = hearingCandidates(ledger, today);
    const label = { question: '未割り当ての質問', gap: '台帳の空欄', nfr: '非機能の未着手' };
    root.appendChild(h('h3', { text: `次のヒヤリングの候補（${cands.length}件）` }));
    if (!cands.length) {
      root.appendChild(h('p', { class: 'muted', text: '候補はありません。' }));
    } else {
      const items = cands.map((c) => h('li', { class: 'row cand' },
        h('input', { type: 'checkbox', id: 'cand-' + c.key.replace(/[^A-Za-z0-9_-]/g, '_'), 'data-fk': 'cand-' + c.key, checked: hearingState.picked.has(c.key), 'aria-label': c.text,
          onchange: (e) => { if (e.target.checked) hearingState.picked.add(c.key); else hearingState.picked.delete(c.key); app.refresh(); } }),
        h('span', { class: 'badge', text: label[c.type] }),
        h('span', { class: 'cand-text', text: c.text }),
        c.type !== 'nfr' ? idButton(c.ref, app) : null));
      root.appendChild(h('ul', { class: 'cand-list stack', id: 'hearing-cands' }, items));
      const n = cands.filter((c) => hearingState.picked.has(c.key)).length;
      root.appendChild(h('div', { class: 'row' },
        h('button', { class: 'btn small', type: 'button', onclick: () => { hearingState.picked = new Set(cands.map((c) => c.key)); app.refresh(); } }, 'すべて選ぶ'),
        h('button', { class: 'btn primary', type: 'button', id: 'hearing-assign', disabled: n === 0, onclick: () => {
          const ops = cands.filter((c) => hearingState.picked.has(c.key)).flatMap((c) => c.ops(m.id));
          const r = store.applyLocal(ops, 'hearing');
          if (!r.ok) { toast(r.errors.join(' / ')); return; }
          hearingState.picked = new Set();
          toast(`${n}件をこの会議に割り当てました（取り消し可）`);
        } }, `選んだ ${n} 件をこの会議に割り当てる`)));
    }
  }
}


// ---- ui/views/issues.js ----
// 課題と質問: ボール（誰の対応待ちか）ごとの件数と一覧。待ち日数の長い順


const issuesState = { ball: '' };

function openItemsByBall(ledger, today) {
  const rows = ledger.items
    .filter((it) => (it.kind === 'issue' || it.kind === 'question') && isOpen(it))
    .map((it) => ({ it, ball: ballOf(it, ledger), wait: waitDays(it, ledger, today), notAsked: notAskedYet(it, ledger) }));
  // 待ち日数の長い順。待ち日数の無いもの（まだ聞いていない）は後ろ
  rows.sort((a, b) => (b.wait ?? -1) - (a.wait ?? -1) || a.it.id.localeCompare(b.it.id));
  return rows;
}

function renderIssues(root, app) {
  const ledger = store.view();
  const today = todayStr();
  const rows = openItemsByBall(ledger, today);
  const limit = settingOf(ledger, 'ballWaitDays');

  root.appendChild(h('h2', { text: '課題と質問' }));
  root.appendChild(h('p', { class: 'muted small', text: `未完了の課題・質問を「誰の対応待ちか」で分けています。質問は質問先、課題は担当の立場で決まります。顧客待ちが ${limit} 日以上のものは健康診断にも出ます（日数は設定で変えられます）。` }));

  const counts = Object.fromEntries(BALL.map((b) => [b.v, rows.filter((r) => r.ball === b.v).length]));
  root.appendChild(h('div', { class: 'grid cols-4', id: 'ball-counts' }, BALL.map((b) => h('button', {
    class: ['card stat', issuesState.ball === b.v && 'active'], type: 'button', 'data-ball': b.v, 'aria-pressed': String(issuesState.ball === b.v),
    onclick: () => { issuesState.ball = issuesState.ball === b.v ? '' : b.v; app.refresh(); },
  }, h('span', { class: 'num', text: String(counts[b.v]) }), h('span', { class: 'lab', text: b.label })))));

  const shown = issuesState.ball ? rows.filter((r) => r.ball === issuesState.ball) : rows;
  root.appendChild(h('p', { class: 'muted small', id: 'issues-count', text: issuesState.ball ? `${BALL.find((b) => b.v === issuesState.ball).label}: ${shown.length}件（もう一度押すと全件）` : `全 ${rows.length}件` }));
  if (!shown.length) { root.appendChild(h('div', { class: 'empty', text: '該当する課題・質問はありません' })); return; }

  const thead = h('thead', null, h('tr', null, ['ID', '種別', '題名', '状態', '誰の対応待ちか', '相手', '待ち日数', '期限'].map((t) => h('th', { scope: 'col', text: t }))));
  const tbody = h('tbody', null, shown.map((r) => {
    const who = r.it.kind === 'question' ? r.it.askTo : r.it.owner;
    const over = r.ball === 'customer' && r.wait !== null && r.wait >= limit;
    return h('tr', {
      tabindex: '0', 'data-id': r.it.id, class: store.selectedId === r.it.id ? 'selected' : null, 'aria-label': `${r.it.id} ${r.it.title}`,
      onclick: () => app.openItem(r.it.id),
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); app.openItem(r.it.id); } },
    },
    h('td', { class: 'mono small', text: r.it.id }),
    h('td', null, h('span', { class: 'badge', text: kindLabel(r.it.kind) })),
    h('td', { class: 'title', text: r.it.title }),
    h('td', null, statusBadge(r.it.kind, r.it.status)),
    h('td', null, h('span', { class: ['badge', r.ball === 'customer' ? 'mid' : r.ball === 'unknown' ? 'high' : 'accent'], text: r.notAsked ? '自社（まだ聞いていない）' : BALL.find((b) => b.v === r.ball).label })),
    h('td', { class: 'small wrap', text: who ? (itemTitle(who, ledger) || who) : '未定' }),
    h('td', { class: ['small mono', over && 'over'], text: r.wait === null ? '—' : `${r.wait}日${over ? '（長い）' : ''}` }),
    h('td', { class: 'small mono', text: r.it.due || '' }));
  }));
  root.appendChild(h('div', { class: 'table-wrap' }, h('table', { class: 'list', id: 'issues-table' }, thead, tbody)));
}

// ---- ui/views/scope.js ----
// スコープ: ベースラインの記録、ベースラインと今の差、要望・要件の範囲の一覧


const scopeState = { baselineId: null };
const SCOPE_TONE = { in: 'ok', out: 'high', tbd: 'mid' };

function scopeBadge(scope) {
  const v = scope || 'tbd';
  return h('span', { class: `badge ${SCOPE_TONE[v]}`, text: enumLabel(SCOPE, v) });
}

function diffSection(title, rows, empty) {
  return h('section', { class: 'card' },
    h('h3', { text: `${title}（${rows.length}件）` }),
    rows.length ? h('ul', { class: 'ref-list' }, rows) : h('p', { class: 'muted small', text: empty }));
}

function renderScope(root, app) {
  const ledger = store.view();
  const bls = ledger.baselines || [];
  if (!scopeState.baselineId || !bls.some((b) => b.id === scopeState.baselineId)) scopeState.baselineId = bls.length ? bls[bls.length - 1].id : null;

  root.appendChild(h('h2', { text: 'スコープ' }));

  const name = h('input', { type: 'text', id: 'bl-name', placeholder: '例: 要件定義 合意版', 'aria-label': 'ベースラインの名前' });
  const date = h('input', { type: 'date', id: 'bl-date', value: todayStr(), 'aria-label': 'ベースラインの日付' });
  root.appendChild(h('section', { class: 'card stack' },
    h('h3', { text: 'ベースラインを記録する' }),
    h('p', { class: 'small muted', text: '今の要望・要件の ID・題名・範囲・状態を、名前と日付をつけて残します。合意した時点で記録すると、その後に増えた要望が分かります。' }),
    h('div', { class: 'row' }, name, date, h('button', { class: 'btn primary', type: 'button', id: 'bl-record', onclick: () => {
      if (!name.value.trim()) { toast('名前を入れてください'); name.focus(); return; }
      const id = store.recordBaseline(name.value.trim(), date.value || todayStr());
      scopeState.baselineId = id;
      toast(`ベースライン ${id} を記録しました（取り消し可）`);

// WBS: 作業の階層の表。親は子から集計。末端の作業は進捗と実績をその場で入力できる


function numInput(id, field, value, label, max) {
  const el = h('input', { type: 'number', class: 'num-in', min: '0', max: String(max), step: field === 'progress' ? '5' : '0.5', 'data-fk': `${field}-${id}`, 'aria-label': label, value: value == null ? '' : String(value) });
  el.addEventListener('change', () => {
    const v = el.value === '' ? null : Number(el.value);
    if (v !== null && (!Number.isFinite(v) || v < 0 || v > max || (field === 'progress' && !Number.isInteger(v)))) { toast(`${label}は 0〜${max}${field === 'progress' ? ' の整数' : ''}で入れてください`); el.value = value == null ? '' : String(value); return; }
    const r = store.applyLocal([{ op: 'update', id, set: { [field]: v } }]);
    toast(r.ok ? `${label}を更新しました（取り消し可）` : r.errors.join(' / '));
  });
  return el;
}

function renderWbs(root, app) {

// ---- ui/views/gantt.js ----
// ガント: 作業を日付の横棒で出す。今日の線・進捗・マイルストーン・前の作業からの矢印・遅れ


const ganttState = { unit: 'week' };

function renderGantt(root, app) {
  const ledger = visibleLedger(store.ledger, store.presentation);

  setTimeout(() => {

// ---- ui/views/data.js ----
// データ設計: ER 図・テーブル定義・DDL（方言を選んでコピー）・物理名の点検


// 文字幅の概算で箱に収まるように切る（全角 12.5px・半角 7px）
function clipText(str, maxW) {
  let w = 0;
  let out = '';
  for (const ch of String(str)) {
    w += ch.charCodeAt(0) > 0xff ? 12.5 : 7;
    if (w > maxW - 10) return out + '…';
    out += ch;
  }
  return out;
}

function erSvg(L, selectedId, app) {
  const svg = s('svg', { class: 'chart er', width: L.width, height: L.height, viewBox: `0 0 ${L.width} ${L.height}`, role: 'img', 'aria-label': 'ER 図' });
  svg.appendChild(s('defs', null, s('marker', { id: 'er-arrow', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' }, s('path', { d: 'M0,0 L10,5 L0,10 z', class: 'er-head' }))));
  for (const ln of L.lines) {
    const d = ln.points.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join(' ');

// CRUD 表: 機能（画面・連携・バッチ）× テーブル。作成されないテーブル・どの機能も触らないテーブルに印


function crudMatrix(ledger) {
  const funcs = ledger.items.filter((it) => ['screen', 'interface', 'batch'].includes(it.kind) && it.status !== 'dropped');
  const ents = ledger.items.filter((it) => it.kind === 'entity' && it.status !== 'dropped');
  const cell = new Map();
  for (const f of funcs) for (const c of f.crud || []) if (c && c.entity) cell.set(f.id + '|' + c.entity, c.ops);
  const created = new Set();
  const touched = new Set();
  for (const [k, ops] of cell) {
    const e = k.split('|')[1];
    touched.add(e);
    if (/C/.test(ops)) created.add(e);
  }
  return { funcs, ents, cell, created, touched };
}

function renderCrud(root, app) {
  const ledger = store.view();
  const m = crudMatrix(ledger);
  root.appendChild(h('h2', { text: 'CRUD 表' }));
  if (!m.funcs.length || !m.ents.length) { root.appendChild(h('div', { class: 'empty', text: '画面・連携・バッチとテーブルがそろうと表が出ます。' })); return; }
  root.appendChild(h('p', { class: 'muted small', text: 'C 作成・R 参照・U 更新・D 削除。列の見出しの「作成なし」は、どの機能からも作られないテーブル（外部参照のテーブルを除く）、「未使用」はどの機能も触らないテーブルです。' }));

    const noCreate = e.fileType !== 'external' && !m.created.has(e.id);
    const unused = !m.touched.has(e.id);
    return h('th', { scope: 'col', class: ['crud-col', (noCreate || unused) && 'warn'], 'data-entity': e.id },
      h('button', { type: 'button', class: 'linklike', onclick: () => app.openItem(e.id) }, e.title),
      h('div', { class: 'mono small muted', text: e.physicalName }),
      unused ? h('span', { class: 'badge high', text: '未使用' }) : noCreate ? h('span', { class: 'badge mid', text: '作成なし' }) : null,
      e.fileType === 'external' ? h('span', { class: 'badge', text: '外部' }) : null);
  }));
  const body = m.funcs.map((f) => h('tr', { class: 'nocursor', 'data-id': f.id },
    h('th', { scope: 'row', class: 'crud-row' }, h('button', { type: 'button', class: 'linklike', onclick: () => app.openItem(f.id) }, f.title), h('span', { class: 'badge small', text: kindLabel(f.kind) })),

    })));
  root.appendChild(h('div', { class: 'table-wrap' }, h('table', { class: 'list crud-table', id: 'crud-table' }, h('thead', null, head), h('tbody', null, body))));
}

// ---- ui/views/master.js ----
// マスタ点検: マスタのテーブルを選び、CSV / TSV を貼るかファイルを選んで、列の定義と突き合わせる
// 元データは顧客の実データになりうるため、この画面の変数にだけ置く。台帳・localStorage には渡さない。画面を離れると消す


const ENCODINGS = [{ v: 'auto', label: '自動（UTF-8 → Shift_JIS）' }, { v: 'utf-8', label: 'UTF-8' }, { v: 'shift_jis', label: 'Shift_JIS' }];
let masterState = null;
const fresh = () => ({ entityId: null, encoding: 'auto', main: null, refs: {}, result: null });

// 画面を離れたときに呼ぶ（元データを捨てる）
function clearMasterState() {
  masterState = null;
}

function dataInput(id, label, onLoad) {
  const ta = h('textarea', { rows: '6', id: id + '-text', 'aria-label': label, placeholder: 'CSV / TSV を貼り付けるか、下でファイルを選びます（1 行目は見出し）' });
  const file = h('input', { type: 'file', id: id + '-file', accept: '.csv,.tsv,.txt,text/csv', 'aria-label': label + 'のファイル' });
  file.addEventListener('change', async () => {
    const f = file.files[0];
    if (!f) return;
    const dec = decodeBytes(await f.arrayBuffer(), masterState.encoding);
    onLoad({ name: f.name, text: dec.text, encoding: dec.encoding });
  });
  const btn = h('button', { class: 'btn small', type: 'button', id: id + '-use', onclick: () => { if (ta.value.trim()) onLoad({ name: '貼り付け', text: ta.value, encoding: '貼り付け' }); } }, '貼った内容を使う');
  return h('div', { class: 'stack' }, ta, h('div', { class: 'row' }, file, btn));
}

function renderMaster(root, app) {
  if (!masterState) masterState = fresh();
  const st = masterState;
  const ledger = store.view();
  const ents = ledger.items.filter((it) => it.kind === 'entity' && it.status !== 'dropped');
  const masters = ents.filter((e) => e.master);
  root.appendChild(h('h2', { text: 'マスタ点検' }));
  root.appendChild(h('p', { class: 'notice small', text: '貼った元データはこの画面の中だけで点検し、台帳にもブラウザの保存にも残しません。別の画面に移ると消えます。' }));
  if (!masters.length) { root.appendChild(h('div', { class: 'empty', text: 'マスタの印のあるテーブルがありません。データ設計でテーブルを master: true にしてください。' })); return; }
  if (!st.entityId || !masters.some((e) => e.id === st.entityId)) st.entityId = masters[0].id;
  const ent = masters.find((e) => e.id === st.entityId);

  const sel = h('select', { id: 'master-entity', 'aria-label': '点検するマスタ' }, masters.map((e) => h('option', { value: e.id, selected: e.id === st.entityId, text: `${e.title}（${e.physicalName}）` })));
  sel.addEventListener('change', () => { masterState = { ...fresh(), entityId: sel.value, encoding: st.encoding }; app.refresh(); });
  const enc = h('select', { id: 'master-encoding', 'aria-label': 'ファイルの文字コード' }, ENCODINGS.map((x) => h('option', { value: x.v, selected: x.v === st.encoding, text: x.label })));
  enc.addEventListener('change', () => { st.encoding = enc.value; });
  root.appendChild(h('div', { class: 'row' }, h('label', { class: 'row' }, 'マスタ', sel), h('label', { class: 'row small' }, 'ファイルの文字コード', enc)));

  const run = () => {
    if (!st.main) return;
    const refData = new Map();
    for (const [eid, d] of Object.entries(st.refs)) {
      const rows = parseDelimited(d.text);
      if (rows.length) refData.set(eid, { header: rows[0], rows: rows.slice(1) });
    }
    st.result = checkMaster(ent, parseDelimited(st.main.text), refData, ents);
    toast(`点検しました（違反 ${st.result.total} 件）`);
    app.refresh();
  };
  root.appendChild(h('section', { class: 'card stack' },
    h('h3', { text: `点検する元データ（${ent.title}）` }),
    st.main ? h('p', { class: 'small', id: 'master-loaded', text: `読み込み済み: ${st.main.name}（${st.main.encoding}）` }) : null,
    dataInput('master-main', `${ent.title}の元データ`, (d) => { st.main = d; run(); })));

  // 外部キーの参照先（任意）
  const fkTargets = [...new Set((ent.columns || []).filter((c) => c.fk && c.fk.entity).map((c) => c.fk.entity))].map((id) => ents.find((e) => e.id === id)).filter(Boolean);
  if (fkTargets.length) {
    root.appendChild(h('details', { class: 'card' },
      h('summary', { text: `参照先の元データ（任意。入れると「参照先に無い値」を点検します）: ${fkTargets.map((e) => e.title).join('・')}` }),
      fkTargets.map((t) => h('div', { class: 'stack' },
        h('h4', { text: t.title + (st.refs[t.id] ? `（読み込み済み: ${st.refs[t.id].name}）` : '') }),
        dataInput('master-ref-' + t.id, `${t.title}の元データ`, (d) => { st.refs[t.id] = d; run(); })))));
  }

// ---- ui/views/trace.js ----
// トレーサビリティ: 要件ごとの 要望・設計・テストと判定。判定と工程で絞り込む


const traceState = { verdict: '', level: '' };
const TONE = { none: 'high', failed: 'high', pending: 'mid', passed: 'ok' };
const LEVELS = KINDS.test.fields.level.values;

// 工程で絞ったときは、その工程のテストだけで判定し直す
function judge(tests) {
  if (!tests.length) return 'none';
  if (tests.some((t) => t.status === 'failed')) return 'failed';
  if (tests.some((t) => t.status !== 'passed')) return 'pending';
  return 'passed';
}

function renderTrace(root, app) {
  const ledger = store.view();
  const rows = traceRows(ledger).map((r) => {
    const tests = traceState.level ? r.tests.filter((t) => t.level === traceState.level) : r.tests;
    return { ...r, tests, verdict: judge(tests) };
  });
  root.appendChild(h('div', { class: 'row' },
    h('h2', { text: 'トレーサビリティ（要件 → 設計 → テスト）' }),

  const counts = Object.fromEntries(VERDICTS.map((v) => [v.v, rows.filter((r) => r.verdict === v.v).length]));
  const sel = (id, label, value, options, on) => {
    const el = h('select', { id, 'aria-label': label }, options.map(([v, t]) => h('option', { value: v, selected: v === value, text: t })));

      onclick: () => { traceState.verdict = traceState.verdict === v.v ? '' : v.v; app.refresh(); },

  const thead = h('thead', null, h('tr', null, ['要件', '状態', '要望', '設計', 'テスト', '判定'].map((t) => h('th', { scope: 'col', text: t }))));

    h('td', { class: 'wrap small' }, refs(r.requests)),

// ---- ui/views/convert.js ----
// 資料の変換: ファイルを Markdown にする（Excel・CSV・JSON・Word・PowerPoint・HTML・md・txt）。
// 表は NotebookLM 用の一式（表の下ごしらえ）も作れる。PDF・画像は Gemini に貼る変換の指示文と、返事の点検。
// 結果は台帳にもブラウザにも保存しない。この画面のモジュールの中だけに持ち、ロックで消す（画面を離れても残す）


let convertState = { files: [], seq: 0 };
function clearConvertState() { convertState = { files: [], seq: 0 }; }

const KIND_LABEL = { xlsx: 'Excel', csv: 'CSV', tsv: 'TSV', json: 'JSON', docx: 'Word', pptx: 'PowerPoint', html: 'HTML', text: '文字（そのまま）', pdf: 'PDF', image: '画像', reject: '読めない形式' };
const PREVIEW_LINES = 200;
const MD_TYPE = 'text/markdown;charset=utf-8';
const sizeText = (n) => (n >= 1024 * 1024 ? `${(n / 1024 / 1024).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);

async function addFiles(list, app) {
  const today = todayStr();
  for (const f of list) {
    const id = ++convertState.seq;
    const entry = { id, name: f.name, size: f.size, kind: '', ok: false, reason: '', md: null, counts: '', tables: null };
    convertState.files.push(entry);
    try {
      const bytes = new Uint8Array(await f.arrayBuffer());
      const r = await convertFile(f.name, bytes, { today });
      Object.assign(entry, r);
      if (r.kind === 'pdf') entry.pages = pdfPageCount(bytes);
      if (r.kind === 'image') entry.pages = 1;
      if (r.tables && r.tables.length) entry.bundle = { table: 0, groupCol: '', format: 'md', size: 500, merge: true, ext: 'json' };
    } catch (e) {
      Object.assign(entry, { ok: false, kind: 'reject', reason: 'ファイルを読めませんでした（' + String(e && e.message || e) + '）' });
    }
  }
  app.refresh();
}

// 表の下ごしらえの一式（zip）
function saveBundle(entry) {
  const src = entry.tables[entry.bundle.table];
  const t = TABLEPREP.fromRows(src.rows, { name: baseName(entry.name) + (src.label ? '_' + src.label : ''), source: entry.name, sheet: src.label || '' });
  const o = entry.bundle;
  const files = TABLEPREP.bundle(t, { groupCol: o.groupCol || null, format: o.format, ext: o.ext, size: Math.max(1, +o.size || 500), date: todayStr(), merge: o.merge });
  download(`${TABLEPREP.fileSafe(t.name)}_NotebookLM.zip`, zipWrite(files), 'application/zip');
  toast(`${files.length} 個のファイルを zip にしました`);
}

function bundleBox(entry, app) {
  const o = entry.bundle;
  const src = entry.tables[o.table];
  const cols = src.rows[0] || [];
  const sel = (key, options, label) => {
    const el = h('select', { 'aria-label': label, 'data-fk': `b-${entry.id}-${key}` }, options.map(([v, t]) => h('option', { value: v, selected: String(o[key]) === String(v), text: t })));
    el.addEventListener('change', () => { o[key] = key === 'table' ? +el.value : el.value; if (key === 'table') o.groupCol = ''; app.refresh(); });
    return h('label', { class: 'field' }, label, el);
  };
  const chk = (key, label) => {
    const el = h('input', { type: 'checkbox', checked: !!o[key], 'data-fk': `b-${entry.id}-${key}` });
    el.addEventListener('change', () => { o[key] = el.checked; });
    return h('label', { class: 'row small' }, el, label);
  };
  const size = h('input', { type: 'number', min: '1', step: '100', value: String(o.size), class: 'num-in', 'aria-label': '1 ファイルの行数', 'data-fk': `b-${entry.id}-size` });
  size.addEventListener('change', () => { o.size = Math.max(1, +size.value || 500); });
  return h('details', { class: 'cv-bundle' },
    h('summary', { text: 'NotebookLM 用の一式（表の下ごしらえ）' }),
    h('p', { class: 'small muted', text: '項目定義書・集計（全行から計算済み）・代表サンプル・行数で分けたデータを zip で保存します。NotebookLM は大きな表の集計を間違えやすいため、集計はここで計算して渡します。' }),
    h('div', { class: 'row settings-row' },
      entry.tables.length > 1 ? sel('table', entry.tables.map((t, i) => [i, t.label || `表 ${i + 1}`]), entry.kind === 'json' ? '配列のキー' : 'シート') : null,
      sel('groupCol', [['', '（集計の軸なし）'], ...cols.map((c) => [c, c])], 'まとめる列（集計の軸）'),
      sel('format', [['md', 'Markdown'], ['json', 'JSON'], ['csv', 'CSV']], 'データの形式'),
      h('label', { class: 'field' }, '1 ファイルの行数', size)),
    h('div', { class: 'row' }, chk('merge', '定義・集計・サンプルを 1 ファイルにまとめる'),
      h('label', { class: 'row small' }, (() => { const el = h('input', { type: 'checkbox', checked: o.ext === 'txt', 'data-fk': `b-${entry.id}-ext` }); el.addEventListener('change', () => { o.ext = el.checked ? 'txt' : 'json'; }); return el; })(), 'JSON の拡張子を .txt にする')),
    h('button', { class: 'btn', type: 'button', 'data-fk': `b-${entry.id}-save`, onclick: () => saveBundle(entry) }, '一式を zip で保存'));
}

function geminiBox(entry, app) {
  const pages = h('input', { type: 'number', min: '1', value: entry.pages ? String(entry.pages) : '', class: 'num-in', 'aria-label': 'ページ数', 'data-fk': `g-${entry.id}-pages` });
  pages.addEventListener('change', () => { entry.pages = Math.max(1, Math.floor(+pages.value)) || null; });
  const reply = h('textarea', { rows: '6', 'aria-label': 'Gemini の返事', placeholder: 'Gemini の返事（```markdown の囲みごと）を貼ります。何回かに分かれたときは、つなげて貼ってください。', 'data-fk': `g-${entry.id}-reply` });
  reply.value = entry.reply || '';
  reply.addEventListener('input', () => { entry.reply = reply.value; });
  const r = entry.inspect;
  return h('div', { class: 'stack' },
    h('p', { class: 'small', text: 'PDF・画像はブラウザの中では文字にできません。変換の指示文をコピーし、ファイルと一緒に Gemini に貼ってください。Gemini は先に 5 つを選択肢で聞いてきます。答えると、要約せずに書き写した Markdown を返します。' }),

    h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', 'data-fk': `g-${entry.id}-check`, onclick: () => {
      if (!reply.value.trim()) { toast('返事を貼ってください'); return; }
      entry.inspect = inspectMarkdown(reply.value, { pages: entry.pages });

      app.refresh();
    } }, '点検する')),

      h('li', { text: !r.pageMarks ? 'ページの区切りの印がありません（印を入れない答えにした場合は点検しません）'
        : r.pageChecked ? (r.missing.length ? `抜けているページ: ${r.missing.join('・')}（印 ${r.pageMarks} 個 / ${r.pagesExpected} ページ）` : `全 ${r.pagesExpected} ページの印がそろっています`)
          : `ページの区切りの印 ${r.pageMarks} 個（ページ数を入れると抜けを点検します）` }),
      h('li', { text: `見出し ${r.headings}・表 ${r.tables}・[読めない] ${r.unreadable}` })) : null);
}

function fileCard(entry, app) {
  const actions = [];
  if (entry.md) {
    actions.push(
      h('button', { class: 'btn small', type: 'button', 'data-fk': `c-${entry.id}-save`, onclick: () => download(baseName(entry.name) + '.md', entry.md, MD_TYPE) }, 'md を保存'),
      h('button', { class: 'btn small', type: 'button', 'data-fk': `c-${entry.id}-copy`, onclick: async () => toast((await copyText(entry.md)) ? 'コピーしました' : 'コピーできませんでした') }, 'コピー'));
  }
  actions.push(h('button', { class: 'btn small', type: 'button', 'data-fk': `c-${entry.id}-remove`, onclick: () => { convertState.files = convertState.files.filter((x) => x !== entry); app.refresh(); } }, '一覧から外す'));
  const lines = entry.md ? entry.md.split('\n') : [];
  return h('section', { class: ['card', 'stack', 'cv-card', !entry.ok && 'cv-ng'], 'data-file': entry.id },
    h('div', { class: 'row' },
      h('strong', { class: 'cv-name', text: entry.name }),
      h('span', { class: ['badge', entry.ok ? 'accent' : 'high'], text: KIND_LABEL[entry.kind] || entry.kind }),
      h('span', { class: 'small muted', text: `${sizeText(entry.size)}${entry.counts ? '・' + entry.counts : ''}${entry.md ? `・${entry.md.length.toLocaleString()} 字` : ''}` }),
      h('span', { class: 'spacer' }), actions),
    !entry.ok ? h('p', { class: 'notice error small', role: 'alert', text: entry.reason }) : null,
    entry.kind === 'pdf' || entry.kind === 'image' ? geminiBox(entry, app) : null,
    entry.md ? h('details', { class: 'cv-preview', open: convertState.files.length === 1 },
      h('summary', { text: `md の先頭（${Math.min(PREVIEW_LINES, lines.length)} / ${lines.length} 行）` }),
      h('pre', { class: 'cv-pre', text: lines.slice(0, PREVIEW_LINES).join('\n') })) : null,
    entry.bundle ? bundleBox(entry, app) : null);
}

function saveAll() {
  const used = new Map();
  const files = [];
  for (const e of convertState.files) {
    if (!e.md) continue;
    let name = baseName(e.name) + '.md';
    if (used.has(name)) { const k = used.get(name) + 1; used.set(name, k); name = `${baseName(e.name)} (${k}).md`; } else used.set(name, 1);
    files.push({ name, data: e.md });
  }
  if (!files.length) { toast('保存できる md がありません'); return; }
  download(`資料の変換_${todayStr().replace(/-/g, '')}.zip`, zipWrite(files), 'application/zip');
  toast(`${files.length} 個の md を zip にしました`);
}

function renderConvert(root, app) {
  root.appendChild(h('h2', { text: '資料の変換' }));
  root.appendChild(h('p', { class: 'muted small', text: 'NotebookLM や Gemini に渡しやすいよう、資料を Markdown にします。Excel・CSV・JSON・Word・PowerPoint・HTML はこのブラウザの中で変換し、PDF・画像は Gemini に任せます。結果は保存しません（ロックすると消えます）。社外へ持ち出さないでください。' }));
  const input = h('input', { type: 'file', multiple: true, id: 'cv-file', 'aria-label': '変換するファイルを選ぶ' });
  input.addEventListener('change', () => { addFiles([...input.files], app); input.value = ''; });
  const zone = h('section', { class: 'card stack dropzone', id: 'cv-drop' },
    h('p', { class: 'small', text: 'ファイルを選ぶか、この枠にドラッグ&ドロップします（複数可・1 ファイル 30MB まで）。.xls・.doc・.ppt（古い形式）と暗号化されたファイルは読めません。' }),
    input);
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('over'); addFiles([...e.dataTransfer.files], app); });
  root.appendChild(zone);
  const fs = convertState.files;
  if (!fs.length) return;
  root.appendChild(h('div', { class: 'row cv-bar' },
    h('span', { class: 'small muted', text: `${fs.length} 件（md にできたもの ${fs.filter((x) => x.md).length} 件）` }),
    h('span', { class: 'spacer' }),
    h('button', { class: 'btn primary', type: 'button', id: 'cv-save-all', onclick: saveAll }, '全部を zip で保存'),
    h('button', { class: 'btn', type: 'button', id: 'cv-clear', onclick: () => { clearConvertState(); app.refresh(); } }, '一覧を空にする')));
  for (const e of fs) root.appendChild(fileCard(e, app));
}

let memosState = { draft: { title: '', memoType: 'chat', channel: '', tags: '', text: '' }, parsed: null, selected: new Set(), filter: { memoType: '', channel: '', from: '', to: '', tag: '' } };
function clearMemosState() {
  memosState = { draft: { title: '', memoType: 'chat', channel: '', tags: '', text: '' }, parsed: null, selected: new Set(), filter: { memoType: '', channel: '', from: '', to: '', tag: '' } };
}

const memoTypes = () => KINDS.memo.fields.memoType.values;
const memoTotal = (ledger) => ledger.items.filter((it) => it.kind === 'memo').reduce((a, it) => a + String(it.body || '').length, 0);
const fileSafeName = (s) => String(s || '案件').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
const ymd = () => todayStr().replace(/-/g, '');

// メモを台帳に足す（前処理の画面からも使う）。戻り値 { ok, id? }
async function saveMemo(app, { title, memoType, channel, tags, body, from, to }) {
  if (!store.ledger) { toast('案件を開くとメモにできます'); return { ok: false }; }
  if (!String(title || '').trim()) { toast('題名を入れてください'); return { ok: false }; }
  if (body.length > MEMO_BODY_MAX) { toast(`本文が ${body.length.toLocaleString()} 字あります。メモは ${MEMO_BODY_MAX.toLocaleString()} 字までです。期間を分けてください`); return { ok: false }; }
  const total = memoTotal(store.ledger) + body.length;
  if (total > MEMO_TOTAL_WARN && !(await confirmDialog(`この案件のメモの本文が合計 ${total.toLocaleString()} 字になります。`, 'それでも保存する',
    `目安の ${MEMO_TOTAL_WARN.toLocaleString()} 字を超えます。保存の中ではおよそ 4 倍の大きさになり、ブラウザの保存の上限（5MB）に近づきます。要らないメモを書き出してから消してください。`))) return { ok: false };
  const item = { kind: 'memo', title: String(title).trim(), memoType, body, status: 'active' };
  if (channel) item.channel = String(channel).trim();
  if (from) item.from = from;
  if (to) item.to = to;
  const tg = String(tags || '').split(/[,、\s]+/).map((x) => x.trim()).filter(Boolean);
  if (tg.length) item.tags = tg;
  const r = store.applyLocal([{ op: 'add', tempId: 'new:memo', item }], 'local');
  if (!r.ok) { toast(r.errors.join(' / ')); return { ok: false }; }
  const id = r.idMap.get('new:memo') || null;
  toast('メモにしました（取り消し可）');
  return { ok: true, id };
}

// ---- ui/views/preprocess.js ----
// 議事録の前処理: 文字起こし（Teams の VTT・txt、Meet、話者:本文）を 1 行 1 発言に整える（gemini-kit の前処理と同じ規則）。
// 結果は保存しない（ロックで消す）。「メモとして台帳に入れる」で台帳のメモにできる（50,000 字を超えるときは分ける）


let preprocessState = { items: [], seq: 0, paste: '' };
function clearPreprocessState() { preprocessState = { items: [], seq: 0, paste: '' }; }

const PREVIEW = 200;
const RATE_WARN = 0.8;

function addResult(name, text) {
  const r = TRANSCRIPT.clean(text);
  preprocessState.items.push({ id: ++preprocessState.seq, name, result: r, title: name ? baseName(name) : `貼り付け ${todayStr()}` });
}

// 行の区切りで、上限を超えないように分ける
function splitBody(body, max) {
  const parts = [];
  let cur = '';
  for (const line of body.split('\n')) {
    const add = cur ? `${cur}\n${line}` : line;
    if (add.length > max && cur) { parts.push(cur); cur = line; } else cur = add;
  }
  if (cur) parts.push(cur);
  return parts;
}

async function toMemo(app, it) {
  const body = it.result.out.replace(/\n+$/, '');
  const parts = body.length > MEMO_BODY_MAX ? splitBody(body, MEMO_BODY_MAX) : [body];
  if (parts.length > 1 && !(await confirmDialog(`${body.length.toLocaleString()} 字あり、メモの上限（${MEMO_BODY_MAX.toLocaleString()} 字）を超えています。`, `${parts.length} 件のメモに分けて保存する`,
    `行の区切りで分け、題名を「${it.title}（1/${parts.length}）」のようにします。`))) return;
  for (let i = 0; i < parts.length; i++) {
    const title = parts.length > 1 ? `${it.title}（${i + 1}/${parts.length}）` : it.title;
    const r = await saveMemo(app, { title, memoType: 'transcript', channel: '', tags: '', body: parts[i], from: '', to: '' });
    if (!r.ok) return;
  }
}

function resultCard(app, it) {
  const r = it.result;
  const s = r.stats;
  const lines = r.out.split('\n');
  const title = h('input', { type: 'text', value: it.title, 'aria-label': 'メモにするときの題名', 'data-fk': `pp-${it.id}-title` });
  title.addEventListener('input', () => { it.title = title.value; });
  const chart = h('div', { class: 'pp-chart' });
  const card = h('section', { class: 'card stack', 'data-pp': it.id },
    h('div', { class: 'row' },
      h('strong', { text: it.name || '貼り付け' }),
      h('span', { class: 'badge accent', text: r.format }),
      h('span', { class: 'small muted', text: `発言 ${s.utterances} 件・読めなかった行 ${s.unparsed} 件・読めた割合 ${Math.round(s.rate * 100)}%・${r.out.length.toLocaleString()} 字` }),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn small', type: 'button', 'data-fk': `pp-${it.id}-save`, onclick: () => download(`${it.name ? baseName(it.name) : `前処理_${todayStr().replace(/-/g, '')}`}.clean.txt`, r.out, 'text/plain;charset=utf-8') }, '.clean.txt を保存'),
      h('button', { class: 'btn small', type: 'button', 'data-fk': `pp-${it.id}-copy`, onclick: async () => toast((await copyText(r.out)) ? 'コピーしました' : 'コピーできませんでした') }, 'コピー'),
      h('button', { class: 'btn small', type: 'button', 'data-fk': `pp-${it.id}-remove`, onclick: () => { preprocessState.items = preprocessState.items.filter((x) => x !== it); app.refresh(); } }, '一覧から外す')),
    s.rate < RATE_WARN ? h('p', { class: 'notice warn small', text: '形式が想定と違う可能性があります（読めた行が 8 割未満）。読めなかった行は本文のまま残しています。' }) : null,
    chart,
    h('details', { class: 'cv-preview' }, h('summary', { text: `本文の先頭（${Math.min(PREVIEW, lines.length)} / ${lines.length} 行）` }), h('pre', { class: 'cv-pre', text: lines.slice(0, PREVIEW).join('\n') })),
    h('div', { class: 'row' },
      h('label', { class: 'field' }, 'メモにするときの題名', title),
      h('button', { class: 'btn', type: 'button', 'data-fk': `pp-${it.id}-memo`, disabled: !store.ledger, title: store.ledger ? '' : '案件を開くとメモにできます', onclick: () => toMemo(app, it) }, 'メモとして台帳に入れる'),
      store.ledger ? null : h('span', { class: 'small muted', text: '案件を開くとメモにできます' })));
  return { card, chart, stats: s };
}

function renderPreprocess(root, app) {
  root.appendChild(h('h2', { text: '議事録の前処理' }));
  root.appendChild(h('p', { class: 'muted small', text: 'Teams（VTT・txt）・Meet の文字起こしを、1 行 1 発言（時刻 話者｜本文）に整え、つなぎ言葉（えー・あのー など）を除きます。結果は保存しません（ロックすると消えます）。整えた本文を「議事録の取込」の指示文に貼るか、メモにします。' }));

// マスキング: 表（CSV・TSV・Excel・貼り付け）の個人や会社の情報を、列ごとの規則で伏せる（gemini-kit のマスキングと同じ規則）。
// 対応表（元の値と伏せた値）は保存しない。この画面のモジュールの中だけに持ち、ロックか「対応表を空にする」で消す


let maskState = { name: '', rows: null, rules: null, header: true, inText: true, result: null, state: MASK.newState(), sheets: null, sheet: 0, paste: '' };
function clearMaskState() {
  maskState = { name: '', rows: null, rules: null, header: true, inText: true, result: null, state: MASK.newState(), sheets: null, sheet: 0, paste: '' };
}

const maskYmd = () => todayStr().replace(/-/g, '');
const srcName = () => (maskState.name ? baseName(maskState.name) : '貼り付け');

function loadRows(rows, name) {
  if (!rows || !rows.length || !rows[0].length) { toast('表が空です'); return; }
  maskState.rows = rows;
  maskState.name = name;
  maskState.result = null;
  inferRules();
}
function inferRules() {
  const rows = maskState.rows;
  const body = maskState.header ? rows.slice(1) : rows;
  const width = Math.max(...rows.map((r) => r.length));
  maskState.rules = Array.from({ length: width }, (_, c) => MASK.infer(maskState.header ? rows[0][c] || '' : '', body.map((r) => r[c] || '')));
}

async function loadMaskFile(f, app) {
  const bytes = new Uint8Array(await f.arrayBuffer());
  const kind = (await detectKind(f.name, bytes)).kind;
  try {
    if (kind === 'xlsx') {
      maskState.sheets = (await XLSX.sheets(bytes)).filter((s) => s.rows.length);
      maskState.sheet = 0;
      if (!maskState.sheets.length) { toast('シートが空です'); return; }
      loadRows(maskState.sheets[0].rows, f.name);
    } else if (kind === 'csv' || kind === 'tsv' || kind === 'text') {
      maskState.sheets = null;
      loadRows(MASK.parseTable(decodeText(bytes).text), f.name);
    } else { toast('表のファイル（CSV・TSV・Excel）を選んでください'); return; }
  } catch (e) { toast(String(e && e.message || e)); return; }
  app.refresh();
}

  if (!maskState.rows) return;

  // 列ごとの規則

  root.appendChild(h('section', { class: 'card stack', id: 'mk-rules' },
    h('div', { class: 'row' }, h('h3', { text: `列ごとの伏せ方（${srcName()}・${body.length} 行）` }), sheetSel),
    h('div', { class: 'table-wrap' }, h('table', { class: 'list' },
      h('thead', null, h('tr', null, ['列', '値の例（先頭 3 件）', '伏せ方', '仮名の頭'].map((t) => h('th', { scope: 'col', text: t })))),
      h('tbody', null, maskState.rules.map((rule, c) => {
        const sel = h('select', { 'aria-label': `列 ${c + 1} の伏せ方`, 'data-fk': `mk-rule-${c}` }, Object.entries(MASK.RULES).map(([k, v]) => h('option', { value: k, selected: k === rule.rule, text: v })));
        sel.addEventListener('change', () => { rule.rule = sel.value; app.refresh(); });
        const pre = rule.rule === 'pseudo' ? (() => { const el = h('input', { type: 'text', value: rule.prefix || '', 'aria-label': `列 ${c + 1} の仮名の頭`, class: 'mk-prefix', 'data-fk': `mk-pre-${c}` }); el.addEventListener('input', () => { rule.prefix = el.value; }); return el; })() : h('span', { class: 'muted', text: '－' });
        const ex = [...new Set(body.map((r) => r[c]).filter((v) => String(v || '').trim()))].slice(0, 3).join(' ／ ');
        return h('tr', { class: 'nocursor' }, h('td', { text: maskState.header ? rows[0][c] || `列${c + 1}` : `列${c + 1}` }), h('td', { class: 'wrap small', text: ex }), h('td', null, sel), h('td', null, pre));
      })))),
    h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', id: 'mk-run', onclick: () => {
      maskState.result = MASK.apply(maskState.rows, maskState.rules, maskState.state, { header: maskState.header, replaceInText: maskState.inText });
      app.refresh();
    } }, '伏せる'))));

  const res = maskState.result;
  if (!res) return;
  const out = res.rows;
  root.appendChild(h('section', { class: 'card stack', id: 'mk-out' },
    h('div', { class: 'row' },
      h('h3', { text: '伏せた表' }),

      h('button', { class: 'btn', type: 'button', id: 'mk-copy', onclick: async () => toast((await copyText(MASK.toTSV(out))) ? 'コピーしました（Excel に貼れる形）' : 'コピーできませんでした') }, 'コピー'),
      h('button', { class: 'btn', type: 'button', id: 'mk-tsv', onclick: () => download(`${srcName()}_masked_${maskYmd()}.tsv`, MASK.toTSV(out) + '\n', 'text/tab-separated-values;charset=utf-8') }, 'TSV を保存'),
      h('button', { class: 'btn', type: 'button', id: 'mk-csv', onclick: () => download(`${srcName()}_masked_${maskYmd()}.csv`, MASK.toCSV(out), 'text/csv;charset=utf-8') }, 'CSV を保存'),
      h('button', { class: 'btn', type: 'button', id: 'mk-map', onclick: () => download(`対応表_社外秘_${srcName()}_${maskYmd()}.csv`, MASK.mappingCSV(res.mapping), 'text/csv;charset=utf-8') }, `対応表を保存（${res.mapping.length} 件）`)),

        : h('li', { text: '「そのまま」にした列に、会社名・メール・電話番号らしき文字は見つかりませんでした' })),
    h('div', { class: 'table-wrap' }, h('table', { class: 'list' },
      h('tbody', null, out.slice(0, 51).map((r, i) => h('tr', { class: 'nocursor' }, r.map((v) => h(i === 0 && maskState.header ? 'th' : 'td', { text: v }))))))),

// ---- ui/views/kpi-tree.js ----
// KPI の木: 目的 → ゴール → KPI（→ 子の KPI）→ 施策（要望）→ 要件。字下げの表と、Dash.flow（上から下）の図
// 組み立ては core/kpi.js。KPI は Gemini の差分（指示文「目的と KPI の整理」）で足す


const FLOW_MAX = 40;

function renderKpiTree(root, app) {
  const ledger = store.view();
  const t = kpiTree(ledger);
  root.appendChild(h('h2', { text: 'KPI の木' }));
  root.appendChild(h('p', { class: 'muted small', text: '目的 → ゴール → KPI → 施策（KPI と関連でつながる要望）→ 要件 のつながりです。ゴールは案件情報のゴールの文です。KPI は「指示文」の「目的と KPI の整理」で Gemini に作らせて取り込みます。' }));
  root.appendChild(h('div', { class: 'row' },
    h('button', { class: 'btn', type: 'button', onclick: () => app.go('prompts', { purpose: 'kpi' }) }, '指示文「目的と KPI の整理」を開く')));

  // 字下げの表
  const rows = [];
  const row = (depth, kind, item, extra, cls) => rows.push(h('tr', { class: ['kt-row', cls, item && store.selectedId === item.id && 'selected'], 'data-id': item ? item.id : null, onclick: item ? () => store.select(item.id) : null },
    h('td', { class: 'kt-name' }, h('span', { class: 'kt-indent', 'data-depth': String(depth) }), h('span', { class: 'badge', text: kind }), ' ', item ? h('span', { class: 'mono small', text: item.id + ' ' }) : null, h('span', { text: item ? item.title : extra.title })),
    h('td', { class: 'small', text: extra.metric || '' }),
    h('td', { class: 'small', text: extra.value || '' }),
    h('td', null, item ? statusBadge(item.kind, item.status) : null)));
  const kpiRows = (n, depth) => {
    const k = n.kpi;
    row(depth, 'KPI', k, { metric: [k.metric, k.unit ? `（${k.unit}）` : ''].join(''), value: `${k.baseline || '?'} → ${k.target || '?'}` });
    for (const r of n.requests) {
      row(depth + 1, '施策', r.request, {});
      for (const q of r.requirements) row(depth + 2, '要件', q, {});
    }
    for (const q of n.directRequirements) row(depth + 1, '要件（直接）', q, {});
    for (const c of n.children) kpiRows(c, depth + 1);
  };
  rows.push(h('tr', { class: 'kt-row kt-purpose nocursor' }, h('td', { colspan: '4' }, h('strong', { text: '目的: ' }), t.purpose || '（案件情報に目的がありません）')));
  for (const r of t.roots) {
    rows.push(h('tr', { class: 'kt-row kt-goal nocursor' }, h('td', { colspan: '4' }, h('span', { class: 'kt-indent', 'data-depth': '1' }), h('span', { class: 'badge accent', text: 'ゴール' }), ' ', r.goal)));
    if (!r.nodes.length) rows.push(h('tr', { class: 'nocursor' }, h('td', { colspan: '4', class: 'small muted' }, h('span', { class: 'kt-indent', 'data-depth': '2' }), 'このゴールの KPI はまだありません')));
    for (const n of r.nodes) kpiRows(n, 2);
  }
  if (t.unassigned.length) {
    rows.push(h('tr', { class: 'kt-row kt-goal nocursor' }, h('td', { colspan: '4' }, h('span', { class: 'kt-indent', 'data-depth': '1' }), h('span', { class: 'badge', text: 'ゴール' }), ' （ゴール未設定）')));
    for (const n of t.unassigned) kpiRows(n, 2);
  }
  root.appendChild(h('div', { class: 'table-wrap' }, h('table', { class: 'list kt-table' },
    h('thead', null, h('tr', null, ['項目', '指標', '現状値 → 目標値', '状態'].map((x) => h('th', { scope: 'col', text: x })))),
    h('tbody', null, rows))));

  // 図（Dash.flow・上から下）。項目が多いときは表だけ
  const Dash = window.Dash;
  if (!Dash) return;
  if (t.count > FLOW_MAX) { root.appendChild(h('p', { class: 'small muted', text: `項目が ${t.count} 件あり多いため、表だけ出しています（図は ${FLOW_MAX} 件まで）` })); return; }
  const nodes = [];
  const edges = [];
  const seen = new Set();
  const add = (id, label, kind) => { if (!seen.has(id)) { seen.add(id); nodes.push({ id, label, kind }); } };
  const walk = (n, from) => {
    const k = n.kpi;
    add(k.id, `${k.title}（${k.target || '?'}）`, 'step');
    edges.push({ from, to: k.id });
    for (const r of n.requests) {
      add(r.request.id, `${kindLabel('request')}: ${r.request.title}`, 'step');
      edges.push({ from: k.id, to: r.request.id });
      for (const q of r.requirements) { add(q.id, `${kindLabel('requirement')}: ${q.title}`, 'end'); edges.push({ from: r.request.id, to: q.id }); }
    }
    for (const q of n.directRequirements) { add(q.id, `${kindLabel('requirement')}: ${q.title}`, 'end'); edges.push({ from: k.id, to: q.id }); }
    for (const c of n.children) walk(c, k.id);
  };
  t.roots.forEach((r, i) => { const gid = 'goal-' + i; add(gid, `ゴール: ${r.goal}`, 'start'); for (const n of r.nodes) walk(n, gid); });
  if (t.unassigned.length) { add('goal-none', 'ゴール未設定', 'start'); for (const n of t.unassigned) walk(n, 'goal-none'); }
  if (!nodes.length) return;
  const host = h('section', { class: 'card dash-card', id: 'kt-flow' });
  root.appendChild(host);
  Dash.flow(host, { title: 'KPI の木（図）', nodes, edges, direction: 'TB', asOf: todayStr(), source: `台帳 rev ${ledger.revision}`, empty: 'まだありません' });
}

      h('span', { class: ['badge', f.phase === 'tobe' ? 'accent' : 'low'], text: enumLabel(bfPhases(), f.phase) }), ' ',

    const phase = h('select', { 'aria-label': '現行・導入後', 'data-fk': 'bf-new-phase' }, bfPhases().map((p) => h('option', { value: p.v, selected: p.v === bizflowState.newPhase, text: p.label })));
    phase.addEventListener('change', () => { bizflowState.newPhase = phase.value; });
    left.appendChild(h('section', { class: 'card stack', id: 'bf-new' },

      h('div', { class: 'row' },
        h('button', { class: 'btn', type: 'button', id: 'bf-create', onclick: () => {

// ---- ui/views/arch.js ----
// 構成図: 台帳のシステム・連携・バッチから、データの流れを自動で描く（配置は core/arch.js）
// 真ん中に案件のシステム、左に受信元、右に送信先。バッチは真ん中の箱の下、連携の無いシステムは図の下


function archBox(box, label, sub, opts = {}) {
  const g = s('g', { class: ['arch-node', opts.self && 'is-self', box.dashed && 'is-retired', opts.id && store.selectedId === opts.id && 'is-selected'], 'data-id': opts.id || null,
    tabindex: opts.id ? '0' : null, role: opts.id ? 'button' : null, 'aria-label': opts.id ? label + (sub ? `（${sub}）` : '') : null });
  g.appendChild(s('rect', { x: box.x, y: box.y, width: box.w, height: box.h, rx: 6 }));
  g.appendChild(s('text', { class: 'arch-name', x: box.x + box.w / 2, y: box.y + (sub ? 23 : 33) }, label));
  if (sub) g.appendChild(s('text', { class: 'arch-sub', x: box.x + box.w / 2, y: box.y + 41 }, sub));
  if (opts.id) {
    const go = () => store.select(opts.id);
    g.addEventListener('click', go);
    g.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
  }
  return g;
}

function renderArch(root, app) {
  const ledger = store.view();
  const L = archLayout(ledger);
  root.appendChild(h('h2', { text: '構成図' }));
  root.appendChild(h('p', { class: 'muted small', text: '台帳のシステム・連携・バッチから自動で描きます。左が受信元、右が送信先です。同じ相手・同じ向きの連携は 1 本の線にまとめています。直すときは「画面・連携」や項目の詳細で連携の相手・向きを変えます。' }));
  if (L.empty) { root.appendChild(h('div', { class: 'empty', text: 'まだありません（システムと連携を足すと、ここに描きます）' })); return; }

  const svg = s('svg', { class: 'arch-svg', viewBox: `0 0 ${L.width} ${L.height}`, width: L.width, height: L.height, role: 'img', 'aria-label': '構成図' });
  svg.appendChild(s('defs', null, s('marker', { id: 'arch-arrow', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, s('path', { class: 'arch-arrowhead', d: 'M0,1 L10,5 L0,9 z' }))));
  svg.appendChild(s('text', { class: 'arch-col', x: ARCH_BOX.margin, y: 22 }, '受信元（こちらへ送ってくる）'));
  svg.appendChild(s('text', { class: 'arch-col', x: L.width - ARCH_BOX.margin, y: 22, 'text-anchor': 'end' }, '送信先（こちらから送る）'));
  for (const e of L.edges) {
    svg.appendChild(s('path', { class: 'arch-edge', d: `M${e.from[0]},${e.from[1]} L${e.to[0]},${e.to[1]}`, 'marker-end': 'url(#arch-arrow)' }));
    // ラベルは相手の箱の側に寄せて縦に並べる
    const lines = [...e.labels, ...(e.more ? [`ほか ${e.more} 件`] : [])];
    const x = e.direction === 'in' ? e.from[0] + 8 : e.to[0] - 8;
    const y0 = e.from[1] - 6 - (lines.length - 1) * ARCH_BOX.labelH;
    lines.forEach((t, k) => svg.appendChild(s('text', { class: 'arch-label', x, y: y0 + k * ARCH_BOX.labelH, 'text-anchor': e.direction === 'in' ? 'start' : 'end' }, t)));
  }
  for (const b of [...L.left, ...L.right]) svg.appendChild(archBox(b, b.system.title + b.mark, b.system.id, { id: b.system.id }));
  svg.appendChild(archBox(L.self, L.self.label, 'この案件', { self: true }));
  if (L.batches.length) {
    svg.appendChild(s('text', { class: 'arch-col', x: L.self.x, y: L.batchTop + 12 }, `バッチ（${L.batches.length} 件）`));
    L.batches.forEach((b, k) => svg.appendChild(s('text', { class: 'arch-batch', x: L.self.x + 6, y: L.batchTop + 30 + k * 17 }, `・${b.title}${b.frequency ? `（${b.frequency}）` : ''}`)));
  }
  root.appendChild(h('div', { class: 'graph-wrap', id: 'arch-chart' }, svg));
  if (L.unlinked.length) root.appendChild(h('section', { class: 'card stack', id: 'arch-unlinked' },
    h('h3', { text: `連携の無いシステム（${L.unlinked.length} 件）` }),
    h('div', { class: 'row' }, L.unlinked.map((u) => h('button', { class: ['btn', 'small', u.system.status === 'retired' && 'is-retired'], type: 'button', onclick: () => store.select(u.system.id) }, `${u.system.id} ${u.system.title}${u.mark}`)))));
}

function orgSvg(ledger) {
  const g = orgLayout(ledger);
  const svg = s('svg', { class: 'org-svg', viewBox: `0 0 ${g.width} ${g.height}`, width: String(g.width), height: String(g.height), role: 'img', 'aria-label': '体制図' });
  svg.appendChild(s('defs', null, s('marker', { id: 'org-arrow', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse' }, s('path', { class: 'org-arrowhead', d: 'M0,0L10,5L0,10Z' }))));
  const pos = new Map();
  for (const col of g.columns) {
    svg.appendChild(s('text', { class: 'org-col-title', x: String(col.x), y: '18' }, col.label));
    for (const gr of col.groups) {
      svg.appendChild(s('text', { class: 'org-group', x: String(col.x), y: String(gr.y + 14) }, gr.org));
      for (const n of gr.nodes) pos.set(n.id, n);
    }
  }
  // 線（上長 → 部下）。同じまとまりの中は左の縦線から、別のまとまり・列への線は破線
  for (const e of g.edges) {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) continue;
    const d = e.cross
      ? `M${a.x + a.w},${a.y + a.h / 2}C${a.x + a.w + 30},${a.y + a.h / 2} ${b.x - 30},${b.y + b.h / 2} ${b.x},${b.y + b.h / 2}`
      : `M${a.x + 8},${a.y + a.h}V${b.y + b.h / 2}H${b.x}`;
    svg.appendChild(s('path', { class: ['org-edge', e.cross && 'is-cross'], d, 'marker-end': 'url(#org-arrow)' }));
  }
  for (const n of pos.values()) {
    const p = n.item;
    const gEl = s('g', { class: ['org-node', p.status === 'inactive' && 'is-inactive', store.selectedId === p.id && 'is-selected'], tabindex: '0', role: 'button', 'aria-label': `${p.title}（${p.role || '役割なし'}）`, 'data-id': p.id });
    gEl.appendChild(s('rect', { x: String(n.x), y: String(n.y), width: String(n.w), height: String(n.h), rx: '6' }));
    gEl.appendChild(s('text', { class: 'org-name', x: String(n.x + 10), y: String(n.y + 19) }, p.title + (n.cycle ? '（上長が循環）' : '')));
    gEl.appendChild(s('text', { class: 'org-sub', x: String(n.x + 10), y: String(n.y + 36) }, [p.role, p.teamRole ? enumLabel(TEAM_ROLES, p.teamRole) : ''].filter(Boolean).join('・') || '—'));
    const go = () => store.select(p.id);
    gEl.addEventListener('click', go);
    gEl.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
    svg.appendChild(gEl);
  }
  return svg;
}

function flowDiagram(st) {
  const svg = s('svg', { class: 'fl-svg', viewBox: '0 0 1040 520', width: '1040', height: '520', 'aria-labelledby': 'fl-summary' });
  svg.appendChild(s('defs', null, s('marker', { id: 'fl-arrow', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' },
    s('path', { class: 'fl-arrowhead', d: 'M0,0L10,5L0,10Z' }))));
  // 繰り返しの枠
  svg.appendChild(s('rect', { class: ['fl-loop', st && st.loopActive && 'is-now'], x: LOOP_BOX.x, y: LOOP_BOX.y, width: LOOP_BOX.w, height: LOOP_BOX.h, rx: '18' }));
  svg.appendChild(s('text', { class: 'fl-loop-label', x: '400', y: '58' }, FLOW_TEXT.loopLabel));
  svg.appendChild(s('text', { class: 'fl-loop-sub', x: '600', y: '58' }, FLOW_TEXT.loopSub));
  // 線
  for (const e of FLOW_EDGES) {
    const p = EDGE_PATHS[e.from + '>' + e.to];
    if (!p) continue;
    svg.appendChild(s('path', { class: ['fl-edge', e.back && 'fl-back'], d: p.d, 'marker-end': 'url(#fl-arrow)' }));
    if (e.label && p.at) {
      const [x, y] = p.at;
      const w = e.label.length * 12 + 10;
      const g = s('g', { class: 'fl-elabel', transform: p.rot ? `rotate(-90 ${x} ${y})` : null });
      g.appendChild(s('rect', { x: x - w / 2, y: y - 10, width: w, height: '20', rx: '4' }));
      g.appendChild(s('text', { x, y: y + 4, 'text-anchor': 'middle' }, e.label));
      svg.appendChild(g);
    }
  }
  // 箱（FLOW_STEPS の順に足す。Tab で回る順になる）
  for (const step of FLOW_STEPS) {
    const [x, y] = POS[step.id];
    const state = st ? st.status[step.id] : null;
    const mark = state ? FLOW_TEXT.marks[state] : '';
    const where = WHERE[step.where] + (state === 'active' ? '・今ここ' : '');
    const label = (mark ? mark.split(' ')[0] + ' ' : '') + step.label;
    const g = s('g', {
      class: ['fl-node', state && 'fl-' + state, `fl-where-${step.where}`],
      role: 'button', tabindex: '0', 'data-step': step.id,
      'aria-label': `${step.label}（${WHERE[step.where]}${state ? '・' + mark.split(' ').slice(1).join(' ') : ''}）。押すと説明に移ります`,
    });
    g.appendChild(s('rect', { x, y, width: BW, height: BH, rx: step.kind === 'step' ? '8' : String(BH / 2) }));
    g.appendChild(s('text', { class: ['fl-name', label.length > 11 && 'is-long'], x: x + BW / 2, y: y + 24, 'text-anchor': 'middle' }, label));
    g.appendChild(s('text', { class: 'fl-where', x: x + BW / 2, y: y + 44, 'text-anchor': 'middle' }, where));
    const go = () => focusStep(step.id);
    g.addEventListener('click', go);
    g.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
    svg.appendChild(g);
  }
  return svg;
}

};

const NEEDS_LEDGER = new Set(VIEWS.filter((v) => !NO_LEDGER_OK.includes(v.id)).map((v) => v.id));
// 再描画をまたいで保つスクロール位置（画面の中の横スクロール領域も含む）
const SCROLLERS = ['#view', '.graph-wrap', '.table-wrap', '#detail'];

// フォーカスしている要素を、再描画後に探し直せる形で覚える
function focusSelector(el) {
  if (!el || el === document.body || !el.closest) return null;
  if (!el.closest('#view, #detail, #tabs, #groups, .topbar')) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  if (el.dataset && el.dataset.fk) return `[data-fk="${CSS.escape(el.dataset.fk)}"]`;
  if (el.dataset && el.dataset.id) return `${el.tagName.toLowerCase()}[data-id="${CSS.escape(el.dataset.id)}"]`;
  return null;
}

function captureUi() {
  const scroll = SCROLLERS.map((sel) => { const e = document.querySelector(sel); return e ? [sel, e.scrollTop, e.scrollLeft] : null; }).filter(Boolean);
  return { scroll, focus: focusSelector(document.activeElement) };
}

function restoreUi(st) {
  for (const [sel, top, left] of st.scroll) {
    const e = document.querySelector(sel);
    if (e) { e.scrollTop = top; e.scrollLeft = left; }
  }
  if (st.focus) {
    const f = document.querySelector(st.focus);
    if (f) f.focus({ preventScroll: true });
  }
}

const app = {
  view: 'overview',
  viewOpts: {},
  opener: null,
  // 画面を切り替える（先頭から表示する）
  go(view, opts) {
    if (!VIEWS.some((v) => v.id === view) || hiddenInPresentation(view)) view = 'overview';
    const same = view === this.view;
    // マスタ点検の元データは、画面を離れたら捨てる（保存しない）
    if (!same && this.view === 'master') clearMasterState();
    this.view = view;
    this.viewOpts = opts || {};
    if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
    if (same) { this.refresh(); return; }
    renderAll();
    document.getElementById('view').scrollTop = 0;
    const cur = document.querySelector('#tabs [aria-current="page"]');
    if (cur && document.activeElement && document.activeElement.closest && document.activeElement.closest('#tabs, #groups')) cur.focus();
  },
  // 同じ画面を描き直す（スクロール位置とフォーカスを保つ）
  refresh() {
    const st = captureUi();
    renderAll();
    restoreUi(st);
  },
  openItem(id) {
    this.opener = focusSelector(document.activeElement);
    store.select(id);
    const t = document.getElementById('detail-title');
    if (t) t.focus({ preventScroll: true });
  },
  closeDetail() {
    const back = this.opener;
    store.select(null);
    if (back) { const e = document.querySelector(back); if (e) e.focus({ preventScroll: true }); }
  },
  // 画面を開けるか。タブのボタンと使い方のボタンの両方がこれを使う。戻り値: { ok, reason }
  canOpen(viewId) {
    if (!VIEWS.some((v) => v.id === viewId)) return { ok: false, reason: 'その画面はありません' };
    if (locked()) return viewId === 'guide' ? { ok: true } : { ok: false, reason: '合言葉で開いてから使えます' };
    if (!store.ledger && NEEDS_LEDGER.has(viewId)) return { ok: false, reason: '先に「設定」で案件を作るか、読み込んでください' };
    if (hiddenInPresentation(viewId)) return { ok: false, reason: '説明用の表示中は開けません' };
    return { ok: true };
  },
  views() { return VIEWS; },
  health() {
    // 説明用の表示では健康診断を出さない（社内向けの点検のため）
    return store.ledger && !store.presentation ? runHealth(store.ledger, todayStr()) : [];
  },
};

// 説明用の表示で開けない画面（道具の分類と健康診断）
function hiddenInPresentation(viewId) {
  if (!store.presentation) return false;
  return hiddenScreenInPresentation(VIEWS.find((x) => x.id === viewId));
}

function locked() {
  return store.vaultState === 'locked' || store.vaultState === 'legacy';
}

// 分類ごとに最後に開いた画面（分類を押したときに戻る先）
const lastInGroup = {};

function renderTabs() {
  const groupsEl = clear(document.getElementById('groups'));
  const tabs = clear(document.getElementById('tabs'));
  if (locked()) return;
  const highCount = app.health().filter((f) => f.severity === 'high').length;
  const curView = VIEWS.find((v) => v.id === app.view);
  lastInGroup[curView.group] = curView.id;
  for (const g of GROUPS) {
    const views = VIEWS.filter((v) => v.group === g.id && !hiddenInPresentation(v.id));
    if (!views.length) continue;
    groupsEl.appendChild(h('button', {
      class: 'group', type: 'button', id: 'group-' + g.id, 'aria-current': g.id === curView.group ? 'true' : null,
      onclick: () => app.go(lastInGroup[g.id] || (g.id === 'grasp' ? 'overview' : views[0].id)),
    }, g.label));
  }
  for (const v of VIEWS.filter((x) => x.group === curView.group && !hiddenInPresentation(x.id))) {
    // 台帳が無いときの「概要」タブは押せてようこそ画面を出す（初回の入口）
    const disabled = !app.canOpen(v.id).ok && !(v.id === 'overview' && !store.ledger);
    tabs.appendChild(h('button', {
      class: 'tab', type: 'button', id: 'tab-' + v.id, 'aria-current': app.view === v.id ? 'page' : null, disabled,
      onclick: () => app.go(v.id),
    }, v.label, v.id === 'health' && highCount ? h('span', { class: 'count', text: String(highCount), 'aria-label': `（重要度 高 ${highCount}件）` }) : null));
  }
}

// 取り消しの段の種類の表示名
const STEP_LABELS = { import: '取込', local: '画面での変更', hearing: 'ヒヤリング', settings: '設定', baseline: 'ベースライン', reset: '中身を空に戻す' };

// 取り消しの履歴: 新しい順に出し、「ここまで戻す」でその変更の前まで一度に戻す
function historyDialog() {
  const steps = store.history();
  const total = steps.length;
  const dlg = h('dialog', { class: 'dialog history-dialog', id: 'history-dialog', 'aria-labelledby': 'history-title' },
    h('h2', { id: 'history-title', text: '取り消しの履歴' }),
    h('p', { class: 'small muted', text: `直近 ${total} 件（最大 ${UNDO_LIMIT} 件）。再読み込み・ロックで消えます。案件を切り替えても残ります。` }),
    h('div', { class: 'table-wrap' }, h('table', { class: 'list' },
      h('thead', null, h('tr', null, ['いつ', 'どこから', '件数', ''].map((t) => h('th', { scope: 'col', text: t })))),
      h('tbody', null, steps.map((st, n) => h('tr', { class: 'nocursor', 'data-step': String(st.index) },
        h('td', { class: 'mono small', text: fmtDateTime(st.at) }),
        h('td', { text: STEP_LABELS[st.kind] || st.kind }),
        h('td', { class: 'num', text: st.kind === 'reset' ? '—' : `${st.count} 件` }),
        h('td', null, h('button', { class: 'btn small', type: 'button', 'data-fk': 'undo-to-' + st.index, onclick: async () => {
          const lost = total - st.index;
          close();
          const ok = await confirmDialog('この変更の前まで戻します。', 'ここまで戻す',
            `この変更を含め、新しい方から ${lost} 段の変更が失われ、やり直せません。`);
          if (ok && store.undoTo(st.index)) toast(`${lost} 段取り消しました`);
        } }, n === 0 ? 'これを取り消す' : 'ここまで戻す'))))))),
    h('div', { class: 'row dialog-actions' }, h('button', { class: 'btn', type: 'button', 'data-act': 'cancel', onclick: () => close() }, '閉じる')));
  function close() { dlg.close(); dlg.remove(); }
  dlg.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
  document.body.appendChild(dlg);
  dlg.showModal();
}

  if (store.vaultState === 'unlocked') {
    actions.appendChild(h('button', {
      class: 'btn', type: 'button', id: 'btn-lock', disabled: store.passChanging, title: store.passChanging ? '合言葉を変えている間はロックできません' : '台帳と鍵をメモリから消し、合言葉を入れるまで開けないようにする',
      onclick: () => { store.lock(); toast('ロックしました'); },
    }, 'ロック'));
  }
}

function renderView() {
  const root = clear(document.getElementById('view'));
  if (locked()) {
    // ロック中でも使い方だけは読める（案件のデータは出さない）
    if (app.view === 'guide') {
      root.appendChild(h('div', { class: 'row guide-back' }, h('button', { class: 'btn', type: 'button', id: 'guide-back-lock', onclick: () => app.go('overview') }, '← 合言葉の画面に戻る')));
      renderGuide(root, app, app.viewOpts);
    } else renderLock(root, app);
    return;
  }
  if (store.loadError) root.appendChild(h('p', { class: 'notice error', text: store.loadError }));
  if (store.saveError) root.appendChild(h('p', { class: 'notice error', text: store.saveError }));
  const v = VIEWS.find((x) => x.id === app.view);
  if (!store.ledger && NEEDS_LEDGER.has(v.id)) {
    renderWelcome(root);
    return;
  }
  v.render(root, app, app.viewOpts);
}

function renderWelcome(root) {
  root.appendChild(h('div', { class: 'card stack welcome' },
    h('h2', { text: '案件ワークベンチへようこそ' }),
    h('p', { text: 'まだ台帳がありません。上の「＋ 新しい案件」か「設定」から新しい案件を作るか、「設定」で書き出した台帳ファイルを読み込んでください。' }),
    h('p', { class: 'muted small', text: '台帳は合言葉で暗号化してこのブラウザの中に保存し、書き出したファイルにも保存できます。外部へは一切送信しません。' }),
    h('div', { class: 'row' },
      h('button', { class: 'btn primary', type: 'button', onclick: () => app.go('settings') }, '設定を開く'),
      h('button', { class: 'btn', type: 'button', id: 'welcome-guide', onclick: () => app.go('guide') }, '使い方を見る'))));
}

function renderAll() {
  renderTabs();
  renderTopbar();
  renderView();
  renderDetail(document.getElementById('detail'), app);
}

function boot() {
  // 他人のページの枠の中では動かない（クリックジャッキング対策。GitHub Pages ではヘッダで防げないため）
  if (window.top !== window.self) {
    document.body.textContent = 'このツールは単独のタブで開いてください。';
    return;
  }
  store.init();
  const fromHash = location.hash.replace('#', '');
  app.view = VIEWS.some((v) => v.id === fromHash) ? fromHash : 'overview';
  store.subscribe((reason) => {
    if (reason === 'select') {
      // 選んだ項目を画面の中でも強調する画面は、描き直す
      if (['graph', 'list', 'data', 'gantt', 'wbs', 'issues', 'scope', 'changes', 'functions', 'tests', 'arch'].includes(app.view)) app.refresh();
      else renderDetail(document.getElementById('detail'), app);
      return;
    }
    if (reason === 'save-error') { renderTopbar(); return; }
    if (reason === 'lock') { clearConvertState(); clearMemosState(); clearPreprocessState(); clearMaskState(); clearBizflowState(); clearJudgeState(); return; }   // ロックのときだけ、資料の変換の結果を消す（続く vault の通知で描き直す）
    if (reason === 'vault') { clearMasterState(); clearJudgeState(); }   // 案件の切り替えでも判断・データの入力を消す
    if (reason === 'presentation' && hiddenInPresentation(app.view)) { app.go('overview'); return; }
    app.refresh();
  });
  window.addEventListener('hashchange', () => {
    const id = location.hash.replace('#', '');
    if (id !== app.view && VIEWS.some((v) => v.id === id)) app.go(id);
    else if (hiddenInPresentation(id)) app.go('overview');
  });
  // Esc で詳細パネルを閉じる（ダイアログが開いているときはダイアログ側が受ける）
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && store.selectedId && !document.querySelector('dialog[open]')) { e.preventDefault(); app.closeDetail(); }
  });
  // 自動確認用の入口。URL に ?debug を付けたときだけ公開する（普段は台帳をメモリから取り出せないようにする）
  if (new URLSearchParams(location.search).has('debug')) {
    window.__workbench = { store, app, core: { createLedger, validatePatch, extractJson } };
  }
  renderAll();
}

boot();

})();
</script>
</body>
</html>
