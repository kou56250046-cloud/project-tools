  for (const p of validated.ops) delete p._newId;
  next.revision = ledger.revision + 1;
  next.updatedAt = now;
  if (changes.length) appendChange(next, { rev: next.revision, at: now, source, changes });
  return { ledger: next, idMap, applied };
}

// 仮に適用して、項目をまたぐ検査で新しく出る誤りを調べる（取込の「適用」を押せるかの判定）
function previewPatch(ledger, validated, accepted, now) {
  const r = applyPatch(ledger, validated, accepted, now);
  return { ...r, integrityErrors: newIntegrityErrors(ledger, r.ledger) };
}

// 画面の内部から作る差分（詳細パネルでの変更など）を検証して適用する
function applyLocalOps(ledger, ops, now, source = 'local') {
  const v = validatePatch({ type: 'ledger-patch', schemaVersion: SCHEMA_VERSION, ops }, ledger);
  const errs = [...v.errors, ...v.ops.flatMap((p) => p.errors)];
  if (errs.length) return { ok: false, errors: errs };
  const r = applyPatch(ledger, v, new Set(v.ops.map((p) => p.index)), now, source);
  const integ = newIntegrityErrors(ledger, r.ledger);
  if (integ.length) return { ok: false, errors: integ.map((e) => `${e.itemId}: ${e.message}`) };
  return { ok: true, ...r };
}

// update の「変更前 → 変更後」の行を作る（表示用）
function updateRows(ledger, op) {
  const target = ledger.items.find((it) => it.id === op.id);
  if (!target) return [];
  const rows = [];
  for (const [k, after] of Object.entries(op.set || {})) {
    if (['id', 'kind', 'createdAt', 'updatedAt'].includes(k)) continue;
    const spec = fieldSpec(target.kind, k);
    rows.push({ field: k, label: spec ? spec.label : k, before: target[k], after });
  }
  if (Array.isArray(op.addLinks)) rows.push({ field: 'links', label: '関連（追記）', before: target.links, after: [...(target.links || []), ...op.addLinks] });
  return rows;
}

// 配列の項目（列・項目・CRUD）の update で消える要素の名前（取込の警告用。配列は丸ごと置き換わるため）
function removedElements(ledger, op) {
  const target = ledger.items.find((it) => it.id === op.id);
  if (!target || !op.set) return [];
  const out = [];
  const keyOf = { columns: (e) => e && e.name, fields: (e) => e && e.name, crud: (e) => e && e.entity };
  for (const f of Object.keys(keyOf)) {
    if (!Array.isArray(op.set[f]) || !Array.isArray(target[f])) continue;
    const after = new Set(op.set[f].map(keyOf[f]));
    const gone = target[f].map(keyOf[f]).filter((k) => k && !after.has(k));
    if (gone.length) out.push({ field: f, names: gone });
  }
  return out;
}


// ---- core/ball.js ----
// ボール（誰の対応待ちか）と待ち日数。未完了の課題・質問だけが対象。


const BALL = [
  { v: 'customer', label: '顧客待ち' },
  { v: 'own', label: '自社待ち' },
  { v: 'vendor', label: '協力会社待ち' },
  { v: 'unknown', label: '未定' },
];

const ownerField = (it) => OWNER_FIELD[it.kind];

// まだ聞いていない質問: 予定の会議に割り当て済みで、聞いた日が無い
function notAskedYet(it, ledger) {
  if (it.kind !== 'question' || it.askedAt || !it.meeting) return false;
  const m = ledger.items.find((x) => x.id === it.meeting);
  return !!m && m.status === 'planned';
}

// 戻り値: 'customer' | 'own' | 'vendor' | 'unknown'。未完了でなければ null
function ballOf(it, ledger) {
  if ((it.kind !== 'issue' && it.kind !== 'question') || !isOpen(it)) return null;
  if (notAskedYet(it, ledger)) return 'own';
  const who = it[ownerField(it)];
  if (!who) return 'unknown';
  const sh = ledger.items.find((x) => x.id === who);
  return sh && sh.kind === 'stakeholder' && ['customer', 'own', 'vendor'].includes(sh.side) ? sh.side : 'unknown';
}

// 待ち日数。質問は聞いた日（無ければ作成日）から、課題は作成日から。まだ聞いていない質問は null
function waitDays(it, ledger, today) {
  if (notAskedYet(it, ledger)) return null;
  const start = it.kind === 'question' && it.askedAt ? dayNumber(it.askedAt) : localDayNumber(it.createdAt);
  if (Number.isNaN(start)) return null;
  return Math.max(0, dayNumber(today) - start);
}


// ---- core/wbs.js ----
// WBS: 作業の階層と、子からの集計（見積・実績・進捗）、遅れの判定


const DELAY_POINTS = 20;

function dayToYmd(d) {
  return new Date(d * 86400000).toISOString().slice(0, 10);
}

// 期間の経過割合（0〜1）。today の日の終わり時点。日付がそろわなければ null
function elapsedRatio(task, todayNum) {
  if (!task.start || !task.end) return null;
  const s = dayNumber(task.start);
  const e = dayNumber(task.end);
  if (todayNum < s) return 0;
  return Math.min(1, (todayNum - s + 1) / (e - s + 1));
}

const byStart = (a, b) => (a.start || '9999').localeCompare(b.start || '9999') || a.id.localeCompare(b.id);

// 戻り値: { roots: Node[], byId: Map<id, Node>, flat: Node[] }
// Node = { item, children, depth, leaf, rollup: { estimate, actual, progress }, ratio, delayed }
function buildTree(ledger, today) {
  const todayNum = dayNumber(today);
  const tasks = ledger.items.filter((it) => it.kind === 'task');
  const byId = new Map(tasks.map((t) => [t.id, { item: t, children: [], depth: 0 }]));
  const roots = [];
  for (const n of byId.values()) {
    const p = n.item.parent && byId.get(n.item.parent);
    if (p && p !== n) p.children.push(n); else roots.push(n);
  }
  const flat = [];
  const seen = new Set();
  const walk = (n, depth) => {
    if (seen.has(n.item.id)) return; // 循環していても止まる（循環は健康診断が出す）
    seen.add(n.item.id);
    n.depth = depth;
    n.children.sort((a, b) => byStart(a.item, b.item));
    flat.push(n);
    for (const c of n.children) walk(c, depth + 1);
    n.leaf = n.children.length === 0;
    if (n.leaf) {
      n.rollup = { estimate: n.item.estimate || 0, actual: n.item.actual || 0, progress: n.item.progress || 0 };
    } else {
      const live = n.children.filter((c) => c.item.status !== 'cancelled' && c.rollup);
      const est = live.reduce((a, c) => a + c.rollup.estimate, 0);
      const act = live.reduce((a, c) => a + c.rollup.actual, 0);
      const prog = est > 0
        ? live.reduce((a, c) => a + c.rollup.estimate * c.rollup.progress, 0) / est
        : (live.length ? live.reduce((a, c) => a + c.rollup.progress, 0) / live.length : 0);
      n.rollup = { estimate: est, actual: act, progress: Math.round(prog * 10) / 10 };
    }
    n.ratio = elapsedRatio(n.item, todayNum);
    n.delayed = n.leaf && !n.item.milestone && n.ratio !== null && !['done', 'cancelled'].includes(n.item.status) && n.ratio * 100 - n.rollup.progress >= DELAY_POINTS;
  };
  roots.sort((a, b) => byStart(a.item, b.item));
  for (const r of roots) walk(r, 0);
  return { roots, byId, flat };
}


// ---- core/evm.js ----
// EVM（工数・人日）: BAC / PV / EV / AC / SPI / CPI / EAC と S カーブの点
// EV と AC の推移は、変更の記録（changelog の values）から日ごとの値を復元する


const EVM_ALERT = 0.9;

// 対象の作業: 末端・中止以外・見積と開始と終了がそろったもの
function evmTargets(ledger) {
  const parents = new Set(ledger.items.filter((it) => it.kind === 'task' && it.parent).map((it) => it.parent));
  const leaves = ledger.items.filter((it) => it.kind === 'task' && !parents.has(it.id) && it.status !== 'cancelled' && !it.milestone);
  const ok = leaves.filter((t) => typeof t.estimate === 'number' && t.estimate > 0 && t.start && t.end);
  return { targets: ok, missing: leaves.length - ok.length };
}

// 作業ごとの値の時系列: id → [{ day, values }]（古い順）。起点の記録の日（S カーブを描き始める日）も返す
function timelines(ledger) {
  const map = new Map();
  let snapshotDay = null;
  for (const e of ledger.changelog || []) {
    const day = localDayNumber(e.at);
    if (e.source === 'snapshot') snapshotDay = snapshotDay === null ? day : Math.max(snapshotDay, day);
    for (const c of e.changes || []) {
      if (!c.values) continue;
      if (!map.has(c.id)) map.set(c.id, []);
      map.get(c.id).push({ day, values: c.values });
    }
  }
  return { map, snapshotDay };
}

// day の日の終わり時点の進捗と実績
function valueAt(task, tl, day) {
  const list = tl.get(task.id);
  if (!list) {
    // 記録が無い作業（記録の仕組みより前に作られた等）は、作成日以降は今の値とみなす
    return localDayNumber(task.createdAt) <= day ? { progress: task.progress || 0, actual: task.actual || 0 } : { progress: 0, actual: 0 };
  }
  let progress = 0;
  let actual = 0;
  for (const r of list) {
    if (r.day > day) break;
    if (r.values.progress !== undefined) progress = r.values.progress;
    if (r.values.actual !== undefined) actual = r.values.actual;
  }
  return { progress, actual };
}

const ratioOrNull = (a, b) => (b > 0 ? a / b : null);

// 戻り値: { bac, pv, ev, ac, spi, cpi, eac, missing, curve: [{ date, pv, ev, ac }], curveStart }
function computeEvm(ledger, today) {
  const todayNum = dayNumber(today);
  const { targets, missing } = evmTargets(ledger);
  const bac = targets.reduce((a, t) => a + t.estimate, 0);
  const pvAt = (d) => targets.reduce((a, t) => a + t.estimate * elapsedRatio(t, d), 0);
  const pv = pvAt(todayNum);
  const ev = targets.reduce((a, t) => a + t.estimate * (t.progress || 0) / 100, 0);
  const ac = targets.reduce((a, t) => a + (t.actual || 0), 0);
  const spi = ratioOrNull(ev, pv);
  const cpi = ratioOrNull(ev, ac);
  const eac = cpi ? bac / cpi : null;

  const curve = [];
  const { map, snapshotDay } = timelines(ledger);
  if (targets.length) {
    const first = Math.min(...targets.map((t) => dayNumber(t.start)));
    const last = Math.max(...targets.map((t) => dayNumber(t.end)), todayNum);
    // 週の初め（月曜）に合わせる。1970-01-01 は木曜なので (d + 3) % 7 === 0 が月曜
    let d = first - ((first + 3) % 7 + 7) % 7;
    const days = [];
    for (; d <= last; d += 7) days.push(d);
    if (!days.includes(todayNum)) days.push(todayNum);
    days.sort((a, b) => a - b);
    for (const day of days) {
      const recorded = day <= todayNum && (snapshotDay === null || day >= snapshotDay);
      let evD = null;
      let acD = null;
      if (recorded) {
        evD = 0; acD = 0;
        for (const t of targets) {
          const v = valueAt(t, map, day);
          evD += t.estimate * v.progress / 100;
          acD += v.actual;
        }
      }
      curve.push({ date: dayToYmd(day), pv: round(pvAt(day)), ev: evD === null ? null : round(evD), ac: acD === null ? null : round(acD), today: day === todayNum });
    }
  }
  return {
    bac: round(bac), pv: round(pv), ev: round(ev), ac: round(ac),
    spi: spi === null ? null : round2(spi), cpi: cpi === null ? null : round2(cpi), eac: eac === null ? null : round(eac),
    missing, targets: targets.length, curve, curveStart: snapshotDay === null ? null : dayToYmd(snapshotDay),
  };
}

function round(x) { return Math.round(x * 10) / 10; }
function round2(x) { return Math.round(x * 100) / 100; }


// ---- core/health.js ----
// 健康診断。AIを使わない機械的な点検で、抜け漏れを重要度つきで返す。


const SEVERITY = [
  { v: 'high', label: '高' },
  { v: 'mid', label: '中' },
  { v: 'low', label: '低' },
];
const RANK = { high: 0, mid: 1, low: 2 };
const STALE_GUESS_DAYS = 7;

const fieldLabelOf = (kind, f) => { const sp = fieldSpec(kind, f); return sp ? sp.label : f; };

// today: YYYY-MM-DD
function runHealth(ledger, today) {
  const out = [];
  const ids = new Set(ledger.items.map((it) => it.id));
  const t = dayNumber(today);
  const push = (severity, code, item, message) => {
    const due = item && DUE_FIELD[item.kind] ? item[DUE_FIELD[item.kind]] || null : null;
    out.push({ severity, code, itemId: item ? item.id : null, due, message });
  };

  // 存在しない ID への参照（高）
  for (const it of ledger.items) {
    for (const r of refsOf(it)) {
      if (!ids.has(r.id)) push('high', 'dangling', it, `${it.id} の${refFieldLabel(r.field, it.kind)}が、台帳にない ${r.id} を指しています`);
    }
  }
  for (const rel of ledger.relations) {
    for (const end of ['from', 'to']) {
      if (!ids.has(rel[end])) {
        const other = ledger.items.find((it) => it.id === rel[end === 'from' ? 'to' : 'from']);
        push('high', 'dangling', other || null, `関係 ${rel.id}（${rel.label}）の${end === 'from' ? '始点' : '終点'}が、台帳にない ${rel[end]} を指しています`);
      }
    }
  }

  // 子を持つ作業（親）は担当・期限の点検の対象外（子で管理する）
  const parents = new Set(ledger.items.filter((it) => it.kind === 'task' && it.parent).map((it) => it.parent));
  for (const it of ledger.items) {
    const open = isOpen(it);
    const dueField = DUE_FIELD[it.kind];
    const ownerField = OWNER_FIELD[it.kind];
    const due = dueField ? it[dueField] : null;
    const tracked = !!ownerField && !(it.kind === 'task' && parents.has(it.id));
    // 期限切れ（高）
    if (open && tracked && due && dayNumber(due) < t) {
      push('high', 'overdue', it, `${kindLabel(it.kind)}「${it.title}」の${it.kind === 'task' ? '終了日' : '期限'}（${due}）を${t - dayNumber(due)}日過ぎています`);
    }
    // 担当・期限なし（中）
    if (open && tracked) {
      const missing = [];
      if (!it[ownerField]) missing.push(fieldLabelOf(it.kind, ownerField));
      if (!due) missing.push(fieldLabelOf(it.kind, dueField));
      if (missing.length) push('mid', 'no-owner', it, `${kindLabel(it.kind)}「${it.title}」に${missing.join('と')}がありません`);
    }
    // 出典なし（中）
    if (!it.sources || !it.sources.length) push('mid', 'no-source', it, `${kindLabel(it.kind)}「${it.title}」に出典がありません`);
    // Must で推測（中）
    if ((it.kind === 'request' || it.kind === 'requirement') && it.priority === 'Must' && it.confidence === 'guess') {
      push('mid', 'must-guess', it, `優先度 Must の${kindLabel(it.kind)}「${it.title}」が推測のままです`);
    }
    // 顧客待ちが設定日数以上（中）
    if (ballOf(it, ledger) === 'customer') {
      const w = waitDays(it, ledger, today);
      if (w !== null && w >= settingOf(ledger, 'ballWaitDays')) push('mid', 'ball-wait', it, `${kindLabel(it.kind)}「${it.title}」が顧客の返事を${w}日待っています`);
    }
    // 推測のまま7日以上（低）。質問は対象外
    if (it.kind !== 'question' && it.confidence === 'guess' && it.updatedAt && t - localDayNumber(it.updatedAt) >= STALE_GUESS_DAYS) {
      push('low', 'stale-guess', it, `${kindLabel(it.kind)}「${it.title}」が推測のまま${t - localDayNumber(it.updatedAt)}日たっています`);
    }
  }

  // 範囲（中）: 範囲外なのに理由が無い / ベースライン後に追加されて範囲が未判断
  const after = afterBaselineIds(ledger);
  for (const it of ledger.items) {
    if (it.kind !== 'request' && it.kind !== 'requirement') continue;
    if (it.scope === 'out' && !(it.scopeReason && it.scopeReason.trim())) push('mid', 'scope-no-reason', it, `${kindLabel(it.kind)}「${it.title}」は範囲外ですが、判断の理由がありません`);
    const closed = it.status === 'rejected' || it.status === 'dropped';
    if (after.has(it.id) && !closed && (!it.scope || it.scope === 'tbd')) push('mid', 'scope-undecided', it, `${kindLabel(it.kind)}「${it.title}」はベースラインの後に追加されましたが、範囲内か範囲外かが決まっていません`);
  }

  // 非機能の大項目で、要件も未回答の質問も無いもの（中）
  for (const c of nfrStatus(ledger)) {
    if (c.state === 'none') push('mid', 'nfr-missing', null, `非機能「${c.label}」について、要件も確認中の質問もありません`);
  }

  // EVM（高）: SPI か CPI が基準未満
  if (ledger.items.some((it) => it.kind === 'task')) {
    const e = computeEvm(ledger, today);
    if (e.pv > 0 && e.spi !== null && e.spi < EVM_ALERT) push('high', 'evm-low', null, `スケジュール効率 SPI が ${e.spi} です（${EVM_ALERT} 未満。予定より遅れています）`);
    if (e.cpi !== null && e.cpi < EVM_ALERT) push('high', 'evm-low', null, `コスト効率 CPI が ${e.cpi} です（${EVM_ALERT} 未満。見積より工数がかかっています）`);
  }

  const idx = linkIndex(ledger);

  // 設計（P4）: 要件とつながらない設計の項目（低）・作業の無い合意済みの要件（低）・作成されないテーブル（中）・見積の差（中）
  const DESIGN = ['entity', 'screen', 'interface', 'batch'];
  const kindOf = new Map(ledger.items.map((it) => [it.id, it.kind]));
  const linkedKind = (id, k) => [...(idx.get(id) || [])].some((x) => kindOf.get(x) === k);
  for (const it of ledger.items) {
    if (DESIGN.includes(it.kind) && it.status !== 'dropped' && !linkedKind(it.id, 'requirement')) {
      push('low', 'unlinked-design', it, `${kindLabel(it.kind)}「${it.title}」に対応する要件がありません`);
    }
  }
  if (ledger.items.some((it) => it.kind === 'task')) {
    for (const it of ledger.items) {
      if (it.kind === 'requirement' && it.status === 'agreed' && !linkedKind(it.id, 'task')) push('low', 'req-no-task', it, `合意済みの要件「${it.title}」を実現する作業がありません`);
    }
  }
  const funcs = ledger.items.filter((it) => ['screen', 'interface', 'batch'].includes(it.kind) && it.status !== 'dropped');
  if (funcs.length) {
    const created = new Set(funcs.flatMap((f) => (f.crud || []).filter((c) => c && /C/.test(c.ops || '')).map((c) => c.entity)));
    for (const it of ledger.items) {
      if (it.kind === 'entity' && it.status !== 'dropped' && it.fileType !== 'external' && !created.has(it.id)) push('mid', 'entity-no-create', it, `テーブル「${it.title}」を作成（C）する機能がありません`);
    }
  }
  const fe = fpEstimate(ledger, today);
  if (fe.gap !== null && Math.abs(fe.gap) > FP_GAP_ALERT) {
    push('mid', 'fp-gap', null, `FP からの見積 ${fe.effort} 人日と WBS の見積 ${fe.bac} 人日の差が ${Math.round(fe.gap * 100)}% あります（±${FP_GAP_ALERT * 100}% を超えています）`);
  }

  // テスト（P5）: 不合格のテスト（高）・テストの無い合意済みの要件（中。テストを書き始めてから点検する）
  for (const it of ledger.items) {
    if (it.kind === 'test' && it.status === 'failed') push('high', 'test-failed', it, `テスト「${it.title}」が不合格です`);
  }
  if (ledger.items.some((it) => it.kind === 'test')) {
    for (const r of traceRows(ledger)) {
      if (r.req.status === 'agreed' && r.verdict === 'none') push('mid', 'req-no-test', r.req, `合意済みの要件「${r.req.title}」を確かめるテストがありません`);
    }
  }

  // 項目をまたぐ誤り（高）。取込では止めるので、主に読み込んだ台帳で起こる
  for (const e of checkIntegrity(ledger).errors) {
    push('high', 'integrity', ledger.items.find((it) => it.id === e.itemId) || null, `${e.itemId}: ${e.message}`);
  }

  // どの要件ともつながっていない要望（低）。不採用の要望は除く。links は向きを持たない
  const kindById = new Map(ledger.items.map((it) => [it.id, it.kind]));
  const hasReq = (id) => [...(idx.get(id) || [])].some((x) => kindById.get(x) === 'requirement');
  for (const it of ledger.items) {
    if (it.kind === 'request' && it.status !== 'rejected' && !hasReq(it.id)) {
      push('low', 'unlinked-request', it, `要望「${it.title}」に対応する要件がありません`);
    }
  }

  out.sort((a, b) => RANK[a.severity] - RANK[b.severity]
    || (a.due ? 0 : 1) - (b.due ? 0 : 1)
    || (a.due && b.due ? a.due.localeCompare(b.due) : 0)
    || String(a.itemId).localeCompare(String(b.itemId)));
  return out;
}

const HEALTH_CODES = {
  dangling: '存在しない ID への参照',
  integrity: '項目をまたぐ誤り',
  'ball-wait': '顧客待ちが長い',
  'scope-no-reason': '範囲外の理由なし',
  'scope-undecided': '範囲が未判断',
  'nfr-missing': '非機能の未着手',
  'evm-low': 'EVM の悪化',
  'unlinked-design': '要件のない設計',
  'req-no-task': '作業のない要件',
  'entity-no-create': '作成されないテーブル',
  'fp-gap': '見積の差',
  'test-failed': '不合格のテスト',
  'req-no-test': 'テストのない要件',
  overdue: '期限切れ',
  'no-owner': '担当・期限なし',
  'no-source': '出典なし',
  'must-guess': 'Must が推測のまま',
  'stale-guess': '推測のまま放置',
  'unlinked-request': '要件のない要望',
};



// ---- core/impact.js ----
// 変更の影響範囲: 対象の項目から、参照フィールド（両方向）・links・関係を幅優先で 2 段までたどる
// 関係者とシステムは影響範囲に含めるが、そこから先へはたどらない（担当者つながりで無関係な作業が入らないように）


const TERMINAL = new Set(['stakeholder', 'system']);

// 戻り値: { items: { item, depth }[], byKind: Record<kind, Item[]>, tasks: Item[], taskEstimate: number }
function impactOf(ledger, rootIds, depth = 2) {
  const byId = new Map(ledger.items.map((it) => [it.id, it]));
  const back = buildBackrefs(ledger);
  const links = linkIndex(ledger);
  const neighbors = (id) => {
    const it = byId.get(id);
    const out = new Set();
    // 親子（parent）はたどらない。子から親へ上がると兄弟の作業まで入るため。子孫は下でまとめて足す
    if (it) for (const r of refsOf(it)) if (r.field !== 'parent') out.add(r.id);
    for (const b of back.get(id) || []) if (b.field !== 'parent') out.add(b.from);
    for (const x of links.get(id) || []) out.add(x);
    return out;
  };
  const roots = new Set(rootIds);
  const seen = new Map();
  let frontier = [...roots];
  for (let d = 1; d <= depth && frontier.length; d++) {
    const next = [];
    for (const id of frontier) {
      const it = byId.get(id);
      // 根でない関係者・システムからは先へ進まない
      if (it && TERMINAL.has(it.kind) && !roots.has(id)) continue;
      for (const n of neighbors(id)) {
        if (roots.has(n) || seen.has(n) || !byId.has(n)) continue;
        seen.set(n, d);
        next.push(n);
      }
    }
    frontier = next;
  }
  // たどり着いた作業の子孫も含める（親だけがつながっていても、子の見積を数えるため）
  const children = new Map();
  for (const it of ledger.items) if (it.kind === 'task' && it.parent) {
    if (!children.has(it.parent)) children.set(it.parent, []);
    children.get(it.parent).push(it.id);
  }
  const addDesc = (id, d) => {
    for (const c of children.get(id) || []) {
      if (!seen.has(c) && !roots.has(c)) { seen.set(c, d); addDesc(c, d); }
    }
  };
  for (const [id, d] of [...seen]) if (byId.get(id).kind === 'task') addDesc(id, d);

  const items = [...seen].map(([id, d]) => ({ item: byId.get(id), depth: d }));
  const byKind = {};
  for (const k of KIND_IDS) byKind[k] = [];
  for (const x of items) byKind[x.item.kind].push(x.item);
  // 見積は末端の作業だけを足す（親と子を二重に数えない）
  const tasks = byKind.task || [];
  const leafEst = tasks.filter((t) => !children.has(t.id) && t.status !== 'cancelled').reduce((a, t) => a + (t.estimate || 0), 0);
  return { items, byKind, tasks, taskEstimate: Math.round(leafEst * 10) / 10 };
}

// 変更要求書の下書き（平文）
function changeRequestText(ledger, cr, imp) {
  const name = (id) => { const it = ledger.items.find((x) => x.id === id); return it ? `${it.title}（${id}）` : id; };
  const L = [];
  L.push(`変更要求書（下書き）　${cr.id}`, '');
  L.push(`■ 件名: ${cr.title}`);
  if (cr.requestedBy) L.push(`■ 依頼者: ${name(cr.requestedBy)}`);
  L.push(`■ 状態: ${statusLabel('change', cr.status)}`);
  if (cr.body) L.push('', '■ 内容', cr.body);
  L.push('', '■ 対象');
  for (const id of cr.links || []) L.push(`・${name(id)}`);
  if (!(cr.links || []).length) L.push('・（未指定）');
  L.push('', '■ 影響範囲（台帳から機械的に求めたもの）');
  for (const [k, list] of Object.entries(imp.byKind)) {
    if (!list.length || k === 'stakeholder' || k === 'system') continue;
    L.push(`【${kindLabel(k)}】`);
    for (const it of list) L.push(`・${it.title}（${it.id}${it.kind === 'task' && typeof it.estimate === 'number' ? `・見積 ${it.estimate} 人日` : ''}）`);
  }
  const people = [...(imp.byKind.stakeholder || []), ...(imp.byKind.system || [])];
  if (people.length) L.push('【関係者・システム】', ...people.map((it) => `・${it.title}（${it.id}）`));
  L.push('', `■ 影響する作業の見積の合計: ${imp.taskEstimate} 人日`);
  L.push(`■ 追加工数の見込み: ${typeof cr.extraEstimate === 'number' ? cr.extraEstimate + ' 人日' : '未見積'}`);
  L.push('', '■ 判断', '（承認 / 却下 / 保留。決定者と日付を記入）');
  return L.join('\n');
}


// ---- core/report.js ----
// 定例会資料と週報の文面: 期間の変更・EVM・遅れ・顧客待ち・新しい決定・次回までの作業


const DONE = new Set(['done', 'closed', 'answered', 'agreed', 'accepted', 'approved']);
const NEXT_DAYS = 14;

// 前回の会議: 開催済みの定例のうち、今日より前で最も新しいもの。無ければ 7 日前
function previousMeetingDate(ledger, today) {
  const t = dayNumber(today);
  const ms = ledger.items.filter((it) => it.kind === 'meeting' && it.meetingType === 'regular' && it.status === 'held' && it.date && dayNumber(it.date) < t)
    .sort((a, b) => b.date.localeCompare(a.date));
  return ms.length ? ms[0].date : dayToYmd(t - 7);
}

// 戻り値: { from, to, added, completed, statusChanged, decisions, evm, delayed, waiting, next }
function buildReport(ledgerAll, { from, to, today, presentation }) {
  const ledger = visibleLedger(ledgerAll, presentation);
  const byId = new Map(ledger.items.map((it) => [it.id, it]));
  const f = dayNumber(from);
  const tt = dayNumber(to);
  const added = new Map();
  const completed = new Map();
  const statusChanged = new Map();
  for (const e of ledger.changelog || []) {
    if (e.source === 'snapshot') continue;
    const d = localDayNumber(e.at);
    if (d < f || d > tt) continue;
    for (const c of e.changes || []) {
      const it = byId.get(c.id);
      if (!it) continue;   // 社内のみで隠れた項目・関係など
      if (c.op === 'add') added.set(it.id, it);
      else if (c.statusTo && DONE.has(c.statusTo)) { completed.set(it.id, { item: it, from: c.statusFrom, to: c.statusTo }); statusChanged.delete(it.id); }
      else if (c.statusTo) statusChanged.set(it.id, { item: it, from: c.statusFrom, to: c.statusTo });
    }
  }
  const decisions = ledger.items.filter((it) => it.kind === 'decision' && it.decidedAt && dayNumber(it.decidedAt) >= f && dayNumber(it.decidedAt) <= tt);
  const hasTasks = ledger.items.some((it) => it.kind === 'task');
  const evm = hasTasks ? computeEvm(ledger, today) : null;
  const tree = buildTree(ledger, today);
  const delayed = tree.flat.filter((n) => n.delayed).map((n) => n.item);
  const waiting = ledger.items
    .filter((it) => ballOf(it, ledger) === 'customer')
    .map((it) => ({ item: it, wait: waitDays(it, ledger, today) }))
    .sort((a, b) => (b.wait ?? -1) - (a.wait ?? -1));
  const limit = dayNumber(to) + NEXT_DAYS;
  const next = tree.flat.filter((n) => n.leaf && n.item.end && !['done', 'cancelled'].includes(n.item.status) && dayNumber(n.item.end) <= limit && dayNumber(n.item.end) > tt)
    .map((n) => n.item).sort((a, b) => a.end.localeCompare(b.end));
  return {
    from, to, presentation: !!presentation,
    added: [...added.values()], completed: [...completed.values()], statusChanged: [...statusChanged.values()],
    decisions, evm, delayed, waiting, next,
  };
}

const line = (it) => `・${it.title}（${it.id}）`;

// 週報の平文（メールや Chat に貼る）。説明用の表示では実績（AC・CPI・EAC）を書かない
function reportText(r, projectName) {
  const L = [];
  L.push(`【${projectName}】週次報告（${r.from}〜${r.to}）`, '');
  L.push('■ 今週の進捗');
  if (r.evm) {
    const base = `計画 ${r.evm.pv} 人日に対し出来高 ${r.evm.ev} 人日（SPI ${r.evm.spi ?? '—'}）`;
    L.push(r.presentation ? `・${base}` : `・${base}、実績 ${r.evm.ac} 人日（CPI ${r.evm.cpi ?? '—'}）`);
  }
  for (const c of r.completed) L.push(`・完了: ${c.item.title}（${kindLabel(c.item.kind)}）`);
  for (const it of r.added) L.push(`・追加: ${it.title}（${kindLabel(it.kind)}）`);
  if (!r.completed.length && !r.added.length) L.push('・期間中の追加・完了はありません');
  if (r.delayed.length) {
    L.push('', '■ 遅れている作業');
    for (const it of r.delayed) L.push(`${line(it)} 予定 ${it.start}〜${it.end}・進捗 ${it.progress || 0}%`);
  }
  L.push('', '■ 決まったこと');
  if (r.decisions.length) for (const d of r.decisions) L.push(`・${d.decidedAt} ${d.title}${d.reason ? '（理由: ' + d.reason + '）' : ''}`);
  else L.push('・期間中の決定はありません');
  L.push('', '■ お願い（ご回答・ご対応をお待ちしています）');
  if (r.waiting.length) for (const w of r.waiting) L.push(`・${w.item.title}${w.item.due ? '（期限 ' + w.item.due + '）' : ''}${w.wait !== null ? ' ' + w.wait + '日経過' : ''}`);
  else L.push('・ありません');
  L.push('', `■ 来週以降の予定（${NEXT_DAYS}日以内に終わる予定の作業）`);
  if (r.next.length) for (const it of r.next) L.push(`・${it.end} ${it.title}（${statusLabel('task', it.status)}・${it.progress || 0}%）`);
  else L.push('・ありません');
  return L.join('\n');
}


// ---- core/fp.js ----
// ファンクションポイントの概算（NESMA 概算法）と、WBS の見積（BAC）との突き合わせ


const FP_TYPES = [
  { v: 'ILF', label: '内部論理ファイル（自システムのテーブル）', weight: 35 },
  { v: 'EIF', label: '外部インタフェースファイル（外部参照のテーブル）', weight: 15 },
  { v: 'EI', label: '外部入力（入力画面・受信連携・更新するバッチ）', weight: 4 },
  { v: 'EO', label: '外部出力（帳票・送信連携・参照だけのバッチ）', weight: 5 },
  { v: 'EQ', label: '外部照会（照会画面）', weight: 4 },
];
const FP_GAP_ALERT = 0.3;

// 機能の種類を決める。数えないものは null と理由
function fpTypeOf(it) {
  if (it.status === 'dropped') return { type: null, reason: '取り下げ' };
  if (it.kind === 'entity') return { type: it.fileType === 'external' ? 'EIF' : 'ILF' };
  if (it.kind === 'screen') return { type: { input: 'EI', report: 'EO', inquiry: 'EQ' }[it.screenType] || null, reason: '画面の区分が無い' };
  if (it.kind === 'interface') return { type: it.direction === 'in' ? 'EI' : it.direction === 'out' ? 'EO' : null, reason: '向きが無い' };
  if (it.kind === 'batch') {
    const ops = (it.crud || []).map((c) => c.ops || '').join('');
    if (!ops) return { type: null, reason: 'CRUD が無く、種類を決められない' };
    return { type: /[CUD]/.test(ops) ? 'EI' : 'EO' };
  }
  return null;
}

// 戻り値: { rows: [{ v, label, weight, items, count, fp }], total, uncounted: [{ item, reason }] }
function countFp(ledger) {
  const rows = FP_TYPES.map((t) => ({ ...t, items: [], count: 0, fp: 0 }));
  const uncounted = [];
  for (const it of ledger.items) {
    const r = fpTypeOf(it);
    if (!r) continue;
    if (!r.type) { uncounted.push({ item: it, reason: r.reason }); continue; }
    rows.find((x) => x.v === r.type).items.push(it);
  }
  for (const r of rows) { r.count = r.items.length; r.fp = r.count * r.weight; }
  return { rows, total: rows.reduce((a, r) => a + r.fp, 0), uncounted };
}

// 見積の工数と BAC の比較。生産性が無ければ effort 以降は null
function fpEstimate(ledger, today) {
  const fp = countFp(ledger);
  const productivity = settingOf(ledger, 'productivity');
  const bac = ledger.items.some((it) => it.kind === 'task') ? computeEvm(ledger, today).bac : 0;
  if (!productivity) return { ...fp, productivity: null, effort: null, bac, gap: null };
  const effort = Math.round(fp.total * productivity * 10) / 10;
  const gap = bac > 0 ? Math.round(((effort - bac) / bac) * 1000) / 1000 : null;
  return { ...fp, productivity, effort, bac, gap };
}


// ---- core/ddl.js ----
// DDL の生成（PostgreSQL / SQL Server / Oracle）と、物理名の点検

const DIALECTS = [
  { v: 'postgres', label: 'PostgreSQL' },
  { v: 'sqlserver', label: 'SQL Server' },
  { v: 'oracle', label: 'Oracle' },
];

const DEFAULT_LEN = { string: 255, code: 20 };

// 論理型 → 方言ごとの物理型
function physType(col, dialect) {
  const n = col.length || DEFAULT_LEN[col.type];
  const p = col.length || 18;
  const sc = col.scale || 0;
  const map = {
    postgres: { string: `VARCHAR(${n})`, code: `VARCHAR(${n})`, text: 'TEXT', int: 'INTEGER', bigint: 'BIGINT', decimal: `NUMERIC(${p},${sc})`, date: 'DATE', datetime: 'TIMESTAMP', boolean: 'BOOLEAN' },
    sqlserver: { string: `NVARCHAR(${n})`, code: `NVARCHAR(${n})`, text: 'NVARCHAR(MAX)', int: 'INT', bigint: 'BIGINT', decimal: `DECIMAL(${p},${sc})`, date: 'DATE', datetime: 'DATETIME2', boolean: 'BIT' },
    oracle: { string: `VARCHAR2(${n} CHAR)`, code: `VARCHAR2(${n} CHAR)`, text: 'CLOB', int: 'NUMBER(10)', bigint: 'NUMBER(19)', decimal: `NUMBER(${p},${sc})`, date: 'DATE', datetime: 'TIMESTAMP', boolean: 'NUMBER(1)' },
  };
  return map[dialect][col.type] || map[dialect].string;
}

const ident = (name, namingCase) => (namingCase === 'upper' ? String(name).toUpperCase() : String(name).toLowerCase());
const quote = (s) => String(s == null ? '' : s).replace(/'/g, "''");

// 外部キーの参照先が先に来る順に並べる。循環する外部キーは後から ALTER で足す
function orderTables(entities) {
  const ids = new Set(entities.map((e) => e.id));
  const deps = new Map(entities.map((e) => [e.id, new Set((e.columns || []).map((c) => c.fk && c.fk.entity).filter((x) => x && x !== e.id && ids.has(x)))]));
  const order = [];
  const deferred = [];   // { from, colName }
  const state = new Map();
  const visit = (id, path) => {
    if (state.get(id) === 2) return;
    state.set(id, 1);
    for (const d of deps.get(id)) {
      if (state.get(d) === 1) { deferred.push({ from: id, to: d }); continue; }
      visit(d, path);
    }
    state.set(id, 2);
    order.push(id);
  };
  for (const e of [...entities].sort((a, b) => a.id.localeCompare(b.id))) if (!state.has(e.id)) visit(e.id);
  return { order: order.map((id) => entities.find((e) => e.id === id)), deferred };
}

// 戻り値: 文字列（そのまま流せる SQL）
function generateDdl(ledger, dialect = 'postgres', namingCase = 'lower') {
  const all = ledger.items.filter((it) => it.kind === 'entity' && it.status !== 'dropped');
  const internal = all.filter((e) => e.fileType !== 'external');
  const byId = new Map(all.map((e) => [e.id, e]));
  const created = new Set(internal.map((e) => e.id));
  const { order, deferred } = orderTables(internal);
  const deferredSet = new Set(deferred.map((d) => d.from + '>' + d.to));
  const id = (n) => ident(n, namingCase);
  const L = [`-- ${ledger.project.name} のテーブル定義（${DIALECTS.find((d) => d.v === dialect).label}）`, '-- 案件ワークベンチで生成。外部参照のテーブルは作成しない'];
  const external = all.filter((e) => e.fileType === 'external');
  if (external.length) L.push(`-- 外部参照のテーブル（作成しない）: ${external.map((e) => `${id(e.physicalName)}（${e.title}）`).join(', ')}`);
  const alters = [];
  const comments = [];
  for (const e of order) {
    const t = id(e.physicalName);
    const cols = e.columns || [];
    const lines = cols.map((c) => `  ${id(c.name)} ${physType(c, dialect)}${c.required || c.pk ? ' NOT NULL' : ''}`);
    const pk = cols.filter((c) => c.pk).map((c) => id(c.name));
    if (pk.length) lines.push(`  CONSTRAINT ${id('pk_' + e.physicalName)} PRIMARY KEY (${pk.join(', ')})`);
    for (const c of cols) {
      if (!c.fk || !c.fk.entity) continue;
      const ref = byId.get(c.fk.entity);
      if (!ref) continue;
      const fkName = id(`fk_${e.physicalName}_${c.name}`);
      const clause = `FOREIGN KEY (${id(c.name)}) REFERENCES ${id(ref.physicalName)} (${id(c.fk.column)})`;
      if (!created.has(ref.id)) { lines.push(`  -- ${clause}（参照先は外部参照のため制約を作らない）`); continue; }
      if (deferredSet.has(e.id + '>' + ref.id)) alters.push(`ALTER TABLE ${t} ADD CONSTRAINT ${fkName} ${clause};`);
      else lines.push(`  CONSTRAINT ${fkName} ${clause}`);
    }
    // 最後の行のカンマを正しく付ける（コメント行には付けない）
    const body = [];
    const real = lines.map((x, i) => ({ x, i, comment: x.trim().startsWith('--') }));
    const lastReal = Math.max(...real.filter((r) => !r.comment).map((r) => r.i));
    for (const r of real) body.push(r.comment || r.i === lastReal ? r.x : r.x + ',');
    L.push('', `CREATE TABLE ${t} (`, ...body, ');');
    // コメント
    if (dialect === 'sqlserver') {
      comments.push(`EXEC sp_addextendedproperty N'MS_Description', N'${quote(e.title)}', N'SCHEMA', N'dbo', N'TABLE', N'${t}';`);
      for (const c of cols) if (c.logical || c.note) comments.push(`EXEC sp_addextendedproperty N'MS_Description', N'${quote([c.logical, c.note].filter(Boolean).join(' '))}', N'SCHEMA', N'dbo', N'TABLE', N'${t}', N'COLUMN', N'${id(c.name)}';`);
    } else {
      comments.push(`COMMENT ON TABLE ${t} IS '${quote(e.title)}';`);
      for (const c of cols) if (c.logical || c.note) comments.push(`COMMENT ON COLUMN ${t}.${id(c.name)} IS '${quote([c.logical, c.note].filter(Boolean).join(' '))}';`);
    }
  }
  if (alters.length) L.push('', '-- 循環する外部キー（テーブルを作った後に足す）', ...alters);
  if (comments.length) L.push('', '-- 表と列のコメント', ...comments);
  return L.join('\n') + '\n';
}

// 方言ごとの主な予約語（すべてではない。よく衝突するものを中心に）
const RESERVED_COMMON = ['add', 'all', 'alter', 'and', 'any', 'as', 'asc', 'between', 'by', 'case', 'check', 'column', 'constraint', 'create', 'current_date', 'current_time', 'default', 'delete', 'desc', 'distinct', 'drop', 'else', 'end', 'exists', 'foreign', 'from', 'grant', 'group', 'having', 'in', 'index', 'insert', 'into', 'is', 'join', 'key', 'like', 'not', 'null', 'on', 'or', 'order', 'primary', 'references', 'select', 'set', 'table', 'then', 'to', 'union', 'unique', 'update', 'user', 'values', 'view', 'when', 'where', 'with'];
const RESERVED = {
  postgres: [...RESERVED_COMMON, 'analyse', 'analyze', 'array', 'limit', 'offset', 'returning', 'window', 'only', 'placing'],
  sqlserver: [...RESERVED_COMMON, 'backup', 'browse', 'file', 'identity', 'key', 'open', 'percent', 'plan', 'rule', 'schema', 'top', 'transaction', 'tran'],
  oracle: [...RESERVED_COMMON, 'access', 'comment', 'date', 'file', 'level', 'mode', 'number', 'resource', 'rowid', 'rownum', 'session', 'size', 'start', 'uid', 'long', 'raw'],
};

// 戻り値: [{ itemId, message }]
function lintNames(ledger, dialect = 'postgres', namingCase = 'lower') {
  const out = [];
  const re = namingCase === 'upper' ? /^[A-Z][A-Z0-9_]*$/ : /^[a-z][a-z0-9_]*$/;
  const rule = namingCase === 'upper' ? '英大文字・数字・下線（先頭は英字）' : '英小文字・数字・下線（先頭は英字）';
  const reserved = new Set(RESERVED[dialect]);
  const check = (itemId, what, name) => {
    if (!re.test(name)) out.push({ itemId, message: `${what}「${name}」は${rule}だけにしてください` });
    if (reserved.has(String(name).toLowerCase())) out.push({ itemId, message: `${what}「${name}」は ${DIALECTS.find((d) => d.v === dialect).label} の予約語です` });
    if (dialect === 'oracle' && String(name).length > 30) out.push({ itemId, message: `${what}「${name}」が 30 文字を超えています（古い Oracle では使えません）` });
  };
  for (const e of ledger.items.filter((it) => it.kind === 'entity' && it.status !== 'dropped')) {
    check(e.id, 'テーブル名', e.physicalName);
    for (const c of e.columns || []) if (c && c.name) check(e.id, `列名（${e.physicalName}）`, c.name);
  }
  return out;
}


// ---- core/erlayout.js ----
// ER 図の配置（DOM に依存しない）。外部キーの向きで層に分け、参照先を左、参照元を右に置く
// 層割りと並べ替えは ~/.claude/skills/dashboard/assets/dash.js の layering を改変して流用

const ER = { BOX_W: 230, HEAD: 26, ROW: 18, MAX_ROWS: 20, GAP_X: 90, GAP_Y: 28, PAD: 20 };

// 有向グラフを層に分ける。逆向きの辺（循環）を見つけ、最長経路で層を決め、重心法で並び替える
function layering(ids, edges) {
  const out = new Map(ids.map((id) => [id, []]));
  edges.forEach((e, i) => out.get(e.s).push(i));
  const state = new Map();
  const back = new Set();
  const visit = (u) => {
    state.set(u, 1);
    for (const i of out.get(u)) {
      const v = edges[i].t;
      const st = state.get(v);
      if (st === 1) back.add(i); else if (!st) visit(v);
    }
    state.set(u, 2);
  };
  ids.forEach((id) => { if (!state.get(id)) visit(id); });
  const fwd = edges.map((_, i) => i).filter((i) => !back.has(i));
  const indeg = new Map(ids.map((id) => [id, 0]));
  for (const i of fwd) indeg.set(edges[i].t, indeg.get(edges[i].t) + 1);
  const rank = new Map(ids.map((id) => [id, 0]));
  const queue = ids.filter((id) => !indeg.get(id));
  while (queue.length) {
    const u = queue.shift();
    for (const i of out.get(u)) {
      if (back.has(i)) continue;
      const v = edges[i].t;
      rank.set(v, Math.max(rank.get(v), rank.get(u) + 1));
      indeg.set(v, indeg.get(v) - 1);
      if (!indeg.get(v)) queue.push(v);
    }
  }
  const maxRank = Math.max(0, ...rank.values());
  const layers = Array.from({ length: maxRank + 1 }, () => []);
  ids.forEach((id) => layers[rank.get(id)].push(id));
  const pos = new Map();
  const index = () => layers.forEach((L) => L.forEach((id, i) => pos.set(id, i)));
  index();
  const preds = new Map(ids.map((id) => [id, []]));
  const succs = new Map(ids.map((id) => [id, []]));
  for (const i of fwd) { preds.get(edges[i].t).push(edges[i].s); succs.get(edges[i].s).push(edges[i].t); }
  const bary = (id, nb) => { const ns = nb.get(id); return ns.length ? ns.reduce((a, x) => a + pos.get(x), 0) / ns.length : pos.get(id); };
  for (let it = 0; it < 6; it++) {
    for (let r = 1; r <= maxRank; r++) { const b = new Map(layers[r].map((id) => [id, bary(id, preds)])); layers[r].sort((x, y) => b.get(x) - b.get(y)); index(); }
    for (let r = maxRank - 1; r >= 0; r--) { const b = new Map(layers[r].map((id) => [id, bary(id, succs)])); layers[r].sort((x, y) => b.get(x) - b.get(y)); index(); }
  }
  return { rank, layers };
}

// 戻り値: { boxes: [{ id, x, y, w, h, title, physicalName, external, rows: [{ name, type, pk, fk }], more }], lines: [{ from, to, column, points }], width, height }
function layoutEr(ledger) {
  const ents = ledger.items.filter((it) => it.kind === 'entity' && it.status !== 'dropped').sort((a, b) => a.id.localeCompare(b.id));
  const ids = ents.map((e) => e.id);
  const idSet = new Set(ids);
  const edges = [];
  for (const e of ents) for (const c of e.columns || []) {
    if (c && c.fk && idSet.has(c.fk.entity) && c.fk.entity !== e.id) edges.push({ s: c.fk.entity, t: e.id });
  }
  const { layers } = layering(ids, edges);
  const byId = new Map(ents.map((e) => [e.id, e]));
  const boxes = new Map();
  let height = 0;
  layers.forEach((layer, r) => {
    let y = ER.PAD;
    for (const id of layer) {
      const e = byId.get(id);
      const cols = (e.columns || []).filter(Boolean);
      const shown = cols.slice(0, ER.MAX_ROWS);
      const more = cols.length - shown.length;
      const h = ER.HEAD + (shown.length + (more > 0 ? 1 : 0)) * ER.ROW + 6;
      boxes.set(id, {
        id, x: ER.PAD + r * (ER.BOX_W + ER.GAP_X), y, w: ER.BOX_W, h,
        title: e.title, physicalName: e.physicalName, external: e.fileType === 'external',
        rows: shown.map((c) => ({ name: c.name, type: c.type, pk: !!c.pk, fk: !!c.fk })), more,
      });
      y += h + ER.GAP_Y;
    }
    height = Math.max(height, y);
  });
  const rowY = (box, name) => {
    const i = box.rows.findIndex((r) => String(r.name).toLowerCase() === String(name).toLowerCase());
    return box.y + ER.HEAD + (i < 0 ? 0 : i) * ER.ROW + ER.ROW / 2;
  };
  // 線: 参照元の列の行から、参照先の列の行へ。左右の辺の上に端を置き、直交の折れ線で結ぶ
  const lines = [];
  for (const e of ents) {
    const child = boxes.get(e.id);
    for (const c of e.columns || []) {
      if (!c || !c.fk || !boxes.has(c.fk.entity) || c.fk.entity === e.id) continue;
      const parent = boxes.get(c.fk.entity);
      const y1 = rowY(child, c.name);
      const y2 = rowY(parent, c.fk.column);
      let points;
      if (parent.x + parent.w <= child.x) {
        const x1 = child.x;
        const x2 = parent.x + parent.w;
        const mx = Math.round((x1 + x2) / 2);
        points = [[x1, y1], [mx, y1], [mx, y2], [x2, y2]];
      } else if (child.x + child.w <= parent.x) {
        const x1 = child.x + child.w;
        const x2 = parent.x;
        const mx = Math.round((x1 + x2) / 2);
        points = [[x1, y1], [mx, y1], [mx, y2], [x2, y2]];
      } else {
        // 同じ列（循環で同じ層に来たとき）: 右の辺から外へ出て回り込む
        const x1 = child.x + child.w;
        const x2 = parent.x + parent.w;
        const ox = Math.max(x1, x2) + 24;
        points = [[x1, y1], [ox, y1], [ox, y2], [x2, y2]];
      }
      lines.push({ from: e.id, to: c.fk.entity, column: c.name, points });
    }
  }
  // 同じすき間を通る線の縦の部分が重ならないよう、少しずつずらす
  const groups = new Map();
  for (const ln of lines) {
    const key = `${ln.points[0][0]}|${ln.points[3][0]}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(ln);
  }
  for (const list of groups.values()) {
    list.sort((a, b) => a.points[0][1] - b.points[0][1]);
    list.forEach((ln, i) => {
      const off = Math.round((i - (list.length - 1) / 2) * 10);
      ln.points[1][0] += off;
      ln.points[2][0] += off;
    });
  }
  const width = ER.PAD * 2 + layers.length * ER.BOX_W + Math.max(0, layers.length - 1) * ER.GAP_X + 30;
  return { boxes: [...boxes.values()], lines, width, height: height + ER.PAD };
}


// ---- core/csv.js ----
// CSV / TSV の読み取り。引用符・"" のエスケープ・引用符の中の改行・CRLF・BOM に対応する状態機械
// ~/projects/薬膳/index.html の parseCSV を改変して流用（区切り文字を引数にし、BOM 除去を足した）

function stripBom(text) {
  return String(text).replace(/^﻿/, '');
}

// 1 行目のタブとカンマの数で区切りを決める（引用符の中は数えない）
function detectDelimiter(text) {
  let tabs = 0;
  let commas = 0;
  let inQ = false;
  for (const ch of text) {
    if (ch === '"') inQ = !inQ;
    else if (!inQ && (ch === '\n' || ch === '\r')) break;
    else if (!inQ && ch === '\t') tabs++;
    else if (!inQ && ch === ',') commas++;
  }
  return tabs > commas ? '\t' : ',';
}

// 戻り値: string[][]（空行は除く）
function parseDelimited(text, delim) {
  const src = stripBom(text);
  const d = delim || detectDelimiter(src);
  const rows = [];
  let row = [];
  let cell = '';
  let inQ = false;
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (inQ) {
      if (ch === '"') {
        if (src[i + 1] === '"') { cell += '"'; i++; } else inQ = false;
      } else cell += ch;
      continue;
    }
    if (ch === '"') inQ = true;
    else if (ch === d) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && src[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); if (row.length > 1 || row[0] !== '') rows.push(row); }
  return rows;
}

// バイト列を文字列にする。auto なら UTF-8 として読み、読めなければ Shift_JIS（TextDecoder は標準機能）
function decodeBytes(buffer, encoding = 'auto') {
  const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
  if (encoding === 'shift_jis') return { text: new TextDecoder('shift_jis').decode(bytes), encoding: 'shift_jis' };
  if (encoding === 'utf-8') return { text: new TextDecoder('utf-8').decode(bytes), encoding: 'utf-8' };
  try {
    return { text: new TextDecoder('utf-8', { fatal: true }).decode(bytes), encoding: 'utf-8' };
  } catch (e) {
    return { text: new TextDecoder('shift_jis').decode(bytes), encoding: 'shift_jis' };
  }
}


// ---- core/mastercheck.js ----
// マスタの点検: 元データ（CSV / TSV）をテーブルの列の定義と突き合わせる。元データは保存しない

const CHECKS = [
  { v: 'header', label: '見出しと列の対応' },
  { v: 'pk', label: '主キーの重複' },
  { v: 'required', label: '必須の空欄' },
  { v: 'type', label: '型と長さの違反' },
  { v: 'pattern', label: 'コードの形の違反' },
  { v: 'fk', label: '参照先に無い値' },
];
const ISSUE_LIMIT = 1000;

const norm = (s) => String(s == null ? '' : s).trim().toLowerCase();

// 見出し → 列の対応。戻り値: { map: (列 | null)[], unknown: string[], missing: Column[] }
function mapHeaders(entity, header) {
  const cols = entity.columns || [];
  const map = header.map((hd) => cols.find((c) => norm(c.name) === norm(hd) || (c.logical && norm(c.logical) === norm(hd))) || null);
  const unknown = header.filter((hd, i) => !map[i] && norm(hd) !== '');
  const missing = cols.filter((c) => (c.required || c.pk) && !map.includes(c));
  return { map, unknown, missing };
}

function isValidDate(y, m, d) {
  const t = new Date(Date.UTC(y, m - 1, d));
  return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
}

// 型と長さ。違反ならメッセージ、問題なければ null
function typeError(col, v) {
  const s = String(v);
  switch (col.type) {
    case 'int':
    case 'bigint':
      return /^-?\d+$/.test(s) ? null : '整数ではありません';
    case 'decimal': {
      const m = /^-?(\d+)(?:\.(\d+))?$/.exec(s);
      if (!m) return '数値ではありません';
      const scale = col.scale || 0;
      if ((m[2] || '').length > scale) return `小数点以下は ${scale} 桁までです`;
      if (col.length && m[1].replace(/^0+(?=\d)/, '').length > col.length - scale) return `整数部が ${col.length - scale} 桁を超えています`;
      return null;
    }
    case 'date': {
      const m = /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/.exec(s);
      return m && isValidDate(+m[1], +m[2], +m[3]) ? null : '日付（YYYY-MM-DD か YYYY/MM/DD）ではありません';
    }
    case 'datetime': {
      const m = /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/.exec(s);
      return m && isValidDate(+m[1], +m[2], +m[3]) && (m[4] === undefined || (+m[4] < 24 && +m[5] < 60)) ? null : '日時ではありません';
    }
    case 'boolean':
      return /^(0|1|true|false)$/i.test(s) ? null : '0 / 1 / true / false ではありません';
    default:
      return col.length && [...s].length > col.length ? `${col.length} 文字を超えています（${[...s].length} 文字）` : null;
  }
}

// rows: 見出しを含む string[][]。refData: Map<テーブルID, { header: string[], rows: string[][] }>（外部キーの点検用。任意）
// 戻り値: { summary: Record<種類, 件数>, issues: [{ row, column, type, value, message }], total, dataRows, mapping }
function checkMaster(entity, rows, refData = new Map(), allEntities = []) {
  const summary = Object.fromEntries(CHECKS.map((c) => [c.v, 0]));
  const issues = [];
  const add = (row, column, type, value, message) => {
    summary[type]++;
    if (issues.length < ISSUE_LIMIT) issues.push({ row, column, type, value, message });
  };
  if (!rows.length) return { summary, issues, total: 0, dataRows: 0, mapping: null };
  const header = rows[0];
  const mapping = mapHeaders(entity, header);
  for (const u of mapping.unknown) add(1, u, 'header', u, `見出し「${u}」に当たる列がありません`);
  for (const c of mapping.missing) add(1, c.name, 'header', '', `必須の列「${c.name}」${c.logical ? `（${c.logical}）` : ''}の見出しがありません`);

  // 外部キーの参照先の値の集合（参照先の元データが渡されたときだけ）
  const refSets = new Map();
  for (const c of entity.columns || []) {
    if (!c.fk || !refData.has(c.fk.entity)) continue;
    const ref = refData.get(c.fk.entity);
    const refEnt = allEntities.find((e) => e.id === c.fk.entity);
    if (!refEnt) continue;
    const m = mapHeaders(refEnt, ref.header);
    const idx = m.map.findIndex((x) => x && norm(x.name) === norm(c.fk.column));
    if (idx < 0) continue;
    refSets.set(c.name, new Set(ref.rows.map((r) => String(r[idx] ?? '').trim())));
  }

  const pkCols = mapping.map.map((c, i) => (c && c.pk ? i : -1)).filter((i) => i >= 0);
  const seenPk = new Map();
  let dataRows = 0;
  for (let r = 1; r < rows.length; r++) {
    const line = r + 1;  // 見出しが 1 行目
    const row = rows[r];
    dataRows++;
    mapping.map.forEach((col, i) => {
      if (!col) return;
      const v = String(row[i] ?? '').trim();
      if (v === '') {
        if (col.required || col.pk) add(line, col.name, 'required', '', `「${col.name}」が空です`);
        return;
      }
      const te = typeError(col, v);
      if (te) add(line, col.name, 'type', v, `「${col.name}」: ${te}`);
      if (col.pattern) {
        let re = null;
        try { re = new RegExp(col.pattern); } catch (e) { re = null; }
        if (re && !re.test(v)) add(line, col.name, 'pattern', v, `「${col.name}」がコードの形（${col.pattern}）に合いません`);
      }
      if (refSets.has(col.name) && !refSets.get(col.name).has(v)) add(line, col.name, 'fk', v, `「${col.name}」の値「${v}」が参照先に見つかりません`);
    });
    if (pkCols.length) {
      const key = pkCols.map((i) => String(row[i] ?? '').trim()).join('\u0001');
      if (pkCols.every((i) => String(row[i] ?? '').trim() !== '')) {
        if (seenPk.has(key)) add(line, pkCols.map((i) => mapping.map[i].name).join('+'), 'pk', key.split('\u0001').join(' / '), `主キーが ${seenPk.get(key)} 行目と重複しています`);
        else seenPk.set(key, line);
      }
    }
  }
  return { summary, issues, total: Object.values(summary).reduce((a, b) => a + b, 0), dataRows, mapping };
}


// ---- core/trace.js ----
// トレーサビリティ: 要件ごとに、つながる要望・設計の項目・テストと判定を出す
// つながりは links（向きなし。linkIndex）で見る。設計の項目につながるテストも、その要件のテストとして数える


const VERDICTS = [
  { v: 'none', label: 'テストなし' },
  { v: 'failed', label: '不合格あり' },
  { v: 'pending', label: '未実施あり' },
  { v: 'passed', label: 'すべて合格' },
];
const DESIGN = new Set(['screen', 'interface', 'batch', 'entity']);

// 戻り値: [{ req, requests, design, tests, counts: Record<status, n>, verdict }]
function traceRows(ledger) {
  const idx = linkIndex(ledger);
  const byId = new Map(ledger.items.map((it) => [it.id, it]));
  const near = (id) => [...(idx.get(id) || [])].map((x) => byId.get(x)).filter(Boolean);
  return ledger.items
    .filter((it) => it.kind === 'requirement' && it.status !== 'dropped')
    .map((req) => {
      const linked = near(req.id);
      const requests = linked.filter((x) => x.kind === 'request');
      const design = linked.filter((x) => DESIGN.has(x.kind) && x.status !== 'dropped');
      const tests = new Map();
      for (const t of linked.filter((x) => x.kind === 'test')) tests.set(t.id, t);
      for (const d of design) for (const t of near(d.id)) if (t.kind === 'test') tests.set(t.id, t);
      const list = [...tests.values()];
      const counts = {};
      for (const t of list) counts[t.status] = (counts[t.status] || 0) + 1;
      let verdict = 'passed';
      if (!list.length) verdict = 'none';
      else if (counts.failed) verdict = 'failed';
      else if (list.some((t) => t.status !== 'passed')) verdict = 'pending';
      return { req, requests, design, tests: list, counts, verdict };
    });
}

// 工程ごとの合格率。戻り値: [{ level, total, passed, failed, rate }]
function passRates(ledger, levels) {
  const tests = ledger.items.filter((it) => it.kind === 'test');
  return levels.map((lv) => {
    const t = tests.filter((x) => x.level === lv.v);
    const passed = t.filter((x) => x.status === 'passed').length;
    const failed = t.filter((x) => x.status === 'failed').length;
    return { level: lv.v, label: lv.label, total: t.length, passed, failed, rate: t.length ? Math.round((passed / t.length) * 1000) / 10 : null };
  });
}


// ---- core/workspace.js ----
// 複数案件の入れ物（workspace）。暗号化の箱の中身はこの形になる（P5）
// type: 'workspace', version: 1, activeId, ledgers: { 案件ID: 台帳 }, exported: { 案件ID: { revision, at } }

const WORKSPACE_VERSION = 1;

function newProjectId() {
  const r = globalThis.crypto && globalThis.crypto.getRandomValues ? globalThis.crypto.getRandomValues(new Uint32Array(2)) : [Math.random() * 2 ** 32, Math.random() * 2 ** 32];
  return 'p' + [...r].map((x) => Math.floor(x).toString(36)).join('');
}

function emptyWorkspace() {
  return { type: 'workspace', version: WORKSPACE_VERSION, activeId: null, ledgers: {}, exported: {} };
}

// 箱の中身（P4 までの台帳1件 / workspace）を workspace にそろえる。
// legacyExported: P4 までの書き出し状態（{ revision, at }）。戻り値: { workspace, wrapped } / { error }
function migrateWorkspace(obj, legacyExported) {
  if (obj && obj.type === 'workspace' && obj.version === WORKSPACE_VERSION && obj.ledgers && typeof obj.ledgers === 'object') {
    return { workspace: { ...emptyWorkspace(), ...obj, exported: obj.exported || {} }, wrapped: false };
  }
  if (obj && obj.type === 'ledger') {
    const id = newProjectId();
    const ws = emptyWorkspace();
    ws.ledgers[id] = obj;
    ws.activeId = id;
    ws.exported[id] = legacyExported || { revision: null, at: null };
    return { workspace: ws, wrapped: true };
  }
  return { error: '保存されたデータの形が分かりません' };
}

// 案件ごとに検査する。check(ledgerObj) → { ok, ledger, migrated } / { ok: false, errors }
// 戻り値: { workspace（読めた案件だけ）, broken: { 案件ID: 元の文字列 }, migratedIds: string[] }
function openWorkspace(ws, check) {
  const out = { ...ws, ledgers: {}, exported: { ...(ws.exported || {}) } };
  const broken = {};
  const migratedIds = [];
  for (const [id, obj] of Object.entries(ws.ledgers || {})) {
    let r;
    try { r = check(obj); } catch (e) { r = { ok: false, errors: [String(e && e.message || e)] }; }
    if (r.ok) {
      out.ledgers[id] = r.ledger;
      if (r.migrated) { migratedIds.push(id); out.exported[id] = { revision: null, at: null }; }
    } else {
      broken[id] = JSON.stringify(obj, null, 2);
      delete out.exported[id];
    }
  }
  if (!out.ledgers[out.activeId]) out.activeId = Object.keys(out.ledgers)[0] || null;
  return { workspace: out, broken, migratedIds };
}

// 同じ案件名の案件の ID（無ければ null）
function findByName(ws, name) {
  const n = String(name || '').trim();
  for (const [id, l] of Object.entries(ws.ledgers)) if (String(l.project && l.project.name || '').trim() === n) return id;
  return null;
}


// ---- core/cross.js ----
// 案件をまたいだ一覧（横断）: 自分の作業・自分が持つボール・顧客待ち・案件ごとの高の件数と SPI
// 新しい計算は持たず、既存の関数（ballOf / waitDays / runHealth / computeEvm）を案件ごとに呼んで集める


const CROSS_DAYS = 14;

// 戻り値: [{ id, name, me, myTasks, myBalls, waiting, high, spi }]（me が未設定なら myTasks・myBalls は null）
function crossSummary(workspace, today) {
  const t = dayNumber(today);
  return Object.entries(workspace.ledgers).map(([id, l]) => {
    const me = settingOf(l, 'me');
    const hasMe = !!(me && l.items.some((x) => x.id === me));
    const myTasks = hasMe
      ? l.items.filter((x) => x.kind === 'task' && x.assignee === me && isOpen(x) && x.end && dayNumber(x.end) <= t + CROSS_DAYS)
        .sort((a, b) => a.end.localeCompare(b.end))
        .map((x) => ({ item: x, overdue: dayNumber(x.end) < t }))
      : null;
    const myBalls = hasMe
      ? l.items.filter((x) => (x.kind === 'issue' && x.owner === me) || (x.kind === 'question' && x.askTo === me)).filter(isOpen)
        .map((x) => ({ item: x, wait: waitDays(x, l, today) }))
      : null;
    const limit = settingOf(l, 'ballWaitDays');
    const waiting = l.items.filter((x) => ballOf(x, l) === 'customer')
      .map((x) => ({ item: x, wait: waitDays(x, l, today) }))
      .filter((w) => w.wait !== null && w.wait >= limit)
      .sort((a, b) => b.wait - a.wait);
    const high = runHealth(l, today).filter((f) => f.severity === 'high').length;
    const spi = l.items.some((x) => x.kind === 'task') ? computeEvm(l, today).spi : null;
    return { id, name: l.project.name, me: hasMe ? me : null, myTasks, myBalls, waiting, high, spi };
  });
}


// ---- core/hearing.js ----
// ヒヤリングの候補と、ベースラインとの差


const GAP_CODES = { 'no-owner': '担当と期限', 'no-source': '根拠（誰がいつ言ったか）', 'must-guess': '内容（Must だが推測のまま）', 'stale-guess': '内容（推測のまま）' };

// 次のヒヤリングの候補。戻り値: { key, type: 'question' | 'gap' | 'nfr', ref, text, ops(meetingId) }[]
// ops は「この会議に割り当てる」ときの差分の操作（applyLocalOps に渡す）
function hearingCandidates(ledger, today) {
  const out = [];
  const idx = linkIndex(ledger);
  const byId = new Map(ledger.items.map((it) => [it.id, it]));
  const hasOpenQuestion = (id) => [...(idx.get(id) || [])].some((x) => { const q = byId.get(x); return q && q.kind === 'question' && q.status === 'open'; });

  // 未回答で会議が決まっていない質問
  for (const q of ledger.items) {
    if (q.kind !== 'question' || q.status !== 'open' || q.meeting) continue;
    out.push({ key: 'q:' + q.id, type: 'question', ref: q.id, text: q.title, ops: (m) => [{ op: 'update', id: q.id, set: { meeting: m } }] });
  }

  // 健康診断の空欄。質問そのものの空欄は除く（質問を増やしても埋まらない）。既に未回答の質問でつながっていれば除く
  const seen = new Set();
  for (const f of runHealth(ledger, today)) {
    if (!GAP_CODES[f.code] || !f.itemId || seen.has(f.itemId)) continue;
    const it = byId.get(f.itemId);
    if (!it || it.kind === 'question' || it.kind === 'meeting' || hasOpenQuestion(it.id)) continue;
    seen.add(it.id);
    const text = `${kindLabel(it.kind)}「${it.title}」の${GAP_CODES[f.code]}を確認する`;
    out.push({
      key: 'g:' + it.id, type: 'gap', ref: it.id, text,
      ops: (m) => [{ op: 'add', item: { kind: 'question', title: text, meeting: m, links: [it.id], confidence: 'fact', sources: [{ type: 'other', ref: 'ヒヤリングの候補（健康診断）' }] } }],
    });
  }

  // 非機能の未着手の大項目
  for (const c of nfrStatus(ledger)) {
    if (c.state !== 'none') continue;
    const text = `${c.label}について確認する（${c.points.slice(0, 2).join('、')} など）`;
    out.push({
      key: 'n:' + c.id, type: 'nfr', ref: c.id, text,
      ops: (m) => [{ op: 'add', item: { kind: 'question', title: `${c.label}について確認する`, body: c.points.map((p) => '・' + p).join('\n'), meeting: m, nfrCategory: c.id, confidence: 'fact', sources: [{ type: 'other', ref: 'ヒヤリングの候補（非機能）' }] } }],
    });
  }
  return out;
}

const DROPPED = { requirement: 'dropped', request: 'rejected' };

// ベースラインと今の差。戻り値: { added: Item[], scopeChanged: { item, from, to }[], dropped: Item[] }
function baselineDiff(baseline, ledger) {
  const base = new Map(baseline.items.map((x) => [x.id, x]));
  const added = [];
  const scopeChanged = [];
  const dropped = [];
  for (const it of ledger.items) {
    if (it.kind !== 'request' && it.kind !== 'requirement') continue;
    const b = base.get(it.id);
    if (!b) { added.push(it); continue; }
    const now = it.scope || 'tbd';
    if (b.scope !== now) scopeChanged.push({ item: it, from: b.scope, to: now });
    if (it.status === DROPPED[it.kind] && b.status !== DROPPED[it.kind]) dropped.push(it);
  }
  return { added, scopeChanged, dropped };
}

// 種別と値の一覧
function schemaText() {
  const lines = [];
  lines.push('### 共通の項目（全種別）');
  lines.push('- title*: 題名（1行。体言止めで短く）');
  lines.push('- body: 内容（詳細。複数行可）');
  lines.push('- status: 状態（種別ごとに下記。省略すると最初の値）');
  lines.push(`- confidence: 確度（${enumText(CONFIDENCE)}）。省略すると guess`);
  lines.push(`- sources: 出典の配列。各要素は { "type": 種類, "ref": 会議名や資料名, "date": "YYYY-MM-DD", "speaker": 発言した関係者のID, "note": 補足 }。type は ${enumText(SOURCE_TYPES)}`);
  lines.push('- links: 関係する項目の ID の配列（例: 要件 → もとになった要望、課題 → 関係する要件）');
  lines.push('- tags: 文字列の配列（任意）');
  lines.push('- internal: true にすると社内のみの項目になり、顧客に見せる表示で隠れる（任意。社内向けのメモやリスクに使う）');
  lines.push('');
  lines.push('### 種別（kind）ごとの項目。* は必須');
  for (const k of KIND_IDS) {
    const d = KINDS[k];
    const fields = Object.entries(d.fields).map(([name, f]) => {
      let t = `${name}${f.required ? '*' : ''}（${f.label}`;
      if (f.type === 'enum') t += `: ${enumText(f.values)}`;
      if (f.type === 'date') t += ': YYYY-MM-DD';
      if (f.type === 'ref') t += `: ${f.kinds.map(kindLabel).join('・')}の ID`;
      if (f.type === 'refs') t += `: ${f.kinds.map(kindLabel).join('・')}の ID の配列`;
      if (f.type === 'strings') t += ': 文字列の配列';
      if (f.type === 'number') t += `: 数値 ${f.min}〜${f.max}${f.integer ? 'の整数' : ''}`;
      if (f.type === 'boolean') t += ': true / false';
      return t + '）';
    });
    lines.push(`- ${k}（${d.label}。ID は ${d.prefix}-001 の形）状態: ${enumText(d.statuses)}` + (fields.length ? `。項目: ${fields.join(', ')}` : ''));
  }
  lines.push('');
  lines.push('### 配列の項目の書き方（テーブル・画面・連携・バッチ）');
  lines.push(`- columns（列）: [{ "name": 物理名, "logical": 論理名, "type": ${LOGICAL_TYPES.map((t) => t.v).join(' / ')}, "length": 桁数, "scale": 小数の桁数, "pk": true, "required": true, "fk": { "entity": テーブルの ID か tempId, "column": 参照先の列名 }, "pattern": コードの形の正規表現, "note": 補足 }]`);
  lines.push('- fields（画面・連携の項目）: [{ "name": 項目名, "type": 論理型, "required": true, "source": { "entity": テーブルの ID, "column": 列名 } }]');
  lines.push('- crud: [{ "entity": テーブルの ID か tempId, "ops": "C" "R" "U" "D" の組み合わせ（例 "CRU"） }]');
  lines.push('- 配列は update で丸ごと置き換わる。テーブルを更新するときは、変えない列も含めて columns を全部返す（fields・crud も同じ）');
  return lines.join('\n');
}

function projectText(ledger) {
  const p = ledger.project;
  const lines = [`- 案件名: ${p.name}`];
  if (p.customer) lines.push(`- 顧客: ${p.customer}`);
  if (p.purpose) lines.push(`- 目的: ${p.purpose}`);
  if (p.periodStart || p.periodEnd) lines.push(`- 期間: ${p.periodStart || '?'} 〜 ${p.periodEnd || '?'}`);
  if (p.goals && p.goals.length) lines.push(`- ゴール: ${p.goals.join(' / ')}`);
  if (p.summary) lines.push(`- 概要: ${p.summary}`);
  lines.push(`- 台帳の revision: ${ledger.revision}`);
  return lines.join('\n');
}

const oneLine = (s) => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();

// 今の項目一覧。detailed なら本文や主要な項目も含める（レビュー用）。kinds を渡すとその種別だけ載せる
function itemsText(ledger, detailed, kinds, ids) {
  const items = ids ? ledger.items.filter((it) => ids.has(it.id)) : kinds ? ledger.items.filter((it) => kinds.includes(it.kind)) : ledger.items;
  if (!items.length) return '（まだ項目はありません）';
  const shown = new Set(items.map((it) => it.id));
  const lines = ['ID | 種別 | 状態 | 題名' + (detailed ? ' | 詳細' : '')];
  for (const it of items) {
    let line = `${it.id} | ${kindLabel(it.kind)} | ${statusLabel(it.kind, it.status)} | ${oneLine(it.title)}`;
    if (detailed) {
      const extra = [];
      for (const name of Object.keys(KINDS[it.kind].fields)) {
        const v = it[name];
        if (v === undefined || v === null || (Array.isArray(v) && !v.length)) continue;
        extra.push(`${KINDS[it.kind].fields[name].label}: ${Array.isArray(v) ? v.join(',') : oneLine(v)}`);
      }
      extra.push(`確度: ${it.confidence}`);
      if (it.links && it.links.length) extra.push(`関連: ${it.links.join(',')}`);
      if (it.body) extra.push(`内容: ${oneLine(it.body)}`);
      line += ' | ' + extra.join(' / ');
    }
    lines.push(line);
  }
  const rels = ledger.relations.filter((r) => shown.has(r.from) && shown.has(r.to));
  if (rels.length) {
    lines.push('', '関係（from → to: label）');
    for (const r of rels) lines.push(`${r.from} → ${r.to}: ${oneLine(r.label)}`);
  }
  return lines.join('\n');
}

// 会議を指定した議事録の取込に入れる、会議の情報とヒヤリングシート
function meetingText(ledger, meetingId) {
  const m = ledger.items.find((it) => it.id === meetingId && it.kind === 'meeting');
  if (!m) return '';
  const name = (id) => { const s = ledger.items.find((it) => it.id === id); return s ? `${s.title}（${id}）` : id; };
  const sheet = ledger.items.filter((it) => it.kind === 'question' && it.meeting === m.id);
  return [
    '',
    `## この議事録の会議: ${m.id} ${m.title}（${m.date}）`,
    `- 出席者: ${(m.attendees || []).map(name).join('、') || '（未登録）'}`,
    `- 議題: ${(m.agenda || []).join(' / ') || '（未登録）'}`,
    '- この会議で聞いた質問（回答が出たものは、この ID への update で status を answered、answer に回答、askedAt に会議の日付を入れる）:',
    ...(sheet.length ? sheet.map((q) => `  - ${q.id} ${oneLine(q.title)}`) : ['  - （なし）']),
    `- 会議が開催されたので、${m.id} を update で status: "held" にする`,
    '- 出典の ref には会議名、date には会議の日付を入れる',
  ].join('\n');
}

// ヒヤリング質問の生成に入れる、未確定・空欄の一覧
function gapsText(ledger, today) {
  const open = ledger.items.filter((it) => it.kind === 'question' && it.status === 'open');
  const gaps = runHealth(ledger, today).filter((f) => ['no-owner', 'no-source', 'must-guess', 'stale-guess', 'nfr-missing', 'scope-undecided'].includes(f.code));
  return [
    '## 未回答の質問（重複して作らない）',
    ...(open.length ? open.map((q) => `- ${q.id} ${oneLine(q.title)}`) : ['- （なし）']),
    '',
    '## 台帳の空欄・未確定（機械的な点検の結果）',
    ...(gaps.length ? gaps.map((f) => `- ${f.message}`) : ['- （なし）']),
  ].join('\n');
}

function nfrText(ledger) {
  const st = nfrStatus(ledger);
  return NFR.map((c) => {
    const s = st.find((x) => x.id === c.id);
    return `- ${c.id}（${c.label}）今の状態: ${enumLabel(NFR_STATES, s.state)}
  確認点: ${c.points.join(' / ')}`;
  }).join('\n');
}

function notebookPrompt(ledger) {
  const known = ledger.items.length
    ? ledger.items.map((it) => `- ${kindLabel(it.kind)}: ${oneLine(it.title)}`).join('\n')
    : '（まだありません）';
  return [
    `案件「${ledger.project.name}」について、アップロードした資料から要点を整理してください。`,
    '',
    '## 出力の形',
    '次の見出しの下に、1行に1件ずつ箇条書きで書いてください。',
    '',
    '## 関係者',
    '## 要望',
    '## 制約',
    '## 決定',
    '## 課題',
    '## 未確定の点',
    '',
    '各行の形: `- 内容 ／ 発言者: 名前（所属） ／ 日付: YYYY-MM-DD ／ 出典: 資料名`',
    '',
    '## 守ること',
    '- 資料に書かれていないことは書かない。推測で補わない',
    '- 発言者・日付・出典が分からないときは「不明」と書く',
    '- 決定には、理由と、検討された他の案があれば併せて書く',
    '- 下の「把握済みの事項」と同じものは書かなくてよい。内容が変わっていたら書く',
    '',
    '## 把握済みの事項',
    known,
  ].join('\n');
}

  const lines = [
    `## 変更要求: ${cr.id} ${cr.title}`,
    cr.body ? `- 内容: ${oneLine(cr.body)}` : null,
    `- 対象: ${(cr.links || []).join(', ') || '（未指定）'}`,
    `- 追加工数の見込み（今の値）: ${cr.extraEstimate ?? '未入力'} 人日`,
    '',
    '## 機械的に求めた影響範囲（2 段まで。関係者とシステムから先はたどっていない）',
  ];
  const byKind = Object.entries(imp.byKind).filter(([, v]) => v.length);
  if (!byKind.length) lines.push('- （つながる項目はありません）');
  for (const [k, list] of byKind) lines.push(`- ${kindLabel(k)}: ${list.map((it) => `${it.id} ${oneLine(it.title)}`).join(' / ')}`);
  lines.push(`- 影響する作業の見積の合計: ${imp.taskEstimate} 人日`);
  return lines.filter((x) => x !== null).join('\n');
}

// テスト観点の生成に入れる、対象の詳細・関係する制約と非機能要件・既にあるテスト
function targetsText(ledger, ids) {
  const byId = new Map(ledger.items.map((it) => [it.id, it]));
  const idx = linkIndex(ledger);
  const targets = ids.map((id) => byId.get(id)).filter(Boolean);
  if (!targets.length) return '（テストの対象が選ばれていません。指示文の画面で要件か画面を選んでください）';
  const L = ['## テストの対象'];
  const related = new Set();
  const tests = new Set();
  for (const t of targets) {
    L.push(`### ${t.id} ${kindLabel(t.kind)}「${oneLine(t.title)}」`);
    if (t.body) L.push(`- 内容: ${oneLine(t.body)}`);
    for (const [name, spec] of Object.entries(KINDS[t.kind].fields)) {
      const v = t[name];
      if (v === undefined || v === null || (Array.isArray(v) && !v.length)) continue;
      if (spec.type === 'fields') {
        L.push('- 項目:');
        for (const f of v) L.push(`  - ${f.name}（型 ${f.type || '不明'}${f.required ? '・必須' : ''}${f.source ? `・元 ${f.source.entity}.${f.source.column || ''}` : ''}）`);
      } else if (spec.type === 'crud') {
        L.push(`- CRUD: ${v.map((c) => `${c.entity} ${c.ops}`).join(' / ')}`);
      } else if (spec.type === 'columns') {
        L.push(`- 列: ${v.map((c) => `${c.name}(${c.type}${c.length ? ' ' + c.length : ''}${c.required || c.pk ? ' 必須' : ''})`).join(' / ')}`);
      } else {
        L.push(`- ${spec.label}: ${Array.isArray(v) ? v.join(', ') : oneLine(v)}`);
      }
    }
    for (const x of idx.get(t.id) || []) {
      const it = byId.get(x);
      if (!it) continue;
      if (it.kind === 'constraint' || (it.kind === 'requirement' && it.category === 'nonfunctional')) related.add(it);
      if (it.kind === 'test') tests.add(it);
    }
  }
  L.push('', '## 関係する制約・非機能要件');
  L.push(...(related.size ? [...related].map((it) => `- ${it.id} ${oneLine(it.title)}`) : ['- （なし）']));
  L.push('', '## 既にあるテスト（同じものは作らない）');
  L.push(...(tests.size ? [...tests].map((it) => `- ${it.id} ${oneLine(it.title)}`) : ['- （なし）']));
  return L.join('\n');
}

// 指示文を作る。opts: { today: 'YYYY-MM-DD', freeText?: string }
function buildPrompt(purpose, ledger, opts = {}) {
  const today = opts.today || new Date().toISOString().slice(0, 10);
  if (purpose === 'notebooklm') return notebookPrompt(ledger);
  if (purpose === 'report-polish') return reportPolishPrompt(ledger, opts.reportText || '');
  if (!PURPOSES.some((p) => p.id === purpose)) throw new Error('不明な目的: ' + purpose);
  const detailed = purpose.startsWith('review-');
  const def = PURPOSES.find((p) => p.id === purpose);
  const extra = { ...opts };
  if (purpose === 'hearing-questions') extra.gaps = gapsText(ledger, today);
  if (purpose === 'nfr') extra.nfr = nfrText(ledger);
  let ids = null;
  if (purpose === 'test-viewpoints') {
    const targetIds = Array.isArray(opts.targetIds) ? opts.targetIds : [];
    extra.targets = targetsText(ledger, targetIds);
    const idx = linkIndex(ledger);
    ids = new Set(targetIds);
    for (const id of targetIds) for (const x of idx.get(id) || []) ids.add(x);
  }
  if (purpose === 'change-review') {
    const cr = ledger.items.find((it) => it.id === opts.changeId && it.kind === 'change');
    if (cr) {
      const imp = impactOf(ledger, [cr.id]);
      ids = new Set([cr.id, ...(cr.links || []), ...imp.items.map((x) => x.item.id)]);
      extra.change = changeText(cr, imp);
    } else {
      extra.change = '（変更要求が選ばれていません。指示文の画面で変更要求を選んでください）';
      ids = new Set();
    }
  }
  return [
    taskText(purpose, extra) + (purpose === 'minutes' && opts.meetingId ? meetingText(ledger, opts.meetingId) : ''),
    '',
    rulesText(ledger, today),
    '',
    '## 種別と値の一覧',
    schemaText(),
    '',
    '## 出力の例',
    exampleJson(ledger.revision),
    '',
    '## 案件の概要',
    projectText(ledger),
    '',
    '## 今の台帳の項目一覧',
    ids ? (purpose === 'test-viewpoints' ? '（テストの対象と、それにつながる項目だけを載せています）' : '（変更要求とその影響範囲の項目だけを載せています）') : def.kinds ? `（${def.kinds.map(kindLabel).join('・')}だけを載せています）` : null,
    itemsText(ledger, detailed || purpose === 'change-review', ids ? null : def.kinds, ids),

// 新規の台帳を作る。starterId が null なら空の台帳
function createLedger(name, starterId, now) {
  const base = emptyLedger(name, now);
  if (!starterId) return base;
  const st = STARTERS[starterId];
  if (!st) throw new Error('不明な案件の型: ' + starterId);
  const r = applyLocalOps(base, [...st.ops, { op: 'project', set: { starter: starterId } }], now);
  if (!r.ok) throw new Error('案件の型の適用に失敗しました: ' + r.errors.join(' / '));
  // 型の項目は「変更」ではないので記録を残さない
  return { ...r.ledger, revision: 0, changelog: [] };
}


// ---- core/vault.js ----
// 台帳の暗号化。合言葉 → PBKDF2(SHA-256) → AES-GCM 256。鍵はメモリにだけ持ち、保存しない。
// ブラウザと Node（テスト）の両方で globalThis.crypto.subtle を使う。

const VAULT_VERSION = 1;
const PBKDF2_ITERATIONS = 600000;

const enc = new TextEncoder();
const dec = new TextDecoder();

function cryptoAvailable() {
  return !!(globalThis.crypto && globalThis.crypto.subtle && globalThis.crypto.getRandomValues);
}

function toB64(bytes) {
  let s = '';
  const u = new Uint8Array(bytes);
  for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
  return btoa(s);
}

function fromB64(b64) {
  const s = atob(b64);
  const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}

function newSalt() {
  return toB64(globalThis.crypto.getRandomValues(new Uint8Array(16)));
}

// 合言葉と salt から鍵を作る（取り出せない鍵）
async function deriveKey(passphrase, saltB64, iterations = PBKDF2_ITERATIONS) {
  const base = await globalThis.crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return globalThis.crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(saltB64), iterations },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt'],
  );
}

// 文字列を暗号化して、保存用の箱（JSON 文字列）を返す
async function sealText(key, saltB64, iterations, text) {
  const iv = globalThis.crypto.getRandomValues(new Uint8Array(12));
  const ct = await globalThis.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text));
  return JSON.stringify({ v: VAULT_VERSION, kdf: 'PBKDF2-SHA256', iter: iterations, salt: saltB64, iv: toB64(iv), ct: toB64(ct) });
}

// 保存用の箱を読む（中身は開けない。salt と回数を取り出すだけ）
function parseBox(boxText) {
  let b;
  try { b = JSON.parse(boxText); } catch (e) { return null; }
  if (!b || b.v !== VAULT_VERSION || typeof b.salt !== 'string' || typeof b.iv !== 'string' || typeof b.ct !== 'string' || !Number.isInteger(b.iter)) return null;
  return b;
}

// 箱を開ける。合言葉が違うと例外（AES-GCM の認証に失敗する）
async function openBox(key, box) {
  const pt = await globalThis.crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(box.iv) }, key, fromB64(box.ct));
  return dec.decode(pt);
}
