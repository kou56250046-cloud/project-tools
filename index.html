  { field: 'parent', shape: 'one', kinds: ['task', 'kpi'], on: ['task', 'kpi'] },   // kpi の parent が kpi だけを指すことは KINDS.kpi.fields.parent.kinds で守る
  { field: 'assignee', shape: 'one', kinds: ['stakeholder'], on: ['task'] },
  { field: 'dependsOn', shape: 'many', kinds: ['task'], on: ['task'] },
  { field: 'requestedBy', shape: 'one', kinds: ['stakeholder'], on: ['change'] },
  { field: 'system', shape: 'one', kinds: ['system'], on: ['interface'] },
  // 配列の中のオブジェクトの参照（P4）。path の先の ID を見る。dropElement なら参照先が無くなったとき要素ごと外す
  { field: 'columns', shape: 'nested', path: ['fk', 'entity'], kinds: ['entity'], on: ['entity'] },
  { field: 'fields', shape: 'nested', path: ['source', 'entity'], kinds: ['entity'], on: ['screen', 'interface'] },
  { field: 'crud', shape: 'nested', path: ['entity'], kinds: ['entity'], on: ['screen', 'interface', 'batch'], dropElement: true },
  { field: 'raci', shape: 'nested', path: ['who'], kinds: ['stakeholder'], on: ['task', 'decision', 'issue'], dropElement: true },
  { field: 'reportsTo', shape: 'one', kinds: ['stakeholder'], on: ['stakeholder'] },
];

// 台帳ごとの設定（store.updateSettings で変える。Gemini には変えさせない）
const SETTINGS = dict({
  ballWaitDays: { label: '顧客待ちを知らせる日数', type: 'int', min: 1, max: 90, default: 7 },
  productivity: { label: '生産性（人日 / FP）', type: 'number', min: 0.01, max: 100, default: null, nullable: true },
  ddlDialect: { label: 'DDL の方言', type: 'enum', default: 'postgres', values: [{ v: 'postgres', label: 'PostgreSQL' }, { v: 'sqlserver', label: 'SQL Server' }, { v: 'oracle', label: 'Oracle' }] },
  me: { label: '自分（この案件での関係者）', type: 'ref', kinds: ['stakeholder'], default: null, nullable: true },
  namingCase: { label: '物理名の大文字・小文字', type: 'enum', default: 'lower', values: [{ v: 'lower', label: '小文字（例: order_item）' }, { v: 'upper', label: '大文字（例: ORDER_ITEM）' }] },
});

function defaultSettings() {
  const out = {};
  for (const [k, d] of Object.entries(SETTINGS)) out[k] = d.default;
  return out;
}

function settingOf(ledger, key) {
  const v = ledger.settings ? ledger.settings[key] : undefined;
  return v === undefined ? SETTINGS[key].default : v;
}

function validateSettings(partial) {
  const errors = [];
  for (const [k, v] of Object.entries(partial || {})) {
    const d = SETTINGS[k];
    if (!d) { errors.push(`設定「${k}」はありません`); continue; }
    if (d.type === 'int' && (!Number.isInteger(v) || v < d.min || v > d.max)) errors.push(`${d.label}は ${d.min}〜${d.max} の整数で指定してください`);
    if (v === null && d.nullable) continue;
    if (d.type === 'number' && (typeof v !== 'number' || !Number.isFinite(v) || v < d.min || v > d.max)) errors.push(`${d.label}は ${d.min}〜${d.max} の数で指定してください`);
    if (d.type === 'enum' && !d.values.some((e) => e.v === v)) errors.push(`${d.label}の値「${String(v)}」は使えません`);
    if (d.type === 'ref' && v !== null && typeof v !== 'string') errors.push(`${d.label}は ID で指定してください`);
  }
  return errors;
}

const ID_RE = new RegExp('^(' + KIND_IDS.map((k) => KINDS[k].prefix).join('|') + ')-(\\d{3,})$');
const REL_ID_RE = /^RL-(\d{3,})$/;
const BL_ID_RE = /^BL-(\d{3,})$/;
const TEMP_ID_RE = /^new:[A-Za-z0-9_-]+$/;
const DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;

function kindOfId(id) {
  if (typeof id !== 'string') return null;
  const m = ID_RE.exec(id);
  if (!m) return null;
  return KIND_IDS.find((k) => KINDS[k].prefix === m[1]) || null;
}

function idNumber(id) {
  const m = ID_RE.exec(id) || REL_ID_RE.exec(id);
  return m ? Number(m[m.length - 1]) : 0;
}

function formatId(prefix, n) {
  return prefix + '-' + String(n).padStart(3, '0');
}

function isDate(s) {
  if (typeof s !== 'string') return false;
  const m = DATE_RE.exec(s);
  if (!m) return false;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return d.getUTCFullYear() === +m[1] && d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3];
}

// 日付の通し番号（日単位）。YYYY-MM-DD はそのまま、ISO 日時は端末のローカル日付にそろえる
function dayNumber(ymd) {
  const [y, m, d] = ymd.slice(0, 10).split('-').map(Number);
  return Date.UTC(y, m - 1, d) / 86400000;
}

// ISO 日時（UTC）を、端末のローカル日付の通し番号にする（今日の日付はローカルなので合わせる）
function localDayNumber(iso) {
  const t = new Date(iso);
  if (Number.isNaN(t.getTime())) return NaN;
  return Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / 86400000;
}

function kindLabel(kind) { return KINDS[kind] ? KINDS[kind].label : kind; }

function statusLabel(kind, v) {
  const s = KINDS[kind] && KINDS[kind].statuses.find((x) => x.v === v);
  return s ? s.label : v;
}

function enumLabel(values, v) {
  const x = values.find((e) => e.v === v);
  return x ? x.label : v;
}

function fieldSpec(kind, name) {
  return COMMON_FIELDS[name] || (KINDS[kind] && KINDS[kind].fields[name]) || null;
}

function isOpen(item) {
  const s = OPEN_STATUSES[item.kind];
  return !!s && s.includes(item.status);
}

const vlist = (values) => values.map((e) => e.v).join(', ');

// 参照の解決。resolve(id) は参照先の kind を返す。見つからなければ null
function checkRef(id, spec, where, resolve, out, allowDangling) {
  if (typeof id !== 'string' || id === '') { out.push(`${where}: ID を文字列で指定してください`); return; }
  const k = resolve(id);
  if (!k) {
    if (TEMP_ID_RE.test(id)) out.push(`${where}: 仮ID「${id}」はこの差分の中にありません`);
    else if (!kindOfId(id)) out.push(`${where}: 「${id}」は ID の形式ではありません（例: SH-001 / new:1）`);
    else if (!allowDangling) out.push(`${where}: ID「${id}」は台帳にありません`);
    return;
  }
  if (!spec.kinds.includes(k)) {
    out.push(`${where}: 「${id}」は${kindLabel(k)}です。ここには${spec.kinds.map(kindLabel).join('・')}の ID を指定してください`);
  }
}

// 1つのフィールド値を検査する
function checkField(kind, name, spec, value, ctx, out) {
  const where = `${spec.label}（${name}）`;
  switch (spec.type) {
    case 'string':
    case 'text':
      if (typeof value !== 'string') out.push(`${where}: 文字列で指定してください`);
      else if (spec.required && value.trim() === '') out.push(`${where}: 空にできません`);
      break;
    case 'date':
      if (!isDate(value)) out.push(`${where}: 日付は YYYY-MM-DD の形で指定してください（「${String(value)}」）`);
      break;
    case 'enum':
      if (!spec.values.some((e) => e.v === value)) out.push(`${where}: 「${String(value)}」は使えません。使える値: ${vlist(spec.values)}`);
      break;
    case 'status': {
      const st = KINDS[kind].statuses;
      if (!st.some((e) => e.v === value)) out.push(`${where}: 「${String(value)}」は使えません。使える値: ${vlist(st)}`);
      break;
    }
    case 'number':
      if (typeof value !== 'number' || !Number.isFinite(value)) out.push(`${where}: 数で指定してください`);
      else if (spec.integer && !Number.isInteger(value)) out.push(`${where}: 整数で指定してください`);
      else if ((spec.min !== undefined && value < spec.min) || (spec.max !== undefined && value > spec.max)) out.push(`${where}: ${spec.min}〜${spec.max} の範囲で指定してください（${value}）`);
      break;
    case 'boolean':
      if (typeof value !== 'boolean') out.push(`${where}: true か false で指定してください`);
      break;
    case 'columns':
    case 'fields':
    case 'crud':
    case 'raci':
      checkNested(spec.type, value, where, ctx, out);
      break;
    case 'strings':
      if (!Array.isArray(value) || value.some((x) => typeof x !== 'string')) out.push(`${where}: 文字列の配列で指定してください`);
      break;
    case 'ref':
      checkRef(value, spec, where, ctx.resolve, out, ctx.allowDangling);
      break;
    case 'refs':
      if (!Array.isArray(value)) { out.push(`${where}: ID の配列で指定してください`); break; }
      value.forEach((id, i) => checkRef(id, spec, `${where}[${i}]`, ctx.resolve, out, ctx.allowDangling));
      break;
    case 'sources':
      if (!Array.isArray(value)) { out.push(`${where}: 配列で指定してください`); break; }
      value.forEach((s, i) => {
        const w = `出典[${i}]`;
        if (!s || typeof s !== 'object' || Array.isArray(s)) { out.push(`${w}: オブジェクトで指定してください`); return; }
        if (!SOURCE_TYPES.some((e) => e.v === s.type)) out.push(`${w}.type: 「${String(s.type)}」は使えません。使える値: ${vlist(SOURCE_TYPES)}`);
        if (typeof s.ref !== 'string' || s.ref.trim() === '') out.push(`${w}.ref: 会議名や資料名を文字列で指定してください`);
        if (s.date !== undefined && !isDate(s.date)) out.push(`${w}.date: 日付は YYYY-MM-DD の形で指定してください（「${String(s.date)}」）`);
        if (s.note !== undefined && typeof s.note !== 'string') out.push(`${w}.note: 文字列で指定してください`);
        if (s.speaker !== undefined) checkRef(s.speaker, { kinds: ['stakeholder'] }, `${w}.speaker`, ctx.resolve, out, ctx.allowDangling);
        for (const k of Object.keys(s)) {
          if (!['type', 'ref', 'date', 'speaker', 'note'].includes(k)) ctx.warnings.push(`${w}: 不明な項目「${k}」は無視します`);
        }
      });
      break;
    default:
      out.push(`${where}: 定義の誤り（型 ${spec.type}）`);
  }
}

// 列・項目・CRUD の配列の検査（P4）
const isObjLike = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
const NESTED_KEYS = {
  columns: ['name', 'logical', 'type', 'length', 'scale', 'pk', 'required', 'fk', 'pattern', 'note'],
  fields: ['name', 'type', 'required', 'source'],
  crud: ['entity', 'ops'],
  raci: ['who', 'role'],
};
function checkNested(type, value, where, ctx, out) {
  if (!Array.isArray(value)) { out.push(`${where}: 配列で指定してください`); return; }
  const entitySpec = { kinds: ['entity'] };
  value.forEach((el, i) => {
    const w = `${where}[${i}]`;
    if (!isObjLike(el)) { out.push(`${w}: オブジェクトで指定してください`); return; }
    for (const k of Object.keys(el)) if (!NESTED_KEYS[type].includes(k)) ctx.warnings.push(`${w}: 不明な項目「${k}」は無視します`);
    if (type === 'raci') {
      checkRef(el.who, { kinds: ['stakeholder'] }, `${w}.who`, ctx.resolve, out, ctx.allowDangling);
      if (!RACI_ROLES.some((r) => r.v === el.role)) out.push(`${w}.role: R（実行）・A（承認）・C（相談）・I（報告）のどれかで指定してください。「${String(el.role)}」`);
      if (value.slice(0, i).some((x) => isObjLike(x) && x.who === el.who)) out.push(`${w}.who: 同じ人（${String(el.who)}）が 2 回あります。1 人に 1 つの役にしてください`);
      return;
    }
    if (type === 'crud') {
      checkRef(el.entity, entitySpec, `${w}.entity`, ctx.resolve, out, ctx.allowDangling);
      if (typeof el.ops !== 'string' || !/^[CRUD]+$/.test(el.ops) || new Set(el.ops).size !== el.ops.length) out.push(`${w}.ops: C・R・U・D の組み合わせで、同じ文字を重ねずに指定してください（例: "CRU"）。「${String(el.ops)}」`);
      return;
    }
    if (typeof el.name !== 'string' || el.name.trim() === '') out.push(`${w}.name: 名前がありません`);
    if (type === 'columns') {
      if (!LOGICAL_TYPES.some((t) => t.v === el.type)) out.push(`${w}.type: 「${String(el.type)}」は使えません。使える値: ${LOGICAL_TYPES.map((t) => t.v).join(', ')}`);
      if (el.length !== undefined && (!Number.isInteger(el.length) || el.length <= 0)) out.push(`${w}.length: 1 以上の整数で指定してください`);
      if (el.scale !== undefined && (!Number.isInteger(el.scale) || el.scale < 0)) out.push(`${w}.scale: 0 以上の整数で指定してください`);
      for (const b of ['pk', 'required']) if (el[b] !== undefined && typeof el[b] !== 'boolean') out.push(`${w}.${b}: true か false で指定してください`);
      if (el.fk !== undefined) {
        if (!isObjLike(el.fk)) out.push(`${w}.fk: { "entity": テーブルの ID, "column": 列名 } で指定してください`);
        else {
          checkRef(el.fk.entity, entitySpec, `${w}.fk.entity`, ctx.resolve, out, ctx.allowDangling);
          if (typeof el.fk.column !== 'string' || !el.fk.column) out.push(`${w}.fk.column: 参照先の列名がありません`);
        }
      }
      if (el.pattern !== undefined) {
        try { new RegExp(el.pattern); } catch (e) { out.push(`${w}.pattern: 正規表現として読めません`); }
      }
    } else if (el.source !== undefined) {
      if (!isObjLike(el.source)) out.push(`${w}.source: { "entity": テーブルの ID, "column": 列名 } で指定してください`);
      else checkRef(el.source.entity, entitySpec, `${w}.source.entity`, ctx.resolve, out, ctx.allowDangling);
    }
  });
}

const META_FIELDS = ['id', 'kind', 'createdAt', 'updatedAt'];

// 項目のフィールドを検査する。
// opts.partial: true なら update の set として検査（必須の欠けを見ない）
// 戻り値: { errors, warnings, unknown }（unknown は無視するフィールド名）
function validateFields(kind, obj, opts) {
  const errors = [];
  const warnings = [];
  const unknown = [];
  const ctx = { resolve: opts.resolve, allowDangling: !!opts.allowDangling, warnings };
  if (!KINDS[kind]) {
    errors.push(`種別（kind）「${String(kind)}」は使えません。使える値: ${KIND_IDS.join(', ')}`);
    return { errors, warnings, unknown };
  }
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) {
    errors.push('項目はオブジェクトで指定してください');
    return { errors, warnings, unknown };
  }
  const specs = Object.assign(Object.create(null), COMMON_FIELDS, KINDS[kind].fields);
  if (!opts.partial) {
    for (const [name, spec] of Object.entries(specs)) {
      if (spec.required && (obj[name] === undefined || obj[name] === null || obj[name] === '')) {
        errors.push(`${spec.label}（${name}）がありません`);
      }
    }
  }
  for (const [name, value] of Object.entries(obj)) {
    if (META_FIELDS.includes(name) || value === undefined) continue;
    const spec = specs[name];
    if (!spec) { unknown.push(name); warnings.push(`不明な項目「${name}」は無視します`); continue; }
    // 任意項目に null が来たら「消す」とみなす（update で値を外すため）
    if (value === null) {
      // sources と links は配列であることを前提に描画・検査するので、消せない（空にするなら []）
      if (spec.required || ['status', 'confidence', 'sources', 'links'].includes(name)) errors.push(`${spec.label}（${name}）は空にできません${name === 'sources' || name === 'links' ? '。空にするときは [] を指定してください' : ''}`);
      continue;
    }
    checkField(kind, name, spec, value, ctx, errors);
  }
  if (kind === 'memo' && typeof obj.body === 'string' && obj.body.length > MEMO_BODY_MAX) {
    errors.push(`メモの本文は ${MEMO_BODY_MAX.toLocaleString()} 字までです（${obj.body.length.toLocaleString()} 字）。期間を分けてください`);
  }
  if (kind === 'bizflow' && typeof obj.notation === 'string' && obj.notation.length > BIZFLOW_NOTATION_MAX) {
    errors.push(`業務フローの記法は ${BIZFLOW_NOTATION_MAX.toLocaleString()} 字までです（${obj.notation.length.toLocaleString()} 字）。図を分けてください`);
  }
  return { errors, warnings, unknown };
}

// 省略された共通フィールドを既定値で補う（新しいオブジェクトを返す）
function withDefaults(kind, obj) {
  const out = { ...obj };
  if (out.status === undefined) out.status = KINDS[kind].statuses[0].v;
  if (out.confidence === undefined) out.confidence = 'guess';
  if (out.sources === undefined) out.sources = [];
  if (out.links === undefined) out.links = [];
  if (kind === 'risk' && out.internal === undefined) out.internal = true;   // リスクは既定で社内のみ（外せる）
  return out;
}

// 台帳から id → kind の解決関数を作る（関係の ID も含む）
function makeResolver(ledger, extra) {
  const map = new Map();
  for (const it of ledger.items || []) if (it && typeof it.id === 'string') map.set(it.id, it.kind);
  return (id) => map.get(id) || (extra ? extra(id) : null) || null;
}

function emptyLedger(name, now) {
  const counters = {};
  for (const k of KIND_IDS) counters[KINDS[k].prefix] = 0;
  counters[RELATION_PREFIX] = 0;
  counters[BASELINE_PREFIX] = 0;
  return {
    schemaVersion: SCHEMA_VERSION,
    type: 'ledger',
    revision: 0,
    project: { name: name || '新しい案件', goals: [], starter: null },
    items: [],
    relations: [],
    baselines: [],
    changelog: [],
    settings: defaultSettings(),
    counters,
    updatedAt: now,
  };
}

const BASELINE_PREFIX = 'BL';
const CHANGELOG_LIMIT = 2000;

// 古い版の台帳を今の版にそろえる。戻り値: { ledger, migrated } / { error }
// 移行はここ1か所で行う。元のオブジェクトは変えない
function migrateLedger(obj) {
  if (!obj || typeof obj !== 'object' || Array.isArray(obj) || obj.type !== 'ledger') return { error: '台帳ではありません' };
  if (obj.schemaVersion === SCHEMA_VERSION) return { ledger: obj, migrated: false };
  if (obj.schemaVersion === 1) {
    const out = {
      ...obj,
      schemaVersion: 2,
      baselines: [],
      changelog: [],
      settings: defaultSettings(),
      counters: { ...(obj.counters || {}), [BASELINE_PREFIX]: 0 },
    };
    return { ledger: out, migrated: true };
  }
  return { error: `この版（schemaVersion ${String(obj.schemaVersion)}）の台帳は、このツールでは開けません。新しい版のツールで開いてください` };
}

// 案件の型の ID（starter.js が登録する。schema.js から starter.js は import できないため）
const STARTER_IDS = new Set(['business-system-new']);
function registerStarters(ids) {
  for (const id of ids) STARTER_IDS.add(id);
}

const PROJECT_FIELDS = dict({
  name: 'string', customer: 'string', purpose: 'text', periodStart: 'date', periodEnd: 'date',
  goals: 'strings', summary: 'text', starter: 'starter',
});

function validateProject(p, partial) {
  const errors = [];
  const warnings = [];
  if (!p || typeof p !== 'object' || Array.isArray(p)) return { errors: ['案件情報（project）はオブジェクトで指定してください'], warnings };
  if (!partial && (typeof p.name !== 'string' || p.name.trim() === '')) errors.push('案件名（project.name）がありません');
  for (const [k, v] of Object.entries(p)) {
    const t = PROJECT_FIELDS[k];
    if (!t) { warnings.push(`案件情報の不明な項目「${k}」は無視します`); continue; }
    if (v === null) { if (k === 'name') errors.push('案件名（name）は空にできません'); continue; }
    if ((t === 'string' || t === 'text') && typeof v !== 'string') errors.push(`案件情報 ${k}: 文字列で指定してください`);
    if (t === 'date' && !isDate(v)) errors.push(`案件情報 ${k}: 日付は YYYY-MM-DD の形で指定してください（「${String(v)}」）`);
    if (t === 'strings' && (!Array.isArray(v) || v.some((x) => typeof x !== 'string'))) errors.push(`案件情報 ${k}: 文字列の配列で指定してください`);
    if (t === 'starter' && !STARTER_IDS.has(v)) errors.push(`案件情報 ${k}: 「${String(v)}」は使えません`);
  }
  if (p.name !== undefined && typeof p.name === 'string' && p.name.trim() === '') errors.push('案件名（name）は空にできません');
  return { errors, warnings };
}

// 台帳全体の検査。opts.allowDanglingRefs: 存在しない ID への参照を許す（ファイル読み込み用）
function validateLedger(obj, opts = {}) {
  const errors = [];
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return ['台帳がオブジェクトではありません'];
  if (obj.type !== 'ledger') errors.push('type が "ledger" ではありません（台帳のファイルではない可能性があります）');
  if (obj.schemaVersion !== SCHEMA_VERSION) errors.push(`schemaVersion が ${SCHEMA_VERSION} ではありません（${String(obj.schemaVersion)}）`);
  if (!Number.isInteger(obj.revision) || obj.revision < 0) errors.push('revision が 0 以上の整数ではありません');
  errors.push(...validateProject(obj.project, false).errors);
  if (!Array.isArray(obj.items)) { errors.push('items が配列ではありません'); return errors; }
  if (!Array.isArray(obj.relations)) { errors.push('relations が配列ではありません'); return errors; }

  const seen = new Set();
  obj.items.forEach((it, i) => {
    const where = `items[${i}]`;
    if (!it || typeof it !== 'object') { errors.push(`${where}: オブジェクトではありません`); return; }
    const k = kindOfId(it.id);
    if (!k) { errors.push(`${where}: ID「${String(it.id)}」の形式が正しくありません`); return; }
    if (k !== it.kind) errors.push(`${where}（${it.id}）: ID の接頭辞と種別「${String(it.kind)}」が合いません`);
    if (seen.has(it.id)) errors.push(`${where}: ID「${it.id}」が重複しています`);
    seen.add(it.id);
  });
  const resolve = makeResolver(obj);
  obj.items.forEach((it, i) => {
    if (!it || !KINDS[it.kind]) return;
    const r = validateFields(it.kind, it, { resolve, allowDangling: !!opts.allowDanglingRefs });
    for (const e of r.errors) errors.push(`items[${i}]（${it.id}）: ${e}`);
    for (const f of ['status', 'confidence', 'sources', 'links']) {
      if (it[f] === undefined) errors.push(`items[${i}]（${it.id}）: ${f} がありません`);
    }
  });
  // 版 2 で足した入れ物。形だけ見て、不明なキーは誤りにしない（後の段階で足す値で読めなくならないように）
  if (!Array.isArray(obj.baselines)) errors.push('baselines が配列ではありません');
  else obj.baselines.forEach((b, i) => {
    if (!b || typeof b !== 'object' || !BL_ID_RE.test(b.id) || typeof b.name !== 'string' || !isDate(b.date) || !Array.isArray(b.items)) errors.push(`baselines[${i}]: 形が正しくありません（id・name・date・items が要ります）`);
  });
  if (!Array.isArray(obj.changelog)) errors.push('changelog が配列ではありません');
  else if (obj.changelog.some((c) => !c || typeof c !== 'object' || !Array.isArray(c.changes))) errors.push('changelog の要素の形が正しくありません');
  if (!obj.settings || typeof obj.settings !== 'object' || Array.isArray(obj.settings)) errors.push('settings がオブジェクトではありません');

  const relSeen = new Set();
  obj.relations.forEach((r, i) => {
    const where = `relations[${i}]`;
    if (!r || typeof r !== 'object') { errors.push(`${where}: オブジェクトではありません`); return; }
    if (!REL_ID_RE.test(r.id)) errors.push(`${where}: ID「${String(r.id)}」の形式が正しくありません（例: RL-001）`);
    if (relSeen.has(r.id)) errors.push(`${where}: ID「${r.id}」が重複しています`);
    relSeen.add(r.id);
    if (typeof r.label !== 'string') errors.push(`${where}: label を文字列で指定してください`);
    const spec = { kinds: RELATION_NODE_KINDS };
    const out = [];
    checkRef(r.from, spec, `${where}.from`, resolve, out, !!opts.allowDanglingRefs);
    checkRef(r.to, spec, `${where}.to`, resolve, out, !!opts.allowDanglingRefs);
    errors.push(...out);
  });
  return errors;
}

// counters を項目と関係の最大番号以上にそろえる（読み込んだ台帳の採番が重複しないように）
function normalizeCounters(ledger) {
  const counters = { ...(ledger.counters || {}) };
  for (const k of KIND_IDS) {
    const p = KINDS[k].prefix;
    counters[p] = Math.max(Number(counters[p]) || 0, ...ledger.items.filter((it) => it.kind === k).map((it) => idNumber(it.id)), 0);
  }
  counters[RELATION_PREFIX] = Math.max(Number(counters[RELATION_PREFIX]) || 0, ...ledger.relations.map((r) => idNumber(r.id)), 0);
  counters[BASELINE_PREFIX] = Math.max(Number(counters[BASELINE_PREFIX]) || 0, ...(ledger.baselines || []).map((b) => { const m = BL_ID_RE.exec(b.id); return m ? Number(m[1]) : 0; }), 0);
  return { ...ledger, counters };
}

// ベースライン（P2）
function latestBaseline(ledger) {
  const b = ledger.baselines || [];
  return b.length ? b[b.length - 1] : null;
}

// 最新のベースラインに無い要望・要件の ID
function afterBaselineIds(ledger) {
  const b = latestBaseline(ledger);
  if (!b) return new Set();
  const inBase = new Set(b.items.map((x) => x.id));
  return new Set(ledger.items.filter((it) => (it.kind === 'request' || it.kind === 'requirement') && !inBase.has(it.id)).map((it) => it.id));
}

// 説明用の表示（P3）: 社内のみの項目と、それにつながる関係を除いた台帳を返す。全画面の一覧・集計はこれを通す
function visibleLedger(ledger, presentation) {
  if (!presentation) return ledger;
  // 説明用の表示では、社内のみの項目とメモを除く
  const items = ledger.items.filter((it) => !it.internal && it.kind !== 'memo');
  const ids = new Set(items.map((it) => it.id));
  return { ...ledger, items, relations: ledger.relations.filter((r) => ids.has(r.from) && ids.has(r.to)) };
}

// links は向きを持たない。A と B がつながっている = A.links に B があるか、B.links に A があるか
function linkIndex(ledger) {
  const map = new Map();
  const add = (a, b) => { if (!map.has(a)) map.set(a, new Set()); map.get(a).add(b); };
  for (const it of ledger.items) {
    for (const id of it.links || []) { add(it.id, id); add(id, it.id); }
  }
  return map;
}

function linkedIds(ledger, id, index) {
  return (index || linkIndex(ledger)).get(id) || new Set();
}

// 項目をまたぐ検査（循環・重複など）。戻り値: { errors: { itemId, message }[], warnings }
// 段階ごとに INTEGRITY_RULES に規則を足す。取込と画面の変更では、仮に適用した台帳にかけて新しい誤りを止める
const INTEGRITY_RULES = [];

// P3: 作業の親の循環・前の作業の循環・開始 > 終了
function findCycleNodes(nodes, nextOf) {
  // 深さ優先で、循環に含まれる ID を集める
  const state = new Map();
  const inCycle = new Set();
  const stack = [];
  const visit = (id) => {
    state.set(id, 1);
    stack.push(id);
    for (const n of nextOf(id)) {
      if (!nodes.has(n)) continue;
      if (state.get(n) === 1) { for (let i = stack.indexOf(n); i < stack.length; i++) inCycle.add(stack[i]); }
      else if (!state.has(n)) visit(n);
    }
    stack.pop();
    state.set(id, 2);
  };
  for (const id of nodes.keys()) if (!state.has(id)) visit(id);
  return inCycle;
}

// P4: テーブルの物理名の重複・同じテーブル内の列名の重複・外部キーの参照先の列・主キーの無いテーブル（警告）
INTEGRITY_RULES.push((ledger, errors, warnings) => {
  const ents = ledger.items.filter((it) => it.kind === 'entity' && it.status !== 'dropped');
  const byName = new Map();
  for (const e of ents) {
    const key = String(e.physicalName || '').toLowerCase();
    if (!key) continue;
    if (byName.has(key)) errors.push({ itemId: e.id, message: `テーブルの物理名「${e.physicalName}」が ${byName.get(key)} と重複しています` });
    else byName.set(key, e.id);
  }
  const byId = new Map(ledger.items.filter((it) => it.kind === 'entity').map((e) => [e.id, e]));
  for (const e of ents) {
    const cols = Array.isArray(e.columns) ? e.columns : [];
    const seen = new Set();
    for (const c of cols) {
      const n = String(c && c.name || '').toLowerCase();
      if (n && seen.has(n)) errors.push({ itemId: e.id, message: `列名「${c.name}」が重複しています` });
      seen.add(n);
      if (c && c.fk && c.fk.entity) {
        const ref = byId.get(c.fk.entity);
        if (ref && !(ref.columns || []).some((x) => x && String(x.name).toLowerCase() === String(c.fk.column).toLowerCase())) {
          errors.push({ itemId: e.id, message: `列「${c.name}」の外部キーの参照先 ${c.fk.entity} に列「${c.fk.column}」がありません` });
        }
      }
    }
    if (cols.length && !cols.some((c) => c && c.pk)) warnings.push({ itemId: e.id, message: `テーブル「${e.title}」に主キーがありません` });
  }
});

INTEGRITY_RULES.push((ledger, errors) => {
  const people = new Map(ledger.items.filter((it) => it.kind === 'stakeholder').map((it) => [it.id, it]));
  for (const id of findCycleNodes(people, (x) => (people.get(x).reportsTo ? [people.get(x).reportsTo] : []))) {
    errors.push({ itemId: id, message: '上長をたどると自分に戻ります（上下関係が循環しています）' });
  }
});

INTEGRITY_RULES.push((ledger, errors) => {
  const kpis = new Map(ledger.items.filter((it) => it.kind === 'kpi').map((it) => [it.id, it]));
  for (const id of findCycleNodes(kpis, (x) => (kpis.get(x).parent ? [kpis.get(x).parent] : []))) {
    errors.push({ itemId: id, message: '親の KPI をたどると自分に戻ります（親子が循環しています）' });
  }
});

INTEGRITY_RULES.push((ledger, errors) => {
  const tasks = new Map(ledger.items.filter((it) => it.kind === 'task').map((it) => [it.id, it]));
  for (const id of findCycleNodes(tasks, (x) => (tasks.get(x).parent ? [tasks.get(x).parent] : []))) {
    errors.push({ itemId: id, message: '親の作業をたどると自分に戻ります（親子が循環しています）' });
  }
  for (const id of findCycleNodes(tasks, (x) => tasks.get(x).dependsOn || [])) {
    errors.push({ itemId: id, message: '前の作業をたどると自分に戻ります（前後関係が循環しています）' });
  }
  for (const t of tasks.values()) {
    if (t.start && t.end && t.start > t.end) errors.push({ itemId: t.id, message: `開始日（${t.start}）が終了日（${t.end}）より後です` });
  }
});

function checkIntegrity(ledger) {
  const errors = [];
  const warnings = [];
  for (const rule of INTEGRITY_RULES) rule(ledger, errors, warnings);
  return { errors, warnings };
}

// 元の台帳に無かった誤りだけを返す（取込の判定用）
function newIntegrityErrors(before, after) {
  const key = (e) => e.itemId + '|' + e.message;
  const had = new Set(checkIntegrity(before).errors.map(key));
  return checkIntegrity(after).errors.filter((e) => !had.has(key(e)));
}

// 配列の要素の中の参照（path をたどる）
function nestedRef(el, path) {
  let v = el;
  for (const k of path) { if (!v || typeof v !== 'object') return null; v = v[k]; }
  return typeof v === 'string' ? v : null;
}

// 項目が参照している ID を列挙する: [{ field, id, index? }]
function refsOf(item) {
  const out = [];
  for (const rf of REF_FIELDS) {
    if (!rf.on.includes(item.kind)) continue;
    if (rf.shape === 'source') {
      (item.sources || []).forEach((s, i) => { if (s && s.speaker) out.push({ field: 'speaker', id: s.speaker, index: i }); });
    } else if (rf.shape === 'nested') {
      (Array.isArray(item[rf.field]) ? item[rf.field] : []).forEach((el, i) => {
        const id = nestedRef(el, rf.path);
        if (id) out.push({ field: rf.field, id, index: i });
      });
    } else if (rf.shape === 'many') {
      (Array.isArray(item[rf.field]) ? item[rf.field] : []).forEach((id) => out.push({ field: rf.field, id }));
    } else if (item[rf.field]) {
      out.push({ field: rf.field, id: item[rf.field] });
    }
  }
  return out;
}

// 逆参照の索引: id → [{ from: 項目ID, field }]。関係（relations）も含める
function buildBackrefs(ledger) {
  const map = new Map();
  const add = (to, entry) => { if (!map.has(to)) map.set(to, []); map.get(to).push(entry); };
  for (const it of ledger.items) {
    for (const r of refsOf(it)) add(r.id, { from: it.id, field: r.field });
  }
  for (const rel of ledger.relations) {
    add(rel.from, { from: rel.to, field: 'relation', relation: rel.id, label: rel.label });
    add(rel.to, { from: rel.from, field: 'relation', relation: rel.id, label: rel.label });
  }
  return map;
}

// kind を渡すとその種別でのラベルを返す（owner は種別により「担当」「要望者」「管理者」）
function refFieldLabel(field, kind) {
  if (field === 'speaker') return '発言者';
  if (field === 'relation') return '関係';
  if (field === 'links') return '関連';
  if (kind && KINDS[kind] && KINDS[kind].fields[field]) return KINDS[kind].fields[field].label;
  for (const k of KIND_IDS) if (KINDS[k].fields[field]) return KINDS[k].fields[field].label;
  return field;
}

// ---- core/guide-flow.js ----
// 使い方の流れ図の進み具合。台帳から毎回求める（保存しない）。DOM に触れない。
// 戻り値: { status: { 段の id: 'done' | 'active' | 'todo' | 'loop' | 'optional' }, loopActive } / 台帳が無ければ null


// 直線の段と「済」の条件（状態は問わない。取り下げた項目も数える。手が付いたかを見るため）
const has = (ledger, kinds) => ledger.items.some((it) => kinds.includes(it.kind));
const onlyTemplate = (it) => !!(it.sources && it.sources.length && it.sources.every((s) => s && s.type === 'template'));
const LINEAR = [
  { id: 'setup', done: () => true },
  { id: 'initial', done: (l) => l.items.some((it) => it.kind !== 'memo' && !onlyTemplate(it)) },
  { id: 'baseline', done: (l) => (l.baselines || []).length > 0 },
  { id: 'plan', done: (l) => has(l, ['task']) },
  { id: 'design', done: (l) => has(l, ['entity', 'screen', 'interface', 'batch']) },
  { id: 'test', done: (l) => has(l, ['test']) },
];

function stepStatus(ledger) {
  if (!ledger) return null;
  const status = {};
  for (const s of FLOW_STEPS) {
    if (s.loop) status[s.id] = 'loop';
    else if (s.optional) status[s.id] = 'optional';
  }
  for (const s of LINEAR) status[s.id] = s.done(ledger) ? 'done' : 'todo';
  let loopActive = false;
  const first = LINEAR.find((s) => status[s.id] === 'todo');
  if (first) {
    if (first.id === 'baseline') loopActive = true;
    else status[first.id] = 'active';
  }
  return { status, loopActive };
}

};

const NFR = NFR_CATEGORIES.map((c) => ({ id: c.v, label: c.label, points: NFR_POINTS[c.v] || [] }));

function nfrLabel(id) {
  const c = NFR_CATEGORIES.find((x) => x.v === id);
  return c ? c.label : id;
}

// 大項目ごとの状態。判定は design.md の表のとおり（上から順に当てはめる）
// 戻り値: [{ id, label, points, requirements, openQuestions, answeredQuestions, state }]
const NFR_STATES = [
  { v: 'agreed', label: '合意済み' },
  { v: 'defined', label: '定義あり' },
  { v: 'asking', label: '質問中' },
  { v: 'none', label: '未着手' },
];

function nfrStatus(ledger) {
  return NFR.map((c) => {
    const requirements = ledger.items.filter((it) => it.kind === 'requirement' && it.category === 'nonfunctional' && it.nfrCategory === c.id && it.status !== 'dropped');
    const questions = ledger.items.filter((it) => it.kind === 'question' && it.nfrCategory === c.id);
    const openQuestions = questions.filter((q) => q.status === 'open');
    let state = 'none';
    if (requirements.length && requirements.every((r) => r.status === 'agreed')) state = 'agreed';
    else if (requirements.length) state = 'defined';
    else if (openQuestions.length) state = 'asking';
    return { ...c, requirements, openQuestions, answeredQuestions: questions.filter((q) => q.status !== 'open'), state };
  });
}


// ---- core/extract.js ----
// Gemini の返答から JSON を取り出す寛容なパーサ。

// 囲み記号（```json）・前後の説明文・末尾のカンマ・全角の引用符・配列だけの返答に対応する。

// 文字列リテラルを考慮して、start の括弧に対応する閉じ括弧の位置を返す。無ければ -1
function matchBracket(text, start) {
  const open = text[start];
  const close = open === '{' ? '}' : ']';
  let depth = 0;
  let inStr = false;
  for (let i = start; i < text.length; i++) {
    const c = text[i];
    if (inStr) {
      if (c === '\\') i++;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') inStr = true;
    else if (c === '{' || c === '[') depth++;
    else if (c === '}' || c === ']') {
      depth--;
      if (depth === 0) return c === close ? i : -1;
    }
  }
  return -1;
}

// 文字列の外にある末尾カンマ（, の直後が } か ]）を消す
function stripTrailingCommas(text) {
  let out = '';
  let inStr = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inStr) {
      out += c;
      if (c === '\\') { out += text[i + 1] || ''; i++; } else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') { inStr = true; out += c; continue; }
    if (c === ',') {
      let j = i + 1;
      while (j < text.length && /\s/.test(text[j])) j++;
      if (text[j] === '}' || text[j] === ']') continue;
    }
    out += c;
  }
  return out;
}

function lineOf(text, pos) {
  return text.slice(0, pos).split('\n').length;
}

// JSON.parse のエラーから位置を取り出して「○行目付近」にする
function describeParseError(err, text) {
  const msg = String(err && err.message || err);
  let m = /line (\d+) column (\d+)/.exec(msg);
  if (m) return `${m[1]}行目 ${m[2]}文字目付近`;
  m = /position (\d+)/.exec(msg);
  if (m) return `${lineOf(text, Number(m[1]))}行目付近`;
  return '位置不明';
}

// プロトタイプ汚染に使われるキーを捨てる（外部から来た JSON はすべてこれを通す）
const DANGEROUS_KEYS = new Set(['__proto__', 'constructor', 'prototype']);
function safeReviver(key, value) {
  return DANGEROUS_KEYS.has(key) ? undefined : value;
}

function safeParse(text) {
  return JSON.parse(text, safeReviver);
}

function tryParse(text) {
  try { return { ok: true, value: safeParse(text) }; } catch (e) { return { ok: false, error: e }; }
}

// 候補の文字列を取り出す。囲み記号の中を優先し、無ければ最初の { か [ から対応する括弧まで
function candidates(text) {
  const out = [];
  const fence = /```[ \t]*([A-Za-z0-9_-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  let m;
  while ((m = fence.exec(text))) out.push({ body: m[2].trim(), note: '囲み記号（```' + (m[1] || '') + '）を外しました' });
  // 閉じていない囲み（出力が途中で切れた場合など）
  const open = /```[ \t]*(?:json)?[ \t]*\r?\n([\s\S]*)$/i.exec(text);
  if (!out.length && open) out.push({ body: open[1].trim(), note: '閉じていない囲み記号を外しました' });
  const firstObj = text.search(/[{[]/);
  if (firstObj >= 0) {
    const end = matchBracket(text, firstObj);
    const body = end >= 0 ? text.slice(firstObj, end + 1) : text.slice(firstObj);
    const trimmedOuter = firstObj > 0 || (end >= 0 && end < text.length - 1 && text.slice(end + 1).trim() !== '');
    out.push({ body, note: trimmedOuter ? 'JSON の前後にある説明文を外しました' : null });
  }
  return out;
}

// 戻り値: { ok: true, value, notes: string[] } / { ok: false, error: string }
function extractJson(text) {
  if (typeof text !== 'string' || text.trim() === '') return { ok: false, error: '貼り付けた内容が空です' };
  const src = text.replace(/^﻿/, '');
  const cands = candidates(src);
  if (!cands.length) return { ok: false, error: 'JSON が見つかりません（{ または [ で始まる部分がありません）' };

  let firstError = null;
  for (const c of cands) {
    const notes = c.note ? [c.note] : [];
    let r = tryParse(c.body);
    if (!r.ok) {
      if (!firstError) firstError = { err: r.error, body: c.body };
      // 1回だけ修復して再挑戦: 全角の引用符 → 半角、末尾カンマの除去
      const fixed = stripTrailingCommas(c.body.replace(/[“”„‟″＂]/g, '"'));
      if (fixed !== c.body) {
        r = tryParse(fixed);
        if (r.ok) notes.push('全角の引用符や末尾のカンマを直して読みました');
      }
    }
    if (r.ok) {
      let value = r.value;
      if (Array.isArray(value)) {
        value = { type: 'ledger-patch', schemaVersion: SCHEMA_VERSION, ops: value };
        notes.push('配列だけの返答だったので、差分の ops とみなしました');
      }
      if (!value || typeof value !== 'object') continue;
      return { ok: true, value, notes };
    }
  }
  const where = firstError ? describeParseError(firstError.err, firstError.body) : '位置不明';
  return { ok: false, error: `JSON として読めません（${where}）。返答が途中で切れていないか確かめてください` };
}


// ---- core/patch.js ----
// 差分の検証・計画・適用。適用は新しい台帳を返し、元の台帳は変えない。


const OP_TYPES = ['add', 'update', 'relate', 'project'];
const OP_LABELS = { add: '追加', update: '更新', relate: '関係の追加', project: '案件情報の更新' };
const FORBIDDEN_SET = ['id', 'kind', 'createdAt'];

function opLabel(op) { return OP_LABELS[op] || String(op); }

const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
// 関係の重複判定のキー（ラベルの前後の空白は無視する）
const relKey = (from, to, label) => [from, to, String(label).trim()].join('|');

// 差分を検査する。戻り値:
// { errors: 差分全体の誤り, warnings, ops: ParsedOp[] }
// ParsedOp = { index, op, type, kind, tempId, errors, warnings, unknown }
// opts.local: 画面の操作（applyLocalOps）から呼ぶとき true。Gemini の差分ではメモ（memo）を足したり変えたりできない
function validatePatch(patch, ledger, opts = {}) {
  const errors = [];
  const warnings = [];
  if (!isObj(patch)) return { errors: ['差分がオブジェクトではありません'], warnings, ops: [] };
  if (patch.type !== 'ledger-patch') {
    if (patch.type === 'ledger') return { errors: ['これは差分ではなく台帳全体です。台帳は「設定」画面の「読み込み」から開いてください'], warnings, ops: [] };
    warnings.push('type が "ledger-patch" ではありませんが、差分として読みました');
  }
  if (patch.schemaVersion !== undefined && patch.schemaVersion !== SCHEMA_VERSION) warnings.push(`schemaVersion が ${SCHEMA_VERSION} ではありません（${String(patch.schemaVersion)}）`);
  if (patch.basedOnRevision !== undefined && patch.basedOnRevision !== ledger.revision) {
    warnings.push(`この差分は revision ${String(patch.basedOnRevision)} の台帳をもとに作られています（今は ${ledger.revision}）。指示文を作った後に台帳が変わっています`);
  }
  if (!Array.isArray(patch.ops)) return { errors: [...errors, 'ops（操作の配列）がありません'], warnings, ops: [] };
  if (!patch.ops.length) errors.push('ops が空です。取り込む操作がありません');

  // 1周目: 仮ID を集める
  const temps = new Map();
  const parsed = patch.ops.map((op, index) => ({
    index, op, type: isObj(op) ? op.op : undefined, kind: null, tempId: null, errors: [], warnings: [], unknown: [],
  }));
  for (const p of parsed) {
    if (p.type !== 'add' || !isObj(p.op.item)) continue;
    p.kind = p.op.item.kind;
    if (p.op.tempId === undefined) continue;
    if (typeof p.op.tempId !== 'string' || !TEMP_ID_RE.test(p.op.tempId)) { p.errors.push(`tempId「${String(p.op.tempId)}」は「new:1」の形で指定してください`); continue; }
    if (temps.has(p.op.tempId)) { p.errors.push(`tempId「${p.op.tempId}」が操作${temps.get(p.op.tempId).index + 1}と重複しています`); continue; }
    p.tempId = p.op.tempId;
    temps.set(p.tempId, { index: p.index, kind: KINDS[p.kind] ? p.kind : null });
  }
  const base = makeResolver(ledger);
  const resolve = (id) => base(id) || (temps.has(id) ? temps.get(id).kind : null);

  // 2周目: 各操作を検査する
  const relKeys = new Set(ledger.relations.map((r) => relKey(r.from, r.to, r.label)));
  for (const p of parsed) {
    const op = p.op;
    if (!isObj(op)) { p.errors.push('操作がオブジェクトではありません'); continue; }
    if (!OP_TYPES.includes(op.op)) { p.errors.push(`op「${String(op.op)}」は使えません。使える値: ${OP_TYPES.join(', ')}`); continue; }

    if (op.op === 'add') {
      if (!isObj(op.item)) { p.errors.push('item（追加する項目）がありません'); continue; }
      if (op.item.id !== undefined) p.warnings.push(`item.id「${String(op.item.id)}」は無視します。ID は取り込み時に振ります`);
      if (!KINDS[op.item.kind]) { p.errors.push(`種別（kind）「${String(op.item.kind)}」は使えません。使える値: ${KIND_IDS.join(', ')}`); continue; }
      if (op.item.kind === 'memo' && !opts.local) { p.errors.push(MEMO_PATCH_ERROR); continue; }
      const r = validateFields(op.item.kind, withDefaults(op.item.kind, op.item), { resolve });
      p.errors.push(...r.errors); p.warnings.push(...r.warnings); p.unknown = r.unknown;
      if (op.item.kind === 'decision' && op.item.supersedes && op.item.supersedes === op.tempId) p.errors.push('supersedes に自分自身は指定できません');
    } else if (op.op === 'update') {
      if (typeof op.id !== 'string') { p.errors.push('id（更新する項目の ID）がありません'); continue; }
      if (TEMP_ID_RE.test(op.id)) { p.errors.push(`仮ID「${op.id}」は更新できません。追加の item に含めてください`); continue; }
      const k = base(op.id);
      if (!k) { p.errors.push(kindOfId(op.id) ? `ID「${op.id}」は台帳にありません` : `「${op.id}」は ID の形式ではありません`); continue; }
      p.kind = k;
      if (k === 'memo' && !opts.local) { p.errors.push(MEMO_PATCH_ERROR); continue; }
      const set = op.set === undefined ? {} : op.set;
      if (!isObj(set)) { p.errors.push('set（変更する内容）はオブジェクトで指定してください'); continue; }
      for (const f of FORBIDDEN_SET) if (set[f] !== undefined) p.errors.push(`${f} は変更できません`);
      const rest = { ...set };
      for (const f of [...FORBIDDEN_SET, 'updatedAt']) delete rest[f];
      if (set.updatedAt !== undefined) p.warnings.push('updatedAt は無視します');
      const r = validateFields(k, rest, { resolve, partial: true });
      p.errors.push(...r.errors); p.warnings.push(...r.warnings); p.unknown = r.unknown;
      if (op.addLinks !== undefined) {
        if (!Array.isArray(op.addLinks)) p.errors.push('addLinks は ID の配列で指定してください');
        else p.errors.push(...validateFields(k, { links: op.addLinks }, { resolve, partial: true }).errors.map((e) => e.replace('関連（links）', '追加する関連（addLinks）')));
      }
      if (!Object.keys(rest).length && !op.addLinks) p.errors.push('変更する内容（set か addLinks）がありません');
      if (op.reason !== undefined && typeof op.reason !== 'string') p.warnings.push('reason は文字列で指定してください（無視します）');
      if (k === 'decision' && set.supersedes === op.id) p.errors.push('supersedes に自分自身は指定できません');
      // 配列の項目は丸ごと置き換わるので、消える要素を知らせる（P4 AC-16）
      for (const r of removedElements(ledger, op)) {
        p.warnings.push(`この更新で${refFieldLabel(r.field, k)}から次が消えます: ${r.names.join('、')}（残すときは、変えない要素も含めて全部返させてください）`);
      }
    } else if (op.op === 'relate') {
      for (const end of ['from', 'to']) {
        const id = op[end];
        const k = typeof id === 'string' ? resolve(id) : null;
        if (typeof id !== 'string' || id === '') p.errors.push(`${end}: ID を文字列で指定してください`);
        else if (!k) {
          if (TEMP_ID_RE.test(id)) p.errors.push(`${end}: 仮ID「${id}」はこの差分の中にありません`);
          else if (!kindOfId(id)) p.errors.push(`${end}: 「${id}」は ID の形式ではありません（例: SH-001 / new:1）`);
          else p.errors.push(`${end}: ID「${id}」は台帳にありません`);
        } else if (!RELATION_NODE_KINDS.includes(k)) p.errors.push(`${end}: 「${id}」は${kindLabel(k)}です。関係は関係者とシステムの間にだけ引けます`);
      }
      if (typeof op.label !== 'string' || op.label.trim() === '') p.errors.push('label（関係の名前。例: 発注、利用、連携）がありません');
      else if (relKeys.has(relKey(op.from, op.to, op.label))) p.errors.push('同じ関係がすでにあります（台帳か、この差分の前の操作に）');
      if (!p.errors.length) relKeys.add(relKey(op.from, op.to, op.label));
    } else if (op.op === 'project') {
      if (!isObj(op.set)) { p.errors.push('set（変更する案件情報）がありません'); continue; }
      const r = validateProject(op.set, true);
      p.errors.push(...r.errors); p.warnings.push(...r.warnings);
    }
  }
  return { errors, warnings, ops: parsed };
}

// 採用/却下の状態から、実際に適用される操作と警告を求める。
// accepted: 採用する操作の index の Set（誤りのある操作は含めても無視する）
// 戻り値: { apply: Set<index>, autoRejected: Set<index>, warnings: Map<index, string[]> }
function planPatch(validated, accepted) {
  const ok = (p) => accepted.has(p.index) && !p.errors.length;
  const rejectedTemps = new Set(validated.ops.filter((p) => p.tempId && !ok(p)).map((p) => p.tempId));
  const apply = new Set();
  const autoRejected = new Set();
  const warnings = new Map();
  const warn = (i, m) => { if (!warnings.has(i)) warnings.set(i, []); warnings.get(i).push(m); };
  for (const p of validated.ops) {
    if (!ok(p)) continue;
    const op = p.op;
    if (op.op === 'relate') {
      const bad = ['from', 'to'].filter((e) => rejectedTemps.has(op[e]));
      if (bad.length) {
        autoRejected.add(p.index);
        warn(p.index, `参照先 ${bad.map((e) => op[e]).join('・')} の追加が却下されたため、この関係は取り込みません`);
        continue;
      }
    } else if (op.op === 'add' || op.op === 'update') {
      const obj = op.op === 'add' ? op.item : { ...(op.set || {}), links: [...((op.set && op.set.links) || []), ...(op.addLinks || [])] };
      for (const rf of REF_FIELDS) {
        if (rf.shape === 'source') {
          for (const s of Array.isArray(obj.sources) ? obj.sources : []) {
            if (s && rejectedTemps.has(s.speaker)) warn(p.index, `参照先 ${s.speaker} の追加が却下されたため、出典「${s.ref}」の発言者を外します`);
          }
        } else if (rf.shape === 'nested') {
          for (const el of Array.isArray(obj[rf.field]) ? obj[rf.field] : []) {
            const id = nestedRef(el, rf.path);
            if (rejectedTemps.has(id)) warn(p.index, rf.dropElement
              ? `参照先 ${id} の追加が却下されたため、${refFieldLabel(rf.field, p.kind)}からその行を外します`
              : `参照先 ${id} の追加が却下されたため、「${el.name}」の参照（${rf.path[0]}）を外します`);
          }
        } else if (rf.shape === 'many') {
          for (const id of Array.isArray(obj[rf.field]) ? obj[rf.field] : []) {
            if (rejectedTemps.has(id)) warn(p.index, `参照先 ${id} の追加が却下されたため、${refFieldLabel(rf.field)}から外します`);
          }
        } else if (rejectedTemps.has(obj[rf.field])) {
          warn(p.index, `参照先 ${obj[rf.field]} の追加が却下されたため、${refFieldLabel(rf.field, p.kind)}を外します`);
        }
      }
    }
    apply.add(p.index);
  }
  return { apply, autoRejected, warnings };
}

// 参照フィールドの ID を置き換える。sub(id) が null を返したら外す
function substituteRefs(kind, obj, sub) {
  const out = { ...obj };
  for (const rf of REF_FIELDS) {
    if (!rf.on.includes(kind)) continue;
    if (rf.shape === 'source') {
      if (Array.isArray(out.sources)) {
        out.sources = out.sources.map((s) => {
          if (!s || s.speaker === undefined) return s;
          const v = sub(s.speaker);
          const c = { ...s };
          if (v) c.speaker = v; else delete c.speaker;
          return c;
        });
      }
    } else if (rf.shape === 'nested') {
      if (Array.isArray(out[rf.field])) {
        out[rf.field] = out[rf.field].map((el) => {
          const id = nestedRef(el, rf.path);
          if (!id) return el;
          const v = sub(id);
          if (!v) {
            if (rf.dropElement) return null;
            const c = { ...el };
            delete c[rf.path[0]];   // 参照のオブジェクト（fk / source）ごと外す
            return c;
          }
          // path の先の ID を置き換えた写しを作る
          const c = { ...el };
          if (rf.path.length === 1) c[rf.path[0]] = v;
          else c[rf.path[0]] = { ...el[rf.path[0]], [rf.path[1]]: v };
          return c;
        }).filter((x) => x !== null);
      }
    } else if (rf.shape === 'many') {
      if (Array.isArray(out[rf.field])) out[rf.field] = [...new Set(out[rf.field].map(sub).filter(Boolean))];
    } else if (out[rf.field] !== undefined && out[rf.field] !== null) {
      const v = sub(out[rf.field]);
      if (v) out[rf.field] = v; else delete out[rf.field];
    }
  }
  return out;
}

function stripUnknown(obj, unknown) {
  const out = { ...obj };
  for (const k of unknown) delete out[k];
  return out;
}

// 差分を適用して新しい台帳を返す。
// 戻り値: { ledger, idMap: Map<tempId, id>, applied: number }
// 変更の記録を1件足す（新しい台帳オブジェクトの changelog を直接書き換える。上限を超えたら古いものを捨てる）
// 上限を超えて古い記録を捨てるときは、捨てる記録にあった作業の値（S カーブ用）の最後の値を、起点の記録1件にまとめて先頭に残す
function appendChange(next, entry) {
  if (!Array.isArray(next.changelog)) next.changelog = [];
  next.changelog.push(entry);
  if (next.changelog.length <= CHANGELOG_LIMIT) return;
  // 起点の記録の分も枠に入れるため、1件多く捨てる
  const drop = next.changelog.splice(0, next.changelog.length - CHANGELOG_LIMIT + 1);
  const last = new Map();
  for (const e of drop) {
    for (const c of e.changes || []) {
      if (c.values) last.set(c.id, { ...(last.get(c.id) || {}), ...c.values });
    }
  }
  const at = drop[drop.length - 1].at;
  const rev = drop[drop.length - 1].rev;
  next.changelog.unshift({ rev, at, source: 'snapshot', changes: [...last].map(([id, values]) => ({ id, op: 'update', kind: 'task', values })) });
}

// 作業の値の記録（S カーブの復元用）。この項目が変わったときだけ残す
const TRACKED_VALUES = ['progress', 'actual', 'estimate', 'status'];
function trackedValues(item, keys) {
  if (item.kind !== 'task') return null;
  const v = {};
  for (const k of TRACKED_VALUES) if (keys.includes(k) && item[k] !== undefined) v[k] = item[k];
  return Object.keys(v).length ? v : null;
}

function applyPatch(ledger, validated, accepted, now, source = 'import') {
  const plan = planPatch(validated, accepted);
  const next = structuredClone(ledger);
  const counters = next.counters;
  const idMap = new Map();

  // 先に採番する（後ろの操作が前の仮IDを参照していても、前の操作が後ろの仮IDを参照していても置き換えられるように）
  for (const p of validated.ops) {
    if (!plan.apply.has(p.index) || p.op.op !== 'add') continue;
    const prefix = KINDS[p.op.item.kind].prefix;
    counters[prefix] = (counters[prefix] || 0) + 1;
    const id = formatId(prefix, counters[prefix]);
    p._newId = id;
    if (p.tempId) idMap.set(p.tempId, id);
  }
  const sub = (id) => (TEMP_ID_RE.test(id) ? idMap.get(id) || null : id);
  const byId = new Map(next.items.map((it) => [it.id, it]));
  const superseded = [];
  const changes = [];
  let applied = 0;

  for (const p of validated.ops) {
    if (!plan.apply.has(p.index)) continue;
    const op = p.op;
    if (op.op === 'add') {
      const kind = op.item.kind;
      const clean = stripUnknown(op.item, [...p.unknown, 'id', 'kind', 'createdAt', 'updatedAt']);
      for (const [k, v] of Object.entries(clean)) if (v === null) delete clean[k];
      const item = { id: p._newId, kind, ...substituteRefs(kind, withDefaults(kind, clean), sub), createdAt: now, updatedAt: now };
      item.links = item.links.filter((x) => x !== item.id);
      next.items.push(item);
      byId.set(item.id, item);
      const addValues = trackedValues(item, TRACKED_VALUES);
      changes.push(addValues ? { id: item.id, op: 'add', kind, values: addValues } : { id: item.id, op: 'add', kind });
      if (kind === 'decision' && item.supersedes) superseded.push(item.supersedes);
    } else if (op.op === 'update') {
      const target = byId.get(op.id);
      // 検証した後に台帳が変わって対象が無くなっていたら、この操作は飛ばす（壊さない）
      if (!target) continue;
      const set = stripUnknown(op.set || {}, [...p.unknown, ...FORBIDDEN_SET, 'updatedAt']);
      const s = substituteRefs(target.kind, set, sub);
      const change = { id: target.id, op: 'update', kind: target.kind, fields: Object.keys(s) };
      if (s.status !== undefined && s.status !== target.status) { change.statusFrom = target.status; change.statusTo = s.status; }
      if (Array.isArray(op.addLinks) && !change.fields.includes('links')) change.fields.push('links');
      changes.push(change);
      for (const [k, v] of Object.entries(s)) {
        if (v === null) delete target[k];
        else target[k] = v;
      }
      if (Array.isArray(op.addLinks)) {
        const add = op.addLinks.map(sub).filter(Boolean);
        target.links = [...new Set([...(target.links || []), ...add])];
      }
      target.links = (target.links || []).filter((x) => x !== target.id);
      target.updatedAt = now;
      const upd = trackedValues(target, Object.keys(s));
      if (upd) change.values = upd;
      if (target.kind === 'decision' && s.supersedes) superseded.push(s.supersedes);
    } else if (op.op === 'relate') {
      const from = sub(op.from);
      const to = sub(op.to);
      // 仮IDを解決した結果、既存の関係と同じになったものは足さない
      if (next.relations.some((r) => relKey(r.from, r.to, r.label) === relKey(from, to, op.label))) continue;
      counters[RELATION_PREFIX] = (counters[RELATION_PREFIX] || 0) + 1;
      next.relations.push({ id: formatId(RELATION_PREFIX, counters[RELATION_PREFIX]), from, to, label: op.label.trim() });
      changes.push({ id: formatId(RELATION_PREFIX, counters[RELATION_PREFIX]), op: 'relate' });
    } else if (op.op === 'project') {
      changes.push({ id: 'project', op: 'project', fields: Object.keys(op.set) });
      for (const [k, v] of Object.entries(op.set)) {
        if (!['name', 'customer', 'purpose', 'periodStart', 'periodEnd', 'goals', 'summary', 'starter'].includes(k)) continue;
        if (v === null) delete next.project[k];
        else next.project[k] = v;
      }
    }
    applied++;
  }
  // 置き換えられた決定を superseded にする（AC-13b）
  for (const id of superseded) {
    const d = byId.get(id);
    if (d && d.kind === 'decision' && d.status !== 'superseded') {
      changes.push({ id: d.id, op: 'update', kind: 'decision', fields: ['status'], statusFrom: d.status, statusTo: 'superseded' });
      d.status = 'superseded'; d.updatedAt = now;
    }
  }
  for (const p of validated.ops) delete p._newId;
  next.revision = ledger.revision + 1;
  next.updatedAt = now;
  if (changes.length) appendChange(next, { rev: next.revision, at: now, source, changes });
  return { ledger: next, idMap, applied };
}

// 仮に適用して、項目をまたぐ検査で新しく出る誤りを調べる（取込の「適用」を押せるかの判定）
function previewPatch(ledger, validated, accepted, now) {
  const r = applyPatch(ledger, validated, accepted, now);
  return { ...r, integrityErrors: newIntegrityErrors(ledger, r.ledger) };
}

// 画面の内部から作る差分（詳細パネルでの変更など）を検証して適用する
const MEMO_PATCH_ERROR = 'メモは差分で足したり変えたりできません（メモの画面で扱います）';

// メモを消す（画面の操作だけ。取り消し・変更の記録・revision の対象）。メモを指す関連（links）も外す
function removeMemos(ledger, ids, now, source) {
  const errors = [];
  for (const id of ids) {
    const it = ledger.items.find((x) => x.id === id);
    if (!it) errors.push(`ID「${id}」は台帳にありません`);
    else if (it.kind !== 'memo') errors.push(`${id} はメモではありません。消せるのはメモだけです`);
  }
  if (errors.length) return { ok: false, errors };
  const gone = new Set(ids);
  const next = structuredClone(ledger);
  next.items = next.items.filter((x) => !gone.has(x.id)).map((x) => (Array.isArray(x.links) && x.links.some((l) => gone.has(l)) ? { ...x, links: x.links.filter((l) => !gone.has(l)), updatedAt: now } : x));
  next.revision = ledger.revision + 1;
  next.updatedAt = now;
  appendChange(next, { rev: next.revision, at: now, source, changes: ids.map((id) => ({ id, op: 'remove', kind: 'memo' })) });
  return { ok: true, ledger: next, idMap: {}, applied: ids.length };
}

function applyLocalOps(ledger, ops, now, source = 'local') {
  const removes = ops.filter((o) => o && o.op === 'remove');
  if (removes.length) {
    if (removes.length !== ops.length) return { ok: false, errors: ['remove は他の操作と混ぜられません'] };
    return removeMemos(ledger, removes.map((o) => o.id), now, source);
  }
  const v = validatePatch({ type: 'ledger-patch', schemaVersion: SCHEMA_VERSION, ops }, ledger, { local: true });
  const errs = [...v.errors, ...v.ops.flatMap((p) => p.errors)];
  if (errs.length) return { ok: false, errors: errs };
  const r = applyPatch(ledger, v, new Set(v.ops.map((p) => p.index)), now, source);
  const integ = newIntegrityErrors(ledger, r.ledger);
  if (integ.length) return { ok: false, errors: integ.map((e) => `${e.itemId}: ${e.message}`) };
  return { ok: true, ...r };
}

// update の「変更前 → 変更後」の行を作る（表示用）
function updateRows(ledger, op) {
  const target = ledger.items.find((it) => it.id === op.id);
  if (!target) return [];
  const rows = [];
  for (const [k, after] of Object.entries(op.set || {})) {
    if (['id', 'kind', 'createdAt', 'updatedAt'].includes(k)) continue;
    const spec = fieldSpec(target.kind, k);
    rows.push({ field: k, label: spec ? spec.label : k, before: target[k], after });
  }
  if (Array.isArray(op.addLinks)) rows.push({ field: 'links', label: '関連（追記）', before: target.links, after: [...(target.links || []), ...op.addLinks] });
  return rows;
}

// 配列の項目（列・項目・CRUD）の update で消える要素の名前（取込の警告用。配列は丸ごと置き換わるため）
function removedElements(ledger, op) {
  const target = ledger.items.find((it) => it.id === op.id);
  if (!target || !op.set) return [];
  const out = [];
  const keyOf = { columns: (e) => e && e.name, fields: (e) => e && e.name, crud: (e) => e && e.entity, raci: (e) => e && e.who };
  for (const f of Object.keys(keyOf)) {
    if (!Array.isArray(op.set[f]) || !Array.isArray(target[f])) continue;
    const after = new Set(op.set[f].map(keyOf[f]));
    const gone = target[f].map(keyOf[f]).filter((k) => k && !after.has(k));
    if (gone.length) out.push({ field: f, names: gone });
  }
  return out;
}


// ---- core/ball.js ----
// ボール（誰の対応待ちか）と待ち日数。未完了の課題・質問だけが対象。


const BALL = [
  { v: 'customer', label: '顧客待ち' },
  { v: 'own', label: '自社待ち' },
  { v: 'vendor', label: '協力会社待ち' },
  { v: 'unknown', label: '未定' },
];

const ownerField = (it) => OWNER_FIELD[it.kind];

// まだ聞いていない質問: 予定の会議に割り当て済みで、聞いた日が無い
function notAskedYet(it, ledger) {
  if (it.kind !== 'question' || it.askedAt || !it.meeting) return false;
  const m = ledger.items.find((x) => x.id === it.meeting);
  return !!m && m.status === 'planned';
}

// 戻り値: 'customer' | 'own' | 'vendor' | 'unknown'。未完了でなければ null
function ballOf(it, ledger) {
  if ((it.kind !== 'issue' && it.kind !== 'question') || !isOpen(it)) return null;
  if (notAskedYet(it, ledger)) return 'own';
  const who = it[ownerField(it)];
  if (!who) return 'unknown';
  const sh = ledger.items.find((x) => x.id === who);
  return sh && sh.kind === 'stakeholder' && ['customer', 'own', 'vendor'].includes(sh.side) ? sh.side : 'unknown';
}

// 待ち日数。質問は聞いた日（無ければ作成日）から、課題は作成日から。まだ聞いていない質問は null
function waitDays(it, ledger, today) {
  if (notAskedYet(it, ledger)) return null;
  const start = it.kind === 'question' && it.askedAt ? dayNumber(it.askedAt) : localDayNumber(it.createdAt);
  if (Number.isNaN(start)) return null;
  return Math.max(0, dayNumber(today) - start);
}


// ---- core/raci.js ----
// RACI: 明示（台帳の raci）と、表示のときだけの補い。DOM に触れない。
// 補いは役ごと: 明示に R が無ければ担当（task.assignee・issue.owner）を R、明示に A が無く決めた人（decision.decidedBy）が 1 人ならその人を A。
// 明示で別の役を持つ人には補わない。補いは保存しない（表で押したときに、明示の役だけを書き直す）


const RACI_KINDS = ['task', 'decision', 'issue'];
const ORDER = ['', ...RACI_ROLES.map((r) => r.v)];   // '' → R → A → C → I → ''

// 戻り値 [{ who, role, derived }]
function effectiveRaci(item) {
  const explicit = Array.isArray(item.raci) ? item.raci.filter((e) => e && e.who && e.role) : [];
  const out = explicit.map((e) => ({ who: e.who, role: e.role, derived: false }));
  const has = (role) => out.some((e) => e.role === role);
  const taken = (who) => out.some((e) => e.who === who);
  const resp = item.kind === 'task' ? item.assignee : item.kind === 'issue' ? item.owner : null;
  if (!has('R') && resp && !taken(resp)) out.push({ who: resp, role: 'R', derived: true });
  if (item.kind === 'decision' && !has('A') && Array.isArray(item.decidedBy) && item.decidedBy.length === 1 && !taken(item.decidedBy[0])) {
    out.push({ who: item.decidedBy[0], role: 'A', derived: true });
  }
  return out;
}

const cycleRole = (role) => ORDER[(ORDER.indexOf(role || '') + 1) % ORDER.length];

// 表で押したとき: その人の今の役（明示か補い）の次の役を、明示の要素として書き直す。補いは書き写さない
function setRaciOp(item, who) {
  const cur = effectiveRaci(item).find((e) => e.who === who);
  const next = cycleRole(cur ? cur.role : '');
  const explicit = (Array.isArray(item.raci) ? item.raci : []).filter((e) => e && e.who !== who);
  if (next) explicit.push({ who, role: next });
  return { op: 'update', id: item.id, set: { raci: explicit } };
}

// RACI 表の行。tasks: 'top'（親を持たない作業。中止を除く）か 'all'。issues: 'open' か 'all'。決定は置き換え済みを除く（all のときは含める）
function raciRows(ledger, { tasks = 'top', issues = 'open', all = false } = {}) {
  const rows = [];
  const push = (item) => {
    const cells = new Map();
    for (const e of effectiveRaci(item)) cells.set(e.who, { role: e.role, derived: e.derived });
    rows.push({ item, cells });
  };
  for (const t of ledger.items.filter((it) => it.kind === 'task')) {
    if (tasks === 'top' && (t.parent || t.status === 'cancelled')) continue;
    push(t);
  }
  for (const d of ledger.items.filter((it) => it.kind === 'decision')) if (all || d.status !== 'superseded') push(d);
  for (const i of ledger.items.filter((it) => it.kind === 'issue')) if (issues === 'all' || isOpen(i)) push(i);
  return rows;
}

// 表の列: 関与中の関係者と、関与なしでも明示の役を持つ人
function raciColumns(ledger) {
  const used = new Set(ledger.items.flatMap((it) => (Array.isArray(it.raci) ? it.raci.map((e) => e && e.who) : [])));
  return ledger.items.filter((it) => it.kind === 'stakeholder' && (it.status !== 'inactive' || used.has(it.id)));
}


// ---- core/wbs.js ----
// WBS: 作業の階層と、子からの集計（見積・実績・進捗）、遅れの判定


const DELAY_POINTS = 20;

function dayToYmd(d) {
  return new Date(d * 86400000).toISOString().slice(0, 10);
}

// 期間の経過割合（0〜1）。today の日の終わり時点。日付がそろわなければ null
function elapsedRatio(task, todayNum) {
  if (!task.start || !task.end) return null;
  const s = dayNumber(task.start);
  const e = dayNumber(task.end);
  if (todayNum < s) return 0;
  return Math.min(1, (todayNum - s + 1) / (e - s + 1));
}

const byStart = (a, b) => (a.start || '9999').localeCompare(b.start || '9999') || a.id.localeCompare(b.id);

// 戻り値: { roots: Node[], byId: Map<id, Node>, flat: Node[] }
// Node = { item, children, depth, leaf, rollup: { estimate, actual, progress }, ratio, delayed }
function buildTree(ledger, today) {
  const todayNum = dayNumber(today);
  const tasks = ledger.items.filter((it) => it.kind === 'task');
  const byId = new Map(tasks.map((t) => [t.id, { item: t, children: [], depth: 0 }]));
  const roots = [];
  for (const n of byId.values()) {
    const p = n.item.parent && byId.get(n.item.parent);
    if (p && p !== n) p.children.push(n); else roots.push(n);
  }
  const flat = [];
  const seen = new Set();
  const walk = (n, depth) => {
    if (seen.has(n.item.id)) return; // 循環していても止まる（循環は健康診断が出す）
    seen.add(n.item.id);
    n.depth = depth;
    n.children.sort((a, b) => byStart(a.item, b.item));
    flat.push(n);
    for (const c of n.children) walk(c, depth + 1);
    n.leaf = n.children.length === 0;
    if (n.leaf) {
      n.rollup = { estimate: n.item.estimate || 0, actual: n.item.actual || 0, progress: n.item.progress || 0 };
    } else {
      const live = n.children.filter((c) => c.item.status !== 'cancelled' && c.rollup);
      const est = live.reduce((a, c) => a + c.rollup.estimate, 0);
      const act = live.reduce((a, c) => a + c.rollup.actual, 0);
      const prog = est > 0
        ? live.reduce((a, c) => a + c.rollup.estimate * c.rollup.progress, 0) / est
        : (live.length ? live.reduce((a, c) => a + c.rollup.progress, 0) / live.length : 0);
      n.rollup = { estimate: est, actual: act, progress: Math.round(prog * 10) / 10 };
    }
    n.ratio = elapsedRatio(n.item, todayNum);
    n.delayed = n.leaf && !n.item.milestone && n.ratio !== null && !['done', 'cancelled'].includes(n.item.status) && n.ratio * 100 - n.rollup.progress >= DELAY_POINTS;
  };
  roots.sort((a, b) => byStart(a.item, b.item));
  for (const r of roots) walk(r, 0);
  return { roots, byId, flat };
}


// ---- core/evm.js ----
// EVM（工数・人日）: BAC / PV / EV / AC / SPI / CPI / EAC と S カーブの点
// EV と AC の推移は、変更の記録（changelog の values）から日ごとの値を復元する


const EVM_ALERT = 0.9;

// 対象の作業: 末端・中止以外・見積と開始と終了がそろったもの
function evmTargets(ledger) {
  const parents = new Set(ledger.items.filter((it) => it.kind === 'task' && it.parent).map((it) => it.parent));
  const leaves = ledger.items.filter((it) => it.kind === 'task' && !parents.has(it.id) && it.status !== 'cancelled' && !it.milestone);
  const ok = leaves.filter((t) => typeof t.estimate === 'number' && t.estimate > 0 && t.start && t.end);
  return { targets: ok, missing: leaves.length - ok.length };
}

// 作業ごとの値の時系列: id → [{ day, values }]（古い順）。起点の記録の日（S カーブを描き始める日）も返す
function timelines(ledger) {
  const map = new Map();
  let snapshotDay = null;
  for (const e of ledger.changelog || []) {
    const day = localDayNumber(e.at);
    if (e.source === 'snapshot') snapshotDay = snapshotDay === null ? day : Math.max(snapshotDay, day);
    for (const c of e.changes || []) {
      if (!c.values) continue;
      if (!map.has(c.id)) map.set(c.id, []);
      map.get(c.id).push({ day, values: c.values });
    }
  }
  return { map, snapshotDay };
}

// day の日の終わり時点の進捗と実績
function valueAt(task, tl, day) {
  const list = tl.get(task.id);
  if (!list) {
    // 記録が無い作業（記録の仕組みより前に作られた等）は、作成日以降は今の値とみなす
    return localDayNumber(task.createdAt) <= day ? { progress: task.progress || 0, actual: task.actual || 0 } : { progress: 0, actual: 0 };
  }
  let progress = 0;
  let actual = 0;
  for (const r of list) {
    if (r.day > day) break;
    if (r.values.progress !== undefined) progress = r.values.progress;
    if (r.values.actual !== undefined) actual = r.values.actual;
  }
  return { progress, actual };
}

const ratioOrNull = (a, b) => (b > 0 ? a / b : null);

// 戻り値: { bac, pv, ev, ac, spi, cpi, eac, missing, curve: [{ date, pv, ev, ac }], curveStart }
function computeEvm(ledger, today) {
  const todayNum = dayNumber(today);
  const { targets, missing } = evmTargets(ledger);
  const bac = targets.reduce((a, t) => a + t.estimate, 0);
  const pvAt = (d) => targets.reduce((a, t) => a + t.estimate * elapsedRatio(t, d), 0);
  const pv = pvAt(todayNum);
  const ev = targets.reduce((a, t) => a + t.estimate * (t.progress || 0) / 100, 0);
  const ac = targets.reduce((a, t) => a + (t.actual || 0), 0);
  const spi = ratioOrNull(ev, pv);
  const cpi = ratioOrNull(ev, ac);
  const eac = cpi ? bac / cpi : null;

  const curve = [];
  const { map, snapshotDay } = timelines(ledger);
  if (targets.length) {
    const first = Math.min(...targets.map((t) => dayNumber(t.start)));
    const last = Math.max(...targets.map((t) => dayNumber(t.end)), todayNum);
    // 週の初め（月曜）に合わせる。1970-01-01 は木曜なので (d + 3) % 7 === 0 が月曜
    let d = first - ((first + 3) % 7 + 7) % 7;
    const days = [];
    for (; d <= last; d += 7) days.push(d);
    if (!days.includes(todayNum)) days.push(todayNum);
    days.sort((a, b) => a - b);
    for (const day of days) {
      const recorded = day <= todayNum && (snapshotDay === null || day >= snapshotDay);
      let evD = null;
      let acD = null;
      if (recorded) {
        evD = 0; acD = 0;
        for (const t of targets) {
          const v = valueAt(t, map, day);
          evD += t.estimate * v.progress / 100;
          acD += v.actual;
        }
      }
      curve.push({ date: dayToYmd(day), pv: round(pvAt(day)), ev: evD === null ? null : round(evD), ac: acD === null ? null : round(acD), today: day === todayNum });
    }
  }
  return {
    bac: round(bac), pv: round(pv), ev: round(ev), ac: round(ac),
    spi: spi === null ? null : round2(spi), cpi: cpi === null ? null : round2(cpi), eac: eac === null ? null : round(eac),
    missing, targets: targets.length, curve, curveStart: snapshotDay === null ? null : dayToYmd(snapshotDay),
  };
}

function round(x) { return Math.round(x * 10) / 10; }
function round2(x) { return Math.round(x * 100) / 100; }


// ---- core/health.js ----
// 健康診断。AIを使わない機械的な点検で、抜け漏れを重要度つきで返す。


const SEVERITY = [
  { v: 'high', label: '高' },
  { v: 'mid', label: '中' },
  { v: 'low', label: '低' },
];
const RANK = { high: 0, mid: 1, low: 2 };
const STALE_GUESS_DAYS = 7;
// 出典なし・推測のままの点検をしない種別（PM が自分で起こすもの）
const SELF_MADE = new Set(['risk', 'kpi']);
const RISK_HIGH = 15;

const fieldLabelOf = (kind, f) => { const sp = fieldSpec(kind, f); return sp ? sp.label : f; };

// 期限を点検する対象: 未完了・担当と期限を持つ種別・子を持つ作業（親）を除く・期限がある。
// 健康診断の「期限切れ」と、概要の期限の分布の両方がこれを使う（件数をそろえるため）
function dueTargets(ledger) {
  const parents = new Set(ledger.items.filter((it) => it.kind === 'task' && it.parent).map((it) => it.parent));
  return ledger.items
    .filter((it) => isOpen(it) && OWNER_FIELD[it.kind] && DUE_FIELD[it.kind] && it[DUE_FIELD[it.kind]] && !(it.kind === 'task' && parents.has(it.id)))
    .map((it) => ({ item: it, due: it[DUE_FIELD[it.kind]] }));
}

// today: YYYY-MM-DD
function runHealth(fullLedger, today) {
  const out = [];
  // 存在しない ID への参照はメモも含めて見る。それ以外の項目ごとの点検は、メモを除いた台帳で行う
  const ids = new Set(fullLedger.items.map((it) => it.id));
  const ledger = fullLedger.items.some((it) => it.kind === 'memo') ? { ...fullLedger, items: fullLedger.items.filter((it) => it.kind !== 'memo') } : fullLedger;
  const t = dayNumber(today);
  const push = (severity, code, item, message) => {
    const due = item && DUE_FIELD[item.kind] ? item[DUE_FIELD[item.kind]] || null : null;
    out.push({ severity, code, itemId: item ? item.id : null, due, message });
  };

  // 存在しない ID への参照（高）
  for (const it of fullLedger.items) {
    for (const r of refsOf(it)) {
      if (!ids.has(r.id)) push('high', 'dangling', it, `${it.id} の${refFieldLabel(r.field, it.kind)}が、台帳にない ${r.id} を指しています`);
    }
  }
  for (const rel of ledger.relations) {
    for (const end of ['from', 'to']) {
      if (!ids.has(rel[end])) {
        const other = ledger.items.find((it) => it.id === rel[end === 'from' ? 'to' : 'from']);
        push('high', 'dangling', other || null, `関係 ${rel.id}（${rel.label}）の${end === 'from' ? '始点' : '終点'}が、台帳にない ${rel[end]} を指しています`);
      }
    }
  }

  // 子を持つ作業（親）は担当・期限の点検の対象外（子で管理する）
  const parents = new Set(ledger.items.filter((it) => it.kind === 'task' && it.parent).map((it) => it.parent));
  for (const it of ledger.items) {
    const open = isOpen(it);
    const dueField = DUE_FIELD[it.kind];
    const ownerField = OWNER_FIELD[it.kind];
    const due = dueField ? it[dueField] : null;
    const tracked = !!ownerField && !(it.kind === 'task' && parents.has(it.id));
    // 期限切れ（高）
    if (open && tracked && due && dayNumber(due) < t) {
      push('high', 'overdue', it, `${kindLabel(it.kind)}「${it.title}」の${it.kind === 'task' ? '終了日' : '期限'}（${due}）を${t - dayNumber(due)}日過ぎています`);
    }
    // 担当・期限なし（中）
    if (open && tracked) {
      const missing = [];
      if (!it[ownerField]) missing.push(fieldLabelOf(it.kind, ownerField));
      if (!due) missing.push(fieldLabelOf(it.kind, dueField));
      if (missing.length) push('mid', 'no-owner', it, `${kindLabel(it.kind)}「${it.title}」に${missing.join('と')}がありません`);
    }
    // 出典なし（中）。PM が自分で起こすリスク・KPI は対象外
    if (!SELF_MADE.has(it.kind) && (!it.sources || !it.sources.length)) push('mid', 'no-source', it, `${kindLabel(it.kind)}「${it.title}」に出典がありません`);
    // Must で推測（中）
    if ((it.kind === 'request' || it.kind === 'requirement') && it.priority === 'Must' && it.confidence === 'guess') {
      push('mid', 'must-guess', it, `優先度 Must の${kindLabel(it.kind)}「${it.title}」が推測のままです`);
    }
    // 顧客待ちが設定日数以上（中）
    if (ballOf(it, ledger) === 'customer') {
      const w = waitDays(it, ledger, today);
      if (w !== null && w >= settingOf(ledger, 'ballWaitDays')) push('mid', 'ball-wait', it, `${kindLabel(it.kind)}「${it.title}」が顧客の返事を${w}日待っています`);
    }
    // 推測のまま7日以上（低）。質問は対象外
    if (it.kind !== 'question' && !SELF_MADE.has(it.kind) && it.confidence === 'guess' && it.updatedAt && t - localDayNumber(it.updatedAt) >= STALE_GUESS_DAYS) {
      push('low', 'stale-guess', it, `${kindLabel(it.kind)}「${it.title}」が推測のまま${t - localDayNumber(it.updatedAt)}日たっています`);
    }
  }

  // KPI（P7a）
  const links = linkIndex(ledger);
  const byIdK = new Map(ledger.items.map((it) => [it.id, it]));
  const linked = (id, pred) => [...(links.get(id) || [])].map((x) => byIdK.get(x)).filter((x) => x && pred(x));
  const liveKpi = (x) => x.kind === 'kpi' && x.status !== 'dropped';
  const goals = new Set((ledger.project.goals || []).map((g) => String(g).trim()));
  for (const k of ledger.items.filter((it) => it.kind === 'kpi' && it.status === 'active')) {
    if (!String(k.measure || '').trim() || !String(k.target || '').trim()) push('mid', 'kpi-no-measure', k, `KPI「${k.title}」に${!String(k.measure || '').trim() ? '測り方' : '目標値'}がありません`);
    if (!k.parent && !goals.has(String(k.goal || '').trim())) push('low', 'kpi-goal-unknown', k, `KPI「${k.title}」の対応するゴールが${k.goal ? `案件情報のゴールにありません（「${k.goal}」）` : '決まっていません'}`);
  }
  if (ledger.items.some(liveKpi)) {
    for (const r of ledger.items.filter((it) => it.kind === 'requirement' && it.status !== 'dropped')) {
      const reqs = linked(r.id, (x) => x.kind === 'request' && x.status !== 'rejected');
      if (!reqs.length) continue;   // 要望とつながっていない要件は別の点検の範囲
      const ok = linked(r.id, liveKpi).length || reqs.some((q) => linked(q.id, liveKpi).length);
      if (!ok) push('low', 'req-no-kpi', r, `要件「${r.title}」が、どの KPI にもつながっていません（要望を通しても）`);
    }
  }
  // リスク（P7a）: 点数が高いのに対策が無い
  for (const r of ledger.items.filter((it) => it.kind === 'risk' && isOpen(it))) {
    if (riskScore(r) >= RISK_HIGH && !String(r.response || '').trim()) push('mid', 'risk-high-no-response', r, `リスク「${r.title}」は点数 ${riskScore(r)}（見込み ${r.prob} × 影響 ${r.impact}）で、対策がありません`);
  }

  // 業務フロー（P7c）: 記法に誤りがある（誤りの行を外して描いているので、図が欠けている）
  for (const f of ledger.items.filter((it) => it.kind === 'bizflow')) {
    const errs = FLOWCHART.parse(String(f.notation || '')).errors;
    if (errs.length) push('mid', 'flow-error', f, `業務フロー「${f.title}」の記法に誤りが ${errs.length} 件あります（${errs[0].line} 行目: ${errs[0].message}${errs.length > 1 ? ' ほか' : ''}）。誤りの行は図に出ていません`);
  }

  // 体制・RACI（P7b）
  for (const p of ledger.items.filter((it) => it.kind === 'stakeholder' && it.status !== 'inactive' && it.reportsTo)) {
    const boss = byIdK.get(p.reportsTo);
    if (boss && boss.status === 'inactive') push('low', 'reports-to-inactive', p, `関係者「${p.title}」の上長「${boss.title}」が関与なしです`);
  }
  const hasChild = new Set(ledger.items.filter((it) => it.kind === 'task' && it.parent).map((it) => it.parent));
  const hasA = (it) => effectiveRaci(it).some((e) => e.role === 'A');
  for (const t of ledger.items.filter((it) => it.kind === 'task' && !it.parent && hasChild.has(it.id) && it.status !== 'done' && it.status !== 'cancelled')) {
    if (!hasA(t)) push('low', 'task-no-a', t, `工程「${t.title}」に A（承認者）がいません`);
  }
  for (const i of ledger.items.filter((it) => it.kind === 'issue' && isOpen(it) && it.severity === 'high')) {
    if (!hasA(i)) push('low', 'issue-no-a', i, `重要度が高の課題「${i.title}」に、決める人（A）がいません`);
  }
  for (const it of ledger.items.filter((x) => ['task', 'decision', 'issue'].includes(x.kind) && Array.isArray(x.raci))) {
    const a = it.raci.filter((e) => e && e.role === 'A').length;
    if (a >= 2) push('mid', 'multiple-a', it, `${kindLabel(it.kind)}「${it.title}」に A（承認者）が ${a} 人います（1 人にしてください）`);
  }

  // 範囲（中）: 範囲外なのに理由が無い / ベースライン後に追加されて範囲が未判断
  const after = afterBaselineIds(ledger);
  for (const it of ledger.items) {
    if (it.kind !== 'request' && it.kind !== 'requirement') continue;
    if (it.scope === 'out' && !(it.scopeReason && it.scopeReason.trim())) push('mid', 'scope-no-reason', it, `${kindLabel(it.kind)}「${it.title}」は範囲外ですが、判断の理由がありません`);
    const closed = it.status === 'rejected' || it.status === 'dropped';
    if (after.has(it.id) && !closed && (!it.scope || it.scope === 'tbd')) push('mid', 'scope-undecided', it, `${kindLabel(it.kind)}「${it.title}」はベースラインの後に追加されましたが、範囲内か範囲外かが決まっていません`);
  }

  // 非機能の大項目で、要件も未回答の質問も無いもの（中）
  for (const c of nfrStatus(ledger)) {
    if (c.state === 'none') push('mid', 'nfr-missing', null, `非機能「${c.label}」について、要件も確認中の質問もありません`);
  }

  // EVM（高）: SPI か CPI が基準未満
  if (ledger.items.some((it) => it.kind === 'task')) {
    const e = computeEvm(ledger, today);
    if (e.pv > 0 && e.spi !== null && e.spi < EVM_ALERT) push('high', 'evm-low', null, `スケジュール効率 SPI が ${e.spi} です（${EVM_ALERT} 未満。予定より遅れています）`);
    if (e.cpi !== null && e.cpi < EVM_ALERT) push('high', 'evm-low', null, `コスト効率 CPI が ${e.cpi} です（${EVM_ALERT} 未満。見積より工数がかかっています）`);
  }

  const idx = linkIndex(ledger);

  // 設計（P4）: 要件とつながらない設計の項目（低）・作業の無い合意済みの要件（低）・作成されないテーブル（中）・見積の差（中）
  const DESIGN = ['entity', 'screen', 'interface', 'batch'];
  const kindOf = new Map(ledger.items.map((it) => [it.id, it.kind]));
  const linkedKind = (id, k) => [...(idx.get(id) || [])].some((x) => kindOf.get(x) === k);
  for (const it of ledger.items) {
    if (DESIGN.includes(it.kind) && it.status !== 'dropped' && !linkedKind(it.id, 'requirement')) {
      push('low', 'unlinked-design', it, `${kindLabel(it.kind)}「${it.title}」に対応する要件がありません`);
    }
  }
  if (ledger.items.some((it) => it.kind === 'task')) {
    for (const it of ledger.items) {
      if (it.kind === 'requirement' && it.status === 'agreed' && !linkedKind(it.id, 'task')) push('low', 'req-no-task', it, `合意済みの要件「${it.title}」を実現する作業がありません`);
    }
  }
  const funcs = ledger.items.filter((it) => ['screen', 'interface', 'batch'].includes(it.kind) && it.status !== 'dropped');
  if (funcs.length) {
    const created = new Set(funcs.flatMap((f) => (f.crud || []).filter((c) => c && /C/.test(c.ops || '')).map((c) => c.entity)));
    for (const it of ledger.items) {
      if (it.kind === 'entity' && it.status !== 'dropped' && it.fileType !== 'external' && !created.has(it.id)) push('mid', 'entity-no-create', it, `テーブル「${it.title}」を作成（C）する機能がありません`);
    }
  }
  const fe = fpEstimate(ledger, today);
  if (fe.gap !== null && Math.abs(fe.gap) > FP_GAP_ALERT) {
    push('mid', 'fp-gap', null, `FP からの見積 ${fe.effort} 人日と WBS の見積 ${fe.bac} 人日の差が ${Math.round(fe.gap * 100)}% あります（±${FP_GAP_ALERT * 100}% を超えています）`);
  }

  // テスト（P5）: 不合格のテスト（高）・テストの無い合意済みの要件（中。テストを書き始めてから点検する）
  for (const it of ledger.items) {
    if (it.kind === 'test' && it.status === 'failed') push('high', 'test-failed', it, `テスト「${it.title}」が不合格です`);
  }
  if (ledger.items.some((it) => it.kind === 'test')) {
    for (const r of traceRows(ledger)) {
      if (r.req.status === 'agreed' && r.verdict === 'none') push('mid', 'req-no-test', r.req, `合意済みの要件「${r.req.title}」を確かめるテストがありません`);
    }
  }

  // 項目をまたぐ誤り（高）。取込では止めるので、主に読み込んだ台帳で起こる
  for (const e of checkIntegrity(ledger).errors) {
    push('high', 'integrity', ledger.items.find((it) => it.id === e.itemId) || null, `${e.itemId}: ${e.message}`);
  }

  // どの要件ともつながっていない要望（低）。不採用の要望は除く。links は向きを持たない
  const kindById = new Map(ledger.items.map((it) => [it.id, it.kind]));
  const hasReq = (id) => [...(idx.get(id) || [])].some((x) => kindById.get(x) === 'requirement');
  for (const it of ledger.items) {
    if (it.kind === 'request' && it.status !== 'rejected' && !hasReq(it.id)) {
      push('low', 'unlinked-request', it, `要望「${it.title}」に対応する要件がありません`);
    }
  }

  out.sort((a, b) => RANK[a.severity] - RANK[b.severity]
    || (a.due ? 0 : 1) - (b.due ? 0 : 1)
    || (a.due && b.due ? a.due.localeCompare(b.due) : 0)
    || String(a.itemId).localeCompare(String(b.itemId)));
  return out;
}
