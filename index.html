      const c = close.exec(html);
      re.lastIndex = c ? close.lastIndex : html.length;
      continue;
    }
    if (tag === 'pre') {
      const close = /<\/\s*pre\s*>/ig;
      close.lastIndex = re.lastIndex;
      const c = close.exec(html);
      const raw = html.slice(re.lastIndex, c ? c.index : html.length).replace(/<[^>]*>/g, '');
      re.lastIndex = c ? close.lastIndex : html.length;
      if (inCell()) curTable().cell.text += htmlUnescape(raw).replace(/\r?\n/g, '<br>');
      else { closeP(); flush(); out.push('```', htmlUnescape(raw).replace(/^\n/, '').replace(/\s+$/, ''), '```', ''); }
      continue;
    }
    if (tag === 'br') { brk(); continue; }
    if (tag === 'img') { text(a.alt ? `[図: ${a.alt}]` : '[図]'); continue; }
    if (tag === 'hr') { closeP(); flush(); out.push('---', ''); continue; }
    if (tag === 'a') { const t = inCell() ? curTable().cell.text : buf; links.push({ href: a.href || '', at: t.length }); continue; }
    if (tag === 'table') { if (!inCell()) { closeP(); flush(); } tstack.push({ rows: [], row: null, cell: null, pending: [] }); continue; }
    if (tag === 'tr') { if (curTable()) { closeRow(); curTable().row = []; } continue; }
    if (tag === 'td' || tag === 'th') {
      const t = curTable();
      if (!t) continue;
      closeCell();
      if (!t.row) t.row = [];
      t.cell = { text: '', colspan: Math.max(1, +a.colspan || 1), rowspan: Math.max(1, +a.rowspan || 1) };
      continue;
    }
    if (inCell()) { if (HTML_BLOCK.has(tag) || tag === 'li') brk(); continue; }
    if (/^h[1-6]$/.test(tag)) { closeP(); flush(); heading = +tag[1]; continue; }
    if (tag === 'ul' || tag === 'ol') { closeP(); if (liOpen) flush(); lists.push({ ordered: tag === 'ol' }); continue; }
    if (tag === 'li') { closeP(); closeLi(); liOpen = true; continue; }
    if (tag === 'p') { closeP(); flush(); pOpen = true; continue; }
    if (HTML_BLOCK.has(tag)) { closeP(); flush(); continue; }
  }
  while (tstack.length) closeTable();
  closeP(); closeLi(); flush();
  return { body: tidy(out), counts: `見出し ${headings}・表 ${tables}` };
}

// ======== 入口 ========
// 戻り値 { ok: true, kind, md, counts, tables? } / { ok: false, kind, reason } / { ok: true, kind: 'pdf' | 'image' }（md は作らない）
async function convertFile(name, bytes, { today } = {}) {
  const d = await detectKind(name, bytes);
  if (d.kind === 'reject') return { ok: false, kind: 'reject', reason: d.reason };
  if (d.kind === 'pdf' || d.kind === 'image') return { ok: true, kind: d.kind, md: null };
  let r;
  try {
    if (d.kind === 'xlsx') r = await xlsxToMd(bytes);
    else if (d.kind === 'csv' || d.kind === 'tsv') r = delimitedToMd(d.text, d.delim);
    else if (d.kind === 'json') r = jsonToMd(d.text);
    else if (d.kind === 'docx') r = await docxToMd(d.zip);
    else if (d.kind === 'pptx') r = await pptxToMd(d.zip);
    else if (d.kind === 'html') r = htmlToMd(d.text);
    else r = { body: d.text.replace(/^﻿/, '').replace(/\s+$/, '') + '\n', counts: `行 ${d.text.split(/\r?\n/).length}` };
  } catch (e) {
    return { ok: false, kind: d.kind, reason: String(e && e.message || e) };
  }
  return { ok: true, kind: d.kind, md: mdHeader(name, today || '', CONVERT_METHOD, r.counts) + r.body, counts: r.counts, tables: r.tables || null };
}


// ---- core/gemini-convert.js ----
// PDF・画像の変換は Gemini に任せる。その指示文と、返ってきた Markdown の点検。DOM に触れない。
// 指示文は、まず選択肢つきで確かめさせてから、要約せずに一字一句書き写させる（ユーザーの案）

// 先に確かめる 5 つ（番号で答えられる形）
const GEMINI_CONVERT_QUESTIONS = [
  { q: '表の扱い', choices: ['Markdown の表にする', '箇条書きにする'] },
  { q: '図・写真の扱い', choices: ['内容の説明を [図: …] で書く', '[図] の印だけ残す'] },
  { q: '見出しの付け方', choices: ['文字の大きさから見出しの段（#・##・###）を推定する', '見出しを付けない'] },
  { q: 'ページの区切り', choices: ['各ページの先頭に <!-- p.N --> を入れる（N はページ番号）', '入れない'] },
  { q: '読めない文字', choices: ['[読めない] と書く', '前後から推定して [推定: …] と書く'] },
];

// kind: 'pdf' | 'image'、pages: ページ数（分からなければ null）
function conversionPrompt({ fileName, kind, pages }) {
  const what = kind === 'pdf' ? `PDF「${fileName}」${pages ? `（全 ${pages} ページ）` : ''}` : `画像「${fileName}」`;
  const qs = GEMINI_CONVERT_QUESTIONS.map((x, i) => `${i + 1}. ${x.q}\n${x.choices.map((c, j) => `   ${String.fromCharCode(97 + j)}) ${c}`).join('\n')}`).join('\n');
  return [
    `あなたは、資料を一字一句そのまま Markdown に書き写す係です。添付した${what}を書き写してください。`,
    '',
    '## 守ること',
    '- 要約・言い換え・補足・意見を書かない。資料にある文字だけを、出てくる順に書く',
    '- 数字・固有名詞・記号・表の値を変えない。単位も省かない',
    '- 途中で止まったら、「続き」と言われてから、止まったところの次から続ける（前の部分を繰り返さない）',
    '',
    '## 最初の返事でやること',
    'まだ書き写さないでください。次の 5 つを、番号と記号（例「1a 2b 3a 4a 5a」）で答えられるように、そのまま私に聞いてください。',
    '',
    qs,
    '',
    '## 答えを受けた後',
    '- 答えに合わせて、全ページを順に書き写す',
    '- 出力は ```markdown の囲みの中に本文だけを書く。囲みの外に説明を書かない',
  ].join('\n') + '\n';
}

// 貼った返事から ``` の囲みの行をすべて外す（何回かに分かれた返事をつなげて貼ってよい）
function stripFences(text) {
  return String(text).split(/\r?\n/).filter((l) => !/^\s*```/.test(l)).join('\n').replace(/^\s+|\s+$/g, '') + '\n';
}

const TABLE_SEP = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/;

// 戻り値 { md, pageMarks, pagesExpected, missing, pageChecked, tables, headings, unreadable }
function inspectMarkdown(text, { pages } = {}) {
  const md = stripFences(text);
  const lines = md.split('\n');
  const marks = new Set();
  for (const m of md.matchAll(/<!--\s*p\.(\d+)\s*-->/g)) marks.add(+m[1]);
  const expected = Number.isInteger(pages) && pages > 0 ? pages : null;
  const pageChecked = marks.size > 0 && expected !== null;
  const missing = [];
  if (pageChecked) for (let i = 1; i <= expected; i++) if (!marks.has(i)) missing.push(i);
  return {
    md,
    pageMarks: marks.size,
    pagesExpected: expected,
    pageChecked,
    missing,
    tables: lines.filter((l) => TABLE_SEP.test(l) && l.includes('-')).length,
    headings: lines.filter((l) => /^#{1,6}\s/.test(l)).length,
    unreadable: (md.match(/\[読めない\]/g) || []).length,
  };
}

// PDF のページ数。ルートの /Type /Pages の中で最大の /Count。無ければ /Type /Page（/Pages を除く）の数。どちらも無ければ null
function pdfPageCount(bytes) {
  // ASCII の部分だけ見ればよいので、latin1 で読む
  const s = new TextDecoder('latin1').decode(bytes);
  let max = 0;
  for (const m of s.matchAll(/\/Type\s*\/Pages\b([\s\S]{0,400}?)(?:>>|endobj)/g)) {
    const c = /\/Count\s+(\d+)/.exec(m[1]);
    if (c) max = Math.max(max, +c[1]);
  }
  if (!max) {
    for (const m of s.matchAll(/\/Count\s+(\d+)[\s\S]{0,400}?\/Type\s*\/Pages\b/g)) max = Math.max(max, +m[1]);
  }
  if (max) return max;
  const n = (s.match(/\/Type\s*\/Page(?![s\w])/g) || []).length;
  return n || null;
}


// ---- core/transcript.js ----
// 写した部品: gemini-kit src/js/clean.js（2026-11-26）。外側の IIFE を、TRANSCRIPT だけを外に出す形に包み直した。中身は変えていない
// 議事録（文字起こし）の前処理。LLM は使わず、決まった規則だけで行う。
// 対応する形：
//   VTT（Teams）     00:00:12.345 --> 00:00:15.000 の次に <v 山田 太郎>本文</v> または 山田: 本文
//   Teams の txt     [00:12:34] 山田 太郎: 本文      ／  山田 太郎   0:03（次の行から本文）
//   Meet の txt      00:05:00（時刻だけの行）の後に 山田 太郎: 本文
//   話者:本文        山田：本文
// 出力は 1 発言 1 行の「時刻 話者｜本文」。判定できない行は本文のまま残し、件数を返す。
const TRANSCRIPT = (() => {

  const T = String.raw`\d{1,2}:\d{2}(?::\d{2})?(?:[.,]\d+)?`;
  const RE = {
    arrow: new RegExp(`^(${T})\\s*-->\\s*(${T})`),
    vtag: /^<v(?:\.[^\s>]+)?\s+([^>]+)>(.*?)(?:<\/v>)?\s*$/,
    timeSpeaker: new RegExp(`^\\[?(${T})\\]?\\s+(.{1,30}?)\\s*[:：]\\s*(.+)$`),
    header: new RegExp(`^(.{1,30}?)\\s+\\[?(${T})\\]?$`),
    timeOnly: new RegExp(`^\\[?(${T})\\]?$`),
    speaker: /^([^\s:：「」（）()]{1,16}(?:[ 　][^\s:：「」（）()]{1,16})?)\s*[:：]\s*(.+)$/,
    cueNo: /^\d+$/,
  };
  // つなぎ言葉。「あの件」「まあまあ」のような語を消さないよう、後ろに読点・長音・空白が続くときだけ消す
  const FILLER = /(^|[、。！？\s])(?:え[ーっ]+と?|えっと|ええと|あの[ーっ]+|あの(?=[、\s])|その[ーっ]+|まあ(?=[、\s])|う[ーん]+(?=[、\s]|$)|ん[ー]+|なんか(?=[、\s]))[、\s]*/g;
  const MERGE_UNDER = 40; // 同じ話者が続くとき、前の発言がこれより短ければつなげる

  const stripMs = (t) => t.replace(/[.,]\d+$/, "");

  function defiller(s) {
    let prev;
    do { prev = s; s = s.replace(FILLER, "$1"); } while (s !== prev);
    return s.replace(/、{2,}/g, "、").replace(/^[、\s]+/, "").replace(/\s{2,}/g, " ").trim();
  }

  // 話者らしくないもの（見出し・URL・時刻だけ）を除く
  function looksSpeaker(s) {
    if (!s || /^(https?|注|※|件名|日時|場所|参加者|出席者|todo|q|a)$/i.test(s)) return false;
    if (/(議題|メモ|備考|宿題|決定事項|連絡事項|補足)$/.test(s)) return false;
    return !/^\d+$/.test(s) && !/[。、]/.test(s);
  }

  function clean(text) {
    const src = String(text || "").replace(/\r\n?/g, "\n").split("\n");
    const lines = [];
    const raw = [];
    const hits = { vtt: 0, teams: 0, header: 0, meet: 0, speaker: 0 };
    let time = "";
    let pending = null; // ヘッダー形式で、次の行から本文が来る話者
    let lastWasBody = false;
    const push = (speaker, body, how) => {
      const t = defiller(body);
      if (!t) return;
      hits[how]++;
      lines.push({ t: time, speaker: speaker.trim(), text: t });
    };
    for (let i = 0; i < src.length; i++) {
      const line = src[i].trim();
      if (!line) { pending = pending && pending.used ? null : pending; lastWasBody = false; continue; }
      if (i === 0 && /^WEBVTT/.test(line)) continue;
      if (/^NOTE\b/.test(line)) continue;
      let m;
      if ((m = line.match(RE.arrow))) { time = stripMs(m[1]); pending = null; continue; }
      if (RE.cueNo.test(line) && src[i + 1] && RE.arrow.test(src[i + 1].trim())) continue;
      if ((m = line.match(RE.vtag))) { push(m[1], m[2].replace(/<[^>]+>/g, ""), "vtt"); lastWasBody = true; continue; }
      if ((m = line.match(RE.timeSpeaker)) && looksSpeaker(m[2])) { time = stripMs(m[1]); push(m[2], m[3], "teams"); pending = null; lastWasBody = true; continue; }
      if ((m = line.match(RE.timeOnly))) { time = stripMs(m[1]); pending = null; continue; }
      if ((m = line.match(RE.header)) && looksSpeaker(m[1]) && !/[:：]/.test(m[1])) {
        time = stripMs(m[2]);
        pending = { speaker: m[1], used: false };
        continue;
      }
      if (pending) {
        if (pending.used && lines.length) lines[lines.length - 1].text += " " + defiller(line);
        else { push(pending.speaker, line, "header"); pending.used = true; }
        continue;
      }
      if ((m = line.match(RE.speaker)) && looksSpeaker(m[1])) {
        push(m[1], m[2], time ? "meet" : "speaker");
        lastWasBody = true;
        continue;
      }
      // 直前が発言の続きなら、同じ発言に足す（改行で折り返された本文）
      // 「議題メモ：…」のように話者ではない見出しは続きにせず、本文のまま残す
      if (lastWasBody && lines.length && !RE.speaker.test(line)) { lines[lines.length - 1].text += " " + defiller(line); continue; }
      raw.push(line);
      lines.push({ t: "", speaker: "", text: line, raw: true });
    }

    // 同じ話者が続く短い発言を 1 つにまとめる（最初の時刻を残す）
    const merged = [];
    for (const l of lines) {
      const p = merged[merged.length - 1];
      if (p && !p.raw && !l.raw && p.speaker === l.speaker && p.text.length < MERGE_UNDER) p.text += " " + l.text;
      else merged.push(Object.assign({}, l));
    }

    const order = Object.entries(hits).sort((a, b) => b[1] - a[1]);
    const NAMES = { vtt: "Teams（VTT）", teams: "Teams（時刻つき）", header: "Teams（話者と時刻の見出し）", meet: "Meet", speaker: "話者:本文" };
    const format = order[0][1] ? NAMES[order[0][0]] : "判定できない形式";

    const by = new Map();
    for (const l of merged) {
      if (l.raw) continue;
      const s = by.get(l.speaker) || { speaker: l.speaker, count: 0, chars: 0 };
      s.count++;
      s.chars += l.text.length;
      by.set(l.speaker, s);
    }
    const out = merged.map((l) => (l.raw ? l.text : `${l.t ? l.t + " " : ""}${l.speaker}｜${l.text}`)).join("\n") + "\n";
    const parsed = merged.filter((l) => !l.raw).length;
    return {
      format,
      lines: merged,
      raw,
      out,
      stats: { utterances: parsed, unparsed: raw.length, rate: parsed + raw.length ? parsed / (parsed + raw.length) : 0, bySpeaker: [...by.values()].sort((a, b) => b.chars - a.chars) },
    };
  }

  return { clean, defiller };
})();


// ---- core/chat.js ----
// チャット（Teams・Google Chat の貼り付け）の読み取りと、1 行 1 発言の本文との行き来。DOM に触れない。
// 決まりは .claude/specs/workbench-p6c/design.md の「レビューを受けて決めたこと」の「チャットの読み取り」

const CHAT_TIME = '(?:(?:午前|午後)\\s*)?\\d{1,2}:\\d{2}';
const CHAT_FORMATS = [
  { id: 'bracket', label: '角かっこの日時' },
  { id: 'header', label: '名前と時刻の見出し' },
  { id: 'three', label: '名前・時刻・本文の 3 行' },
  { id: 'speaker', label: '話者:本文' },
];
const CHAT_FORMAT_LABEL = Object.fromEntries([...CHAT_FORMATS.map((f) => [f.id, f.label]), ['unknown', '判定できない形']]);

const RE_BRACKET = new RegExp(`^\\[(?:(\\d{4})/(\\d{1,2})/(\\d{1,2}) )?(${CHAT_TIME})\\] (.{1,30}?)[:：] ?(.*)$`);
const RE_HEADER = new RegExp(`^(.{1,30}?)[\\s、,]+(?:(\\d{4})/(\\d{1,2})/(\\d{1,2}) )?(${CHAT_TIME})$`);
const RE_TIME_ONLY = new RegExp(`^(${CHAT_TIME})$`);
const RE_SPEAKER = /^(.{0,19}?[^\d\s:：])[:：](.+)$/;
const RE_DATE_LINES = [
  /^(\d{4})年(\d{1,2})月(\d{1,2})日\s*(?:[(（][^)）]*[)）])?$/,
  /^(\d{4})\/(\d{1,2})\/(\d{1,2})\s*(?:[(（][^)）]*[)）])?$/,
  /^()(\d{1,2})月(\d{1,2})日\s*(?:[(（][^)）]*[)）])?$/,
];
// 落とす飾りの行
const DECOR = [
  /^[(（]?編集済み[)）]?$/,
  /^返信$/,
  /^\d+\s*件の返信$/,
  /^既読(\s*\d+)?$/,
  /さんがリアクションしました$/,
  /^[\p{Extended_Pictographic}\u200d\ufe0f]+(\s*\d+)?(\s+[\p{Extended_Pictographic}\u200d\ufe0f]+(\s*\d+)?)*$/u,   // 絵文字とリアクションの数だけの行（例 👍 2）
];

const chatPad2 = (n) => String(n).padStart(2, '0');
// 午前・午後を 24 時間にする
function to24(t) {
  const m = /^(午前|午後)?\s*(\d{1,2}):(\d{2})$/.exec(t);
  if (!m) return t;
  let hh = +m[2];
  if (m[1] === '午後' && hh < 12) hh += 12;
  if (m[1] === '午前' && hh === 12) hh = 0;
  return `${chatPad2(hh)}:${m[3]}`;
}
const looksDateOrNumber = (s) => /^[\d/:\-年月日\s()（）]+$/.test(s);

// 年の無い日付の年: 基準の年。月が基準の月より 2 か月以上先なら前の年（12 月から 1 月をまたぐとき）
function yearFor(month, today, year) {
  const ty = year || +today.slice(0, 4);
  const tm = +today.slice(5, 7);
  return month - tm >= 2 ? ty - 1 : ty;
}
function addDays(ymd, n) {
  const d = new Date(`${ymd}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function dateLine(line, today, year) {
  if (line === '今日') return today;
  if (line === '昨日') return addDays(today, -1);
  for (const re of RE_DATE_LINES) {
    const m = re.exec(line);
    if (!m) continue;
    const mo = +m[2], d = +m[3];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    const y = m[1] ? +m[1] : yearFor(mo, today, year);
    return `${y}-${chatPad2(mo)}-${chatPad2(d)}`;
  }
  return null;
}
const isDecor = (line) => DECOR.some((re) => re.test(line));

// その行が、形 f の発言の始まりか。始まりなら { speaker, time, date?, text, skip }（skip: 次の何行を読み飛ばすか）
function startOf(f, lines, i) {
  const line = lines[i];
  if (f === 'bracket') {
    const m = RE_BRACKET.exec(line);
    return m ? { speaker: m[5].trim(), time: to24(m[4]), date: m[1] ? `${m[1]}-${chatPad2(m[2])}-${chatPad2(m[3])}` : '', text: m[6].trim(), skip: 0 } : null;
  }
  if (f === 'header') {
    const m = RE_HEADER.exec(line);
    if (!m || looksDateOrNumber(m[1]) || RE_TIME_ONLY.test(m[1].trim())) return null;
    return { speaker: m[1].trim(), time: to24(m[5]), date: m[2] ? `${m[2]}-${chatPad2(m[3])}-${chatPad2(m[4])}` : '', text: '', skip: 0 };
  }
  if (f === 'three') {
    const next = lines[i + 1];
    if (next === undefined || !RE_TIME_ONLY.test(next)) return null;
    if (line.length > 30 || RE_TIME_ONLY.test(line) || looksDateOrNumber(line)) return null;
    return { speaker: line, time: to24(next), date: '', text: '', skip: 1 };
  }
  if (f === 'speaker') {
    const m = RE_SPEAKER.exec(line);
    return m ? { speaker: m[1].trim(), time: '', date: '', text: m[2].trim(), skip: 0 } : null;
  }
  return null;
}

// text: 貼り付け。today: YYYY-MM-DD（「今日」「昨日」と年の無い日付に使う）。year: 年の無い日付の基準の年（省くと today の年）
// 戻り値 { format, lines: [{ at, speaker, text, raw? }], dropped, unparsed, from, to }
function parseChat(text, { year, today } = {}) {
  const base = today || new Date().toISOString().slice(0, 10);
  const all = String(text || '').replace(/\r\n?/g, '\n').split('\n').map((l) => l.trim());
  let dropped = 0;
  const lines = [];   // 空行と飾りの行を除いた行
  for (const l of all) {
    if (!l) continue;
    if (isDecor(l)) { dropped++; continue; }
    lines.push(l);
  }
  // 形を決める: 発言の始まりに当たる行の数がいちばん多い形（同数なら上の形）
  let format = 'unknown';
  let best = 0;
  for (const f of CHAT_FORMATS) {
    let n = 0;
    for (let i = 0; i < lines.length; i++) if (!dateLine(lines[i], base, year) && startOf(f.id, lines, i)) n++;
    if (n > best) { best = n; format = f.id; }
  }
  const out = [];
  let cur = null;
  let date = '';
  let unparsed = 0;
  const finish = () => { if (cur) { if (cur.text) out.push(cur); cur = null; } };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const dl = dateLine(l, base, year);
    if (dl) { date = dl; continue; }
    const s = format === 'unknown' ? null : startOf(format, lines, i);
    if (s) {
      finish();
      const d = s.date || date;
      const at = s.time ? (d ? `${d} ${s.time}` : s.time) : (format === 'speaker' ? '' : d);
      cur = { at, speaker: s.speaker, text: s.text, date: d };
      i += s.skip;
      continue;
    }
    if (cur) { cur.text = cur.text ? `${cur.text} ${l}` : l; continue; }
    out.push({ at: '', speaker: '', text: l, raw: true });
    unparsed++;
  }
  finish();
  const dates = out.map((x) => x.date).filter(Boolean).sort();
  return {
    format,
    lines: out.map((x) => (x.raw ? { at: '', speaker: '', text: x.text, raw: true } : { at: x.at, speaker: x.speaker, text: x.text })),
    dropped,
    unparsed,
    from: dates[0] || '',
    to: dates[dates.length - 1] || '',
  };
}

// lines → 1 行 1 発言の本文（`at 話者｜本文`。at が無ければ `話者｜本文`。読めなかった行はそのまま）
function linesToBody(lines) {
  return lines.map((l) => (l.raw || !l.speaker ? l.text : `${l.at ? l.at + ' ' : ''}${l.speaker}｜${l.text}`)).join('\n');
}

// 本文 → lines（書き出しの JSON に使う）。最初の ｜ で分け、左の先頭が日時なら at、残りが話者
const RE_AT = /^((\d{4}-\d{2}-\d{2} )?\d{1,2}:\d{2}(:\d{2})?) /;
function bodyToLines(body) {
  return String(body || '').split('\n').filter((l) => l.trim() !== '').map((l) => {
    const k = l.indexOf('｜');
    if (k < 0) return { text: l };
    const left = l.slice(0, k);
    const m = RE_AT.exec(left);
    return m ? { at: m[1], speaker: left.slice(m[0].length).trim(), text: l.slice(k + 1) } : { at: '', speaker: left.trim(), text: l.slice(k + 1) };
  });
}


// ---- core/mask.js ----
// 写した部品: gemini-kit src/js/mask.js（2026-11-26）。外側の IIFE を、MASK だけを外に出す形に包み直した。中身は変えていない
// 貼り付けもファイル（CSV・TSV）も、この中の parseTable で読む（結果をそろえるため。P6c design.md）
// 表（Excel からのコピー＝TSV、または CSV）を列ごとの規則でマスキングする。ブラウザの中だけで処理する。
// ・同じ値には必ず同じ仮名を付ける（同じ接頭辞の列どうしで辞書を共有するので、別シートの結合キーも保てる）
// ・対応表は別に出力する。対応表は社外に出さない
const MASK = (() => {

  const RULES = {
    keep: "そのまま",
    pseudo: "仮名にする（顧客A など）",
    seq: "連番にする（形式は保つ）",
    email: "メールを仮のアドレスに",
    round: "数値を丸める（上位2桁）",
    range: "数値を範囲にする",
    reldate: "日付を基準日からの日数に",
    pref: "住所を都道府県までに",
    blank: "空にする",
    drop: "列ごと削除",
  };

  // ---------- 表の読み書き ----------
  function parseTable(text) {
    const src = String(text || "").replace(/\r\n?/g, "\n").replace(/\n+$/, "");
    if (!src) return [];
    const first = src.split("\n")[0];
    const sep = first.includes("\t") ? "\t" : ",";
    const rows = [];
    let row = [], cell = "", q = false;
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      if (q) {
        if (c === '"') { if (src[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"' && cell === "") q = true;
      else if (c === sep) { row.push(cell); cell = ""; }
      else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += c;
    }
    row.push(cell);
    rows.push(row);
    const n = Math.max(...rows.map((r) => r.length));
    return rows.map((r) => (r.length < n ? r.concat(Array(n - r.length).fill("")) : r));
  }
  function toTSV(rows) {
    return rows.map((r) => r.map((v) => (/[\t\n"]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v)).join("\t")).join("\n");
  }
  function toCSV(rows) {
    return "\uFEFF" + rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  }

  // ---------- 値の判定 ----------
  const num = (v) => {
    const s = String(v).replace(/[,，\s円¥￥]/g, "");
    return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : null;
  };
  function parseDate(v) {
    const m = String(v).trim().match(/^(\d{4})[/\-.年](\d{1,2})[/\-.月](\d{1,2})日?/);
    if (!m) return null;
    const d = Date.UTC(+m[1], +m[2] - 1, +m[3]);
    return Number.isNaN(d) ? null : d;
  }
  const EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;
  const PHONE = /0\d{1,4}-\d{1,4}-\d{3,4}/;
  const PREF = /(北海道|東京都|京都府|大阪府|[^\s都道府県]{2,3}県)/;

  // 見出しと値から規則の初期値を決める
  function infer(header, values) {
    const h = String(header || "");
    const vals = values.map((v) => String(v).trim()).filter(Boolean);
    const all = (f) => vals.length > 0 && vals.every(f);
    if (/(メール|mail)/i.test(h) || all((v) => EMAIL.test(v))) return { rule: "email" };
    if (/(顧客|得意先)/.test(h) && !/(コード|ID|番号|No)/i.test(h)) return { rule: "pseudo", prefix: "顧客" };
    if (/(仕入先|外注先|協力会社)/.test(h) && !/(コード|ID|番号)/i.test(h)) return { rule: "pseudo", prefix: "仕入先" };
    if (/(社名|会社|取引先|企業|法人|店舗|支店)/.test(h) && !/(コード|ID|番号)/i.test(h)) return { rule: "pseudo", prefix: "会社" };
    if (/(氏名|名前|担当|社員|作成者|承認者|申請者|責任者)/.test(h) && !/(コード|ID|番号)/i.test(h)) return { rule: "pseudo", prefix: "担当者" };
    if (/(電話|TEL|FAX|携帯)/i.test(h) || all((v) => PHONE.test(v))) return { rule: "seq" };
    if (/(郵便|〒)/.test(h)) return { rule: "blank" };
    if (/(住所|所在地)/.test(h)) return { rule: "pref" };
    if (/(備考|メモ|コメント|摘要|詳細|内容|自由記述)/.test(h)) return { rule: "blank" };
    if (all((v) => parseDate(v) != null)) return { rule: "reldate" };
    if (/(コード|ID|番号|No|ＩＤ)/i.test(h)) return { rule: "seq" };
    if (/(金額|売上|単価|価格|費用|予算|原価|利益|年収|給与|請求)/.test(h) && all((v) => num(v) != null)) return { rule: "round" };
    if (all((v) => num(v) != null)) {
      if (vals.some((v) => /^0\d/.test(v))) return { rule: "seq" };
      return { rule: "keep" };
    }
    const distinct = new Set(vals).size;
    const avg = vals.reduce((s, v) => s + v.length, 0) / Math.max(1, vals.length);
    if (avg > 25) return { rule: "blank" };
    if (distinct <= Math.max(8, vals.length * 0.3)) return { rule: "keep" };
    return { rule: "pseudo", prefix: (h || "項目").slice(0, 6) };
  }

  // ---------- 置き換え ----------
  const alpha = (i) => { let s = ""; i += 1; while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; };
  function seqFormat(orig, n) {
    const runs = [...String(orig).matchAll(/\d+/g)];
    if (!runs.length) return String(orig).replace(/[A-Za-z぀-ヿ一-鿿]+/g, "X") + n;
    let out = "", last = 0;
    runs.forEach((m, k) => {
      out += String(orig).slice(last, m.index);
      out += k === runs.length - 1 ? String(n).padStart(m[0].length, "0") : "0".repeat(m[0].length);
      last = m.index + m[0].length;
    });
    return out + String(orig).slice(last);
  }
  const man = (v) => {
    const a = Math.abs(v);
    if (a >= 1e8) return `${+(v / 1e8).toPrecision(3)}億`;
    if (a >= 1e4) return `${+(v / 1e4).toPrecision(3)}万`;
    return String(v);
  };
  function roundSig(v, d) {
    if (v === 0) return 0;
    const p = Math.pow(10, Math.floor(Math.log10(Math.abs(v))) - (d - 1));
    return Math.round(v / p) * p;
  }

  // state：{ dict: Map(group -> Map(original -> masked)) }。画面を開いている間だけ保持する（保存しない）
  function newState() { return { dict: new Map(), baseDate: null }; }

  function apply(rows, colRules, state, opt) {
    const o = Object.assign({ header: true, replaceInText: true }, opt);
    const st = state || newState();
    if (!rows.length) return { rows: [], mapping: [], warnings: [] };
    const head = o.header ? rows[0] : rows[0].map((_, i) => `列${i + 1}`);
    const body = o.header ? rows.slice(1) : rows;
    const mapping = [];
    const seen = new Set();
    const dictOf = (key) => { if (!st.dict.has(key)) st.dict.set(key, new Map()); return st.dict.get(key); };
    const record = (col, from, to) => { const k = col + "\u0000" + from; if (!seen.has(k)) { seen.add(k); mapping.push({ column: col, original: from, masked: to }); } };

    // 日付の基準日は表全体で1つ（列ごとに変えると、受注日と納期の前後関係が読めなくなる）。
    // 対応表を共有している間は、最初の表で決めた基準日を使い続ける（それより古い日は「基準日-N日」）
    if (st.baseDate == null) {
      const ds = [];
      colRules.forEach((cr, c) => { if (cr.rule === "reldate") for (const r of body) { const d = parseDate(r[c]); if (d != null) ds.push(d); } });
      if (ds.length) st.baseDate = Math.min(...ds);
    }
    const textReplace = []; // 他の列の文中に出てくる元の値 → 仮名
    const outBody = body.map((r) => r.map((v) => v));
    colRules.forEach((cr, c) => {
      const col = head[c];
      // 辞書の共有範囲：仮名は接頭辞ごと（別の列・別の表でも同じ値は同じ仮名）、メールは全体、連番は列ごと
      const group = cr.rule === "pseudo" ? "pseudo:" + (cr.prefix || "") : cr.rule === "seq" ? "seq:" + col : cr.rule;
      const dict = dictOf(group);
      for (const r of outBody) {
        const v = String(r[c] ?? "");
        if (v.trim() === "" && cr.rule !== "drop") continue;
        let out = v;
        switch (cr.rule) {
          case "pseudo":
            if (!dict.has(v)) dict.set(v, `${cr.prefix || "項目"}${alpha(dict.size)}`);
            out = dict.get(v);
            if (v.length >= 2) textReplace.push([v, out]);
            break;
          case "seq":
            if (!dict.has(v)) dict.set(v, seqFormat(v, dict.size + 1));
            out = dict.get(v);
            break;
          case "email":
            if (!dict.has(v)) dict.set(v, `user${String(dict.size + 1).padStart(3, "0")}@example.com`);
            out = dict.get(v);
            textReplace.push([v, out]);
            break;
          case "round": {
            const n = num(v);
            if (n == null) { out = "（数値以外）"; break; }
            const rv = roundSig(n, cr.digits || 2);
            out = /,/.test(v) ? rv.toLocaleString("en-US") : String(rv);
            break;
          }
          case "range": {
            const n = num(v);
            if (n == null) { out = "（数値以外）"; break; }
            if (n === 0) { out = "0"; break; }
            const lo = Math.pow(10, Math.floor(Math.log10(Math.abs(n))));
            out = n < 0 ? `-${man(lo * 10)}超〜-${man(lo)}以下` : `${man(lo)}以上${man(lo * 10)}未満`;
            break;
          }
          case "reldate": {
            const d = parseDate(v);
            if (d == null) { out = "（日付以外）"; break; }
            const days = Math.round((d - st.baseDate) / 86400000);
            out = days < 0 ? `基準日-${-days}日` : `基準日+${days}日`;
            break;
          }
          case "pref": {
            const m = v.match(PREF);
            out = m ? m[1] : "（不明）";
            break;
          }
          case "blank": out = ""; break;
          default: break;
        }
        if (out !== v && cr.rule !== "blank" && cr.rule !== "drop") record(col, v, out);
        r[c] = out;
      }
    });
    // そのままの列の文中にある元の値を置き換える（長いものから）
    if (o.replaceInText && textReplace.length) {
      textReplace.sort((a, b) => b[0].length - a[0].length);
      colRules.forEach((cr, c) => {
        if (cr.rule !== "keep") return;
        for (const r of outBody) {
          let v = String(r[c] ?? "");
          for (const [from, to] of textReplace) if (v.includes(from)) v = v.split(from).join(to);
          r[c] = v;
        }
      });
    }
    const keepIdx = colRules.map((cr, c) => (cr.rule === "drop" ? -1 : c)).filter((c) => c >= 0);
    const outRows = (o.header ? [head] : []).concat(outBody).map((r) => keepIdx.map((c) => r[c]));
    return { rows: outRows, mapping, warnings: check(outRows, colRules.filter((cr) => cr.rule !== "drop"), o.header, textReplace) };
  }

  // 残っていそうな固有情報を探す
  function check(rows, rules, header, replaced) {
    const warns = [];
    const pats = [
      [/(株式会社|有限会社|合同会社|\(株\)|（株）|㈱|\(有\)|㈲)/, "会社名らしき文字"],
      [EMAIL, "メールアドレス"],
      [PHONE, "電話番号"],
      [/〒?\d{3}-\d{4}/, "郵便番号"],
      [/(様|殿|さん)(\s|$|、|。)/, "敬称つきの人名らしき文字"],
    ];
    const originals = new Set(replaced.map((x) => x[0]));
    rows.forEach((r, i) => {
      if (header && i === 0) return;
      r.forEach((v, c) => {
        const s = String(v);
        // 置き換えた列は形式が決まっているので、そのままにした列だけを見る
        if (!s || (rules[c] && rules[c].rule !== "keep")) return;
        for (const [re, what] of pats) if (re.test(s)) { warns.push({ row: i + 1, col: c + 1, rule: rules[c] && rules[c].rule, message: what }); break; }
        if (originals.has(s)) warns.push({ row: i + 1, col: c + 1, message: "置き換え前の値がそのまま残っています" });
      });
    });
    return warns;
  }

  function mappingCSV(mapping) {
    return toCSV([["列", "元の値", "置き換え後"], ...mapping.map((m) => [m.column, m.original, m.masked])]);
  }

  return { RULES, parseTable, toTSV, toCSV, infer, apply, newState, mappingCSV, seqFormat };
})();


// ---- core/mastercheck.js ----
// マスタの点検: 元データ（CSV / TSV）をテーブルの列の定義と突き合わせる。元データは保存しない

const CHECKS = [
  { v: 'header', label: '見出しと列の対応' },
  { v: 'pk', label: '主キーの重複' },
  { v: 'required', label: '必須の空欄' },
  { v: 'type', label: '型と長さの違反' },
  { v: 'pattern', label: 'コードの形の違反' },
  { v: 'fk', label: '参照先に無い値' },
];
const ISSUE_LIMIT = 1000;

const norm = (s) => String(s == null ? '' : s).trim().toLowerCase();

// 見出し → 列の対応。戻り値: { map: (列 | null)[], unknown: string[], missing: Column[] }
function mapHeaders(entity, header) {
  const cols = entity.columns || [];
  const map = header.map((hd) => cols.find((c) => norm(c.name) === norm(hd) || (c.logical && norm(c.logical) === norm(hd))) || null);
  const unknown = header.filter((hd, i) => !map[i] && norm(hd) !== '');
  const missing = cols.filter((c) => (c.required || c.pk) && !map.includes(c));
  return { map, unknown, missing };
}

function isValidDate(y, m, d) {
  const t = new Date(Date.UTC(y, m - 1, d));
  return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
}

// 型と長さ。違反ならメッセージ、問題なければ null
function typeError(col, v) {
  const s = String(v);
  switch (col.type) {
    case 'int':
    case 'bigint':
      return /^-?\d+$/.test(s) ? null : '整数ではありません';
    case 'decimal': {
      const m = /^-?(\d+)(?:\.(\d+))?$/.exec(s);
      if (!m) return '数値ではありません';
      const scale = col.scale || 0;
      if ((m[2] || '').length > scale) return `小数点以下は ${scale} 桁までです`;
      if (col.length && m[1].replace(/^0+(?=\d)/, '').length > col.length - scale) return `整数部が ${col.length - scale} 桁を超えています`;
      return null;
    }
    case 'date': {
      const m = /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/.exec(s);
      return m && isValidDate(+m[1], +m[2], +m[3]) ? null : '日付（YYYY-MM-DD か YYYY/MM/DD）ではありません';
    }
    case 'datetime': {
      const m = /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/.exec(s);
      return m && isValidDate(+m[1], +m[2], +m[3]) && (m[4] === undefined || (+m[4] < 24 && +m[5] < 60)) ? null : '日時ではありません';
    }
    case 'boolean':
      return /^(0|1|true|false)$/i.test(s) ? null : '0 / 1 / true / false ではありません';
    default:
      return col.length && [...s].length > col.length ? `${col.length} 文字を超えています（${[...s].length} 文字）` : null;
  }
}

// rows: 見出しを含む string[][]。refData: Map<テーブルID, { header: string[], rows: string[][] }>（外部キーの点検用。任意）
// 戻り値: { summary: Record<種類, 件数>, issues: [{ row, column, type, value, message }], total, dataRows, mapping }
function checkMaster(entity, rows, refData = new Map(), allEntities = []) {
  const summary = Object.fromEntries(CHECKS.map((c) => [c.v, 0]));
  const issues = [];
  const add = (row, column, type, value, message) => {
    summary[type]++;
    if (issues.length < ISSUE_LIMIT) issues.push({ row, column, type, value, message });
  };
  if (!rows.length) return { summary, issues, total: 0, dataRows: 0, mapping: null };
  const header = rows[0];
  const mapping = mapHeaders(entity, header);
  for (const u of mapping.unknown) add(1, u, 'header', u, `見出し「${u}」に当たる列がありません`);
  for (const c of mapping.missing) add(1, c.name, 'header', '', `必須の列「${c.name}」${c.logical ? `（${c.logical}）` : ''}の見出しがありません`);

  // 外部キーの参照先の値の集合（参照先の元データが渡されたときだけ）
  const refSets = new Map();
  for (const c of entity.columns || []) {
    if (!c.fk || !refData.has(c.fk.entity)) continue;
    const ref = refData.get(c.fk.entity);
    const refEnt = allEntities.find((e) => e.id === c.fk.entity);
    if (!refEnt) continue;
    const m = mapHeaders(refEnt, ref.header);
    const idx = m.map.findIndex((x) => x && norm(x.name) === norm(c.fk.column));
    if (idx < 0) continue;
    refSets.set(c.name, new Set(ref.rows.map((r) => String(r[idx] ?? '').trim())));
  }

  const pkCols = mapping.map.map((c, i) => (c && c.pk ? i : -1)).filter((i) => i >= 0);
  const seenPk = new Map();
  let dataRows = 0;
  for (let r = 1; r < rows.length; r++) {
    const line = r + 1;  // 見出しが 1 行目
    const row = rows[r];
    dataRows++;
    mapping.map.forEach((col, i) => {
      if (!col) return;
      const v = String(row[i] ?? '').trim();
      if (v === '') {
        if (col.required || col.pk) add(line, col.name, 'required', '', `「${col.name}」が空です`);
        return;
      }
      const te = typeError(col, v);
      if (te) add(line, col.name, 'type', v, `「${col.name}」: ${te}`);
      if (col.pattern) {
        let re = null;
        try { re = new RegExp(col.pattern); } catch (e) { re = null; }
        if (re && !re.test(v)) add(line, col.name, 'pattern', v, `「${col.name}」がコードの形（${col.pattern}）に合いません`);
      }
      if (refSets.has(col.name) && !refSets.get(col.name).has(v)) add(line, col.name, 'fk', v, `「${col.name}」の値「${v}」が参照先に見つかりません`);
    });
    if (pkCols.length) {
      const key = pkCols.map((i) => String(row[i] ?? '').trim()).join('\u0001');
      if (pkCols.every((i) => String(row[i] ?? '').trim() !== '')) {
        if (seenPk.has(key)) add(line, pkCols.map((i) => mapping.map[i].name).join('+'), 'pk', key.split('\u0001').join(' / '), `主キーが ${seenPk.get(key)} 行目と重複しています`);
        else seenPk.set(key, line);
      }
    }
  }
  return { summary, issues, total: Object.values(summary).reduce((a, b) => a + b, 0), dataRows, mapping };
}


// ---- core/trace.js ----
// トレーサビリティ: 要件ごとに、つながる要望・設計の項目・テストと判定を出す
// つながりは links（向きなし。linkIndex）で見る。設計の項目につながるテストも、その要件のテストとして数える


const VERDICTS = [
  { v: 'none', label: 'テストなし' },
  { v: 'failed', label: '不合格あり' },
  { v: 'pending', label: '未実施あり' },
  { v: 'passed', label: 'すべて合格' },
];
const DESIGN = new Set(['screen', 'interface', 'batch', 'entity']);

// 戻り値: [{ req, requests, design, tests, counts: Record<status, n>, verdict }]
function traceRows(ledger) {
  const idx = linkIndex(ledger);
  const byId = new Map(ledger.items.map((it) => [it.id, it]));
  const near = (id) => [...(idx.get(id) || [])].map((x) => byId.get(x)).filter(Boolean);
  return ledger.items
    .filter((it) => it.kind === 'requirement' && it.status !== 'dropped')
    .map((req) => {
      const linked = near(req.id);
      const requests = linked.filter((x) => x.kind === 'request');
      const design = linked.filter((x) => DESIGN.has(x.kind) && x.status !== 'dropped');
      const tests = new Map();
      for (const t of linked.filter((x) => x.kind === 'test')) tests.set(t.id, t);
      for (const d of design) for (const t of near(d.id)) if (t.kind === 'test') tests.set(t.id, t);
      const list = [...tests.values()];
      const counts = {};
      for (const t of list) counts[t.status] = (counts[t.status] || 0) + 1;
      let verdict = 'passed';
      if (!list.length) verdict = 'none';
      else if (counts.failed) verdict = 'failed';
      else if (list.some((t) => t.status !== 'passed')) verdict = 'pending';
      return { req, requests, design, tests: list, counts, verdict };
    });
}

// 工程ごとの合格率。戻り値: [{ level, total, passed, failed, rate }]
function passRates(ledger, levels) {
  const tests = ledger.items.filter((it) => it.kind === 'test');
  return levels.map((lv) => {
    const t = tests.filter((x) => x.level === lv.v);
    const passed = t.filter((x) => x.status === 'passed').length;
    const failed = t.filter((x) => x.status === 'failed').length;
    return { level: lv.v, label: lv.label, total: t.length, passed, failed, rate: t.length ? Math.round((passed / t.length) * 1000) / 10 : null };
  });
}


// ---- core/workspace.js ----
// 複数案件の入れ物（workspace）。暗号化の箱の中身はこの形になる（P5）
// type: 'workspace', version: 1, activeId, ledgers: { 案件ID: 台帳 }, exported: { 案件ID: { revision, at } }

const WORKSPACE_VERSION = 1;

function newProjectId() {
  const r = globalThis.crypto && globalThis.crypto.getRandomValues ? globalThis.crypto.getRandomValues(new Uint32Array(2)) : [Math.random() * 2 ** 32, Math.random() * 2 ** 32];
  return 'p' + [...r].map((x) => Math.floor(x).toString(36)).join('');
}

function emptyWorkspace() {
  return { type: 'workspace', version: WORKSPACE_VERSION, activeId: null, ledgers: {}, exported: {} };
}

// 箱の中身（P4 までの台帳1件 / workspace）を workspace にそろえる。
// legacyExported: P4 までの書き出し状態（{ revision, at }）。戻り値: { workspace, wrapped } / { error }
function migrateWorkspace(obj, legacyExported) {
  if (obj && obj.type === 'workspace' && obj.version === WORKSPACE_VERSION && obj.ledgers && typeof obj.ledgers === 'object') {
    return { workspace: { ...emptyWorkspace(), ...obj, exported: obj.exported || {} }, wrapped: false };
  }
  if (obj && obj.type === 'ledger') {
    const id = newProjectId();
    const ws = emptyWorkspace();
    ws.ledgers[id] = obj;
    ws.activeId = id;
    ws.exported[id] = legacyExported || { revision: null, at: null };
    return { workspace: ws, wrapped: true };
  }
  return { error: '保存されたデータの形が分かりません' };
}

// 案件ごとに検査する。check(ledgerObj) → { ok, ledger, migrated } / { ok: false, errors }
// 戻り値: { workspace（読めた案件だけ）, broken: { 案件ID: 元の文字列 }, migratedIds: string[] }
function openWorkspace(ws, check) {
  const out = { ...ws, ledgers: {}, exported: { ...(ws.exported || {}) } };
  const broken = {};
  const migratedIds = [];
  for (const [id, obj] of Object.entries(ws.ledgers || {})) {
    let r;
    try { r = check(obj); } catch (e) { r = { ok: false, errors: [String(e && e.message || e)] }; }
    if (r.ok) {
      out.ledgers[id] = r.ledger;
      if (r.migrated) { migratedIds.push(id); out.exported[id] = { revision: null, at: null }; }
    } else {
      broken[id] = JSON.stringify(obj, null, 2);
      delete out.exported[id];
    }
  }
  if (!out.ledgers[out.activeId]) out.activeId = Object.keys(out.ledgers)[0] || null;
  return { workspace: out, broken, migratedIds };
}

// 同じ案件名の案件の ID（無ければ null）
function findByName(ws, name) {
  const n = String(name || '').trim();
  for (const [id, l] of Object.entries(ws.ledgers)) if (String(l.project && l.project.name || '').trim() === n) return id;
  return null;
}


// ---- core/cross.js ----
// 案件をまたいだ一覧（横断）: 自分の作業・自分が持つボール・顧客待ち・案件ごとの高の件数と SPI
// 新しい計算は持たず、既存の関数（ballOf / waitDays / runHealth / computeEvm）を案件ごとに呼んで集める


const CROSS_DAYS = 14;

// 戻り値: [{ id, name, me, myTasks, myBalls, waiting, high, spi }]（me が未設定なら myTasks・myBalls は null）
function crossSummary(workspace, today) {
  const t = dayNumber(today);
  return Object.entries(workspace.ledgers).map(([id, l]) => {
    const me = settingOf(l, 'me');
    const hasMe = !!(me && l.items.some((x) => x.id === me));
    const myTasks = hasMe
      ? l.items.filter((x) => x.kind === 'task' && x.assignee === me && isOpen(x) && x.end && dayNumber(x.end) <= t + CROSS_DAYS)
        .sort((a, b) => a.end.localeCompare(b.end))
        .map((x) => ({ item: x, overdue: dayNumber(x.end) < t }))
      : null;
    const myBalls = hasMe
      ? l.items.filter((x) => (x.kind === 'issue' && x.owner === me) || (x.kind === 'question' && x.askTo === me)).filter(isOpen)
        .map((x) => ({ item: x, wait: waitDays(x, l, today) }))
      : null;
    const limit = settingOf(l, 'ballWaitDays');
    const waiting = l.items.filter((x) => ballOf(x, l) === 'customer')
      .map((x) => ({ item: x, wait: waitDays(x, l, today) }))
      .filter((w) => w.wait !== null && w.wait >= limit)
      .sort((a, b) => b.wait - a.wait);
    const high = runHealth(l, today).filter((f) => f.severity === 'high').length;
    const spi = l.items.some((x) => x.kind === 'task') ? computeEvm(l, today).spi : null;
    return { id, name: l.project.name, me: hasMe ? me : null, myTasks, myBalls, waiting, high, spi };
  });
}


// ---- core/org.js ----
// 体制図の配置。DOM に触れない。
// 列は立場（schema の stakeholder.side の順）、列の中は所属ごとのまとまり、まとまりの中は上長 → 部下の木（字下げ）。
// 上長が別の所属・別の列にいるときは、その所属の根として置き、線だけ引く（cross）。上長が循環していても箱は消えない


const ORG_BOX = { w: 200, h: 46, indent: 18, gapY: 8, groupGap: 30, colGap: 40, top: 30, left: 16, groupHead: 22 };

// 戻り値 { columns: [{ side, label, x, groups: [{ org, y, nodes: [{ id, item, x, y, w, h, depth, cycle }] }] }], edges: [{ from, to, cross }], width, height }
function orgLayout(ledger) {
  const B = ORG_BOX;
  const people = ledger.items.filter((it) => it.kind === 'stakeholder');
  const byId = new Map(people.map((p) => [p.id, p]));
  const sides = KINDS.stakeholder.fields.side.values;
  const orgOf = (p) => String(p.org || '').trim() || '（所属なし）';
  const columns = [];
  const pos = new Map();
  let height = 0;
  sides.forEach((sd, ci) => {
    const x = B.left + ci * (B.w + B.indent * 3 + B.colGap);
    const col = { side: sd.v, label: sd.label, x, groups: [] };
    const inSide = people.filter((p) => p.side === sd.v);
    const orgs = [...new Set(inSide.map(orgOf))].sort((a, b) => (a === '（所属なし）') - (b === '（所属なし）') || a.localeCompare(b, 'ja'));
    let y = B.top;
    for (const org of orgs) {
      const members = inSide.filter((p) => orgOf(p) === org).sort((a, b) => a.id.localeCompare(b.id));
      const inGroup = new Set(members.map((p) => p.id));
      const kids = new Map();
      for (const p of members) if (p.reportsTo && inGroup.has(p.reportsTo) && p.reportsTo !== p.id) {
        if (!kids.has(p.reportsTo)) kids.set(p.reportsTo, []);
        kids.get(p.reportsTo).push(p);
      }
      const group = { org, y, nodes: [] };
      y += B.groupHead;
      const seen = new Set();
      const place = (p, depth, cycle) => {
        if (seen.has(p.id)) return;
        seen.add(p.id);
        const node = { id: p.id, item: p, x: x + depth * B.indent, y, w: B.w, h: B.h, depth, cycle: !!cycle };
        group.nodes.push(node);
        pos.set(p.id, node);
        y += B.h + B.gapY;
        for (const c of kids.get(p.id) || []) place(c, depth + 1, false);
      };
      // 根: 上長がいない・上長がこのまとまりの外・自分自身
      for (const p of members) if (!p.reportsTo || !inGroup.has(p.reportsTo) || p.reportsTo === p.id) place(p, 0, false);
      // 循環だけでできた人も消えないよう、残りを根として置く（印つき）
      for (const p of members) if (!seen.has(p.id)) place(p, 0, true);
      col.groups.push(group);
      y += B.groupGap;
    }
    height = Math.max(height, y);
    columns.push(col);
  });
  const edges = [];
  for (const p of people) {
    if (!p.reportsTo || !byId.has(p.reportsTo) || p.reportsTo === p.id) continue;
    const a = pos.get(p.reportsTo), b = pos.get(p.id);
    if (!a || !b) continue;
    edges.push({ from: p.reportsTo, to: p.id, cross: a.item.side !== b.item.side || orgOf(a.item) !== orgOf(b.item) });
  }
  const width = B.left * 2 + sides.length * (B.w + B.indent * 3 + B.colGap);
  return { columns, edges, width, height: Math.max(height, B.top + 60) };
}


// ---- core/kpi.js ----
// KPI の木: 目的 → ゴール（案件情報の goals の文）→ KPI（→ 子の KPI）→ 施策（KPI と関連でつながる要望）→ 要件。DOM に触れない。
// 子の KPI は親の下にだけ出し、どのゴールの下に置くかは、いちばん上の祖先の goal で決める。循環していても止まる


// 戻り値 { purpose, roots: [{ goal, nodes: [Node] }], unassigned: [Node], count }
// Node = { kpi, children: [Node], requests: [{ request, requirements: [要件] }], directRequirements: [要件] }
function kpiTree(ledger) {
  const kpis = ledger.items.filter((it) => it.kind === 'kpi');
  const byId = new Map(ledger.items.map((it) => [it.id, it]));
  const links = linkIndex(ledger);
  const linked = (id, pred) => [...(links.get(id) || [])].map((x) => byId.get(x)).filter((x) => x && pred(x)).sort((a, b) => a.id.localeCompare(b.id));
  const isReq = (x) => x.kind === 'requirement' && x.status !== 'dropped';
  const kids = new Map();
  const kpiIds = new Set(kpis.map((k) => k.id));
  for (const k of kpis) if (k.parent && kpiIds.has(k.parent) && k.parent !== k.id) {
    if (!kids.has(k.parent)) kids.set(k.parent, []);
    kids.get(k.parent).push(k);
  }
  let count = 0;
  const seen = new Set();
  const build = (k) => {
    if (seen.has(k.id)) return null;   // 循環していても止まる（循環は検査が出す）
    seen.add(k.id);
    count++;
    const requests = linked(k.id, (x) => x.kind === 'request' && x.status !== 'rejected').map((request) => ({ request, requirements: linked(request.id, isReq) }));
    count += requests.reduce((a, r) => a + 1 + r.requirements.length, 0);
    const directRequirements = linked(k.id, isReq);
    count += directRequirements.length;
    const children = (kids.get(k.id) || []).sort((a, b) => a.id.localeCompare(b.id)).map(build).filter(Boolean);
    return { kpi: k, children, requests, directRequirements };
  };
  // 根: 親が無いか、親が KPI でないもの。循環だけでできた KPI も消えないよう、最後に残りを根として足す
  const rootKpis = kpis.filter((k) => !k.parent || !kpiIds.has(k.parent) || k.parent === k.id);
  const goalsList = (ledger.project.goals || []).map((g) => String(g).trim()).filter(Boolean);
  const roots = goalsList.map((goal) => ({ goal, nodes: [] }));
  const byGoal = new Map(roots.map((r) => [r.goal, r]));
  const unassigned = [];
  for (const k of rootKpis) {
    const n = build(k);
    if (!n) continue;
    const g = byGoal.get(String(k.goal || '').trim());
    (g ? g.nodes : unassigned).push(n);
  }
  for (const k of kpis) if (!seen.has(k.id)) { const n = build(k); if (n) unassigned.push(n); }
  return { purpose: ledger.project.purpose || '', roots, unassigned, count: count + roots.length };
}


// ---- core/risk.js ----
// リスクのヒートマップと「課題へ移す」。DOM に触れない


// 点数の段（1〜4: 1、5〜9: 2、10〜14: 3、15〜25: 4）。ヒートマップの色に使う
function heatLevel(score) {
  return score >= 15 ? 4 : score >= 10 ? 3 : score >= 5 ? 2 : 1;
}

// 戻り値 { cells: number[5][5]（[見込み-1][影響-1]。監視中・対策中だけを数える）, items: [{ risk, score }]（全状態。点数の高い順） }
function riskMatrix(ledger) {
  const risks = ledger.items.filter((it) => it.kind === 'risk');
  const cells = Array.from({ length: 5 }, () => Array(5).fill(0));
  for (const r of risks) {
    if (!isOpen(r)) continue;
    const p = Number(r.prob), i = Number(r.impact);
    if (p >= 1 && p <= 5 && i >= 1 && i <= 5) cells[p - 1][i - 1]++;
  }
  const items = risks.map((risk) => ({ risk, score: riskScore(risk) })).sort((a, b) => b.score - a.score || a.risk.id.localeCompare(b.risk.id));
  return { cells, items };
}

// 課題へ移せるか（監視中・対策中だけ。発生・解消では出さない＝二重に課題ができないように）
const canMoveToIssue = (r) => r && r.kind === 'risk' && isOpen(r);

// 1 回の操作で、リスクを指す課題を足し、リスクを「発生」にする
function riskToIssueOps(r) {
  const s = riskScore(r);
  const body = [r.trigger ? `きっかけ: ${r.trigger}` : '', r.response ? `対策: ${r.response}` : '', r.body || ''].filter(Boolean).join('\n');
  const item = { kind: 'issue', title: `（発生）${r.title}`, severity: s >= 15 ? 'high' : s >= 8 ? 'mid' : 'low', links: [r.id], internal: !!r.internal, confidence: 'fact' };
  if (body) item.body = body;
  if (r.owner) item.owner = r.owner;
  return [{ op: 'add', tempId: 'new:1', item }, { op: 'update', id: r.id, set: { status: 'occurred' } }];
}


// ---- core/flow.js ----
// 写した部品: gemini-kit src/js/flow.js（2026-11-26）。外側の IIFE を、FLOWCHART だけを外に出す形に包み直した。
// 変えたところ: 参照の ID の接頭辞（REF_ID・REF_RE）。toSVG・render・palette と色の表は写さない
// フロー記法 → 構造 → 自動配置 → SVG。
// Gemini には構造（テキスト）だけを書かせ、座標はここで決める。
// 配置の方針：
//   ・左から右へ流れる。レーン（担当）は横帯
//   ・段（rank）は最長経路で決め、段をまたぐ矢印には見えない中継点を置く
//   ・矢印の縦の線は段と段のすき間だけを通す（箱の上を通らない）
//   ・戻りの矢印はレーンの下の余白を通す
const FLOWCHART = (() => {

  // 種類のキーワード。日本語でも書ける
  const TYPE_WORDS = {
    start: "start", 開始: "start",
    end: "end", 終了: "end",
    task: "task", 処理: "task",
    decision: "decision", 分岐: "decision", 判断: "decision",
    data: "data", データ: "data", 入出力: "data",
    doc: "doc", 帳票: "doc", 書類: "doc",
    sub: "sub", サブ: "sub", 定義済み処理: "sub",
  };
  const TYPE_NAMES = { start: "開始", end: "終了", task: "処理", decision: "分岐", data: "データ", doc: "帳票", sub: "サブ処理" };
  // 処理の担い手の区分。{AI} {ルール} {人} {外部} をレーンかノードに付ける。色はどの図でも同じ（テーマにもレーンの順番にもよらない）
  const ROLE_WORDS = {
    ai: "ai", llm: "ai", "ai判断": "ai",
    rule: "rule", ルール: "rule", "ルール判定": "rule", プログラム: "rule", program: "rule", script: "rule",
    human: "human", 人: "human", 人手: "human", "人の判断": "human",
    ext: "ext", external: "ext", 外部: "ext",
  };
  const ROLES = {
    ai: { name: "AI", decision: "AI判断" },
    rule: { name: "ルール", decision: "ルール判定" },
    human: { name: "人", decision: "人の判断" },
    ext: { name: "外部", decision: "外部の判断" },
  };
  const ROLE_ORDER = ["ai", "rule", "human", "ext"];
  const roleOf = (w) => { const k = String(w).trim(); return ROLE_WORDS[k.toLowerCase()] || ROLE_WORDS[k] || null; };
  // 末尾の {区分}（全角の ｛｝ も）
  const TAG_RE = /\s*[{｛]([^}｝]*)[}｝]\s*$/;
  // 末尾の参照 [JDG-001] [Q-04 TBL-001]（全角の ［］ も）。判断マスタ・テーブル定義・カルテの ID だけを対象にする
  // 写し元から変えたところ: 参照の接頭辞を JDG・TBL と台帳の全種別にする（カルテの Q・H・F・D は外す）
  const REF_PFX = ['JDG', 'TBL', ...Object.values(KINDS).map((k) => k.prefix)].join('|');
  const REF_ID = new RegExp(`(?:${REF_PFX})-\\d{1,4}(?![\\d-])`, 'g');
  const REF_RE = new RegExp(`\\s*[[［]\\s*((?:(?:${REF_PFX})-\\d{1,4}(?![\\d-])[\\s,、，]*)+)[\\]］]\\s*$`);

  // ---------- 文字幅 ----------
  // 全角は 1em、半角は 0.6em とみなす（メイリオ / Arial の近似）
  function charW(c) {
    const code = c.codePointAt(0);
    if (code < 0x80) return /[A-Z0-9mwMW]/.test(c) ? 0.66 : 0.56;
    if (code >= 0xff61 && code <= 0xff9f) return 0.55; // 半角カナ
    return 1;
  }
  function textW(s, size) {
    let w = 0;
    for (const c of s) w += charW(c);
    return w * size;
  }
  // 幅に収まるように折り返す。\n は明示の改行。英単語の途中ではなるべく切らない
  function wrap(text, maxW, size) {
    const out = [];
    for (const para of String(text).split("\n")) {
      const start = out.length;
      let line = "";
      let w = 0;
      const chars = [...para];
      for (let i = 0; i < chars.length; i++) {
        const c = chars[i];
        const cw = charW(c) * size;
        if (w + cw > maxW && line) {
          // 半角英数の途中なら直前の空白で切る
          const sp = line.lastIndexOf(" ");
          if (/[A-Za-z0-9]/.test(c) && sp > 0 && sp > line.length - 12) {
            out.push(line.slice(0, sp));
            line = line.slice(sp + 1);
            w = textW(line, size);
          } else {
            out.push(line);
            line = "";
            w = 0;
          }
          if (c === " ") continue;
        }
        line += c;
        w += cw;
      }
      // 最後の行が1文字だけになるなら前の行から1文字もらう
      if ([...line].length === 1 && out.length > start && [...out[out.length - 1]].length > 2) {
        const prev = [...out.pop()];
        line = prev.pop() + line;
        out.push(prev.join(""));
      }
      out.push(line);
    }
    return out;
  }

  // ---------- パース ----------
  function parse(src) {
    const g = { title: "", lanes: [], laneRoles: [], nodes: [], edges: [], errors: [], warnings: [] };
    const byId = new Map();
    const laneSet = new Set();
    let declaredLanes = false;
    const pendingEdges = [];
    const pendingNotes = [];
    const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
    const err = (line, msg) => g.errors.push({ line, message: msg });

    lines.forEach((raw, i) => {
      const ln = i + 1;
      const s = raw.trim();
      if (!s || s.startsWith("#") || s.startsWith("//") || s.startsWith("```")) return;
      let m;
      if ((m = s.match(/^(?:title|タイトル)\s*[:：]?\s*(.+)$/i))) { g.title = m[1].trim(); return; }
      if ((m = s.match(/^(?:lanes|レーン一覧)\s*[:：]?\s*(.+)$/i))) {
        for (const name of m[1].split(/[,、，]/).map((x) => x.trim()).filter(Boolean)) addLane(name, ln);
        declaredLanes = true;
        return;
      }
      if ((m = s.match(/^(?:lane|レーン)\s*[:：]?\s*(.+)$/i))) { addLane(m[1].trim(), ln); declaredLanes = true; return; }
      if ((m = s.match(/^(?:note|注記)\s+([A-Za-z0-9_]+)\s*[:：]?\s*(.+)$/i))) { pendingNotes.push({ id: m[1], text: m[2].trim(), line: ln }); return; }
      // ノードの行は種類のキーワードで始まる。ラベルに -> が入っていても矢印の行とみなさない。全角の ＠ も受け付ける
      m = s.match(/^(\S+)\s+([A-Za-z0-9_]+)(?:\s+[@＠](\[[^\]]+\]|[^\s{｛]+))?(?:\s*[{｛]([^}｝]*)[}｝])?(?:\s+(.*))?$/);
      const isNode = m && (TYPE_WORDS[m[1].toLowerCase()] || TYPE_WORDS[m[1]]);
      if (!isNode && (s.includes("->") || s.includes("..>"))) { parseEdge(s, ln); return; }
      if (m) {
        const type = TYPE_WORDS[m[1].toLowerCase()] || TYPE_WORDS[m[1]];
        if (type) {
          const id = m[2];
          if (byId.has(id)) { err(ln, `ID「${id}」が2回定義されています（最初は ${byId.get(id).line} 行目）`); return; }
          const lane = m[3] ? m[3].replace(/^\[|\]$/g, "").trim() : "";
          let label = (m[5] || "").trim();
          // 区分は @レーン の後ろに書く。ラベルの末尾に書かれた {区分} も受け付ける
          let tag = m[4];
          const tm = tag == null && label.match(TAG_RE);
          if (tm && roleOf(tm[1])) { tag = tm[1]; label = label.slice(0, tm.index).trim(); }
          // 参照と区分はどちらを先に書いてもよい
          let refs = [];
          for (let k = 0; k < 4; k++) {
            let changed = false;
            const rm = label.match(REF_RE);
            if (rm) { refs = rm[1].match(REF_ID).concat(refs); label = label.slice(0, rm.index).trim(); changed = true; }
            const tm2 = tag == null && label.match(TAG_RE);
            if (tm2 && roleOf(tm2[1])) { tag = tm2[1]; label = label.slice(0, tm2.index).trim(); changed = true; }
            if (!changed) break;
          }
          label = label.replace(/\\n/g, "\n") || id;
          const role = tag == null ? null : roleOf(tag);
          if (tag != null && !role) g.warnings.push({ line: ln, message: `区分「${tag}」は使えません（AI・ルール・人・外部のどれか）。無視します` });
          const node = { id, type, label, lane, role, refs: [...new Set(refs)], line: ln, notes: [] };
          byId.set(id, node);
          g.nodes.push(node);
          return;
        }
      }
      err(ln, `解釈できない行です：「${s.length > 30 ? s.slice(0, 30) + "…" : s}」`);
    });

    function addLane(raw, ln) {
      let name = raw, role = null;
      const tm = raw.match(TAG_RE);
      if (tm) {
        name = raw.slice(0, tm.index).trim();
        role = roleOf(tm[1]);
        if (!role) g.warnings.push({ line: ln, message: `区分「${tm[1]}」は使えません（AI・ルール・人・外部のどれか）。無視します` });
      }
      if (laneSet.has(name)) { err(ln, `レーン「${name}」が2回定義されています`); return; }
      laneSet.add(name);
      g.lanes.push(name);
      g.laneRoles.push(role);
    }
    function parseEdge(s, ln) {
      let label = "";
      let body = s;
      const lm = s.match(/^(.*?(?:->|\.\.>)\s*[A-Za-z0-9_]+)\s*[:：]\s*(.+)$/);
      if (lm) { body = lm[1]; label = lm[2].trim(); }
      const parts = body.split(/(->|\.\.>)/).map((x) => x.trim());
      if (parts.length < 3 || parts.length % 2 === 0) { err(ln, "矢印の書き方が正しくありません（例：A -> B : はい）"); return; }
      for (let k = 0; k + 2 < parts.length; k += 2) {
        const from = parts[k], to = parts[k + 2];
        if (!/^[A-Za-z0-9_]+$/.test(from) || !/^[A-Za-z0-9_]+$/.test(to)) { err(ln, `矢印の両端は ID で書きます：「${from} ${parts[k + 1]} ${to}」`); return; }
        pendingEdges.push({ from, to, label: k === 0 ? label : "", dashed: parts[k + 1] === "..>", line: ln });
      }
    }

    // ノードの定義が後ろにあっても良いように、矢印と注記は最後に確かめる
    for (const e of pendingEdges) {
      let ok = true;
      for (const id of [e.from, e.to]) if (!byId.has(id)) { err(e.line, `ID「${id}」が定義されていません`); ok = false; }
      if (ok) g.edges.push(e);
    }
    let noteNo = 0;
    for (const n of pendingNotes) {
      const node = byId.get(n.id);
      if (!node) { err(n.line, `注記の対象「${n.id}」が定義されていません`); continue; }
      node.notes.push({ no: ++noteNo, text: n.text });
    }

    // レーンの整合
    if (declaredLanes) {
      for (const n of g.nodes) {
        if (!n.lane) err(n.line, `「${n.id}」にレーンがありません（@レーン名 を付けてください）`);
        else if (!laneSet.has(n.lane)) err(n.line, `レーン「${n.lane}」は定義されていません（定義済み：${g.lanes.join("、")}）`);
      }
    } else {
      // レーン宣言なしで @ を使った場合は出てきた順にレーンを作る
      for (const n of g.nodes) if (n.lane && !laneSet.has(n.lane)) addLane(n.lane, n.line);
      if (g.lanes.length) for (const n of g.nodes) if (!n.lane) err(n.line, `「${n.id}」にレーンがありません（他のノードはレーン付きです）`);
    }
    // レーンの区分は、区分を書いていないノードに引き継ぐ
    for (const n of g.nodes) if (!n.role && n.lane) { const k = g.lanes.indexOf(n.lane); if (k >= 0 && g.laneRoles[k]) n.role = g.laneRoles[k]; }
    if (!g.nodes.length && !g.errors.length) err(1, "ノードがありません");
    g.errors.sort((a, b) => a.line - b.line);

    // 警告：つながっていないノード、出口のない分岐
    const deg = new Map(g.nodes.map((n) => [n.id, { in: 0, out: 0 }]));
    for (const e of g.edges) { deg.get(e.from).out++; deg.get(e.to).in++; }
    for (const n of g.nodes) {
      const d = deg.get(n.id);
      if (g.nodes.length > 1 && d.in === 0 && d.out === 0) g.warnings.push({ line: n.line, message: `「${n.id}」はどこともつながっていません` });
      if (n.type === "decision" && d.out < 2) g.warnings.push({ line: n.line, message: `分岐「${n.id}」の出口が ${d.out} 本です` });
      if (n.type === "end" && d.out > 0) g.warnings.push({ line: n.line, message: `終了「${n.id}」から矢印が出ています` });
    }
    return g;
  }

  // ---------- 配置 ----------
  const DEF = {
    nodeW: 150, decisionW: 172, fontSize: 13, lineH: 17, labelSize: 11,
    gapMin: 40, track: 12, slotGap: 30, laneHeaderW: 96, margin: 16, titleH: 34, minNodeH: 42,
  };

  // 「あり／なし」はどちらが良いかが文脈で変わるので、肯定・否定には数えない
  const POS_RE = /^(?:(?:はい|yes|ok|可|承認|合格|適合|正常|成功|一致|十分|足りる)(?![a-z])|y$)/;
  const NEG_RE = /^(?:(?:いいえ|no|ng|否|不可|却下|不合格|不適合|異常|エラー|失敗|不一致|不足|差し?戻し|やり直し)(?![a-z])|n$)/;

  function nodeSize(n, o) {
    if (n.type === "decision") {
      const w = o.decisionW;
      const lines = wrap(n.label, w * 0.64, o.fontSize);
      const h = Math.max(70, lines.length * o.lineH * 2.3 + 14);
      return { w, h, lines };
    }
    const pad = n.type === "data" ? 34 : n.type === "sub" ? 30 : 18;
    const lines = wrap(n.label, o.nodeW - pad, o.fontSize);
    let h = Math.max(o.minNodeH, lines.length * o.lineH + 18);
    if (n.type === "doc") h += 8;
    return { w: o.nodeW, h, lines };
  }

  function layout(g, opt) {
    const o = Object.assign({}, DEF, opt || {});
    const nodes = g.nodes.map((n) => Object.assign({}, n, nodeSize(n, o)));
    const idx = new Map(nodes.map((n, i) => [n.id, i]));
    const N = nodes.length;
    const hasLanes = g.lanes.length > 0;
    const lanes = hasLanes ? g.lanes.slice() : [""];
    const laneOf = nodes.map((n) => (hasLanes ? lanes.indexOf(n.lane) : 0));
    const edges = g.edges.map((e, i) => ({ i, from: idx.get(e.from), to: idx.get(e.to), label: e.label, dashed: e.dashed, back: false }));

    // 1. 戻りの矢印を見つける（DFS で祖先へ向かう辺）
    const outs = Array.from({ length: N }, () => []);
    for (const e of edges) outs[e.from].push(e);
    const state = new Array(N).fill(0);
    const order = [...nodes.keys()].sort((a, b) => (nodes[a].type === "start" ? 0 : 1) - (nodes[b].type === "start" ? 0 : 1) || a - b);
    for (const root of order) {
      if (state[root]) continue;
      const stack = [[root, 0]];
      state[root] = 1;
      while (stack.length) {
        const top = stack[stack.length - 1];
        const [v, k] = top;
        if (k < outs[v].length) {
          top[1]++;
          const e = outs[v][k];
          if (state[e.to] === 1) e.back = true;
          else if (state[e.to] === 0) { state[e.to] = 1; stack.push([e.to, 0]); }
        } else { state[v] = 2; stack.pop(); }
      }
    }
    const fwd = edges.filter((e) => !e.back);

    // 2. 段：前向きの辺で最長経路
    const indeg = new Array(N).fill(0);
    for (const e of fwd) indeg[e.to]++;
    const rank = new Array(N).fill(0);
    const topo = [];
    const q = [...nodes.keys()].filter((v) => indeg[v] === 0);
    while (q.length) {
      const v = q.shift();
      topo.push(v);
      for (const e of fwd) if (e.from === v) { rank[e.to] = Math.max(rank[e.to], rank[v] + 1); if (--indeg[e.to] === 0) q.push(e.to); }
    }
    // 入口のないノード（開始以外の入力データなど）は使われる直前の段へ寄せる
    for (let k = topo.length - 1; k >= 0; k--) {
      const v = topo[k];
      if (nodes[v].type === "start") continue;
      if (fwd.some((e) => e.to === v)) continue;
      const succ = fwd.filter((e) => e.from === v).map((e) => rank[e.to]);
      if (succ.length) rank[v] = Math.max(0, Math.min(...succ) - 1);
    }
    const maxRank = N ? Math.max(...rank) : 0;

    // 3. 段をまたぐ辺に中継点を置く。items = 実ノード + 中継点
    const items = nodes.map((n, i) => ({ kind: "node", i, lane: laneOf[i], rank: rank[i], h: n.h, w: n.w }));
    const legs = []; // 前向きの辺を、隣り合う段どうしの区間に分けたもの
    for (const e of fwd) {
      let prev = e.from;
      e.chain = [e.from];
      for (let r = rank[e.from] + 1; r < rank[e.to]; r++) {
        const d = items.length;
        items.push({ kind: "dummy", lane: laneOf[e.from], rank: r, h: 0, w: 0, edge: e });
        e.chain.push(d);
        legs.push({ e, a: prev, b: d });
        prev = d;
      }
      e.chain.push(e.to);
      legs.push({ e, a: prev, b: e.to });
    }

    // 4. セル（レーン × 段）内の並び。重心法で交差を減らす
    const cells = new Map();
    const cellKey = (l, r) => l * 100000 + r;
    items.forEach((it, k) => {
      const key = cellKey(it.lane, it.rank);
      if (!cells.has(key)) cells.set(key, []);
      cells.get(key).push(k);
    });
    const pos = new Array(items.length).fill(0);
    const updatePos = () => { for (const arr of cells.values()) arr.forEach((k, j) => (pos[k] = items[k].lane * 1000 + j)); };
    updatePos();
    const predOf = Array.from({ length: items.length }, () => []);
    const succOf = Array.from({ length: items.length }, () => []);
    for (const l of legs) { predOf[l.b].push(l.a); succOf[l.a].push(l.b); }
    for (let it = 0; it < 6; it++) {
      const useP = it % 2 === 0;
      for (const arr of cells.values()) {
        const bc = new Map(arr.map((k, j) => {
          const nb = useP ? predOf[k] : succOf[k];
          return [k, nb.length ? nb.reduce((s, x) => s + pos[x], 0) / nb.length : pos[k] - items[k].lane * 1000 + items[k].lane * 1000 + j * 0.001];
        }));
        arr.sort((a, b) => bc.get(a) - bc.get(b));
      }
      updatePos();
    }

    // 5. レーン内の行。前の段と同じ行に置けるなら置く（線をまっすぐにする）
    const laneRows = lanes.map(() => 1);
    for (const [key, arr] of cells) { const l = Math.floor(key / 100000); laneRows[l] = Math.max(laneRows[l], arr.length); }
    const row = new Array(items.length).fill(0);
    for (let r = 0; r <= maxRank; r++) {
      for (let l = 0; l < lanes.length; l++) {
        const arr = cells.get(cellKey(l, r));
        if (!arr) continue;
        const n = arr.length;
        const R = laneRows[l];
        const want = arr.map((k, j) => {
          const ps = predOf[k].filter((p) => items[p].lane === l);
          return ps.length ? Math.round(ps.reduce((s, p) => s + row[p], 0) / ps.length) : j;
        });
        for (let j = 0; j < n; j++) want[j] = Math.max(want[j], j === 0 ? 0 : want[j - 1] + 1);
        for (let j = n - 1; j >= 0; j--) want[j] = Math.min(want[j], j === n - 1 ? R - 1 : want[j + 1] - 1);
        arr.forEach((k, j) => (row[k] = want[j]));
      }
    }

    // 6. 戻りの矢印の通り道（レーン下の余白）を割り当てる
    const back = edges.filter((e) => e.back);
    const chanCount = lanes.map(() => 0);
    for (const e of back) {
      e.chanLane = Math.max(laneOf[e.from], laneOf[e.to]);
      e.chan = chanCount[e.chanLane]++;
    }

    // 7. 縦方向：レーンと行の高さ
    const top0 = o.margin + (g.title ? o.titleH : 0);
    const rowH = lanes.map((_, l) => new Array(laneRows[l]).fill(20));
    items.forEach((it, k) => { rowH[it.lane][row[k]] = Math.max(rowH[it.lane][row[k]], it.h); });
    const laneY = [], laneH = [], rowTop = lanes.map(() => []);
    let y = top0;
    for (let l = 0; l < lanes.length; l++) {
      laneY[l] = y;
      let yy = y + o.slotGap * 0.75;
      for (let r = 0; r < laneRows[l]; r++) { rowTop[l][r] = yy; yy += rowH[l][r] + o.slotGap; }
      yy = yy - o.slotGap + o.slotGap * 0.75 + (chanCount[l] ? (chanCount[l] + 1.6) * o.track : 0);
      laneH[l] = yy - y;
      y = yy;
    }
    const totalBottom = y;
    items.forEach((it, k) => {
      it.cy = rowTop[it.lane][row[k]] + rowH[it.lane][row[k]] / 2;
      it.rowBottom = rowTop[it.lane][row[k]] + rowH[it.lane][row[k]];
      it.rowTop = rowTop[it.lane][row[k]];
    });
    const lastRowBottom = (l) => rowTop[l][laneRows[l] - 1] + rowH[l][laneRows[l] - 1];
    // 分岐の下の頂点から出る線（行の下 slotGap/2 を横に走る）と重ならないよう、さらに離す
    for (const e of back) e.chanY = lastRowBottom(e.chanLane) + o.slotGap * 0.5 + (e.chan + 1.6) * o.track;

    // 8. ポート（矢印の出入り口）
    // 右から出る / 左から入る。分岐は右・下・上の頂点を使う
    const outPorts = new Map(); // edge.i -> {side, y}
    const inPorts = new Map();
    const firstTarget = (e) => (e.back ? { y: e.chanY } : { y: items[e.chain[1]].cy });
    nodes.forEach((n, v) => {
      const es = edges.filter((e) => e.from === v).map((e) => ({ e, ty: firstTarget(e).y }));
      es.sort((a, b) => a.ty - b.ty || a.e.i - b.e.i);
      const cy = items[v].cy;
      if (n.type === "decision" && es.length > 1) {
        // 一番近い高さへ行くものを右の頂点、それより上は上の頂点、下は下の頂点
        let best = 0;
        es.forEach((x, j) => { if (Math.abs(x.ty - cy) < Math.abs(es[best].ty - cy)) best = j; });
        es.forEach((x, j) => {
          if (j === best) outPorts.set(x.e.i, { side: "r", y: cy });
          else if (j < best && !es.slice(0, best).some((z, jj) => jj !== j && outPorts.get(z.e.i)?.side === "t")) outPorts.set(x.e.i, { side: "t", y: cy - n.h / 2 });
          else if (j > best && !es.slice(best + 1).some((z) => outPorts.get(z.e.i)?.side === "b")) outPorts.set(x.e.i, { side: "b", y: cy + n.h / 2 });
          else outPorts.set(x.e.i, { side: "r", y: cy });
        });
      } else {
        const sp = es.length > 1 ? Math.min(14, (n.h - 14) / (es.length - 1)) : 0;
        es.forEach((x, j) => outPorts.set(x.e.i, { side: "r", y: n.type === "decision" ? cy : cy + (j - (es.length - 1) / 2) * sp }));
      }
      const ins = edges.filter((e) => e.to === v).map((e) => ({ e, sy: e.back ? e.chanY : items[e.chain[e.chain.length - 2]].cy }));
      ins.sort((a, b) => a.sy - b.sy || a.e.i - b.e.i);
      const isp = ins.length > 1 && n.type !== "decision" ? Math.min(14, (n.h - 14) / (ins.length - 1)) : 0;
      ins.forEach((x, j) => inPorts.set(x.e.i, { y: cy + (j - (ins.length - 1) / 2) * isp }));
    });

    // 9. すき間ごとに縦線の通り道（トラック）を割り当てる
    // gap g は段 g と段 g+1 の間。g = -1 は最初の段の左
    const gapSegs = new Map(); // g -> [{y1,y2,ref}]
    // ya：左の列から縦線まで横に入ってくる高さ / yb：縦線から右の列へ横に出ていく高さ（なければ null）
    const addSeg = (gIdx, ya, yb, ref) => {
      if (ya != null && Math.abs(ya - yb) < 0.5) return;
      if (!gapSegs.has(gIdx)) gapSegs.set(gIdx, []);
      const y1 = ref.y1, y2 = ref.y2;
      gapSegs.get(gIdx).push({ lo: Math.min(y1, y2), hi: Math.max(y1, y2), ya, yb, ref });
    };
    const routes = new Map(); // edge.i -> plan
    for (const e of edges) {
      const op = outPorts.get(e.i);
      const ip = inPorts.get(e.i);
      if (e.back) {
        const sy = op.side === "r" ? op.y : stubY(e.from, op.side);
        const r1 = { y1: sy, y2: e.chanY };
        const r2 = { y1: ip.y, y2: e.chanY };
        addSeg(rank[e.from], r1.y1, null, r1);
        addSeg(rank[e.to] - 1, null, r2.y1, r2);
        routes.set(e.i, { op, ip, r1, r2 });
        continue;
      }
      const segs = [];
      for (let k = 0; k + 1 < e.chain.length; k++) {
        const a = e.chain[k], b = e.chain[k + 1];
        const ya = k === 0 ? (op.side === "r" ? op.y : stubY(a, op.side)) : items[a].cy;
        const yb = k + 2 === e.chain.length ? ip.y : items[b].cy;
        const s = { y1: ya, y2: yb, gap: items[a].rank };
        addSeg(items[a].rank, ya, yb, s);
        segs.push(s);
      }
      routes.set(e.i, { op, ip, segs });
    }
    function stubY(v, side) {
      return side === "b" ? items[v].rowBottom + o.slotGap / 2 : items[v].rowTop - o.slotGap / 2;
    }
    // 縦線の位置（トラック）を決める。
    // 規則1：縦の区間が重なる線は別のトラックにする
    // 規則2：線 A が左から入ってくる高さと、線 B が右へ出ていく高さが同じなら、A を B より左に置く
    //        （逆だと2本の横線が同じ高さで重なり、どこへ向かう線か読めなくなる）
    const gapTracks = new Map();
    const near = (a, b) => a != null && b != null && Math.abs(a - b) < 3;
    for (const [gIdx, segs] of gapSegs) {
      segs.sort((a, b) => a.lo - b.lo || a.hi - b.hi);
      const before = segs.map((s) => segs.filter((o) => o !== s && near(o.ya, s.yb) && !near(s.ya, o.yb)));
      const done = new Set();
      const order = [];
      const visit = (s, depth) => {
        if (done.has(s) || depth > segs.length) return;
        done.add(s);
        for (const o of before[segs.indexOf(s)]) visit(o, depth + 1);
        order.push(s);
      };
      segs.forEach((s) => visit(s, 0));
      const tracks = [];
      for (const s of order) {
        let t = Math.max(0, ...before[segs.indexOf(s)].map((o) => (o.ref.track ?? -1) + 1));
        while (tracks[t] && tracks[t].some((o) => o.lo < s.hi + 24 && s.lo < o.hi + 24)) t++;
        (tracks[t] = tracks[t] || []).push(s);
        s.ref.track = t;
      }
      gapTracks.set(gIdx, tracks.length);
    }
    // ラベルの幅だけ、すき間の入口を空ける
    const labelRoom = new Map();
    for (const e of edges) {
      if (!e.label) continue;
      const op = outPorts.get(e.i);
      if (op.side !== "r") continue;
      const gIdx = rank[e.from];
      labelRoom.set(gIdx, Math.max(labelRoom.get(gIdx) || 0, textW(e.label, o.labelSize) + 10));
    }
    const gapW = (gIdx) => Math.max(o.gapMin, (labelRoom.get(gIdx) || 4) + ((gapTracks.get(gIdx) || 0) + 1) * o.track);
    const colW = Math.max(o.nodeW, nodes.some((n) => n.type === "decision") ? o.decisionW : 0);
    const left0 = o.margin + (hasLanes ? o.laneHeaderW : 0);
    const colX = [];
    let x = left0 + (gapTracks.get(-1) ? gapW(-1) : o.track * 2);
    for (let r = 0; r <= maxRank; r++) { colX[r] = x; x += colW + gapW(r); }
    const rightEdge = x - gapW(maxRank) + (gapTracks.get(maxRank) ? gapW(maxRank) : o.track * 2);
    const trackX = (gIdx, t) => {
      const start = gIdx < 0 ? left0 : colX[gIdx] + colW;
      return start + (labelRoom.get(gIdx) || 4) + (t + 1) * o.track;
    };
    items.forEach((it) => {
      it.cx = colX[it.rank] + colW / 2;
    });

    // 10. 線の座標
    const outEdges = [];
    for (const e of edges) {
      const n = nodes[e.from];
      const it = items[e.from];
      const pl = routes.get(e.i);
      const pts = [];
      let labelPos = null;
      // 出口
      if (pl.op.side === "r") {
        pts.push([it.cx + n.w / 2, pl.op.y]);
        if (e.label) labelPos = { x: it.cx + n.w / 2 + 5, y: pl.op.y - 4, anchor: "start" };
      } else {
        const vy = pl.op.side === "b" ? it.cy + n.h / 2 : it.cy - n.h / 2;
        const sy = stubY(e.from, pl.op.side);
        pts.push([it.cx, vy], [it.cx, sy]);
        if (e.label) labelPos = pl.op.side === "b" ? { x: it.cx + 5, y: vy + 11, anchor: "start" } : { x: it.cx - 5, y: vy - 4, anchor: "end" };
      }
      const tIt = items[e.to];
      const tN = nodes[e.to];
      const inX = tIt.cx - tN.w / 2;
      if (e.back) {
        const x1 = trackX(rank[e.from], pl.r1.track);
        const x2 = trackX(rank[e.to] - 1, pl.r2.track);
        const lastY = pts[pts.length - 1][1];
        pts.push([x1, lastY], [x1, e.chanY], [x2, e.chanY], [x2, pl.ip.y], [inX, pl.ip.y]);
      } else {
        pl.segs.forEach((s, k) => {
          const b = e.chain[k + 1];
          const tx = trackX(s.gap, s.track || 0);
          const lastY = pts[pts.length - 1][1];
          const isLast = k + 2 === e.chain.length;
          const bx = isLast ? inX : items[b].cx - colW / 2;
          if (Math.abs(lastY - s.y2) < 0.5) {
            pts.push([bx, lastY]);
          } else {
            pts.push([tx, lastY], [tx, s.y2], [bx, s.y2]);
          }
          if (!isLast) pts.push([items[b].cx + colW / 2, s.y2]);
        });
      }
      outEdges.push({ from: n.id, to: tN.id, points: simplify(pts), label: e.label, labelPos, dashed: e.dashed, back: e.back, tone: toneOf(e) });
    }

    // 分岐から出る線の色の種類。肯定・否定の言葉なら pos / neg、それ以外は出口の順番（0, 1, 2…）
    function toneOf(e) {
      if (nodes[e.from].type !== "decision") return null;
      const sibs = edges.filter((x) => x.from === e.from);
      if (sibs.length < 2) return null;
      const lb = String(e.label || "").trim().toLowerCase();
      if (NEG_RE.test(lb)) return "neg";
      if (POS_RE.test(lb)) return "pos";
      return sibs.filter((x) => { const l = String(x.label || "").trim().toLowerCase(); return !NEG_RE.test(l) && !POS_RE.test(l); }).indexOf(e);
    }

    const notes = [];
    nodes.forEach((n) => n.notes.forEach((nt) => notes.push({ no: nt.no, id: n.id, label: n.label.replace(/\n/g, ""), text: nt.text })));
    notes.sort((a, b) => a.no - b.no);
    const noteLines = notes.map((nt) => wrap(`※${nt.no} ${nt.label}：${nt.text}`, Math.max(300, rightEdge - o.margin * 2), 12));
    // 区分の凡例（使った区分だけ、決まった順に）
    const used = new Set(nodes.map((n) => n.role).filter(Boolean));
    const roleLegend = ROLE_ORDER.filter((k) => used.has(k)).map((k) => ({ key: k, name: ROLES[k].name }));
    const roleH = roleLegend.length ? 24 : 0;
    const legendH = roleH + (notes.length ? 12 + noteLines.reduce((s, ls) => s + ls.length * 17, 0) : 0);
    const width = Math.ceil(Math.max(rightEdge + o.margin, 320));
    const height = Math.ceil(totalBottom + legendH + o.margin);

    return {
      width, height, title: g.title, titleY: o.margin + 20, fontSize: o.fontSize, lineH: o.lineH, labelSize: o.labelSize,
      laneHeaderW: hasLanes ? o.laneHeaderW : 0, left: o.margin, right: width - o.margin,
      lanes: hasLanes ? lanes.map((name, l) => ({ name, y: laneY[l], h: laneH[l], lines: wrap(name, o.laneHeaderW - 14, 13) })) : [],
      nodes: nodes.map((n, v) => ({ id: n.id, type: n.type, lane: laneOf[v], role: n.role || null, refs: n.refs || [], lines: n.lines, x: items[v].cx - n.w / 2, y: items[v].cy - n.h / 2, w: n.w, h: n.h, cx: items[v].cx, cy: items[v].cy, notes: n.notes.map((x) => x.no) })),
      edges: outEdges,
      notes: notes.map((nt, k) => ({ text: noteLines[k], })),
      roles: roleLegend, roleY: totalBottom + 14,
      legendY: totalBottom + 14 + roleH,
    };
  }

  // 一直線に並ぶ中間点と重複点を除く
  function simplify(pts) {
    const out = [];
    for (const p of pts) {
      const last = out[out.length - 1];
      if (last && Math.abs(last[0] - p[0]) < 0.01 && Math.abs(last[1] - p[1]) < 0.01) continue;
      out.push([Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]);
    }
    for (let k = out.length - 2; k >= 1; k--) {
      const [a, b, c] = [out[k - 1], out[k], out[k + 1]];
      if ((a[0] === b[0] && b[0] === c[0]) || (a[1] === b[1] && b[1] === c[1])) out.splice(k, 1);
    }
    return out;
  }

  // ---------- 図の部品（色は持たない。描くのは src/ui/flowsvg.js、色は styles.css の変数） ----------
  const LANE_BAR = 4;                 // レーン見出しの左端の帯の幅
  // 箱の枠の太さ（pt。SVG は 1.2 倍）。判断と終了は少し太くして目を止める
  const nodeLineW = (n) => (n.type === "decision" ? 1.5 : n.type === "end" ? 1.6 : 1.25);
  // 区分のある箱の左上に出す名前（色だけに頼らない）
  const roleLabel = (n) => (n.role && ROLES[n.role] ? (n.type === "decision" ? ROLES[n.role].decision : ROLES[n.role].name) : "");
  // 区分名の位置（文字の下端）。処理の箱は左上。分岐は上の頂点から出る線のラベルが左上に付くので左下に置く
  const roleLabelPos = (n) => (n.type === "decision" ? { x: n.x - 8, y: n.y + n.h + 11, below: true } : { x: n.x, y: n.y - 3, below: false });
  // overlay（判断・データのタブ）：{ marks: {ID: "ok"|"open"|"none"}, visited: [ID], taken: ["A>B"], current: ID, titles: {ID: 文字} }
  const MARK = { ok: { sym: "✓", word: "確定" }, open: { sym: "?", word: "未確定" }, none: { sym: "!", word: "マスタなし" } };
  // toSVG・render・palette は写さない（文字列の SVG を使わず、src/ui/flowsvg.js で DOM として組む。色は CSS の変数）

  return { parse, layout, wrap, textW, TYPE_NAMES, LANE_BAR, nodeLineW, ROLES, ROLE_ORDER, roleOf, roleLabel, roleLabelPos, MARK };
})();


// ---- core/flowsafe.js ----
// 誤りのある業務フローの記法でも描けるようにする。誤りのある行を外して読み直し、残りで配置する
// 行を消すと行番号がずれるので、空行に置き換える（誤りの行番号は元の記法のまま返す）


const FLOW_RETRY = 5;   // 行を外すと別の行が誤りになる（消えた箱への矢印など）ので、何回か繰り返す

function parseFlowTolerant(src) {
  const first = FLOWCHART.parse(String(src || ''));
  let lines = String(src || '').split(/\r?\n/);
  let g = first;
  const dropped = new Set();
  for (let k = 0; k < FLOW_RETRY && g.errors.length; k++) {
    for (const e of g.errors) if (e.line >= 1 && e.line <= lines.length) dropped.add(e.line);
    lines = lines.map((l, i) => (dropped.has(i + 1) ? '' : l));
    g = FLOWCHART.parse(lines.join('\n'));
  }
  // 繰り返しても誤りが残るときは、描かない（箱の無い図を出さない）
  const drawable = !g.errors.length && g.nodes.length > 0;
  return { graph: drawable ? g : null, errors: first.errors, warnings: g.warnings || [], dropped: [...dropped].sort((a, b) => a - b) };
}

function flowGeometry(src, opt) {
  const r = parseFlowTolerant(src);
  return { ...r, geo: r.graph ? FLOWCHART.layout(r.graph, opt) : null };
}

  const xs = ledger.items.filter((it) => (it.kind === 'requirement' && it.status !== 'dropped') || (it.kind === 'constraint') || (it.kind === 'request' && it.status !== 'rejected'));
  return xs.length ? xs.map((it) => `- ${it.id} ${jpLine(it.title)}（${statusLabel(it.kind, it.status)}${it.confidence === 'guess' ? '・推測' : ''}）`).join('\n') : '（まだありません）';

function judgeOpenQuestions(ledger) {
  const name = (id) => { const p = ledger.items.find((x) => x.id === id); return p ? p.title : id; };
