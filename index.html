// ---- core/karte.js ----
// gemini-kit の案件カルテ（anken.v2）への書き出し。台帳は読むだけで変えない。
// 形は ~/projects/bunsekiya-manage/gemini-kit/src/js/schema.js（normalize・validate）に合わせる。
// カルテの ID は台帳の ID から決める（書き出すたびに同じ ID になり、gemini-kit の版の引き継ぎがずれない）。
// 項目は消さずに状態で表す（gemini-kit の「ID は消さずに状態を変える」決まり）。引用（quote）は台帳に原文が無いので常に空。


const KARTE_SCHEMA = 'anken.v2';
// gemini-kit の VIEWPOINTS のうち、この書き出しで使うもの
const KARTE_VIEWPOINTS = ['機能', '性能・可用性', 'セキュリティ', '移行', '運用・保守', '予算・契約', '日程', '現行システム'];
const FACT_BANDS = { requirement: 10000, request: 20000, constraint: 30000, answer: 40000 };
const BAND_SIZE = 10000;
const KARTE_KINDS = new Set(['requirement', 'request', 'constraint', 'question', 'decision', 'issue', 'task', 'stakeholder', 'risk']);
// リスクの見込み・影響（1〜5）→ gemini-kit の高・中・低
const RISK_HML = (v) => (Number(v) >= 4 ? '高' : Number(v) === 3 ? '中' : Number(v) >= 1 ? '低' : '');
const RISK_MARK = { occurred: '（発生）', closed: '（解消）' };

const NFR_VIEWPOINT = { availability: '性能・可用性', performance: '性能・可用性', security: 'セキュリティ', migration: '移行', operability: '運用・保守', environment: '運用・保守' };
const CONSTRAINT_VIEWPOINT = { budget: '予算・契約', legal: '予算・契約', schedule: '日程', technical: '現行システム', operation: '運用・保守' };

const pad2 = (n) => String(n).padStart(2, '0');
const cut = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

function factViewpoint(it) {
  if (it.kind === 'request') return '機能';
  if (it.kind === 'requirement') return it.category === 'functional' ? '機能' : (NFR_VIEWPOINT[it.nfrCategory] || '');
  if (it.kind === 'constraint') return CONSTRAINT_VIEWPOINT[it.category] || '';
  return '';
}

function factStatus(it) {
  if (it.confidence === 'guess') return '推測';
  if (it.confidence === 'fact' || it.confidence === 'confirmed') return '確定';
  return it.kind === 'requirement' && it.status === 'agreed' ? '確定' : '推測';
}

// 状態の印（消さずに状態で表す）
const FACT_MARK = { requirement: { dropped: '（取り下げ）' }, request: { rejected: '（不採用）', deferred: '（保留）' }, constraint: { resolved: '（解消）' } };
const OUT_STATUS = { requirement: 'dropped', request: 'rejected' };
const TODO_STATUS = { todo: '未着手', doing: '対応中', done: '完了', cancelled: 'クローズ' };
const PENDING_STATUS = { open: '未着手', in_progress: '対応中', closed: '完了' };

// 戻り値: { karte, counts, notes }
function ledgerToKarte(ledger, { includeInternal = false, now, today } = {}) {
  const src = includeInternal ? ledger : visibleLedger(ledger, true);
  const items = src.items;
  const byId = new Map(ledger.items.map((it) => [it.id, it]));
  const nameOf = (id) => { const p = id && byId.get(id); return p && p.kind === 'stakeholder' ? p.title : ''; };
  const names = (ids) => (ids || []).map(nameOf).filter(Boolean).join('、');
  const firstSource = (it) => (it.sources || []).find((s) => s && s.type !== 'template') || null;
  const tooBig = [];
  const num = (it) => { const n = idNumber(it.id); if (n >= BAND_SIZE) { tooBig.push(it.id); return null; } return n; };

  // 書き出す項目
  const factItems = items.filter((it) => it.kind === 'requirement' || it.kind === 'request' || it.kind === 'constraint');
  const questions = items.filter((it) => it.kind === 'question');
  const decisionItems = items.filter((it) => it.kind === 'decision');
  const issueItems = items.filter((it) => it.kind === 'issue');
  const taskItems = items.filter((it) => it.kind === 'task');
  const riskItems = items.filter((it) => it.kind === 'risk');
  const exported = [...factItems, ...questions, ...decisionItems, ...issueItems, ...taskItems, ...riskItems];

  // 出典: 書き出す項目の最初の出典（案件の型を除く）を (type, ref, date) でまとめ、日付・名前の順に S を振る
  const srcKey = (s) => [s.type, s.ref, s.date || ''].join('\u0000');
  const srcMap = new Map();
  for (const it of exported) {
    const s = firstSource(it);
    if (s && !srcMap.has(srcKey(s))) srcMap.set(srcKey(s), s);
  }
  const srcList = [...srcMap.values()].sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.ref.localeCompare(b.ref));
  const srcId = new Map(srcList.map((s, i) => [srcKey(s), 'S-' + pad2(i + 1)]));
  const sources = srcList.map((s, i) => ({ id: 'S-' + pad2(i + 1), name: s.ref, kind: s.type === 'meeting' ? '議事録' : 'その他', date: s.date || '', round: '', summary: '' }));
  const sourceOf = (it) => { const s = firstSource(it); return s ? srcId.get(srcKey(s)) : ''; };
  const speakerOf = (it) => { const s = firstSource(it); return s ? nameOf(s.speaker) : ''; };

  const idMap = {};
  const facts = [];
  for (const it of factItems) {
    const n = num(it);
    if (n === null) continue;
    const id = 'F-' + (FACT_BANDS[it.kind] + n);
    const mark = (FACT_MARK[it.kind] || {})[it.status] || '';
    const out = it.scope === 'out' || OUT_STATUS[it.kind] === it.status;
    const text = cut(it.body ? `${it.title}。${it.body}` : it.title, 200) + mark;
    const f = { id, viewpoint: factViewpoint(it), text, status: factStatus(it), source: sourceOf(it), at: '', speaker: speakerOf(it), quote: '', wbId: it.id };
    if (out) f.scope = '対象外';
    facts.push(f);
    idMap[id] = it.id;
  }

  const unknowns = [];
  let answerFacts = 0;
  for (const q of questions) {
    const n = num(q);
    if (n === null) continue;
    const qid = 'Q-' + pad2(n);
    const viewpoint = NFR_VIEWPOINT[q.nfrCategory] || '';
    const done = q.status === 'answered' || q.status === 'closed';
    let answeredBy = '';
    if (done && q.answer && String(q.answer).trim()) {
      const fid = 'F-' + (FACT_BANDS.answer + n);
      facts.push({ id: fid, viewpoint, text: cut(String(q.answer).trim(), 200), status: '確定', source: '', at: qid, speaker: nameOf(q.askTo), quote: '', answers: qid, wbId: q.id + '#answer' });
      idMap[fid] = q.id + '#answer';
      answeredBy = fid;
      answerFacts++;
    }
    const overdue = !done && q.due && today && q.due < today;
    unknowns.push({
      id: qid, viewpoint, question: q.title, why: q.body || '', priority: overdue ? '高' : '中', askTo: nameOf(q.askTo), raisedIn: sourceOf(q),
      status: done ? '回答済' : (q.askedAt ? '依頼中' : '未回答'), answeredBy, estimateImpact: '', assumption: '',
      askedOn: q.askedAt || '', answeredOn: '', wbId: q.id,
    });
    idMap[qid] = q.id;
  }

  const decisions = [];
  for (const d of decisionItems) {
    const n = num(d);
    if (n === null) continue;
    const id = 'D-' + pad2(n);
    const text = (d.status === 'superseded' ? '（置き換え済み）' : '') + d.title + (d.reason ? `。理由: ${d.reason}` : '');
    decisions.push({ id, text, owner: names(d.decidedBy), source: sourceOf(d), quote: '', wbId: d.id });
    idMap[id] = d.id;
  }

  const pending = [];
  for (const it of issueItems) {
    const n = num(it);
    if (n === null) continue;
    const id = 'H-' + pad2(n);
    pending.push({ id, text: it.title, owner: nameOf(it.owner), due: it.due || '', status: PENDING_STATUS[it.status] || '', source: sourceOf(it), quote: '', wbId: it.id });
    idMap[id] = it.id;
  }

  const todos = [];
  for (const t of taskItems) {
    const n = num(t);
    if (n === null) continue;
    const id = 'T-' + pad2(n);
    todos.push({ id, text: t.title, owner: nameOf(t.assignee), due: t.end || '', status: TODO_STATUS[t.status] || '', source: sourceOf(t), quote: '', wbId: t.id });
    idMap[id] = t.id;
  }

  // リスク: 全状態を書き出し、発生・解消は文の後ろに印（消さずに状態で表す）
  const risks = [];
  for (const r of riskItems) {
    const n = num(r);
    if (n === null) continue;
    const id = 'R-' + pad2(n);
    risks.push({ id, text: r.title + (r.response ? `。対策: ${r.response}` : '') + (RISK_MARK[r.status] || ''), prob: RISK_HML(r.prob), impact: RISK_HML(r.impact), effect: '', wbId: r.id });
    idMap[id] = r.id;
  }

  const people = items.filter((it) => it.kind === 'stakeholder').map((p) => ({ name: p.title, org: p.org || '', role: p.side === 'own' ? '自社' : '', note: p.role || '' }));

  const karte = {
    schema: KARTE_SCHEMA,
    project: { name: ledger.project.name, client: ledger.project.customer || '', phase: '', updated: today || '', version: 0 },
    sources, facts, unknowns, decisions, pending, todos,
    conflicts: [], issues: [], proposals: [], people, asis: [], risks, reviews: [],
    workbench: { from: '案件ワークベンチ', project: ledger.project.name, revision: ledger.revision, exportedAt: now || '', includeInternal: !!includeInternal, idMap },
  };

  // 書き出しの対象になる種別のうち、社内のみの項目の数（含める・含めないに関係なく元の台帳で数える）
  const internalCount = ledger.items.filter((it) => it.internal && KARTE_KINDS.has(it.kind)).length;
  const counts = {
    facts: facts.length, answerFacts, unknowns: unknowns.length, openUnknowns: unknowns.filter((u) => u.status !== '回答済').length,
    decisions: decisions.length, pending: pending.length, todos: todos.length, people: people.length, sources: sources.length, internal: internalCount,
  };
  const notes = [];
  const noQuote = facts.length + decisions.length;
  if (noQuote) notes.push(`事実と決定の ${noQuote} 件は、台帳に資料の原文が無いため、gemini-kit で「引用がありません」と表示されます`);
  if (includeInternal && internalCount) notes.push(`社内のみの項目 ${internalCount} 件を含めます。顧客に見せる文書に載らないよう注意してください`);
  if (!includeInternal && internalCount) {
    notes.push(`社内のみの項目 ${internalCount} 件は書き出しません`);
    notes.push('前に社内のみを含めて書き出した版があると、gemini-kit で「消えています」と表示されることがあります');
  }
  if (tooBig.length) notes.push(`番号が ${BAND_SIZE} 以上の項目 ${tooBig.length} 件は書き出せません（${tooBig.slice(0, 5).join('、')}${tooBig.length > 5 ? ' ほか' : ''}）`);
  if ((ledger.changelog || []).some((e) => (e.changes || []).some((c) => c.op === 'reset'))) notes.push('この案件は中身を空に戻したことがあります。gemini-kit では別の案件名として読み込んでください');
  return { karte, counts, notes };
}


// ---- core/dashboard.js ----
// 概要画面のダッシュボードの集計。DOM に触れない。描画は ui/views/overview.js（dash.js）。
// 分類・系列の名前は schema.js・ball.js の表から引く。ここだけが持つ文言は下の DASH_TEXT に置く。


// 期限を持つ種別（課題・質問・作業・リスク）。DUE_FIELD から作る（種別を足しても決め打ちの直し漏れで落ちないように）
const DUE_KINDS = Object.keys(DUE_FIELD);

const DASH_TEXT = {
  noConfidence: '未設定',
  nfrNone: '非機能（大項目なし）',
  notAsked: 'まだ聞いていない',
  unknownDays: '日数不明',
  dueBuckets: ['期限切れ', '今週', '来週', 'それ以降'],
};

const fieldValueLabel = (kind, field, v) => { const f = KINDS[kind].fields[field]; const e = f && f.values ? f.values.find((x) => x.v === v) : null; return e ? e.label : v; };
const ratio = (a, b) => (b ? a / b : null);

// today: YYYY-MM-DD。presentation: 説明用の表示（社内のみの項目を数えない）
function dashboardData(ledger, { today, presentation = false } = {}) {
  const l = visibleLedger(ledger, presentation);
  const items = l.items;
  const t = dayNumber(today);
  const of = (kind) => items.filter((it) => it.kind === kind);

  // ---- KPI ----
  const customer = items.filter((it) => ballOf(it, l) === 'customer');
  const days = customer.map((it) => waitDays(it, l, today)).filter((d) => d !== null);
  const dues = dueTargets(l);
  const overdueList = dues.filter((d) => dayNumber(d.due) < t);
  const reqs = of('requirement').filter((r) => r.status !== 'dropped');
  const agreed = reqs.filter((r) => r.status === 'agreed').length;
  const bl = presentation ? null : latestBaseline(l);
  const blReqs = bl ? bl.items.filter((x) => x.kind === 'requirement' && x.status !== 'dropped') : [];
  const e = computeEvm(l, today);
  const hasTasks = items.some((it) => it.kind === 'task');
  const hasTargets = e.targets > 0;
  const kpi = {
    customerWait: { count: customer.length, maxDays: days.length ? Math.max(...days) : null },
    overdue: { count: overdueList.length, byKind: Object.fromEntries(DUE_KINDS.map((k) => [k, 0])) },
    agreement: { rate: ratio(agreed, reqs.length), agreed, total: reqs.length, baselineRate: bl && blReqs.length ? ratio(blReqs.filter((x) => x.status === 'agreed').length, blReqs.length) : null },
    spi: { value: hasTargets ? e.spi : null, hasTasks, hasTargets, pv: e.pv },
  };
  for (const d of overdueList) kpi.overdue.byKind[d.item.kind]++;

  // ---- 要件の状態（分類ごと・合意 / 案 / 取り下げ） ----
  const reqCats = [];
  const addCat = (label, list) => { if (list.length) reqCats.push({ label, list }); };
  const allReqs = of('requirement');
  addCat(fieldValueLabel('requirement', 'category', 'functional'), allReqs.filter((r) => r.category === 'functional'));
  for (const c of NFR_CATEGORIES) addCat(c.label, allReqs.filter((r) => r.category === 'nonfunctional' && r.nfrCategory === c.v));
  addCat(DASH_TEXT.nfrNone, allReqs.filter((r) => r.category === 'nonfunctional' && !NFR_CATEGORIES.some((c) => c.v === r.nfrCategory)));
  const cnt = (list, st) => list.filter((r) => r.status === st).length;
  reqCats.sort((a, b) => cnt(b.list, 'draft') - cnt(a.list, 'draft'));
  const requirements = {
    categories: reqCats.map((c) => c.label),
    series: ['agreed', 'draft', 'dropped'].map((st) => ({ name: statusLabel('requirement', st), values: reqCats.map((c) => cnt(c.list, st)) })),
  };

  // ---- ボールの状況（待ち先 × 待ち日数。区切りは設定の「顧客待ちを知らせる日数」） ----
  const n = settingOf(l, 'ballWaitDays');
  const open = items.filter((it) => (it.kind === 'issue' || it.kind === 'question') && isOpen(it));
  const bucketOf = (it) => {
    if (notAskedYet(it, l)) return 3;
    const d = waitDays(it, l, today);
    if (d === null) return 4;
    return d <= n ? 0 : d <= 2 * n ? 1 : 2;
  };
  const ballNames = [`${n} 日以内`, `${n} 日超`, `${2 * n} 日超`, DASH_TEXT.notAsked, DASH_TEXT.unknownDays];
  const ballVals = ballNames.map(() => BALL.map(() => 0));
  for (const it of open) {
    const b = ballOf(it, l);
    const i = BALL.findIndex((x) => x.v === b);
    if (i >= 0) ballVals[bucketOf(it)][i]++;
  }
  const ball = {
    categories: BALL.map((x) => x.label),
    series: ballNames.map((name, i) => ({ name, values: ballVals[i] })).filter((s, i) => i < 4 || s.values.some((v) => v > 0)),
  };

  // ---- 確度の内訳（要望・要件・制約） ----
  const confKinds = [['request', 'rejected'], ['requirement', 'dropped'], ['constraint', 'resolved']];
  const confLists = confKinds.map(([k, ex]) => of(k).filter((it) => it.status !== ex));
  const confidence = {
    categories: confKinds.map(([k]) => KINDS[k].label),
    series: [
      ...CONFIDENCE.map((c) => ({ name: c.label, values: confLists.map((list) => list.filter((it) => it.confidence === c.v).length) })),
      { name: DASH_TEXT.noConfidence, values: confLists.map((list) => list.filter((it) => !CONFIDENCE.some((c) => c.v === it.confidence)).length) },
    ],
  };

  // ---- 期限の分布（週は月曜始まり。1970-01-01 は木曜なので (d + 3) % 7 が 0 の日が月曜） ----
  const weekEnd = t + (6 - (((t + 3) % 7) + 7) % 7);
  const dueBucket = (d) => (d < t ? 0 : d <= weekEnd ? 1 : d <= weekEnd + 7 ? 2 : 3);
  const dueKinds = DUE_KINDS;
  const dueVals = dueKinds.map(() => [0, 0, 0, 0]);
  for (const d of dues) dueVals[dueKinds.indexOf(d.item.kind)][dueBucket(dayNumber(d.due))]++;
  const due = {
    categories: DASH_TEXT.dueBuckets.slice(),
    series: dueKinds.map((k, i) => ({ name: KINDS[k].label, values: dueVals[i] })),
  };

  return { kpi, requirements, ball, curve: hasTargets ? e.curve : null, confidence, due, ballWaitDays: n };
}

// グラフの合計（0 なら空の表示にする）
function seriesTotal(chart) {
  return chart.series.reduce((a, s) => a + s.values.reduce((x, y) => x + y, 0), 0);
}


// ---- core/hearing.js ----
// ヒヤリングの候補と、ベースラインとの差


const GAP_CODES = { 'no-owner': '担当と期限', 'no-source': '根拠（誰がいつ言ったか）', 'must-guess': '内容（Must だが推測のまま）', 'stale-guess': '内容（推測のまま）' };

// 次のヒヤリングの候補。戻り値: { key, type: 'question' | 'gap' | 'nfr', ref, text, ops(meetingId) }[]
// ops は「この会議に割り当てる」ときの差分の操作（applyLocalOps に渡す）
function hearingCandidates(ledger, today) {
  const out = [];
  const idx = linkIndex(ledger);
  const byId = new Map(ledger.items.map((it) => [it.id, it]));
  const hasOpenQuestion = (id) => [...(idx.get(id) || [])].some((x) => { const q = byId.get(x); return q && q.kind === 'question' && q.status === 'open'; });

  // 未回答で会議が決まっていない質問
  for (const q of ledger.items) {
    if (q.kind !== 'question' || q.status !== 'open' || q.meeting) continue;
    out.push({ key: 'q:' + q.id, type: 'question', ref: q.id, text: q.title, ops: (m) => [{ op: 'update', id: q.id, set: { meeting: m } }] });
  }

  // 健康診断の空欄。質問そのものの空欄は除く（質問を増やしても埋まらない）。既に未回答の質問でつながっていれば除く
  const seen = new Set();
  for (const f of runHealth(ledger, today)) {
    if (!GAP_CODES[f.code] || !f.itemId || seen.has(f.itemId)) continue;
    const it = byId.get(f.itemId);
    // リスク・KPI は社内で扱うもの（顧客に聞く質問にしない）
    if (!it || it.kind === 'question' || it.kind === 'meeting' || it.kind === 'risk' || it.kind === 'kpi' || hasOpenQuestion(it.id)) continue;
    seen.add(it.id);
    const text = `${kindLabel(it.kind)}「${it.title}」の${GAP_CODES[f.code]}を確認する`;
    out.push({
      key: 'g:' + it.id, type: 'gap', ref: it.id, text,
      ops: (m) => [{ op: 'add', item: { kind: 'question', title: text, meeting: m, links: [it.id], confidence: 'fact', sources: [{ type: 'other', ref: 'ヒヤリングの候補（健康診断）' }] } }],
    });
  }

  // 非機能の未着手の大項目
  for (const c of nfrStatus(ledger)) {
    if (c.state !== 'none') continue;
    const text = `${c.label}について確認する（${c.points.slice(0, 2).join('、')} など）`;
    out.push({
      key: 'n:' + c.id, type: 'nfr', ref: c.id, text,
      ops: (m) => [{ op: 'add', item: { kind: 'question', title: `${c.label}について確認する`, body: c.points.map((p) => '・' + p).join('\n'), meeting: m, nfrCategory: c.id, confidence: 'fact', sources: [{ type: 'other', ref: 'ヒヤリングの候補（非機能）' }] } }],
    });
  }
  return out;
}

const DROPPED = { requirement: 'dropped', request: 'rejected' };

// ベースラインと今の差。戻り値: { added: Item[], scopeChanged: { item, from, to }[], dropped: Item[] }
function baselineDiff(baseline, ledger) {
  const base = new Map(baseline.items.map((x) => [x.id, x]));
  const added = [];
  const scopeChanged = [];
  const dropped = [];
  for (const it of ledger.items) {
    if (it.kind !== 'request' && it.kind !== 'requirement') continue;
    const b = base.get(it.id);
    if (!b) { added.push(it); continue; }
    const now = it.scope || 'tbd';
    if (b.scope !== now) scopeChanged.push({ item: it, from: b.scope, to: now });
    if (it.status === DROPPED[it.kind] && b.status !== DROPPED[it.kind]) dropped.push(it);
  }
  return { added, scopeChanged, dropped };
}

function enumText(values) {
  return values.map((e) => `${e.v}=${e.label}`).join(', ');
}

// 種別と値の一覧
function schemaText() {
  const lines = [];
  lines.push('### 共通の項目（全種別）');
  lines.push('- title*: 題名（1行。体言止めで短く）');
  lines.push('- body: 内容（詳細。複数行可）');
  lines.push('- status: 状態（種別ごとに下記。省略すると最初の値）');
  lines.push(`- confidence: 確度（${enumText(CONFIDENCE)}）。省略すると guess`);
  lines.push(`- sources: 出典の配列。各要素は { "type": 種類, "ref": 会議名や資料名, "date": "YYYY-MM-DD", "speaker": 発言した関係者のID, "note": 補足 }。type は ${enumText(SOURCE_TYPES)}`);
  lines.push('- links: 関係する項目の ID の配列（例: 要件 → もとになった要望、課題 → 関係する要件）');
  lines.push('- tags: 文字列の配列（任意）');
  lines.push('- internal: true にすると社内のみの項目になり、顧客に見せる表示で隠れる（任意。社内向けの課題などに使う。リスク（risk）は指定しなければ社内のみになる）');
  lines.push('');
  lines.push('### 種別（kind）ごとの項目。* は必須');
  for (const k of LEDGER_KINDS) {
    const d = KINDS[k];
    const fields = Object.entries(d.fields).map(([name, f]) => {
      let t = `${name}${f.required ? '*' : ''}（${f.label}`;
      if (f.type === 'enum') t += `: ${enumText(f.values)}`;
      if (f.type === 'date') t += ': YYYY-MM-DD';
      if (f.type === 'ref') t += `: ${f.kinds.map(kindLabel).join('・')}の ID`;
      if (f.type === 'refs') t += `: ${f.kinds.map(kindLabel).join('・')}の ID の配列`;
      if (f.type === 'strings') t += ': 文字列の配列';
      if (f.type === 'number') t += `: 数値 ${f.min}〜${f.max}${f.integer ? 'の整数' : ''}`;
      if (f.type === 'boolean') t += ': true / false';
      return t + '）';
    });
    lines.push(`- ${k}（${d.label}。ID は ${d.prefix}-001 の形）状態: ${enumText(d.statuses)}` + (fields.length ? `。項目: ${fields.join(', ')}` : ''));
  }
  lines.push('');
  lines.push('### 配列の項目の書き方（テーブル・画面・連携・バッチ・RACI）');
  lines.push(`- columns（列）: [{ "name": 物理名, "logical": 論理名, "type": ${LOGICAL_TYPES.map((t) => t.v).join(' / ')}, "length": 桁数, "scale": 小数の桁数, "pk": true, "required": true, "fk": { "entity": テーブルの ID か tempId, "column": 参照先の列名 }, "pattern": コードの形の正規表現, "note": 補足 }]`);
  lines.push('- fields（画面・連携の項目）: [{ "name": 項目名, "type": 論理型, "required": true, "source": { "entity": テーブルの ID, "column": 列名 } }]');
  lines.push('- crud: [{ "entity": テーブルの ID か tempId, "ops": "C" "R" "U" "D" の組み合わせ（例 "CRU"） }]');
  lines.push('- raci（作業・決定・課題の RACI）: [{ "who": 関係者の ID か tempId, "role": "R"（実行）/ "A"（承認）/ "C"（相談）/ "I"（報告） }]。1 人に 1 つの役。A は 1 人にする');
  lines.push('- 配列は update で丸ごと置き換わる。テーブルを更新するときは、変えない列も含めて columns を全部返す（fields・crud・raci も同じ）');
  return lines.join('\n');
}

function projectText(ledger) {
  const p = ledger.project;
  const lines = [`- 案件名: ${p.name}`];
  if (p.customer) lines.push(`- 顧客: ${p.customer}`);
  if (p.purpose) lines.push(`- 目的: ${p.purpose}`);
  if (p.periodStart || p.periodEnd) lines.push(`- 期間: ${p.periodStart || '?'} 〜 ${p.periodEnd || '?'}`);
  if (p.goals && p.goals.length) lines.push(`- ゴール: ${p.goals.join(' / ')}`);
  if (p.summary) lines.push(`- 概要: ${p.summary}`);
  lines.push(`- 台帳の revision: ${ledger.revision}`);
  return lines.join('\n');
}

// 配列の項目を 1 行の文にする（オブジェクトの配列を [object Object] にしない）
function arrayText(name, v) {
  if (name === 'raci') return v.map((e) => `${e.who}:${e.role}`).join(', ');
  return v.map((e) => (e && typeof e === 'object' ? (e.name || e.entity || JSON.stringify(e)) : String(e))).join(',');
}
const oneLine = (s) => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();

// 今の項目一覧。detailed なら本文や主要な項目も含める（レビュー用）。kinds を渡すとその種別だけ載せる
function itemsText(ledger, detailed, kinds, ids) {
  const base = ledger.items.filter((it) => it.kind !== 'memo');   // メモは指示文の台帳の一覧に出さない
  const items = ids ? base.filter((it) => ids.has(it.id)) : kinds ? base.filter((it) => kinds.includes(it.kind)) : base;
  if (!items.length) return '（まだ項目はありません）';
  const shown = new Set(items.map((it) => it.id));
  const lines = ['ID | 種別 | 状態 | 題名' + (detailed ? ' | 詳細' : '')];
  for (const it of items) {
    let line = `${it.id} | ${kindLabel(it.kind)} | ${statusLabel(it.kind, it.status)} | ${oneLine(it.title)}`;
    if (detailed) {
      const extra = [];
      for (const name of Object.keys(KINDS[it.kind].fields)) {
        const v = it[name];
        if (v === undefined || v === null || (Array.isArray(v) && !v.length)) continue;
        if (name === 'notation') continue;   // 業務フローの記法は長いので、一覧には出さない（目的「業務フローの作成」で選んだものだけ全文を載せる）
        extra.push(`${KINDS[it.kind].fields[name].label}: ${Array.isArray(v) ? arrayText(name, v) : oneLine(v)}`);
      }
      extra.push(`確度: ${it.confidence}`);
      if (it.links && it.links.length) extra.push(`関連: ${it.links.join(',')}`);
      if (it.body) extra.push(`内容: ${oneLine(it.body)}`);
      line += ' | ' + extra.join(' / ');
    }
    lines.push(line);
  }
  const rels = ledger.relations.filter((r) => shown.has(r.from) && shown.has(r.to));
  if (rels.length) {
    lines.push('', '関係（from → to: label）');
    for (const r of rels) lines.push(`${r.from} → ${r.to}: ${oneLine(r.label)}`);
  }
  return lines.join('\n');
}

// 会議を指定した議事録の取込に入れる、会議の情報とヒヤリングシート
function meetingText(ledger, meetingId) {
  const m = ledger.items.find((it) => it.id === meetingId && it.kind === 'meeting');
  if (!m) return '';
  const name = (id) => { const s = ledger.items.find((it) => it.id === id); return s ? `${s.title}（${id}）` : id; };
  const sheet = ledger.items.filter((it) => it.kind === 'question' && it.meeting === m.id);
  return [
    '',
    `## この議事録の会議: ${m.id} ${m.title}（${m.date}）`,
    `- 出席者: ${(m.attendees || []).map(name).join('、') || '（未登録）'}`,
    `- 議題: ${(m.agenda || []).join(' / ') || '（未登録）'}`,
    '- この会議で聞いた質問（回答が出たものは、この ID への update で status を answered、answer に回答、askedAt に会議の日付を入れる）:',
    ...(sheet.length ? sheet.map((q) => `  - ${q.id} ${oneLine(q.title)}`) : ['  - （なし）']),
    `- 会議が開催されたので、${m.id} を update で status: "held" にする`,
    '- 出典の ref には会議名、date には会議の日付を入れる',
  ].join('\n');
}

// ヒヤリング質問の生成に入れる、未確定・空欄の一覧
function gapsText(ledger, today) {
  const open = ledger.items.filter((it) => it.kind === 'question' && it.status === 'open');
  // リスク・KPI の指摘は顧客への質問の材料にしない（社内のもの）
  const kindOf = new Map(ledger.items.map((it) => [it.id, it.kind]));
  const gaps = runHealth(ledger, today).filter((f) => ['no-owner', 'no-source', 'must-guess', 'stale-guess', 'nfr-missing', 'scope-undecided'].includes(f.code) && !['risk', 'kpi'].includes(kindOf.get(f.itemId)));
  return [
    '## 未回答の質問（重複して作らない）',
    ...(open.length ? open.map((q) => `- ${q.id} ${oneLine(q.title)}`) : ['- （なし）']),
    '',
    '## 台帳の空欄・未確定（機械的な点検の結果）',
    ...(gaps.length ? gaps.map((f) => `- ${f.message}`) : ['- （なし）']),
  ].join('\n');
}

function nfrText(ledger) {

}

// 変更の影響レビューに入れる、変更要求と影響範囲
function changeText(cr, imp) {
  const lines = [
    `## 変更要求: ${cr.id} ${cr.title}`,
    cr.body ? `- 内容: ${oneLine(cr.body)}` : null,
    `- 対象: ${(cr.links || []).join(', ') || '（未指定）'}`,
    `- 追加工数の見込み（今の値）: ${cr.extraEstimate ?? '未入力'} 人日`,
    '',
    '## 機械的に求めた影響範囲（2 段まで。関係者とシステムから先はたどっていない）',
  ];
  const byKind = Object.entries(imp.byKind).filter(([, v]) => v.length);
  if (!byKind.length) lines.push('- （つながる項目はありません）');
  for (const [k, list] of byKind) lines.push(`- ${kindLabel(k)}: ${list.map((it) => `${it.id} ${oneLine(it.title)}`).join(' / ')}`);
  lines.push(`- 影響する作業の見積の合計: ${imp.taskEstimate} 人日`);
  return lines.filter((x) => x !== null).join('\n');
}

// テスト観点の生成に入れる、対象の詳細・関係する制約と非機能要件・既にあるテスト
function targetsText(ledger, ids) {
  const byId = new Map(ledger.items.map((it) => [it.id, it]));
  const idx = linkIndex(ledger);
  const targets = ids.map((id) => byId.get(id)).filter(Boolean);
  if (!targets.length) return '（テストの対象が選ばれていません。指示文の画面で要件か画面を選んでください）';
  const L = ['## テストの対象'];
  const related = new Set();
  const tests = new Set();
  for (const t of targets) {
    L.push(`### ${t.id} ${kindLabel(t.kind)}「${oneLine(t.title)}」`);
    if (t.body) L.push(`- 内容: ${oneLine(t.body)}`);
    for (const [name, spec] of Object.entries(KINDS[t.kind].fields)) {
      const v = t[name];
      if (v === undefined || v === null || (Array.isArray(v) && !v.length)) continue;
      if (spec.type === 'fields') {
        L.push('- 項目:');
        for (const f of v) L.push(`  - ${f.name}（型 ${f.type || '不明'}${f.required ? '・必須' : ''}${f.source ? `・元 ${f.source.entity}.${f.source.column || ''}` : ''}）`);
      } else if (spec.type === 'crud') {
        L.push(`- CRUD: ${v.map((c) => `${c.entity} ${c.ops}`).join(' / ')}`);
      } else if (spec.type === 'columns') {
        L.push(`- 列: ${v.map((c) => `${c.name}(${c.type}${c.length ? ' ' + c.length : ''}${c.required || c.pk ? ' 必須' : ''})`).join(' / ')}`);
      } else {
        L.push(`- ${spec.label}: ${Array.isArray(v) ? v.join(', ') : oneLine(v)}`);
      }
    }
    for (const x of idx.get(t.id) || []) {
      const it = byId.get(x);
      if (!it) continue;
      if (it.kind === 'constraint' || (it.kind === 'requirement' && it.category === 'nonfunctional')) related.add(it);
      if (it.kind === 'test') tests.add(it);
    }
  }
  L.push('', '## 関係する制約・非機能要件');
  L.push(...(related.size ? [...related].map((it) => `- ${it.id} ${oneLine(it.title)}`) : ['- （なし）']));
  L.push('', '## 既にあるテスト（同じものは作らない）');
  L.push(...(tests.size ? [...tests].map((it) => `- ${it.id} ${oneLine(it.title)}`) : ['- （なし）']));
  return L.join('\n');
}

// 指示文を作る。opts: { today: 'YYYY-MM-DD', freeText?: string }
const MEMO_PROMPT_MAX = 60000;

// 選んだメモを資料にする。戻り値 { text, total, over, count }（total は本文の字数の合計）
function memoMaterial(ledger, memoIds) {
  const memos = (memoIds || []).map((id) => ledger.items.find((it) => it.id === id && it.kind === 'memo')).filter(Boolean);
  const total = memos.reduce((a, m) => a + String(m.body || '').length, 0);
  const text = memos.map((m) => [`### メモ「${m.title}」${m.channel ? `（${m.channel}）` : ''}${m.from || m.to ? `　期間: ${m.from || '?'}〜${m.to || '?'}` : ''}`, String(m.body || '')].join('\n')).join('\n\n');
  return { text, total, over: total > MEMO_PROMPT_MAX, count: memos.length };
}

// 目的「業務フローの作成」で選んだフロー（記法の全文）。選んでいなければ空
function bizflowTargetText(ledger, flowId) {
  const f = flowId ? ledger.items.find((it) => it.id === flowId && it.kind === 'bizflow') : null;
  if (!f) return '';
  return [`## 直すフロー: ${f.id} ${f.title}（${enumLabel(KINDS.bizflow.fields.phase.values, f.phase)}）`,
    `このフローを直すときは、${f.id} の update で notation を全文書き直して返してください（一部だけを返さない）。`,
    '今の記法:', '```flow', String(f.notation || ''), '```'].join('\n');
}

function buildPrompt(purpose, ledger, opts = {}) {
  const today = opts.today || new Date().toISOString().slice(0, 10);
  const memo = purpose === 'memo' ? memoMaterial(ledger, opts.memoIds) : null;
  if (purpose === 'notebooklm') return notebookPrompt(ledger);
  if (purpose === 'report-polish') return reportPolishPrompt(ledger, opts.reportText || '');
  if (JUDGE_PURPOSE_IDS.includes(purpose)) return judgePrompt(purpose, ledger);
  if (!PURPOSES.some((p) => p.id === purpose)) throw new Error('不明な目的: ' + purpose);
  const detailed = purpose.startsWith('review-') || purpose === 'org';   // 体制の整理では今の RACI を見せる（丸ごと置き換わるため）
  const def = PURPOSES.find((p) => p.id === purpose);
  const extra = { ...opts };
  if (purpose === 'hearing-questions') extra.gaps = gapsText(ledger, today);
  if (purpose === 'nfr') extra.nfr = nfrText(ledger);
  if (purpose === 'bizflow') extra.flow = bizflowTargetText(ledger, opts.flowId);
  let ids = null;
  if (purpose === 'test-viewpoints') {
    const targetIds = Array.isArray(opts.targetIds) ? opts.targetIds : [];
    extra.targets = targetsText(ledger, targetIds);
    const idx = linkIndex(ledger);
    ids = new Set(targetIds);
    for (const id of targetIds) for (const x of idx.get(id) || []) ids.add(x);
  }
  if (purpose === 'change-review') {
    const cr = ledger.items.find((it) => it.id === opts.changeId && it.kind === 'change');
    if (cr) {
      const imp = impactOf(ledger, [cr.id]);
      ids = new Set([cr.id, ...(cr.links || []), ...imp.items.map((x) => x.item.id)]);
      extra.change = changeText(cr, imp);
    } else {
      extra.change = '（変更要求が選ばれていません。指示文の画面で変更要求を選んでください）';
      ids = new Set();
    }
  }
  return [
    taskText(purpose, extra) + (purpose === 'minutes' && opts.meetingId ? meetingText(ledger, opts.meetingId) : ''),
    '',
    rulesText(ledger, today),
    '',
    '## 種別と値の一覧',
    schemaText(),
    '',
    '## 出力の例',
    exampleJson(ledger.revision),
    '',
    '## 案件の概要',
    projectText(ledger),
    '',
    '## 今の台帳の項目一覧',
    ids ? (purpose === 'test-viewpoints' ? '（テストの対象と、それにつながる項目だけを載せています）' : '（変更要求とその影響範囲の項目だけを載せています）') : def.kinds ? `（${def.kinds.map(kindLabel).join('・')}だけを載せています）` : null,
    itemsText(ledger, detailed || purpose === 'change-review', ids ? null : def.kinds, ids),
    '',
    detailed ? '（レビュー対象は上の台帳です。補足の資料があれば下に貼ります）' : memo ? '（この下がメモです）' : '（この下に資料を貼ります）',
    MATERIAL_MARK,
    memo ? (memo.count ? memo.text : '（メモが選ばれていません。指示文の画面でメモを選んでください）') : '',
  ].filter((x) => x !== null).join('\n');
}

registerStarters(Object.keys(STARTERS));

// 新規の台帳を作る。starterId が null なら空の台帳
function createLedger(name, starterId, now) {
  const base = emptyLedger(name, now);
  if (!starterId) return base;
  const st = STARTERS[starterId];
  if (!st) throw new Error('不明な案件の型: ' + starterId);
  const r = applyLocalOps(base, [...st.ops, { op: 'project', set: { starter: starterId } }], now);
  if (!r.ok) throw new Error('案件の型の適用に失敗しました: ' + r.errors.join(' / '));
  // 型の項目は「変更」ではないので記録を残さない
  return { ...r.ledger, revision: 0, changelog: [] };
}


// ---- core/vault.js ----
// 台帳の暗号化。合言葉 → PBKDF2(SHA-256) → AES-GCM 256。鍵はメモリにだけ持ち、保存しない。
// ブラウザと Node（テスト）の両方で globalThis.crypto.subtle を使う。

const VAULT_VERSION = 1;
const PBKDF2_ITERATIONS = 600000;

const enc = new TextEncoder();
const dec = new TextDecoder();

function cryptoAvailable() {
  return !!(globalThis.crypto && globalThis.crypto.subtle && globalThis.crypto.getRandomValues);
}

function toB64(bytes) {
  let s = '';
  const u = new Uint8Array(bytes);
  for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
  return btoa(s);
}

function fromB64(b64) {
  const s = atob(b64);
  const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}

function newSalt() {
  return toB64(globalThis.crypto.getRandomValues(new Uint8Array(16)));
}

// 合言葉と salt から鍵を作る（取り出せない鍵）
async function deriveKey(passphrase, saltB64, iterations = PBKDF2_ITERATIONS) {
  const base = await globalThis.crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return globalThis.crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(saltB64), iterations },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt'],
  );
}

// 文字列を暗号化して、保存用の箱（JSON 文字列）を返す
async function sealText(key, saltB64, iterations, text) {
  const iv = globalThis.crypto.getRandomValues(new Uint8Array(12));
  const ct = await globalThis.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text));
  return JSON.stringify({ v: VAULT_VERSION, kdf: 'PBKDF2-SHA256', iter: iterations, salt: saltB64, iv: toB64(iv), ct: toB64(ct) });
}

// 保存用の箱を読む（中身は開けない。salt と回数を取り出すだけ）
function parseBox(boxText) {
  let b;
  try { b = JSON.parse(boxText); } catch (e) { return null; }
  if (!b || b.v !== VAULT_VERSION || typeof b.salt !== 'string' || typeof b.iv !== 'string' || typeof b.ct !== 'string' || !Number.isInteger(b.iter)) return null;
  return b;
}

// 箱を開ける。合言葉が違うと例外（AES-GCM の認証に失敗する）
async function openBox(key, box) {
  const pt = await globalThis.crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(box.iv) }, key, fromB64(box.ct));
  return dec.decode(pt);
}


// ---- ui/dom.js ----
// DOM の小道具。外部由来の文字列は必ず textContent / setAttribute で入れる（innerHTML を使わない）

const SVG_NS = 'http://www.w3.org/2000/svg';

function setAttrs(el, attrs) {
  if (!attrs) return;
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.setAttribute('class', Array.isArray(v) ? v.filter(Boolean).join(' ') : v);
    else if (k === 'text') el.textContent = String(v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k === 'value' && 'value' in el) el.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'hidden') { el[k] = !!v; }
    else el.setAttribute(k, v === true ? '' : String(v));
  }
}

function append(el, children) {
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  setAttrs(el, attrs);
  append(el, children);
  return el;
}

function s(tag, attrs, ...children) {
  const el = document.createElementNS(SVG_NS, tag);
  setAttrs(el, attrs);
  append(el, children);
  return el;
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
  return el;
}

let toastTimer = 0;
function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function download(filename, text, type) {
  const blob = new Blob([text], { type: type || 'application/json;charset=utf-8' });
  const a = h('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function fallbackCopy(text) {
  const ta = h('textarea', { class: 'offscreen', 'aria-hidden': 'true' });
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

// クリップボードへコピー。file:// では isSecureContext が偽のことがあるので代替経路を持つ
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* 代替へ */ }
  }
  return fallbackCopy(text);
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function nowIso() { return new Date().toISOString(); }

// ブラウザの confirm() の代わり（自動操作を止めないよう <dialog> を使う）
function confirmDialog(message, okLabel, detail) {
  return new Promise((resolve) => {
    const dlg = h('dialog', { class: 'dialog' },
      h('p', { class: 'dialog-msg', text: message }),
      detail ? h('p', { class: 'muted small', text: detail }) : null,
      h('div', { class: 'row dialog-actions' },
        h('button', { class: 'btn', type: 'button', 'data-act': 'cancel', onclick: () => done(false) }, 'やめる'),
        h('button', { class: 'btn primary', type: 'button', 'data-act': 'ok', onclick: () => done(true) }, okLabel || 'OK')));
    function done(v) { dlg.close(); dlg.remove(); resolve(v); }
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); done(false); });
    document.body.appendChild(dlg);
    dlg.showModal();
  });
}

function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// 3 つ以上の選択肢を出すダイアログ。choices: [{ value, label, primary? }]。やめたら null
function choiceDialog(message, choices, detail) {
  return new Promise((resolve) => {
    const dlg = h('dialog', { class: 'dialog' },
      h('p', { class: 'dialog-msg', text: message }),
      detail ? h('p', { class: 'muted small', text: detail }) : null,
      h('div', { class: 'row dialog-actions' },
        h('button', { class: 'btn', type: 'button', 'data-act': 'cancel', onclick: () => done(null) }, 'やめる'),
        choices.map((c) => h('button', { class: ['btn', c.primary && 'primary'], type: 'button', 'data-act': c.value, onclick: () => done(c.value) }, c.label))));
    function done(v) { dlg.close(); dlg.remove(); resolve(v); }
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); done(null); });
    document.body.appendChild(dlg);
    dlg.showModal();
  });
}


// ---- ui/flowsvg.js ----
// 業務フロー・判断の図を SVG の DOM として組む（gemini-kit flow.js の toSVG を、文字列ではなく s() で写したもの）
// 配置は core/flow.js の FLOWCHART.layout。色はすべて styles.css の変数（.fl-* のクラス）で決め、ここでは色を持たない
// overlay（判断・データの画面）: { marks: {ID: 'ok'|'open'|'none'}, visited: [ID], taken: ['A>B'], current: ID, focus: ID（選んでいる箱）, titles: {ID: 文字}, onSelect(id) }



function flShape(n, attrs) {
  const { x, y, w, h } = n;
  switch (n.type) {
    case 'start':
    case 'end': return s('rect', { x, y, width: w, height: h, rx: h / 2, ...attrs });
    case 'decision': return s('polygon', { points: `${n.cx},${y} ${x + w},${n.cy} ${n.cx},${y + h} ${x},${n.cy}`, ...attrs });
    case 'data': { const k = 12; return s('polygon', { points: `${x + k},${y} ${x + w},${y} ${x + w - k},${y + h} ${x},${y + h}`, ...attrs }); }
    case 'doc': { const b = y + h - 8; return s('path', { d: `M${x},${y} H${x + w} V${b} C${x + w * 0.75},${b - 10} ${x + w * 0.5},${b + 12} ${x + w * 0.25},${b + 4} S${x + 4},${b - 4} ${x},${b + 2} Z`, ...attrs }); }
    default: return s('rect', { x, y, width: w, height: h, rx: 4, ...attrs });
  }
}

// 分岐の出口の色は「はい」「いいえ」の 2 色だけ。ほかの出口は灰色の線（design.md の決めごと）
const flTone = (e) => (e.tone === 'pos' || e.tone === 'neg' ? `tone-${e.tone}` : null);
const flPath = (pts) => pts.map((p, k) => `${k ? 'L' : 'M'}${p[0]},${p[1]}`).join(' ');

// 図ごとに矢じりの id を変える（同じ画面に 2 枚出しても衝突しない）
let flSeq = 0;

function renderFlowSvg(geo, overlay) {
  const ov = overlay || null;
  const marks = (ov && ov.marks) || {};
  const visited = new Set((ov && ov.visited) || []);
  const taken = new Set((ov && ov.taken) || []);
  const { ROLES, MARK, LANE_BAR, nodeLineW, roleLabel, roleLabelPos, textW } = FLOWCHART;
  const uid = `fl${++flSeq}`;
  const svg = s('svg', { class: 'fl-svg', viewBox: `0 0 ${geo.width} ${geo.height}`, width: geo.width, height: geo.height, role: ov ? 'group' : 'img', 'aria-label': geo.title || '業務フロー' });
  const tones = ['plain', 'tone-pos', 'tone-neg'];
  svg.appendChild(s('defs', null, tones.map((t) => s('marker', { id: `${uid}-${t}`, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: 'auto-start-reverse' }, s('path', { class: ['fl-arrowhead', t !== 'plain' && t], d: 'M0,1 L10,5 L0,9 z' })))));
  svg.appendChild(s('rect', { class: 'fl-bg', x: 0, y: 0, width: geo.width, height: geo.height }));
  if (geo.title) svg.appendChild(s('text', { class: 'fl-title', x: geo.left, y: geo.titleY }, geo.title));
  geo.lanes.forEach((ln, i) => {
    const alt = i % 2 ? 'is-b' : 'is-a';
    svg.appendChild(s('rect', { class: ['fl-lane', alt], x: geo.left, y: ln.y, width: geo.right - geo.left, height: ln.h }));
    svg.appendChild(s('rect', { class: 'fl-lane-head', x: geo.left, y: ln.y, width: geo.laneHeaderW, height: ln.h }));
    svg.appendChild(s('rect', { class: 'fl-lane-bar', x: geo.left, y: ln.y, width: LANE_BAR, height: ln.h }));
    const ty = ln.y + ln.h / 2 - ((ln.lines.length - 1) * 17) / 2 + 5;
    ln.lines.forEach((l, k) => svg.appendChild(s('text', { class: 'fl-lane-name', x: geo.left + (geo.laneHeaderW + LANE_BAR) / 2, y: ty + k * 17 }, l)));
  });
  // 通った線は下に太い淡い線を敷く。線は白い縁取りの上に描き、分岐の色の線を灰色の線より後に描く
  if (ov) for (const e of geo.edges) if (taken.has(`${e.from}>${e.to}`)) svg.appendChild(s('path', { class: 'fl-taken', d: flPath(e.points) }));
  const order = geo.edges.map((e, i) => i).sort((a, b) => (flTone(geo.edges[a]) ? 1 : 0) - (flTone(geo.edges[b]) ? 1 : 0) || a - b);
  for (const i of order) {
    const e = geo.edges[i];
    const t = flTone(e);
    const d = flPath(e.points);
    svg.appendChild(s('path', { class: 'fl-edge-under', d }));
    svg.appendChild(s('path', { class: ['fl-edge', t, e.dashed && 'is-dashed'], d, 'marker-end': `url(#${uid}-${t || 'plain'})` }));
  }
  for (const n of geo.nodes) {
    const role = n.role && ROLES[n.role] ? n.role : null;
    const cls = ['fl-node', `type-${n.type}`, role && `role-${role}`];
    svg.appendChild(flShape(n, { class: cls, 'stroke-width': nodeLineW(n) * 1.2 }));
    if (n.type === 'sub') svg.appendChild(s('path', { class: ['fl-sub-line', role && `role-${role}`], d: `M${n.x + 9},${n.y} V${n.y + n.h} M${n.x + n.w - 9},${n.y} V${n.y + n.h}` }));
    const lh = geo.lineH;
    const ty = n.cy - ((n.lines.length - 1) * lh) / 2 + geo.fontSize * 0.36 - (n.type === 'doc' ? 4 : 0);
    n.lines.forEach((l, k) => svg.appendChild(s('text', { class: ['fl-node-text', n.type === 'decision' && 'is-bold'], x: n.cx, y: ty + k * lh, 'font-size': geo.fontSize }, l)));
    if (ov) {
      const mk = marks[n.id];
      if (MARK[mk] && mk !== 'ok') svg.appendChild(flShape(n, { class: ['fl-mark-frame', `mark-${mk}`] }));
      if (ov.current === n.id) svg.appendChild(flShape(n, { class: 'fl-current' }));
      else if (visited.has(n.id)) svg.appendChild(flShape(n, { class: 'fl-visited' }));
    }
    if (n.notes.length) svg.appendChild(s('text', { class: 'fl-note-no', x: n.x + n.w - (ov && MARK[marks[n.id]] ? 22 : 0), y: n.y - 3 }, n.notes.map((x) => '※' + x).join(' ')));
    const rl = roleLabel(n);
    if (rl) {
      const p = roleLabelPos(n);
      svg.appendChild(s('text', { class: ['fl-role-label', `role-${n.role}`], x: p.x, y: p.y }, rl));
    }
  }
  for (const e of geo.edges) {
    if (!e.label || !e.labelPos) continue;
    svg.appendChild(s('text', { class: ['fl-edge-label', flTone(e)], x: e.labelPos.x, y: e.labelPos.y, 'text-anchor': e.labelPos.anchor, 'font-size': geo.labelSize }, e.label));
  }
  if (geo.roles && geo.roles.length) {
    const yy = geo.roleY;
    let lx = geo.left;
    svg.appendChild(s('text', { class: 'fl-legend', x: lx, y: yy + 11 }, '区分：'));
    lx += textW('区分：', 12) + 4;
    for (const r of geo.roles) {
      svg.appendChild(s('rect', { class: ['fl-legend-box', `role-${r.key}`], x: lx, y: yy, width: 14, height: 14, rx: 2 }));
      svg.appendChild(s('text', { class: ['fl-legend-role', `role-${r.key}`], x: lx + 19, y: yy + 11 }, r.name));
      lx += 19 + textW(r.name, 12) + 18;
    }
  }
  let ly = geo.legendY;
  for (const nt of geo.notes) for (const l of nt.text) { ly += 17; svg.appendChild(s('text', { class: 'fl-legend', x: geo.left, y: ly }, l)); }
  if (ov) {
    // 状態の印（色だけに頼らず記号でも区別する）
    for (const n of geo.nodes) {
      const mk = MARK[marks[n.id]];
      if (!mk) continue;
      const cx = n.type === 'decision' ? n.x + n.w * 0.75 + 4 : n.x + n.w - 6, cy = n.type === 'decision' ? n.y + n.h * 0.25 - 4 : n.y + 2;
      svg.appendChild(s('circle', { class: ['fl-mark', `mark-${marks[n.id]}`], cx, cy, r: 9 }));
      svg.appendChild(s('text', { class: 'fl-mark-sym', x: cx, y: cy + 4.5 }, mk.sym));
    }
    // 当たり判定は箱と同じ形。どの箱にも Tab で止まり、Enter・Space で選ぶ
    for (const n of geo.nodes) {
      const t = (ov.titles && ov.titles[n.id]) || n.lines.join('');
      const mk = MARK[marks[n.id]];
      const el = flShape(n, { class: ['fl-hit', ov.focus === n.id && 'is-focus'], 'data-node': n.id, tabindex: 0, role: 'button', 'aria-pressed': ov.focus ? String(ov.focus === n.id) : null, 'aria-label': `${n.id} ${t}${mk ? '（' + mk.word + '）' : ''}` });
      el.appendChild(s('title', null, `${n.id} ${t}${mk ? '：' + mk.word : ''}`));
      const pick = () => { if (ov.onSelect) ov.onSelect(n.id); };
      el.addEventListener('click', pick);
      el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(); } });
      svg.appendChild(el);
    }
  }
  return svg;
}


// ---- ui/store.js ----
// 画面の状態。台帳・取り消し・書き出し状態を持ち、localStorage に「暗号化して」保存する。
//
// 保存の状態（vaultState）:
//   empty    保存された台帳が無い。新しく作る・読み込むときに合言葉を決める
//   legacy   P1 の平文の保存が残っている。合言葉を決めると暗号化し、平文を消す
//   locked   暗号化した台帳がある。合言葉を入れるまで開けない
//   unlocked 開いている。鍵はメモリにだけある
//   nostore  この環境では暗号化が使えない。ブラウザには保存しない（書き出しが正本）
//
// P5 から箱の中身は複数案件の入れ物（workspace）。ledger・undoLedger・exportedRevision・exportedAt は
// 「今開いている案件」の値を返す getter にしてあり、画面側は今までどおり store.ledger を読めばよい


const UNDO_LIMIT = 20;
const STEP_OPS = new Set(['settings', 'baseline', 'reset']);

// 取り消しの段の表示用の種類と件数を、適用後の台帳の最後の記録から作る
function stepInfo(after) {
  const log = after && after.changelog;
  const e = log && log.length ? log[log.length - 1] : null;
  if (!e || e.rev !== after.revision) return { kind: 'local', count: 0 };
  const changes = e.changes || [];
  const op = changes[0] && changes[0].op;
  return { kind: STEP_OPS.has(op) ? op : (e.source || 'local'), count: changes.length };
}

const KEY_VAULT = 'anken-workbench:v1:vault';
const KEY_RECOVERY = 'anken-workbench:v1:recovery';
const KEY_LEGACY = 'anken-workbench:v1:ledger';
const KEY_EXPORTED = 'anken-workbench:v1:exportedRevision';
const KEY_EXPORTED_AT = 'anken-workbench:v1:exportedAt';

function lsGet(key) {
  try { return window.localStorage.getItem(key); } catch (e) { return null; }
}
function lsSet(key, value) {
  try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
}
function lsRemove(key) {
  try { window.localStorage.removeItem(key); } catch (e) { /* 何もしない */ }
}

// 台帳のオブジェクトを移行して検査する。戻り値: { ok, ledger, migrated } / { ok: false, errors }
function checkLedgerObject(obj) {
  const m = migrateLedger(obj);
  if (m.error) return { ok: false, errors: [m.error] };
  let errs;
  try { errs = validateLedger(m.ledger, { allowDanglingRefs: true }); } catch (e) {
    errs = ['台帳の検査中に問題が起きました（' + String(e && e.message || e) + '）'];
  }
  if (errs.length) return { ok: false, errors: errs };
  return { ok: true, ledger: normalizeCounters(m.ledger), migrated: m.migrated };
}

// 台帳の文字列を検査して読む
function readLedgerText(text) {
  let obj;
  try { obj = safeParse(String(text).replace(/^﻿/, '')); } catch (e) {
    return { ok: false, errors: ['JSON として読めません'] };
  }
  return checkLedgerObject(obj);
}

const store = {
  workspace: emptyWorkspace(),
  undoById: new Map(),     // 案件ごとの取り消しの段 [{ ledger: 適用前, at, kind, count }]（古い順・最大 UNDO_LIMIT・メモリのみ）
  legacyExported: null,    // P4 までの書き出し状態（移行で使う）
  recovery: {},            // 読めなかった案件の元の文字列 { 案件ID: 文字列 }（暗号化して退避する）
  gen: 0,                  // 台帳が変わるたびに増える世代（revision は取り消しや新規作成で重なるため別に持つ）
  token: '',               // 台帳を置き換えるたびに変わる印（取込の下書きを捨てる判定に使う）
  vaultState: 'empty',
  key: null,
  salt: null,
  passChanging: false,     // 合言葉の変更中（ロックを押せなくする）
  keyRef: null,            // 書き込みに使う鍵 { key, salt }。保存の列に並んだ処理は、実行する時点でこれを読む（合言葉の変更が後から効くように）
  saving: Promise.resolve(),
  saveError: null,
  loadError: null,
  selectedId: null,
  presentation: false,     // 説明用の表示（保存しない。開き直すと通常に戻る）
  listeners: new Set(),

  // ---- 今開いている案件 ----
  get activeId() { return this.workspace.activeId; },
  get ledger() {
    const id = this.workspace.activeId;
    return id ? this.workspace.ledgers[id] || null : null;
  },
  set ledger(v) {
    if (!v) return;
    if (!this.workspace.activeId) {
      const id = newProjectId();
      this.workspace.activeId = id;
      this.workspace.exported[id] = { revision: null, at: null };
    }
    this.workspace.ledgers[this.workspace.activeId] = v;
  },
  get undoSteps() { return this.undoById.get(this.workspace.activeId) || []; },
  // 変更を1段積む（before: 適用前、after: 適用後）
  pushUndo(before, after) {
    const id = this.workspace.activeId;
    if (!id || !before) return;
    const steps = this.undoById.get(id) || [];
    steps.push({ ledger: before, at: after.updatedAt || nowIso(), ...stepInfo(after) });
    if (steps.length > UNDO_LIMIT) steps.splice(0, steps.length - UNDO_LIMIT);
    this.undoById.set(id, steps);
  },
  get exportedRevision() { const e = this.workspace.exported[this.workspace.activeId]; return e ? e.revision : null; },
  get exportedAt() { const e = this.workspace.exported[this.workspace.activeId]; return e ? e.at : null; },
  get recoveryText() {
    const v = Object.values(this.recovery);
    return v.length ? v.join('\n\n') : null;
  },

  init() {
    const ex = lsGet(KEY_EXPORTED);
    this.legacyExported = { revision: ex === null || ex === '' ? null : Number(ex), at: lsGet(KEY_EXPORTED_AT) || null };
    if (!cryptoAvailable()) {
      this.vaultState = 'nostore';
      this.loadError = 'このブラウザでは暗号化が使えないため、台帳をブラウザに保存しません。作業の区切りごとに必ず「書き出し」をしてください';
      return;
    }
    if (lsGet(KEY_VAULT)) { this.vaultState = 'locked'; return; }
    const legacy = lsGet(KEY_LEGACY);
    if (legacy) {
      this.vaultState = 'legacy';
      const r = readLedgerText(legacy);
      if (r.ok) {
        this.ledger = r.ledger;
        this.workspace.exported[this.workspace.activeId] = r.migrated ? { revision: null, at: null } : { ...this.legacyExported };
      } else { this.recovery = { legacy }; this.loadError = '以前の保存が壊れているため開けませんでした。「設定」から元のデータを書き出せます'; }
      this.token = Math.random().toString(36).slice(2);
    }
  },

  subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit(reason) { for (const fn of this.listeners) fn(reason); },

  needsPassphraseSetup() { return this.vaultState === 'empty' || this.vaultState === 'legacy'; },

  // 合言葉を決める（新規・平文からの移行）
  async setPassphrase(pass) {
    this.salt = newSalt();
    this.key = await deriveKey(pass, this.salt);
    this.keyRef = { key: this.key, salt: this.salt };
    this.vaultState = 'unlocked';
    if (this.recoveryText) await this.saveRecovery();
    lsRemove(KEY_LEGACY);
    lsRemove(KEY_EXPORTED); lsRemove(KEY_EXPORTED_AT);
    await this.persist();
    this.emit('vault');
  },

  // 合言葉で開ける。戻り値: { ok } / { ok: false, error }
  async unlock(pass) {
    const box = parseBox(lsGet(KEY_VAULT));
    if (!box) return { ok: false, error: '保存されたデータの形式が正しくありません' };
    const key = await deriveKey(pass, box.salt, box.iter);
    let text;
    try { text = await openBox(key, box); } catch (e) { return { ok: false, error: '合言葉が違います' }; }
    this.key = key;
    this.salt = box.salt;
    this.keyRef = { key, salt: box.salt };
    this.vaultState = 'unlocked';
    this.undoById.clear();
    this.loadError = null;
    // 以前の退避を先に読む（今回の退避と合わせて残すため）
    const rec = parseBox(lsGet(KEY_RECOVERY));
    let recovery = {};
    if (rec) {
      try {
        const t = await openBox(key, rec);
        let o = null;
        try { o = JSON.parse(t); } catch (e) { o = null; }
        recovery = o && o.type === 'recovery' && o.items ? o.items : { legacy: t };   // P1〜P4 の退避は文字列1つ
      } catch (e) { /* 別の合言葉の退避は扱わない */ }
    }
    let obj = null;
    try { obj = safeParse(text); } catch (e) { obj = null; }
    const m = obj ? migrateWorkspace(obj, this.legacyExported) : { error: 'JSON として読めません' };
    let changed = false;
    if (m.error) {
      // 中身の形が分からない。上書きで消えないように丸ごと退避する
      this.workspace = emptyWorkspace();
      recovery.all = text;
      this.loadError = '保存されていた台帳を開けませんでした（' + m.error + '）。元のデータは退避してあり、「設定」から書き出せます';
      changed = true;
    } else {
      const o = openWorkspace(m.workspace, checkLedgerObject);
      this.workspace = o.workspace;
      const brokenIds = Object.keys(o.broken);
      for (const id of brokenIds) recovery[id] = o.broken[id];
      if (brokenIds.length) this.loadError = `読めない案件が ${brokenIds.length} 件あったため、その案件だけを退避しました。「設定」から元のデータを書き出せます`;
      changed = m.wrapped || brokenIds.length > 0 || o.migratedIds.length > 0;
    }
    this.recovery = recovery;
    if (Object.keys(recovery).length) await this.saveRecovery();
    if (changed) {
      lsRemove(KEY_EXPORTED); lsRemove(KEY_EXPORTED_AT);
      this.persist();
    }
    this.token = Math.random().toString(36).slice(2);
    this.gen++;
    this.emit('vault');
    return { ok: true };
  },

  // 鍵と台帳をメモリから消す
  lock() {
    if (this.vaultState !== 'unlocked') return;
    this.workspace = emptyWorkspace(); this.undoById.clear(); this.key = null; this.keyRef = null; this.selectedId = null; this.recovery = {};
    this.vaultState = lsGet(KEY_VAULT) ? 'locked' : 'empty';
    this.gen++;
    this.emit('lock');   // 画面が持つ一時の結果（資料の変換など）を消す合図。ロックのときだけ出す
    this.emit('vault');
  },

  // 合言葉を忘れたとき: ブラウザ内の暗号化データを消して始め直す
  resetVault() {
    lsRemove(KEY_VAULT); lsRemove(KEY_RECOVERY);
    this.workspace = emptyWorkspace(); this.undoById.clear(); this.key = null; this.salt = null; this.keyRef = null; this.recovery = {}; this.loadError = null;
    this.vaultState = 'empty';
    this.gen++;
    this.emit('vault');
  },

  // 退避データを暗号化して保存する（保存の列に並べ、合言葉の変更と入れ替わらないようにする）
  saveRecovery() {
    const ref = this.keyRef;
    if (!ref) return this.saving;
    const items = { ...this.recovery };
    this.saving = this.saving.then(async () => {
      if (!Object.keys(items).length) { lsRemove(KEY_RECOVERY); return; }
      try { lsSet(KEY_RECOVERY, await sealText(ref.key, ref.salt, PBKDF2_ITERATIONS, JSON.stringify({ type: 'recovery', items }))); } catch (e) { /* 次の保存で書き直す */ }
    });
    return this.saving;
  },
  // id を省くとすべて消す
  async discardRecovery(id) {
    if (id) delete this.recovery[id]; else this.recovery = {};
    await this.saveRecovery();
    this.emit('vault');
  },

  // 暗号化して保存する。書き込みの順序が入れ替わらないよう直列にする
  persist() {
    if (this.vaultState !== 'unlocked' || !this.key) return this.saving;
    const text = JSON.stringify(this.workspace);
    const ref = this.keyRef;
    this.saving = this.saving.then(async () => {
      try {
        const ok = lsSet(KEY_VAULT, await sealText(ref.key, ref.salt, PBKDF2_ITERATIONS, text));
        this.saveError = ok ? null : 'ブラウザへの保存に失敗しました。容量不足の可能性があります。今すぐ「書き出し」で JSON を保存してください';
      } catch (e) {
        this.saveError = 'ブラウザへの保存（暗号化）に失敗しました。今すぐ「書き出し」で JSON を保存してください';
      }
      if (this.saveError) this.emit('save-error');
    });
    return this.saving;
  },

  // 合言葉を変える。全案件と退避データを新しい合言葉で暗号化し直す。戻り値: { ok } / { ok: false, error }
  // 保存の列の中で、確かめる → 暗号化 → 書き込み → 鍵の差し替え を行う。失敗したら元の保存に書き戻す
  changePassphrase(current, next) {
    const run = async () => {
      const ref = this.keyRef;
      if (this.vaultState !== 'unlocked' || !ref) return { ok: false, error: '台帳が開いていません' };
      // 待ちの間にロックされても空の入れ物を書かないよう、中身は先に写し取る
      const wsText = JSON.stringify(this.workspace);
      const items = { ...this.recovery };
      const alive = () => this.keyRef === ref && this.vaultState === 'unlocked';
      const aborted = { ok: false, error: '途中でロックされたため、合言葉は変えていません' };
      const oldVault = lsGet(KEY_VAULT);
      const oldRec = lsGet(KEY_RECOVERY);
      const box = parseBox(oldVault);
      if (!box) return { ok: false, error: '保存されたデータの形式が正しくありません' };
      try { await openBox(await deriveKey(current, box.salt, box.iter), box); } catch (e) { return { ok: false, error: '今の合言葉が違います' }; }
      if (!alive()) return aborted;
      const hasItems = Object.keys(items).length > 0;
      if (oldRec && !hasItems) return { ok: false, error: '開けない退避データがあります。先に「設定」から消すか、元の合言葉で開いて書き出してください' };
      let salt, key, vaultText, recText = null;
      try {
        salt = newSalt();
        key = await deriveKey(next, salt);
        vaultText = await sealText(key, salt, PBKDF2_ITERATIONS, wsText);
        if (hasItems) recText = await sealText(key, salt, PBKDF2_ITERATIONS, JSON.stringify({ type: 'recovery', items }));
      } catch (e) {
        return { ok: false, error: '暗号化に失敗しました。合言葉は変わっていません' };
      }
      if (!alive()) return aborted;
      if (!lsSet(KEY_VAULT, vaultText) || (recText !== null && !lsSet(KEY_RECOVERY, recText))) {
        lsSet(KEY_VAULT, oldVault);
        if (oldRec === null) lsRemove(KEY_RECOVERY); else lsSet(KEY_RECOVERY, oldRec);
        return { ok: false, error: '保存に失敗しました（容量不足の可能性）。合言葉は変わっていません' };
      }
      // 列に並んでいる保存も新しい鍵で書くよう、同じ入れ物の中身を差し替える
      ref.key = key; ref.salt = salt;
      this.key = key; this.salt = salt;
      this.saveError = null;
      return { ok: true };
    };
    this.passChanging = true;
    this.emit('pass');
    const p = this.saving.then(run).finally(() => { this.passChanging = false; this.emit('pass'); });
    this.saving = p.then(() => {}, () => {});
    return p.catch(() => ({ ok: false, error: '合言葉の変更に失敗しました。合言葉は変わっていません' }));
  },

  setExported(rev, at) {
    const id = this.workspace.activeId;
    if (!id) return;
    const cur = this.workspace.exported[id] || { revision: null, at: null };
    this.workspace.exported[id] = { revision: rev, at: at === undefined ? cur.at : at };
  },

  isDirty() {
    return !!this.ledger && this.ledger.revision !== this.exportedRevision;
  },

  // ---- 案件の追加・置き換え・切り替え・外す（P5） ----
  // 新しい案件として足して開く。合言葉の設定は呼び出し側で済ませておく
  addProject(ledger, { exported, migrated } = {}) {
    const id = newProjectId();
    this.workspace.ledgers[id] = normalizeCounters(ledger);
    this.workspace.exported[id] = { revision: exported && !migrated ? ledger.revision : null, at: exported && !migrated ? nowIso() : null };
    this.openProject(id, 'replace');
    return id;
  },
  // 既存の案件（同じ案件名など）を置き換えて開く
  replaceProject(id, ledger, { exported, migrated } = {}) {
    if (!this.workspace.ledgers[id]) return this.addProject(ledger, { exported, migrated });
    this.workspace.ledgers[id] = normalizeCounters(ledger);
    this.workspace.exported[id] = { revision: exported && !migrated ? ledger.revision : null, at: exported && !migrated ? nowIso() : null };
    this.undoById.delete(id);
    this.openProject(id, 'replace');
    return id;
  },
  // 互換: 新しい案件として足す
  replace(ledger, opts) { return this.addProject(ledger, opts); },
  openProject(id, reason = 'switch') {
    this.workspace.activeId = id;
    this.selectedId = null;
    if (reason !== 'switch') this.loadError = null;
    this.token = Math.random().toString(36).slice(2);
    this.gen++;
    this.persist();
    this.emit(reason);
  },
  switchProject(id) {
    if (!this.workspace.ledgers[id] || id === this.workspace.activeId) return false;
    this.openProject(id, 'switch');
    return true;
  },
  removeProject(id) {
    if (!this.workspace.ledgers[id]) return;
    delete this.workspace.ledgers[id];
    delete this.workspace.exported[id];
    this.undoById.delete(id);
    const next = this.workspace.activeId === id ? (Object.keys(this.workspace.ledgers)[0] || null) : this.workspace.activeId;
    this.openProject(next, 'replace');
  },
  projects() {
    return Object.entries(this.workspace.ledgers).map(([id, l]) => {
      const e = this.workspace.exported[id] || {};
      return { id, name: l.project.name, revision: l.revision, dirty: l.revision !== e.revision, exportedAt: e.at || null };
    });
  },
  findProjectByName(name) { return findByName(this.workspace, name); },
  // 保存の大きさ（文字数。localStorage はおよそ 5MB まで）
  storageSize() {
    return (lsGet(KEY_VAULT) || '').length + (lsGet(KEY_RECOVERY) || '').length;
  },

  // 取込画面から: validatePatch の結果と採用集合を適用する
  applyValidated(validated, accepted) {
    const before = this.ledger;
    const r = applyPatch(before, validated, accepted, nowIso(), 'import');
    this.pushUndo(before, r.ledger);
    this.ledger = r.ledger;
    this.gen++;
    this.persist();
    this.emit('apply');
    return r;
  },

  // 画面の内部の変更（詳細パネルなど）
  applyLocal(ops, source = 'local') {
    const before = this.ledger;
    const r = applyLocalOps(before, ops, nowIso(), source);
    if (!r.ok) return r;
    this.pushUndo(before, r.ledger);
    this.ledger = r.ledger;
    this.gen++;
    this.persist();
    this.emit('apply');
    return r;
  },

  // 差分の外の変更（設定・ベースライン）を、取り消し・記録・revision の対象として適用する
  commitExternal(mutate, change) {
    const before = this.ledger;
    const next = structuredClone(before);
    const now = nowIso();
    mutate(next);
    next.revision = before.revision + 1;
    next.updatedAt = now;
    appendChange(next, { rev: next.revision, at: now, source: 'local', changes: [change] });
    this.pushUndo(before, next);
    this.ledger = next;
    this.gen++;
    this.persist();
    this.emit('apply');
    return next;
  },

  // 台帳の設定を変える（AC: 設定の変更は revision +1・取り消し可・記録あり）
  updateSettings(partial) {
    const errors = validateSettings(partial);
    if (errors.length) return { ok: false, errors };
    this.commitExternal((next) => { next.settings = { ...(next.settings || {}), ...partial }; }, { id: 'settings', op: 'settings', fields: Object.keys(partial) });
    return { ok: true };
  },

  // ベースラインを記録する（要望・要件の ID・題名・範囲・状態の写し）
  recordBaseline(name, date) {
    let id;
    this.commitExternal((next) => {
      next.counters[BASELINE_PREFIX] = (next.counters[BASELINE_PREFIX] || 0) + 1;
      id = formatId(BASELINE_PREFIX, next.counters[BASELINE_PREFIX]);
      const items = next.items
        .filter((it) => it.kind === 'request' || it.kind === 'requirement')
        .map((it) => ({ id: it.id, kind: it.kind, title: it.title, scope: it.scope || 'tbd', status: it.status }));
      next.baselines.push({ id, name, date, items });
    }, { id: 'baseline', op: 'baseline' });
    return id;
  },

  // 案件の中身を空に戻す。案件情報と設定は残し、型を選び直す（null は型を使わない）。取り消しの1段になる
  resetProject(starterId) {
    const before = this.ledger;
    if (!before) return null;
    const now = nowIso();
    const next = createLedger(before.project.name, starterId || null, now);
    next.project = { ...structuredClone(before.project), starter: starterId || null };
    next.settings = structuredClone(before.settings || next.settings);
    // 関係者などを指す設定は、採番し直した別の項目を指さないよう、無くなった ID なら外す
    for (const [k, d] of Object.entries(SETTINGS)) {
      const v = next.settings[k];
      if (d.type === 'ref' && v && !next.items.some((it) => it.id === v)) next.settings[k] = null;
    }
    next.revision = before.revision + 1;
    next.updatedAt = now;
    next.changelog = [];
    appendChange(next, { rev: next.revision, at: now, source: 'local', changes: [{ id: 'reset', op: 'reset', starter: starterId || null }] });
    this.pushUndo(before, next);
    this.ledger = next;
    this.selectedId = null;
    this.token = Math.random().toString(36).slice(2);   // 取込の下書きを捨てる
    this.gen++;
    this.persist();
    this.emit('apply');
    return next;
  },

  canUndo() { return this.undoSteps.length > 0; },
  // 取り消しの段の一覧（新しい順）。index は undoTo に渡す配列の位置
  history() {
    return this.undoSteps.map((s, index) => ({ index, at: s.at, kind: s.kind, count: s.count })).reverse();
  },
  undo() { return this.undoTo(this.undoSteps.length - 1); },
  // 段の配列の i 番目の適用前に戻し、i 番目以降をすべて捨てる（失われる段の数 = 長さ − i）
  undoTo(i) {
    const steps = this.undoSteps;
    if (!Number.isInteger(i) || i < 0 || i >= steps.length) return false;
    this.ledger = steps[i].ledger;
    steps.splice(i);
    if (!steps.length) this.undoById.delete(this.workspace.activeId);
    this.gen++;
    // 書き出したものより前に戻ったら、同じ revision でも中身が違いうるので未書き出し扱いにする（日時は事実なので残す）
    if (this.exportedRevision !== null && this.exportedRevision > this.ledger.revision) this.setExported(null);
    if (this.selectedId && !this.ledger.items.some((it) => it.id === this.selectedId)) this.selectedId = null;
    this.persist();
    this.emit('undo');
    return true;
  },

  exportText() {
    return JSON.stringify(this.ledger, null, 2) + '\n';
  },
  exportFilename() {
    const name = (this.ledger.project.name || '案件').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
    const d = new Date();
    const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    return `${name}_rev${this.ledger.revision}_${ymd}.json`;
  },
  // 保存ダイアログで取り消されても検知できないため、「書き出しを試みた」記録として扱う
  markExported() {
    this.setExported(this.ledger.revision, nowIso());
    this.persist();
    this.emit('exported');
  },

  // ファイルから読み込む前の検査。置き換えは呼び出し側が確認を取ってから replace する
  parseLedgerFile(text) {
    let obj;
    try { obj = safeParse(String(text).replace(/^﻿/, '')); } catch (e) {
      return { ok: false, errors: ['JSON として読めません。台帳の書き出しファイルか確かめてください'] };
    }
    if (obj && obj.type === 'ledger-patch') return { ok: false, errors: ['これは差分のファイルです。差分は「取込」画面に貼り付けてください'] };
    const r = checkLedgerObject(obj);
    if (!r.ok) return { ok: false, errors: r.errors.slice(0, 10), more: Math.max(0, r.errors.length - 10) };
    return { ok: true, ledger: r.ledger, migrated: r.migrated };
  },

  select(id) {
    this.selectedId = id;
    this.emit('select');
  },

  // 説明用の表示を反映した台帳（画面の一覧・集計はこれを使う）
  view() {
    return this.ledger ? visibleLedger(this.ledger, this.presentation) : null;
  },
  // 説明用の表示で隠れる項目か
  isHidden(id) {
    if (!this.presentation || !this.ledger) return false;
    const it = this.ledger.items.find((x) => x.id === id);
    return !!(it && it.internal);
  },
  setPresentation(on) {
    this.presentation = !!on;
    if (on && this.selectedId && this.isHidden(this.selectedId)) this.selectedId = null;
    this.emit('presentation');
  },

  item(id) {

// ---- ui/lock.js ----
// 合言葉の画面: 開く（locked）・決める（empty / legacy）


const MIN_PASSPHRASE = 8;

// 新しい合言葉を2回入れてもらう。やめたら null
function askNewPassphrase(reason) {
  return new Promise((resolve) => {
    const p1 = h('input', { type: 'password', id: 'pass-new-1', autocomplete: 'new-password', 'aria-label': '合言葉' });
    const p2 = h('input', { type: 'password', id: 'pass-new-2', autocomplete: 'new-password', 'aria-label': '合言葉（確認）' });
    const err = h('p', { class: 'notice error', role: 'alert', hidden: true });
    const dlg = h('dialog', { class: 'dialog', 'aria-labelledby': 'pass-title' },
      h('form', { method: 'dialog', class: 'stack', onsubmit: (e) => { e.preventDefault(); submit(); } },
        h('h2', { id: 'pass-title', text: '合言葉を決める' }),
        reason ? h('p', { class: 'small', text: reason }) : null,
        h('p', { class: 'small', text: `台帳はこの合言葉で暗号化してブラウザに保存します。${MIN_PASSPHRASE}文字以上にしてください。` }),
        h('p', { class: 'small notice warn', text: '合言葉を忘れると、ブラウザ内の台帳は開けません（書き出したファイルからは戻せます）。合言葉はこのツールの外には保存されません。' }),
        h('label', { class: 'field' }, '合言葉', p1),
        h('label', { class: 'field' }, 'もう一度', p2),
        err,
        h('div', { class: 'row dialog-actions' },
          h('button', { class: 'btn', type: 'button', 'data-act': 'cancel', onclick: () => done(null) }, 'やめる'),
          h('button', { class: 'btn primary', type: 'submit', 'data-act': 'ok' }, '決める'))));
    function fail(msg) { err.textContent = msg; err.hidden = false; }
    function submit() {
      if (p1.value.length < MIN_PASSPHRASE) return fail(`${MIN_PASSPHRASE}文字以上にしてください`);
      if (p1.value !== p2.value) return fail('2回の入力が一致しません');
      done(p1.value);
    }
    function done(v) { dlg.close(); dlg.remove(); resolve(v); }
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); done(null); });
    document.body.appendChild(dlg);
    dlg.showModal();
    p1.focus();
  });
}

// 台帳を置き換える前に呼ぶ。合言葉が未設定なら決めてもらう。決められなければ false
async function ensureVaultReady() {
  if (!store.needsPassphraseSetup()) return true;
  const pass = await askNewPassphrase();
  if (!pass) return false;
  await store.setPassphrase(pass);
  return true;
}

// ロック画面の「使い方を見る」（ロック中でも使い方だけは開ける）
function guideLink(app) {

}

      h('div', { class: 'row' }, h('button', {

        },
      }, '合言葉を決める'))));

  }
  const input = h('input', { type: 'password', id: 'unlock-pass', autocomplete: 'current-password', 'aria-label': '合言葉' });
  const err = h('p', { class: 'notice error', role: 'alert', hidden: true, id: 'unlock-error' });

  root.appendChild(h('section', { class: 'card stack lock' },

    h('form', {
      class: 'row', onsubmit: async (e) => {

      h('button', {

        onclick: async () => {
          if (await confirmDialog('ブラウザ内の暗号化された台帳を消します。元に戻せません。', '消す', '書き出したファイルがあるか、先に確かめてください。')) {
            store.resetVault();

  setTimeout(() => input.focus(), 0);
}


// ---- ui/detail.js ----
// 詳細パネルと、値の表示に使う共通の部品


function itemTitle(id, ledger) {
  if (store.isHidden(id)) return '（社内のみ）';
  const it = ledger.items.find((x) => x.id === id);
  return it ? it.title : null;
}

// ID のボタン。台帳に無い ID は取り消し線で表示する
function idButton(id, app, opts = {}) {
  if (TEMP_ID_RE.test(id)) return h('span', { class: 'mono small badge', text: id });
  if (store.isHidden(id)) return h('span', { class: 'muted small', text: '（社内のみ）' });
  const exists = !!store.item(id);
  if (!exists) return h('span', { class: 'idlink dangling', text: id, title: '台帳にない ID' });
  const title = opts.withTitle ? itemTitle(id, store.ledger) : null;
  return h('span', { class: 'idref' },
    h('button', { class: 'idlink', type: 'button', onclick: (e) => { e.stopPropagation(); app.openItem(id); }, text: id }),
    title ? h('span', { text: ' ' + title }) : null);
}

function confBadge(conf) {
  return h('span', { class: `badge conf-${conf}`, text: enumLabel(CONFIDENCE, conf) });
}

function statusBadge(kind, status) {
  const done = ['closed', 'answered', 'resolved', 'agreed', 'accepted', 'valid', 'achieved'].includes(status);
  const off = ['rejected', 'dropped', 'superseded', 'inactive', 'retired', 'deferred', 'occurred'].includes(status);
  return h('span', { class: ['badge', done ? 'ok' : off ? '' : 'accent'], text: statusLabel(kind, status) });
}

function kindBadge(kind) {
  return h('span', { class: 'badge', text: kindLabel(kind) });
}

function sourceText(src, ledger) {
  const parts = [enumLabel(SOURCE_TYPES, src.type) + ': ' + src.ref];
  if (src.date) parts.push(src.date);
  if (src.speaker) {
    const n = itemTitle(src.speaker, ledger);
    parts.push('発言者: ' + (n ? `${n}（${src.speaker}）` : src.speaker));
  }
  if (src.note) parts.push(src.note);
  return parts.join(' ／ ');
}

// フィールドの値を表示用の要素にする（ID はボタンになる）
function fieldValue(kind, name, value, app) {
  const spec = fieldSpec(kind, name);
  if (value === undefined || value === null || value === '') return h('span', { class: 'muted', text: '—' });
  if (!spec) return h('span', { text: typeof value === 'string' ? value : JSON.stringify(value) });
  switch (spec.type) {
    case 'enum': return h('span', { text: enumLabel(spec.values, value) });
    case 'status': return statusBadge(kind, value);
    case 'ref': return idButton(value, app, { withTitle: true });
    case 'refs':
      if (!Array.isArray(value) || !value.length) return h('span', { class: 'muted', text: '—' });
      return h('span', { class: 'refs' }, value.map((id, i) => [i ? '、' : null, idButton(id, app, { withTitle: true })]));
    case 'strings': return h('span', { text: Array.isArray(value) ? value.join(' / ') : String(value) });
    case 'sources':
      return h('div', null, (Array.isArray(value) ? value : []).map((sx) => h('div', { class: 'source small', text: sourceText(sx, store.ledger) })));
    case 'text': return h('span', { class: 'body-text', text: String(value) });
    case 'boolean': return h('span', { text: value ? 'はい' : 'いいえ' });
    case 'crud':
      return h('div', { class: 'small' }, (Array.isArray(value) ? value : []).map((c) => h('div', null, idButton(c.entity, app, { withTitle: true }), ` … ${c.ops}`)));
    case 'raci':
      return h('div', { class: 'small' }, (Array.isArray(value) ? value : []).map((e) => h('div', null, `${e.role}（${enumLabel(RACI_ROLES, e.role)}） `, idButton(e.who, app, { withTitle: true }))));
    case 'columns':
    case 'fields':
      return h('div', { class: 'small nested-lines' }, (Array.isArray(value) ? value : []).map((el) => h('div', { text: nestedLine(spec.type, el) })));
    default: return h('span', { text: String(value) });
  }
}

// 列・項目の1行の説明（例: customer_code 得意先コード code(8) 主キー 必須 → EN-001.customer_code）
function nestedLine(type, el) {
  if (!el || typeof el !== 'object') return String(el);
  const ref = type === 'columns' ? el.fk : el.source;
  return [
    el.name, el.logical, el.type ? `${el.type}${el.length ? `(${el.length}${el.scale ? ',' + el.scale : ''})` : ''}` : null,
    el.pk ? '主キー' : null, el.required ? '必須' : null,
    ref && ref.entity ? `→ ${ref.entity}.${ref.column || ''}` : null,
    el.pattern ? `形 ${el.pattern}` : null,
  ].filter(Boolean).join(' ');
}

// 取込のカードなどで使う、値の短い文字列表現
function valueText(kind, name, value, ledger) {
  if (value === undefined) return '（なし）';
  if (value === null) return '（消す）';
  const spec = fieldSpec(kind, name);
  const ref = (id) => { const t = itemTitle(id, ledger); return t ? `${id} ${t}` : id; };
  if (!spec) return typeof value === 'string' ? value : JSON.stringify(value);
  switch (spec.type) {
    case 'enum': return enumLabel(spec.values, value);
    case 'status': return statusLabel(kind, value);
    case 'ref': return ref(value);
    case 'refs': return Array.isArray(value) && value.length ? value.map(ref).join('、') : '（なし）';
    case 'strings': return Array.isArray(value) ? value.join(' / ') : String(value);
    case 'sources': return Array.isArray(value) && value.length ? value.map((sx) => sourceText(sx, ledger)).join('\n') : '（なし）';
    case 'boolean': return value ? 'はい' : 'いいえ';
    case 'crud': return Array.isArray(value) && value.length ? value.map((c) => `${ref(c.entity)} … ${c.ops}`).join('\n') : '（なし）';
    case 'raci': return Array.isArray(value) && value.length ? value.map((e) => `${e.role}（${enumLabel(RACI_ROLES, e.role)}） ${ref(e.who)}`).join('\n') : '（なし）';
    case 'columns':
    case 'fields': return Array.isArray(value) && value.length ? value.map((el) => nestedLine(spec.type, el)).join('\n') : '（なし）';
    default: return String(value);
  }
}

function section(title, ...children) {
  return h('section', null, h('h3', { text: title }), ...children);
}

function renderDetail(root, app) {
  clear(root);
  const it = store.selectedId && !store.isHidden(store.selectedId) ? store.item(store.selectedId) : null;
  if (!it) { root.hidden = true; return; }
  root.hidden = false;
  // 説明用の表示では、社内のみの項目を除いた台帳で影響範囲・逆参照を求める
  const ledger = store.view();
  const pres = store.presentation;
  const spec = KINDS[it.kind];

  root.appendChild(h('div', { class: 'detail-head' },
    h('div', null, kindBadge(it.kind), ' ', h('span', { class: 'mono small', text: it.id })),

  root.appendChild(h('h2', { class: 'detail-title', id: 'detail-title', tabindex: '-1', text: it.title }));
  root.appendChild(h('div', { class: 'row' }, statusBadge(it.kind, it.status), confBadge(it.confidence),
    ...(it.tags || []).map((t) => h('span', { class: 'badge', text: '#' + t }))));

  // 操作: 確認済みにする・状態の変更（AC-18）
  const sel = h('select', { 'aria-label': '状態を変える', id: 'detail-status' },
    spec.statuses.map((st) => h('option', { value: st.v, selected: st.v === it.status, text: st.label })));
  sel.addEventListener('change', () => {
    const r = store.applyLocal([{ op: 'update', id: it.id, set: { status: sel.value } }]);
    toast(r.ok ? `状態を「${statusLabel(it.kind, sel.value)}」にしました（取り消し可）` : r.errors.join(' / '));
  });
  root.appendChild(h('div', { class: 'row detail-actions' },

      class: 'btn', type: 'button', id: 'detail-confirm',
      onclick: () => { const r = store.applyLocal([{ op: 'update', id: it.id, set: { confidence: 'confirmed' } }]); toast(r.ok ? '確認済みにしました（取り消し可）' : r.errors.join(' / ')); },
    }, '確認済みにする') : null,
    h('label', { class: 'row small' }, '状態', sel),
    // 社内のみの切り替え（P3 AC-19）。説明用の表示中は出さない
    pres ? null : h('label', { class: 'row small' },
      h('input', { type: 'checkbox', id: 'detail-internal', checked: !!it.internal, onchange: (e) => {
        const r = store.applyLocal([{ op: 'update', id: it.id, set: { internal: e.target.checked ? true : null } }]);
        toast(r.ok ? (e.target.checked ? '社内のみにしました（説明用の表示で隠れます）' : '社内のみを外しました') : r.errors.join(' / '));
      } }), '社内のみ')));

  // 上長・体制上の役割（関係者のみ。P7b）。説明用の表示では出さない
  if (it.kind === 'stakeholder' && !pres) {
    const people = store.ledger.items.filter((x) => x.kind === 'stakeholder' && x.id !== it.id);
    const boss = h('select', { id: 'detail-reports-to', 'aria-label': '上長' }, h('option', { value: '', text: '（なし）' }), people.map((p) => h('option', { value: p.id, selected: p.id === it.reportsTo, text: `${p.title}（${p.id}）` })));
    const role = h('select', { id: 'detail-team-role', 'aria-label': '体制上の役割' }, h('option', { value: '', text: '（なし）' }), TEAM_ROLES.map((r) => h('option', { value: r.v, selected: r.v === it.teamRole, text: r.label })));
    const save = (set, msg) => { const r = store.applyLocal([{ op: 'update', id: it.id, set }]); toast(r.ok ? msg : r.errors.join(' / ')); };
    boss.addEventListener('change', () => save({ reportsTo: boss.value || null }, '上長を変えました（取り消し可）'));

  }
  // RACI（作業・決定・課題）: 補った役も薄く見せる

    const eff = effectiveRaci(it);

  if (it.kind === 'request' || it.kind === 'requirement') {

      const r = store.applyLocal(riskToIssueOps(it));
      toast(r.ok ? '課題を足し、リスクを「発生」にしました（取り消し可）' : r.errors.join(' / '));
    } }, '課題へ移す')));
  }
  if (it.kind === 'change') {
    const imp = impactOf(ledger, [it.id]);
    const groups = Object.entries(imp.byKind).filter(([, v]) => v.length);
    root.appendChild(section('影響範囲（2 段まで）',
      h('p', { class: 'small', id: 'impact-estimate' }, '影響する作業の見積の合計: ', h('strong', { text: `${imp.taskEstimate} 人日` }), `（作業 ${imp.tasks.length}件）`),
      groups.length
        ? h('div', null, groups.map(([k, list]) => h('div', { class: 'small impact-group' },
          h('span', { class: 'badge', text: `${kindLabel(k)} ${list.length}` }), ' ',

        : h('p', { class: 'muted small', text: 'つながる項目がありません。対象（関連）を入れてください' }),
